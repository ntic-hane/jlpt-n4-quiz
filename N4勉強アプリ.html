<style>
:root{
  --navy:#0F2E52;
  --blue:#1E4D8C;
  --yellow:#F2C230;
  --green:#12795A;
  --red:#C0392B;
  --bg:#EDF1F6;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;background:var(--bg);color:#222;}
header{background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
@supports not (padding-top: env(safe-area-inset-top)) { header{padding-top:12px;} }
header h1{font-size:16px;margin:0;font-weight:700;}
.langbar{display:flex;gap:4px;flex-wrap:wrap;}
.langbtn{background:transparent;border:1px solid #6b87ac;color:#fff;border-radius:14px;padding:4px 8px;font-size:11px;cursor:pointer;}
.langbtn.active{background:var(--yellow);color:var(--navy);border-color:var(--yellow);font-weight:700;}
main{max-width:640px;margin:0 auto;padding:16px 16px 80px;}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.milestone{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:14px;padding:16px;margin-bottom:14px;}
.milestone .phaselabel{font-size:12px;opacity:.8;margin-bottom:4px;}
.milestone .phasename{font-size:17px;font-weight:700;}
.stats{display:flex;gap:10px;margin-top:10px;}
.stat{flex:1;background:#fff;border-radius:10px;padding:10px;text-align:center;}
.stat .num{font-size:20px;font-weight:700;color:var(--blue);}
.stat .lbl{font-size:11px;color:#667;}
h2.subject{font-size:15px;color:var(--navy);margin:18px 0 8px;font-weight:700;border-left:4px solid var(--yellow);padding-left:8px;}
.rowbtns{display:flex;gap:8px;}
button.primary{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;flex:1;}
button.secondary{background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;flex:1;}
button.ghost{background:transparent;border:none;color:var(--blue);font-size:13px;cursor:pointer;text-decoration:underline;padding:6px 0;}
.fbarwrap{margin:6px 0;}
.fbarrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;}
.fbartrack{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.fbar{height:100%;background:var(--green);}
.fbar.low{background:#e08a1e;}
.catlist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.catchip{border:1px solid var(--blue);color:var(--blue);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none;}
.catchip.sel{background:var(--blue);color:#fff;}
.qcard{background:#fff;border-radius:14px;padding:18px;}
.passage{background:#f5f7fa;border-radius:10px;padding:12px;font-size:14px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;}
ruby rt{font-size:10px;color:var(--blue);user-select:none;}
.qtext{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cbd5e1;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px;cursor:pointer;}
.opt.sel{border-color:var(--blue);background:#eaf1fb;}
.opt.correct{border-color:var(--green);background:#e7f6f0;}
.opt.wrong{border-color:var(--red);background:#fbeceb;}
.feedback{margin-top:12px;padding:12px;border-radius:10px;font-size:13px;line-height:1.6;}
.feedback.ok{background:#e7f6f0;color:var(--green);}
.feedback.ng{background:#fbeceb;color:var(--red);}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.timer{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
.timer.warn{color:var(--red);}
.progress{font-size:12px;color:#667;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:14px;padding:20px;max-width:360px;width:100%;}
.modal-box p{font-size:14px;line-height:1.6;margin:0 0 16px;}
.modal-box .rowbtns button{padding:10px;}
.togglewrap{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0;}
.footerlinks{text-align:center;margin-top:20px;}
.footerlinks button{margin:0 6px;}
.gridnum{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px;}
.gridnum button{padding:8px 0;border-radius:6px;border:1px solid #cbd5e1;background:#fff;font-size:12px;cursor:pointer;}
.gridnum button.done{background:var(--blue);color:#fff;border-color:var(--blue);}
</style>

<script>
(function(){
"use strict";

const STORAGE_KEY = "ntic_jlpt_v1";
const ALL_DATA = {
  moji: DATA_MOJI,
  bunpo: DATA_BUNPO,
  dokkai: DATA_DOKKAI
};
// カテゴリ→科目グループの対応(公式試験区分に準拠)
const CAT_TO_EXAMGROUP = {
  kanji:"moji", hyoki:"moji", bunmyaku:"moji", ruigi:"moji", youho:"moji",
  bunpo1:"bunpo_dokkai", bunpo2:"bunpo_dokkai", bunsho:"bunpo_dokkai",
  tanbun:"bunpo_dokkai", chubun:"bunpo_dokkai", kensaku:"bunpo_dokkai"
};
const EXAMGROUP_MIN = { moji:25, bunpo_dokkai:55 };
const EXAMGROUP_LABEL = {
  moji: ["言語知識（文字・語彙）","Vocabulary Section","Bagian Kosakata","Vocabulary Section"],
  bunpo_dokkai: ["言語知識（文法）・読解","Grammar & Reading Section","Bagian Tata Bahasa & Membaca","Grammar & Reading Section"]
};

// ---- id採番（ビルド時ではなく初回ロード時に配列順で採番） ----
let idCounter = 1;
Object.keys(ALL_DATA).forEach(subj=>{
  ALL_DATA[subj].forEach(item=>{ item.id = "Q"+(idCounter++); item.subj = subj; });
});
const ALL_Q = [].concat(ALL_DATA.moji, ALL_DATA.bunpo, ALL_DATA.dokkai);
function qById(id){ return ALL_Q.find(x=>x.id===id); }

// ---- storage ----
let memoryFallback = null;
let storageBroken = false;
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ return {v:1,q:{},exams:[]}; }
    return JSON.parse(raw);
  }catch(e){
    storageBroken = true;
    return memoryFallback || {v:1,q:{},exams:[]};
  }
}
function save(data){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    storageBroken = true;
    memoryFallback = data;
  }
}

// ---- 利用者ID(企業ID+実習生ID) ----
const ID_KEY = "ntic_jlpt_ids_v1";
function loadIds(){
  try{
    const raw = localStorage.getItem(ID_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveIds(companyId, learnerId){
  try{
    localStorage.setItem(ID_KEY, JSON.stringify({companyId, learnerId}));
  }catch(e){ /* 保存できなくてもアプリ自体は動く */ }
}

// ---- クラウド同期(ベストエフォート。失敗してもアプリの動作には一切影響しない) ----
function syncHeaders(extra){
  const h = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
  if(extra) Object.assign(h, extra);
  return h;
}
function syncProgress(qid){
  const ids = loadIds();
  if(!ids) return;
  const d = load();
  const rec = d.q[qid];
  if(!rec) return;
  const body = {
    company_id: ids.companyId,
    learner_id: ids.learnerId,
    question_id: qid,
    n_count: rec.n,
    c_count: rec.c,
    last_answered_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };
  fetch(SUPABASE_URL + "/rest/v1/progress?on_conflict=company_id,learner_id,question_id", {
    method: "POST",
    headers: syncHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(body)
  }).catch(()=>{ /* オフライン等は無視。次回の操作時にまた送られる */ });
}
function syncExam(examgroup, correct, total, pct){
  const ids = loadIds();
  if(!ids) return;
  const body = {
    company_id: ids.companyId,
    learner_id: ids.learnerId,
    exam_group: examgroup,
    correct: correct,
    total: total,
    pct: pct,
    taken_at: new Date().toISOString()
  };
  fetch(SUPABASE_URL + "/rest/v1/exam_log", {
    method: "POST",
    headers: syncHeaders({ "Prefer": "return=minimal" }),
    body: JSON.stringify(body)
  }).catch(()=>{});
}
function syncActivity(){
  const ids = loadIds();
  if(!ids) return;
  const body = {
    company_id: ids.companyId,
    learner_id: ids.learnerId,
    last_seen_at: new Date().toISOString()
  };
  fetch(SUPABASE_URL + "/rest/v1/learner_activity?on_conflict=company_id,learner_id", {
    method: "POST",
    headers: syncHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(body)
  }).catch(()=>{});
}

// ---- state ----
let ST = {
  view: "home",
  lang: "ja",
  showJa: true,
  mode: null,        // 'practice' | 'mock'
  showFurigana: true, // 練習モードのみ有効。模試モードは常に非表示(本試験と同条件)
  subject: null,      // 'moji' | 'bunpo' | 'dokkai' (practice) / examgroup (mock)
  selectedCats: [],
  queue: [],           // question objects for current session
  idx: 0,
  answers: {},          // idx -> selected option index
  answered: {},          // idx -> bool (practice mode immediate feedback shown)
  mockTimerSec: 0,
  mockTimerHandle: null,
  mockTimeUp: false,
  resultData: null
};

function tr(arr){ const i = LANGS.indexOf(ST.lang); return arr[i>=0?i:0]; }

// ---- ふりがな(ルビ)処理 ----
// 【】で囲まれた部分（漢字読み問題の出題対象語）はルビを振らない＝答えを教えない
const RUBY_KEYS = Object.keys(RUBY_DICT).sort((a,b)=> b.length - a.length);
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function applyRubyToSegment(text){
  let out = "";
  let i = 0;
  while(i < text.length){
    let matched = false;
    for(const key of RUBY_KEYS){
      if(text.startsWith(key, i)){
        out += "<ruby>"+escapeHtml(key)+"<rt>"+escapeHtml(RUBY_DICT[key])+"</rt></ruby>";
        i += key.length;
        matched = true;
        break;
      }
    }
    if(!matched){
      out += escapeHtml(text[i]);
      i += 1;
    }
  }
  return out;
}
function applyRuby(text){
  // 【...】の中身はルビを振らずそのまま出力（答えが割れるのを防ぐ）
  const parts = text.split(/(【[^】]*】)/g);
  return parts.map(p=>{
    if(p.startsWith("【") && p.endsWith("】")) return escapeHtml(p);
    return applyRubyToSegment(p);
  }).join("");
}
// 日本語テキストをルビ設定に応じて描画する（container に innerHTML/textContent をセット）
function renderJaInto(container, text){
  if(ST.mode === "practice" && ST.showFurigana){
    container.innerHTML = applyRuby(text);
  } else {
    container.textContent = text;
  }
}

// ---- 自前の確認ダイアログ（confirm/alert禁止） ----
function ask(message, onYes, onNo){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const yes = tr(T.yes), no = tr(T.no);
  bg.innerHTML = '<div class="modal-box"><p></p><div class="rowbtns"><button class="secondary" id="askNo"></button><button class="primary" id="askYes"></button></div></div>';
  bg.querySelector("p").textContent = message;
  bg.querySelector("#askYes").textContent = yes;
  bg.querySelector("#askNo").textContent = no;
  document.body.appendChild(bg);
  bg.querySelector("#askYes").onclick = function(){ document.body.removeChild(bg); if(onYes) onYes(); };
  bg.querySelector("#askNo").onclick = function(){ document.body.removeChild(bg); if(onNo) onNo(); };
}
function notify(message){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<div class="modal-box"><p></p><div class="rowbtns"><button class="primary" id="okBtn"></button></div></div>';
  bg.querySelector("p").textContent = message;
  bg.querySelector("#okBtn").textContent = tr(T.yes);
  document.body.appendChild(bg);
  bg.querySelector("#okBtn").onclick = function(){ document.body.removeChild(bg); };
}

// ---- 学習記録ロジック ----
function recordAnswer(qid, isCorrect){
  const d = load();
  if(!d.q[qid]) d.q[qid] = {n:0,c:0,t:0};
  d.q[qid].n += 1;
  if(isCorrect) d.q[qid].c += 1;
  d.q[qid].t = Date.now();
  save(d);
  syncProgress(qid);
}
function recordExam(examgroup, correct, total, pct){
  const d = load();
  if(!d.exams) d.exams = [];
  d.exams.unshift({d:Date.now(), g:examgroup, c:correct, n:total, pct:pct});
  d.exams = d.exams.slice(0,20);
  save(d);
  syncExam(examgroup, correct, total, pct);
}
function overallStats(){
  const d = load();
  let studied=0, totalN=0, totalC=0;
  ALL_Q.forEach(q=>{
    const r = d.q[q.id];
    if(r && r.n>0){ studied++; totalN+=r.n; totalC+=r.c; }
  });
  return { studied, total: ALL_Q.length, rate: totalN? Math.round(totalC/totalN*100):0 };
}
function catRate(cat){
  const d = load();
  const qs = ALL_Q.filter(q=>q.c===cat);
  let n=0,c=0;
  qs.forEach(q=>{ const r=d.q[q.id]; if(r){ n+=r.n; c+=r.c; } });
  return n? Math.round(c/n*100): null;
}
function weakQuestions(limit){
  const d = load();
  const scored = ALL_Q.map(q=>{
    const r = d.q[q.id];
    let score;
    if(!r || r.n===0) score = 0.55;
    else score = r.c / r.n;
    const n = r? r.n : 0;
    return {q, score, n};
  });
  scored.sort((a,b)=>{
    if(a.score !== b.score) return a.score - b.score;
    return b.n - a.n;
  });
  return scored.slice(0, limit).map(x=>x.q);
}

// ---- ホーム到達フェーズ ----
function currentPhase(){
  const s = overallStats();
  if(s.rate >= 70 && s.studied >= Math.round(s.total*0.7)) return 3;
  if(s.rate >= 50 && s.studied >= Math.round(s.total*0.4)) return 2;
  return 1;
}

// ---- レンダリング ----
function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }

function renderHeader(){
  document.getElementById("appTitle").textContent = tr(T.appName);
  const bar = document.getElementById("langBar");
  bar.innerHTML = "";
  LANGS.forEach(l=>{
    const b = document.createElement("button");
    b.className = "langbtn" + (ST.lang===l ? " active":"");
    b.textContent = l.toUpperCase();
    b.onclick = ()=>{ ST.lang = l; ST.showJa = (l==="ja") ? true : ST.showJa; render(); };
    bar.appendChild(b);
  });
}

function render(){
  renderHeader();
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(ST.view === "onboarding") app.appendChild(renderOnboarding());
  else if(ST.view === "home") app.appendChild(renderHome());
  else if(ST.view === "select") app.appendChild(renderSelect());
  else if(ST.view === "question") app.appendChild(renderQuestion());
  else if(ST.view === "result") app.appendChild(renderResult());
}

  weakBtn.style.width = "100%";
  weakBtn.textContent = tr(T.weakReview);
  weakBtn.onclick = ()=>{
    ST.mode = "practice";
    ST.queue = weakQuestions(10);
    ST.idx = 0; ST.answers = {}; ST.answered = {};
    ST.view = "question";
    render();
  };
  weakCard.appendChild(weakBtn);
  wrap.appendChild(weakCard);

  const footer = el('<div class="footerlinks"></div>');

  idInfo.style.fontSize = "11px"; idInfo.style.color = "#889"; idInfo.style.marginBottom="6px";
  const ids = loadIds();
  if(ids) idInfo.textContent = tr(T.companyId)+": "+ids.companyId+" / "+tr(T.learnerId)+": "+ids.learnerId;
  footer.appendChild(idInfo);
  const editIdBtn = document.createElement("button");
  editIdBtn.className = "ghost";
  editIdBtn.textContent = tr(T.onboardTitle);
  editIdBtn.onclick = ()=>{ ST.view = "onboarding"; render(); };

  const l = document.createElement("div"); l.className="lbl"; l.textContent=lbl;
  s.appendChild(n); s.appendChild(l);
  return s;
}

function renderSelect(){
  const wrap = document.createElement("div");
  const back = document.createElement("button");
  back.className = "ghost"; back.textContent = tr(T.back);
  back.onclick = ()=>{ ST.view="home"; render(); };
  wrap.appendChild(back);

  const card = el('<div class="card"></div>');
  const title = document.createElement("div");
  title.style.fontWeight="700"; title.style.marginBottom="8px";
  title.textContent = tr(T.selectCategory);

      if(ST.selectedCats.includes(c)) ST.selectedCats = ST.selectedCats.filter(x=>x!==c);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startPractice(limit){
  const cats = ST.selectedCats.length ? ST.selectedCats : [...new Set(ALL_DATA[ST.subject].map(q=>q.c))];
  let pool = ALL_DATA[ST.subject].filter(q=>cats.includes(q.c));
  pool = shuffle(pool);
  if(limit) pool = pool.slice(0, limit);
  ST.mode = "practice";
  ST.queue = pool;
  ST.idx = 0; ST.answers = {}; ST.answered = {};
  ST.view = "question";
  render();
}

function startMock(examgroup){
  const cats = Object.keys(CAT_TO_EXAMGROUP).filter(c=>CAT_TO_EXAMGROUP[c]===examgroup);
  let pool = ALL_Q.filter(q=>cats.includes(q.c));
  pool = shuffle(pool);
  ST.mode = "mock";
  ST.subject = examgroup;
  ST.queue = pool;
  ST.idx = 0; ST.answers = {}; ST.answered = {};
  ST.mockTimeUp = false;
  ST.mockTimerSec = EXAMGROUP_MIN[examgroup]*60;
  ST.view = "question";
  render();
  startTimer();
}

function startTimer(){
  clearTimer();
  ST.mockTimerHandle = setInterval(()=>{
    ST.mockTimerSec -= 1;
    if(ST.mockTimerSec <= 0){
      clearTimer();
      ST.mockTimeUp = true;
      submitExam(true);
      return;
    }
    const el2 = document.getElementById("timerDisplay");
    if(el2){
      const m = Math.floor(ST.mockTimerSec/60), sec = ST.mockTimerSec%60;
      el2.textContent = (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
      el2.className = "timer" + (ST.mockTimerSec <= 300 ? " warn":"");
    }
  },1000);
}
function clearTimer(){ if(ST.mockTimerHandle){ clearInterval(ST.mockTimerHandle); ST.mockTimerHandle=null; } }

function renderQuestion(){
  const wrap = document.createElement("div");
  const q = ST.queue[ST.idx];
  if(!q){
    ST.view="home"; render();
    return wrap;
  }

  const top = el('<div class="topbar"></div>');
  const backBtn = document.createElement("button");
  backBtn.className = "ghost"; backBtn.textContent = tr(T.back);
  backBtn.onclick = ()=>{
    if(ST.mode==="mock"){
      ask(tr(T.quitMock), ()=>{ clearTimer(); ST.view="home"; render(); });
    } else {
      ST.view="home"; render();
    }
  };
  top.appendChild(backBtn);

  const right = document.createElement("div");
  if(ST.mode==="mock"){
    const timer = document.createElement("span");
    timer.className = "timer"; timer.id = "timerDisplay";
    const m = Math.floor(ST.mockTimerSec/60), sec = ST.mockTimerSec%60;
    timer.textContent = (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
    right.appendChild(timer);
  } else {
    const prog = document.createElement("span");
    prog.className = "progress";
    prog.textContent = (ST.idx+1)+" / "+ST.queue.length;
    right.appendChild(prog);
  }
  top.appendChild(right);
  wrap.appendChild(top);

  if(ST.mode === "mock"){
    const grid = el('<div class="gridnum"></div>');
    ST.queue.forEach((qq,i)=>{
      const b = document.createElement("button");
      b.textContent = i+1;
      if(ST.answers[i] !== undefined) b.className = "done";
      b.onclick = ()=>{ ST.idx = i; render(); };
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
  } else {
    const prog = document.createElement("div");
    prog.className = "progress"; prog.style.marginBottom="8px";
    prog.textContent = tr(CAT[q.c]);
    wrap.appendChild(prog);
  }

  const card = el('<div class="qcard"></div>');
  if(q.p){
    const passage = el('<div class="passage"></div>');
    if(ST.lang === "ja") renderJaInto(passage, tr(q.p));
    else passage.textContent = tr(q.p);
    card.appendChild(passage);
  }
  const qtext = el('<div class="qtext"></div>');
  if(ST.lang === "ja") renderJaInto(qtext, tr(q.q));
  else qtext.textContent = tr(q.q);
  card.appendChild(qtext);

  const alreadyAnswered = ST.answers[ST.idx] !== undefined;
  const showFeedback = (ST.mode==="practice") && alreadyAnswered;

  const numOptions = q.o.length;
  for(let i=0;i<numOptions;i++){
    const optBtn = document.createElement("button");
    optBtn.className = "opt";
    optBtn.textContent = tr(q.o[i]);
    if(alreadyAnswered){
      if(ST.mode==="practice"){
        if(i===q.a) optBtn.className += " correct";
        else if(i===ST.answers[ST.idx]) optBtn.className += " wrong";
      } else {
        if(i===ST.answers[ST.idx]) optBtn.className += " sel";
      }
    }
    optBtn.onclick = ()=>{
      if(ST.mode==="practice" && alreadyAnswered) return; // 練習は一度答えたら確定
      ST.answers[ST.idx] = i;
      if(ST.mode==="practice"){
        recordAnswer(q.id, i===q.a);
      }
      render();
    };
    card.appendChild(optBtn);
  }

  if(showFeedback){
    const fb = el('<div class="feedback"></div>');
    const correct = ST.answers[ST.idx] === q.a;
    fb.className = "feedback " + (correct ? "ok":"ng");
    fb.textContent = (correct ? tr(T.correct) : tr(T.incorrect)) + "　" + tr(T.explanation) + "：" + tr(q.e);
    card.appendChild(fb);
  }

  wrap.appendChild(card);

  const nav = el('<div class="rowbtns" style="margin-top:14px;"></div>');
  if(ST.idx > 0){
    const prevBtn = document.createElement("button");
    prevBtn.className = "secondary"; prevBtn.textContent = "← ";
    prevBtn.onclick = ()=>{ ST.idx -= 1; render(); };
    nav.appendChild(prevBtn);
  }
  if(ST.idx < ST.queue.length - 1){
    const nextBtn = document.createElement("button");
    nextBtn.className = "primary"; nextBtn.textContent = tr(T.next);
    nextBtn.onclick = ()=>{ ST.idx += 1; render(); };
    nav.appendChild(nextBtn);
  } else {
    const doneBtn = document.createElement("button");
    doneBtn.className = "primary";
    doneBtn.textContent = ST.mode==="mock" ? tr(T.submit) : tr(T.back);
    doneBtn.onclick = ()=>{
      if(ST.mode==="mock") submitExamCheck();
      else { ST.view="home"; render(); }
    };
    nav.appendChild(doneBtn);
  }
  wrap.appendChild(nav);

  if(ST.mode === "practice"){
    const togWrap = el('<div style="margin-top:10px;"></div>');
    const furiTog = el('<div class="togglewrap"></div>');
    const fcb = document.createElement("input");
    fcb.type = "checkbox"; fcb.checked = ST.showFurigana; fcb.id = "furiCb";
    fcb.onchange = ()=>{ ST.showFurigana = fcb.checked; render(); };
    const flb = document.createElement("label");
    flb.setAttribute("for","furiCb");
    flb.textContent = tr(T.showFurigana);
    furiTog.appendChild(fcb); furiTog.appendChild(flb);
    togWrap.appendChild(furiTog);
    wrap.insertBefore(togWrap, nav);
  }

  if(ST.lang !== "ja" && ST.mode==="practice"){
    const tog = el('<div class="togglewrap"></div>');
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = ST.showJa; cb.id="showJaCb";
    cb.onchange = ()=>{ ST.showJa = cb.checked; render(); };
    const lb = document.createElement("label");
    lb.setAttribute("for","showJaCb"); lb.textContent = tr(T.showJa);
    tog.appendChild(cb); tog.appendChild(lb);
    wrap.appendChild(tog);
    if(ST.showJa){
      const jaBox = el('<div class="passage" style="margin-top:-4px;"></div>');
      if(q.p) { renderJaInto(jaBox, "【JA】 " + q.p[0]); }
      else { renderJaInto(jaBox, "【JA】 " + q.q[0]); }
      wrap.insertBefore(jaBox, nav);
    }
  }

  if(ST.mode === "mock"){
    const note = el('<div class="progress" style="margin-top:10px;"></div>');
    note.textContent = "※ " + tr(["模試モードは本試験と同条件のため、ふりがな・母語表示はありません。","Mock exam mode has no furigana or native-language display, matching real exam conditions.","Mode ujian tidak ada furigana atau tampilan bahasa asli, sesuai kondisi ujian asli.","Walang furigana o native-language display sa mock exam mode, katulad ng tunay na exam."]);
    wrap.insertBefore(note, nav);
  }

  return wrap;
}

function submitExamCheck(){
  const unanswered = ST.queue.filter((q,i)=>ST.answers[i]===undefined).length;
  if(unanswered > 0){
    ask(tr(T.unanswered), ()=> submitExam(false));
  } else {
    submitExam(false);
  }
}

function submitExam(timeUp){
  clearTimer();
  let correct = 0;
  ST.queue.forEach((q,i)=>{
    const isC = ST.answers[i] === q.a;
    if(isC) correct++;
    recordAnswer(q.id, isC);
  });
  const total = ST.queue.length;
  const pct = total? Math.round(correct/total*100) : 0;
  recordExam(ST.subject, correct, total, pct);
  ST.resultData = { correct, total, pct, timeUp, examgroup: ST.subject };
  ST.view = "result";
  render();
}

function renderResult(){
  const wrap = document.createElement("div");
  const r = ST.resultData;
  const card = el('<div class="card"></div>');
  const h = document.createElement("div");
  h.style.fontSize="18px"; h.style.fontWeight="700"; h.style.marginBottom="10px";
  h.textContent = tr(T.result) + (r.timeUp ? "（"+tr(["時間切れ","Time up","Waktu habis","Naubos ang oras"])+"）" : "");
  card.appendChild(h);

  const scoreLine = document.createElement("div");
  scoreLine.style.fontSize="28px"; scoreLine.style.fontWeight="700"; scoreLine.style.color="var(--blue)";
  scoreLine.textContent = r.correct+" / "+r.total+"（"+r.pct+"%）";
  card.appendChild(scoreLine);

  const passInfo = document.createElement("div");
  passInfo.style.marginTop="8px"; passInfo.style.fontSize="13px";
  passInfo.style.color = r.pct>=65 ? "var(--green)" : "var(--red)";
  passInfo.textContent = (r.pct>=65 ? tr(T.passed) : tr(T.notPassed));
  card.appendChild(passInfo);
  wrap.appendChild(card);

  const listCard = el('<div class="card"></div>');
  ST.queue.forEach((q,i)=>{
    const row = document.createElement("div");
    row.style.padding = "10px 0";
    row.style.borderBottom = "1px solid #eee";
    const ok = ST.answers[i] === q.a;
    row.innerHTML = '<div style="font-size:13px;font-weight:700;color:'+(ok?"var(--green)":"var(--red)")+'">'+(i+1)+". "+(ok?tr(T.correct):tr(T.incorrect))+'</div>';
    const qt = document.createElement("div");
    qt.style.fontSize="13px"; qt.style.margin="4px 0";
    qt.textContent = tr(q.q);
    row.appendChild(qt);
    const et = document.createElement("div");
    et.style.fontSize="12px"; et.style.color="#667";
    et.textContent = tr(T.explanation)+"："+tr(q.e);
    row.appendChild(et);
    listCard.appendChild(row);
  });
  wrap.appendChild(listCard);

  const homeBtn = document.createElement("button");
  homeBtn.className = "primary"; homeBtn.style.width="100%";
  homeBtn.textContent = tr(T.home);
  homeBtn.onclick = ()=>{ ST.view="home"; render(); };
  wrap.appendChild(homeBtn);

  return wrap;
}

// ---- init ----
if(!loadIds()){
  ST.view = "onboarding";
} else {
  syncActivity();
}
render();

})();
</script>
