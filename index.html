<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>N.T.I.C Academy - JLPT N4</title>
<style>
:root{
  --navy:#0F2E52;
  --blue:#1E4D8C;
  --yellow:#F2C230;
  --green:#12795A;
  --red:#C0392B;
  --amber:#B8720A;
  --bg:#EDF1F6;
}
*{box-sizing:border-box;}
html{width:100%;overflow-x:hidden;}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;background:var(--bg);color:#222;width:100%;overflow-x:hidden;min-height:100vh;min-height:100dvh;}
header{background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
@supports not (padding-top: env(safe-area-inset-top)) { header{padding-top:12px;} }
header h1{font-size:16px;margin:0;font-weight:700;}
.langbar{display:flex;gap:4px;flex-wrap:wrap;}
.langbtn{background:transparent;border:1px solid #6b87ac;color:#fff;border-radius:14px;padding:4px 8px;font-size:11px;cursor:pointer;}
.langbtn.active{background:var(--yellow);color:var(--navy);border-color:var(--yellow);font-weight:700;}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px;width:100%;box-sizing:border-box;}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2e8f0;
  box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:50;padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;
  padding:6px 4px;cursor:pointer;color:#8a94a6;font-size:11px;font-weight:600;}
.tabbtn svg{width:22px;height:22px;}
.tabbtn.active{color:var(--blue);}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.milestone{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:14px;padding:16px;margin-bottom:14px;}
.milestone .phaselabel{font-size:12px;opacity:.8;margin-bottom:4px;}
.milestone .phasename{font-size:17px;font-weight:700;}
.stats{display:flex;gap:10px;margin-top:10px;}
.stat{flex:1;background:#fff;border-radius:10px;padding:10px;text-align:center;}
.stat .num{font-size:20px;font-weight:700;color:var(--blue);}
.stat .lbl{font-size:11px;color:#667;}
h2.subject{font-size:15px;color:var(--navy);margin:18px 0 8px;font-weight:700;border-left:4px solid var(--yellow);padding-left:8px;}
.rowbtns{display:flex;gap:8px;}
button.primary{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;flex:1;}
button.secondary{background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;flex:1;}
button.ghost{background:transparent;border:none;color:var(--blue);font-size:13px;cursor:pointer;text-decoration:underline;padding:6px 0;}
.fbarwrap{margin:6px 0;}
.fbarrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;}
.fbartrack{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.fbar{height:100%;background:var(--green);}
.fbar.low{background:#e08a1e;}
.catlist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.catchip{border:1px solid var(--blue);color:var(--blue);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none;}
.catchip.sel{background:var(--blue);color:#fff;}
.qcard{background:#fff;border-radius:14px;padding:18px;}
.passage{background:#f5f7fa;border-radius:10px;padding:12px;font-size:14px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;}
ruby rt{font-size:10px;color:var(--blue);user-select:none;}
.qtext{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cbd5e1;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px;cursor:pointer;}
.opt.sel{border-color:var(--blue);background:#eaf1fb;}
.opt.correct{border-color:var(--green);background:#e7f6f0;}
.opt.wrong{border-color:var(--red);background:#fbeceb;}
.feedback{margin-top:12px;margin-bottom:4px;padding:12px;border-radius:10px;font-size:13px;line-height:1.6;}
.feedback.ok{background:#e7f6f0;color:var(--green);}
.feedback.ng{background:#fbeceb;color:var(--red);}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.timer{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
.timer.warn{color:var(--red);}
.progress{font-size:12px;color:#667;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:14px;padding:20px;max-width:360px;width:100%;}
.modal-box p{font-size:14px;line-height:1.6;margin:0 0 16px;}
.modal-box .rowbtns button{padding:10px;}
.togglewrap{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0;}
.footerlinks{text-align:center;margin-top:20px;}
.footerlinks button{margin:0 6px;}
.gridnum{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px;}
.gridnum button{padding:8px 0;border-radius:6px;border:1px solid #cbd5e1;background:#fff;font-size:12px;cursor:pointer;}
.gridnum button.done{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ---- フェーズB: 本人向けダッシュボード ---- */
.achieve-card{background:linear-gradient(135deg,var(--navy),#123a68);color:#fff;border-radius:14px;padding:20px;margin-bottom:14px;text-align:center;}
.achieve-card .achieve-label{font-size:12px;opacity:.85;margin-bottom:4px;}
.achieve-card .achieve-num{font-size:44px;font-weight:800;line-height:1.1;}
.achieve-card .achieve-caption{font-size:11px;opacity:.7;margin-top:4px;}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:700;margin:12px 0 4px;}
.status-badge.good{background:#e7f6f0;color:var(--green);}
.status-badge.mid{background:#fdf3e2;color:var(--amber);}
.status-badge.bad{background:#fbeceb;color:var(--red);}
.status-hint{font-size:12px;color:#667;margin-bottom:2px;}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.summary-cell{background:#fff;border-radius:10px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.summary-cell .num{font-size:18px;font-weight:800;color:var(--blue);}
.summary-cell .lbl{font-size:10px;color:#667;margin-top:2px;}
.subjbar-row{margin:12px 0;}
.subjbar-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px;}
.subjbar-track{height:14px;background:#e2e8f0;border-radius:7px;overflow:hidden;}
.subjbar-fill{height:100%;border-radius:7px;}
.subjbar-fill.great{background:var(--green);}
.subjbar-fill.good{background:#3d8b5f;}
.subjbar-fill.mid{background:var(--amber);}
.subjbar-fill.bad{background:var(--red);}
.subj-status-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;}
.subj-status-tag.great{background:#e7f6f0;color:var(--green);}
.subj-status-tag.good{background:#eef6f0;color:#3d8b5f;}
.subj-status-tag.mid{background:#fdf3e2;color:var(--amber);}
.subj-status-tag.bad{background:#fbeceb;color:var(--red);}
.weak-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;}
.weak-item:last-child{border-bottom:none;}
.weak-item-main{font-size:13px;}
.weak-item-main b{font-size:14px;}
.recent-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #f0f0f0;}
.recent-row:last-child{border-bottom:none;}
.cta-btn{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border:none;border-radius:12px;
  padding:16px;font-size:15px;font-weight:700;width:100%;cursor:pointer;box-shadow:0 3px 10px rgba(15,46,82,.25);}
.cta-sub{font-size:11px;opacity:.85;font-weight:400;display:block;margin-top:3px;}
</style>
</head>

let idCounter = 1;
Object.keys(ALL_DATA).forEach(subj=>{

const ALL_Q = [].concat(ALL_DATA.moji, ALL_DATA.bunpo, ALL_DATA.dokkai, ALL_DATA.choukai);
function qById(id){ return ALL_Q.find(x=>x.id===id); }

// ---- storage ----
let memoryFallback = null;
let storageBroken = false;
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ return {v:1,q:{},exams:[]}; }
    return JSON.parse(raw);
  }catch(e){
    storageBroken = true;
    return memoryFallback || {v:1,q:{},exams:[]};
  }
}
function save(data){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    storageBroken = true;
    memoryFallback = data;
  }
}

// ---- 利用者ID(企業ID+実習生ID) ----
const ID_KEY = "ntic_jlpt_ids_v1";
let idsMemoryFallback = null;
function loadIds(){
  try{
    const raw = localStorage.getItem(ID_KEY);
    return raw ? JSON.parse(raw) : idsMemoryFallback;
  }catch(e){ return idsMemoryFallback; }
}
function saveIds(companyId, learnerId){
  const data = { companyId, learnerId };
  idsMemoryFallback = data;
  try{
    localStorage.setItem(ID_KEY, JSON.stringify(data));
  }catch(e){ /* localStorage不可の場合はメモリ上の値のみで動作を継続 */ }
}

// ---- クラウド同期(ベストエフォート。失敗してもアプリの動作には一切影響しない) ----
function syncHeaders(extra){
  const h = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };
  if(extra) Object.assign(h, extra);
  return h;
}
function syncProgress(qid){
  const ids = loadIds();
  if(!ids) return;
  const d = load();
  const rec = d.q[qid];
  if(!rec) return;
  const body = {
    company_id: ids.companyId,
    learner_id: ids.learnerId,
    question_id: qid,
    n_count: rec.n,
    c_count: rec.c,
    last_answered_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };
  fetch(SUPABASE_URL + "/rest/v1/progress?on_conflict=company_id,learner_id,question_id", {
    method: "POST",
    headers: syncHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(body)
  }).then(res=>{
    if(!res.ok){ res.text().then(t=>console.warn("[sync] progress失敗", res.status, t)); }
  }).catch(e=>{ console.warn("[sync] progress通信エラー", e); });
}

  const filterQS = "company_id=eq." + encodeURIComponent(companyId) + "&learner_id=eq." + encodeURIComponent(learnerId);

// ---- ふりがな(ルビ)処理 ----
// 【】で囲まれた部分（漢字読み問題の出題対象語）はルビを振らない＝答えを教えない
const RUBY_KEYS = Object.keys(RUBY_DICT).sort((a,b)=> b.length - a.length);
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function applyRubyToSegment(text){
  let out = "";
  let i = 0;
  while(i < text.length){
    let matched = false;
    for(const key of RUBY_KEYS){
      if(text.startsWith(key, i)){
        out += "<ruby>"+escapeHtml(key)+"<rt>"+escapeHtml(RUBY_DICT[key])+"</rt></ruby>";
        i += key.length;
        matched = true;
        break;
      }
    }
    if(!matched){
      out += escapeHtml(text[i]);
      i += 1;
    }
  }
  return out;
}
function applyRuby(text){
  // 【対象語】を特定し、その対象語が文章中の他の場所(「」等での再掲を含む)に
  // 出てきても、ルビを振らずそのまま出力する（答えが割れるのを防ぐ）
  const bracketTargets = [];
  const bracketRe = /【([^】]*)】/g;
  let bm;
  while((bm = bracketRe.exec(text))){
    if(bm[1]) bracketTargets.push(bm[1]);
  }
  if(bracketTargets.length === 0){
    return applyRubyToSegment(text);
  }
  const escRe = (s)=> s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const sortedTargets = [...bracketTargets].sort((a,b)=> b.length - a.length);
  const altPattern = ["【[^】]*】"].concat(sortedTargets.map(escRe)).join("|");
  const parts = text.split(new RegExp("(" + altPattern + ")"));
  return parts.map(p=>{
    if(p === undefined || p === "") return "";
    if(/^【[^】]*】$/.test(p)) return escapeHtml(p);
    if(bracketTargets.includes(p)) return escapeHtml(p);
    return applyRubyToSegment(p);
  }).join("");
}
// 日本語テキストをルビ設定に応じて描画する（container に innerHTML/textContent をセット）

// ---- 自前の確認ダイアログ（confirm/alert禁止） ----
function ask(message, onYes, onNo){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const yes = tr(T.yes), no = tr(T.no);
  bg.innerHTML = '<div class="modal-box"><p></p><div class="rowbtns"><button class="secondary" id="askNo"></button><button class="primary" id="askYes"></button></div></div>';
  bg.querySelector("p").textContent = message;
  bg.querySelector("#askYes").textContent = yes;
  bg.querySelector("#askNo").textContent = no;
  document.body.appendChild(bg);
  bg.querySelector("#askYes").onclick = function(){ document.body.removeChild(bg); if(onYes) onYes(); };
  bg.querySelector("#askNo").onclick = function(){ document.body.removeChild(bg); if(onNo) onNo(); };
}
function notify(message){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<div class="modal-box"><p></p><div class="rowbtns"><button class="primary" id="okBtn"></button></div></div>';
  bg.querySelector("p").textContent = message;
  bg.querySelector("#okBtn").textContent = tr(T.yes);
  document.body.appendChild(bg);
  bg.querySelector("#okBtn").onclick = function(){ document.body.removeChild(bg); };

// ---- 音声読み上げ(Web Speech API) ----
// 話者ラベル(女：/男：/店員：等)ごとに、可能なら別の音声(声質)を、
// 1種類しか無い場合はピッチを大きく変えて聞き分けやすくする
function pickGenderVoices(voices){
  const jaVoices = voices.filter(v=>v.lang && v.lang.startsWith("ja"));
  if(jaVoices.length === 0) return { female:null, male:null };
  // 名前のヒントから女性/男性らしい音声を探す(端末やOSによって命名が異なるため複数パターンに対応)
  const femaleHints = /female|woman|女性|kyoko|o-ren|ava|samantha/i;
  const maleHints = /male|man|男性|otoya|daniel|alex/i;
  let female = jaVoices.find(v=>femaleHints.test(v.name));
  let male = jaVoices.find(v=>maleHints.test(v.name) && v !== female);
  // ヒントで見つからなくても、2種類以上あれば単純に別の音声を割り当てる
  if(!female) female = jaVoices[0];
  if(!male) male = jaVoices.find(v=>v !== female) || female;
  return { female, male };
}

function speak(script, rate){
  if(!("speechSynthesis" in window)){
    notify(tr(T.audioUnsupported));
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const voices = window.speechSynthesis.getVoices();
    const { female, male } = pickGenderVoices(voices);
    const neutralVoice = female || voices.find(v=>v.lang && v.lang.startsWith("ja")) || null;
    // 実際に問題文で使用する話者ラベルのみを対象に分割する(誤検出防止)
    const SPEAKER_LABELS = ["女","男","店員","客","上司","部下"];
    const labelPattern = SPEAKER_LABELS.join("|");
    const parts = script.split(new RegExp(`(?=(?:${labelPattern})：)`));
    let lastLabel = null;
    let toggle = false;
    parts.forEach(part=>{
      if(!part.trim()) return;
      const m = part.match(new RegExp(`^(${labelPattern})：`));
      let pitch = 1.0;
      let voice = neutralVoice;
      if(m){
        const label = m[1];
        if(label === "女"){ pitch = 1.4; voice = female || neutralVoice; }
        else if(label === "男"){ pitch = 0.65; voice = male || neutralVoice; }
        else {
          if(label !== lastLabel){ toggle = !toggle; lastLabel = label; }
          pitch = toggle ? 1.35 : 0.7;
          voice = toggle ? (female || neutralVoice) : (male || neutralVoice);
        }
      }
      const u = new SpeechSynthesisUtterance(part);
      u.lang = "ja-JP";
      u.rate = rate || 1.0;
      u.pitch = pitch;
      if(voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    });
  }catch(e){
    notify(tr(T.audioUnsupported));
  }
}

// ---- 学習記録ロジック ----
function recordAnswer(qid, isCorrect, subj){
  const d = load();
  if(!d.q[qid]) d.q[qid] = {n:0,c:0,t:0};
  d.q[qid].n += 1;
  if(isCorrect) d.q[qid].c += 1;
  d.q[qid].t = Date.now();

  // 日別・科目別の記録も更新(本人向け・管理者向けダッシュボードの推移表示に使う)
  const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
  if(!d.daily) d.daily = {};
  if(!d.daily[today]) d.daily[today] = {};
  if(subj){
    if(!d.daily[today][subj]) d.daily[today][subj] = {n:0,c:0};
    d.daily[today][subj].n += 1;
    if(isCorrect) d.daily[today][subj].c += 1;
  }

  save(d);
  syncProgress(qid);
  if(subj) syncDailySummary(today, subj, d.daily[today][subj]);
}
function recordExam(examgroup, correct, total, pct){
  const d = load();
  if(!d.exams) d.exams = [];
  d.exams.unshift({d:Date.now(), g:examgroup, c:correct, n:total, pct:pct});
  d.exams = d.exams.slice(0,20);
  save(d);
  syncExam(examgroup, correct, total, pct);
}
function overallStats(){
  const d = load();
  let studied=0, totalN=0, totalC=0;
  ALL_Q.forEach(q=>{
    const r = d.q[q.id];
    if(r && r.n>0){ studied++; totalN+=r.n; totalC+=r.c; }
  });
  return { studied, total: ALL_Q.length, rate: totalN? Math.round(totalC/totalN*100):0 };
}
function catRate(cat){
  const d = load();
  const qs = ALL_Q.filter(q=>q.c===cat);
  let n=0,c=0;
  qs.forEach(q=>{ const r=d.q[q.id]; if(r){ n+=r.n; c+=r.c; } });
  return n? Math.round(c/n*100): null;
}
function weakQuestions(limit){
  const d = load();
  const scored = ALL_Q.map(q=>{
    const r = d.q[q.id];
    let score;
    if(!r || r.n===0) score = 0.55;
    else score = r.c / r.n;
    const n = r? r.n : 0;
    return {q, score, n};
  });
  scored.sort((a,b)=>{
    if(a.score !== b.score) return a.score - b.score;
    return b.n - a.n;
  });
  return scored.slice(0, limit).map(x=>x.q);
}

function subjRate(subj){
  const d = load();
  const qs = ALL_DATA[subj];
  let n=0,c=0;
  qs.forEach(q=>{ const r=d.q[q.id]; if(r){ n+=r.n; c+=r.c; } });
  return { n, c, rate: n? Math.round(c/n*100): null };
}
function weeklyStats(){
  const d = load();
  const daily = d.daily || {};
  const today = new Date();
  let n=0, c=0;
  for(let i=0;i<7;i++){
    const dt = new Date(today); dt.setDate(dt.getDate()-i);
    const key = dt.toISOString().slice(0,10);
    const day = daily[key];
    if(!day) continue;
    Object.values(day).forEach(v=>{ n+=v.n; c+=v.c; });
  }
  return { n, c, rate: n? Math.round(c/n*100):0 };
}
function dailyTrendArray(days){
  const d = load();
  const daily = d.daily || {};
  const today = new Date();
  const arr = [];
  for(let i=(days-1);i>=0;i--){
    const dt = new Date(today); dt.setDate(dt.getDate()-i);
    const key = dt.toISOString().slice(0,10);
    const day = daily[key];
    let n=0,c=0;
    if(day) Object.values(day).forEach(v=>{ n+=v.n; c+=v.c; });
    arr.push({ date: key, n, c, rate: n? Math.round(c/n*100): null });
  }
  return arr;
}
function achievementScore(){
  const d = load();
  const exams = d.exams || [];
  if(exams.length > 0){
    const latestByGroup = {};
    exams.forEach(e=>{ if(!latestByGroup[e.g] || e.d > latestByGroup[e.g].d) latestByGroup[e.g] = e; });
    const vals = Object.values(latestByGroup).map(e=>e.pct);
    const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    return { score: avg, basedOnExam: true };
  }
  const s = overallStats();
  return { score: s.rate, basedOnExam: false };
}
function weakestSubject(){
  let worst = null;
  ["moji","bunpo","dokkai","choukai"].forEach(subj=>{
    const r = subjRate(subj);
    if(r.n === 0) return; // 未着手の科目は「弱点」ではなく「未着手」として別扱い
    if(!worst || r.rate < worst.rate) worst = { subj, rate: r.rate, n: r.n };
  });
  return worst;
}

// ---- ホーム到達フェーズ ----
function currentPhase(){
  const s = overallStats();
  if(s.rate >= 70 && s.studied >= Math.round(s.total*0.7)) return 3;
  if(s.rate >= 50 && s.studied >= Math.round(s.total*0.4)) return 2;
  return 1;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// 選択肢の並び順をシャッフルした「表示用コピー」を作る。
// 元データ(ALL_Q)は書き換えない。正解インデックス(a)もシャッフル後の位置に付け替える。
function shuffleQuestionOptions(q){
  const order = shuffle([...Array(q.o.length).keys()]);
  const newOptions = order.map(i=>q.o[i]);
  const newCorrect = order.indexOf(q.a);
  return Object.assign({}, q, { o: newOptions, a: newCorrect });
}

function startPractice(limit){
  const cats = ST.selectedCats.length ? ST.selectedCats : [...new Set(ALL_DATA[ST.subject].map(q=>q.c))];
  let pool = ALL_DATA[ST.subject].filter(q=>cats.includes(q.c));
  pool = shuffle(pool);
  if(limit) pool = pool.slice(0, limit);
  pool = pool.map(shuffleQuestionOptions);
  ST.mode = "practice";
  ST.queue = pool;
  ST.idx = 0; ST.answers = {}; ST.answered = {}; ST.revealed = {};
  ST.view = "question";
  render();
}

function startMock(examgroup){
  const cats = Object.keys(CAT_TO_EXAMGROUP).filter(c=>CAT_TO_EXAMGROUP[c]===examgroup);
  let pool = ALL_Q.filter(q=>cats.includes(q.c));
  pool = shuffle(pool);
  pool = pool.map(shuffleQuestionOptions);
  ST.mode = "mock";
  ST.subject = examgroup;
  ST.queue = pool;
  ST.idx = 0; ST.answers = {}; ST.answered = {}; ST.revealed = {};
  ST.mockTimeUp = false;
  ST.mockTimerSec = EXAMGROUP_MIN[examgroup]*60;
  ST.view = "question";
  render();
  startTimer();
}

function startTimer(){
  clearTimer();
  ST.mockTimerHandle = setInterval(()=>{
    ST.mockTimerSec -= 1;
    if(ST.mockTimerSec <= 0){
      clearTimer();
      ST.mockTimeUp = true;
      submitExam(true);
      return;
    }
    const el2 = document.getElementById("timerDisplay");
    if(el2){
      const m = Math.floor(ST.mockTimerSec/60), sec = ST.mockTimerSec%60;
      el2.textContent = (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
      el2.className = "timer" + (ST.mockTimerSec <= 300 ? " warn":"");
    }
  },1000);
}
function clearTimer(){ if(ST.mockTimerHandle){ clearInterval(ST.mockTimerHandle); ST.mockTimerHandle=null; } }

// ---- SVG折れ線グラフ(日々の正答率推移。外部ライブラリ不使用) ----
function svgDailyTrend(trendArr){
  const withData = trendArr.filter(d=>d.n > 0);
  if(withData.length < 2) return "";
  const W = 320, H = 140, padL = 30, padR = 10, padT = 10, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = trendArr.length;
  const xStep = n > 1 ? plotW / (n - 1) : 0;

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:340px;display:block;margin:0 auto;">';
  [0,50,100].forEach(v=>{
    const y = padT + plotH - (v/100*plotH);
    svg += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#e2e8f0" stroke-width="1"/>';
    svg += '<text x="'+(padL-5)+'" y="'+(y+3).toFixed(1)+'" font-size="9" fill="#8a94a6" text-anchor="end">'+v+'</text>';
  });

  let path = "";
  let started = false;
  trendArr.forEach((d,i)=>{
    if(d.rate === null) return;
    const x = padL + i*xStep;
    const y = padT + plotH - (d.rate/100*plotH);
    path += (!started ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    started = true;
  });
  svg += '<path d="'+path+'" fill="none" stroke="var(--blue)" stroke-width="2"/>';
  trendArr.forEach((d,i)=>{
    if(d.rate === null) return;
    const x = padL + i*xStep;
    const y = padT + plotH - (d.rate/100*plotH);
    svg += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="var(--blue)"/>';
  });

  const fmt = (iso)=>{ const p = iso.split("-"); return p[1]+"/"+p[2]; };
  svg += '<text x="'+padL+'" y="'+(H-4)+'" font-size="9" fill="#8a94a6" text-anchor="start">'+fmt(trendArr[0].date)+'</text>';
  svg += '<text x="'+(W-padR)+'" y="'+(H-4)+'" font-size="9" fill="#8a94a6" text-anchor="end">'+fmt(trendArr[n-1].date)+'</text>';
  svg += '</svg>';
  return svg;
}

// ---- 長文パッセージを句点ごとに改行して読みやすくする ----
function insertSentenceBreaks(text){
  // 文末の句点(。)の後に改行を入れる。「」内の句点や、文字列末尾の句点は対象外
  return text.replace(/。(?!」|』|\s*$)/g, "。\n");
}

// ---- 日本語＋翻訳を常に併記して表示する ----
// practice modeのみ翻訳を併記(模試は本試験と同条件でJapaneseのみ)。
// container に日本語(1行目)と、必要なら翻訳(2行目、やや小さく・グレー)を入れる。
function renderPaired(container, arr, opts){
  opts = opts || {};
  container.innerHTML = "";
  const jaText = opts.sentenceBreaks ? insertSentenceBreaks(arr[0]) : arr[0];
  const jaLine = document.createElement("div");
  if(ST.mode === "practice" && !opts.noFurigana){
    renderJaInto(jaLine, jaText);
  } else {
    jaLine.textContent = jaText;
  }
  container.appendChild(jaLine);

  const showTranslation = ST.mode === "practice" && ST.lang !== "ja" && tr(arr).trim() !== arr[0].trim();
  if(showTranslation){
    const trLine = document.createElement("div");
    trLine.style.cssText = "font-size:.82em;color:#6b7789;margin-top:3px;font-weight:400;";
    trLine.textContent = tr(arr);
    container.appendChild(trLine);
  }
}

function renderQuestion(){
  const wrap = document.createElement("div");
  const q = ST.queue[ST.idx];
  if(!q){
    ST.view="home"; render();
    return wrap;
  }

  const top = el('<div class="topbar"></div>');
  const backBtn = document.createElement("button");
  backBtn.className = "ghost"; backBtn.textContent = tr(T.back);
  backBtn.onclick = ()=>{
    if(ST.mode==="mock"){
      ask(tr(T.quitMock), ()=>{ clearTimer(); ST.view="home"; render(); });
    } else {
      ST.view="home"; render();
    }
  };
  top.appendChild(backBtn);

  const right = document.createElement("div");
  if(ST.mode==="mock"){
    const timer = document.createElement("span");
    timer.className = "timer"; timer.id = "timerDisplay";
    const m = Math.floor(ST.mockTimerSec/60), sec = ST.mockTimerSec%60;
    timer.textContent = (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
    right.appendChild(timer);
  } else {
    const prog = document.createElement("span");
    prog.className = "progress";
    prog.textContent = (ST.idx+1)+" / "+ST.queue.length;
    right.appendChild(prog);
  }
  top.appendChild(right);
  wrap.appendChild(top);

  if(ST.mode === "mock"){
    const grid = el('<div class="gridnum"></div>');
    ST.queue.forEach((qq,i)=>{
      const b = document.createElement("button");
      b.textContent = i+1;
      if(ST.answers[i] !== undefined) b.className = "done";
      b.onclick = ()=>{ ST.idx = i; render(); };
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
  } else {
    const prog = document.createElement("div");
    prog.className = "progress"; prog.style.marginBottom="8px";
    prog.textContent = tr(CAT[q.c]);
    wrap.appendChild(prog);
  }

  const card = el('<div class="qcard"></div>');
  const alreadyAnswered = ST.answers[ST.idx] !== undefined;
  const showFeedback = (ST.mode==="practice") && alreadyAnswered;
  const isChoukai = !!q.script;

  if(isChoukai){
    const audioBar = el('<div class="rowbtns" style="margin-bottom:12px;"></div>');
    const playBtn = document.createElement("button");
    playBtn.className = "primary";
    playBtn.textContent = tr(T.playAudio);
    playBtn.onclick = ()=>{ speak(q.script, 1.0); playBtn.textContent = tr(T.replayAudio); };
    audioBar.appendChild(playBtn);
    const slowBtn = document.createElement("button");
    slowBtn.className = "secondary";
    slowBtn.textContent = tr(["ゆっくり再生(0.65倍)","Slow (0.65x)","Pelan (0.65x)","Mabagal (0.65x)"]);
    slowBtn.style.flex = "0 0 auto";
    slowBtn.onclick = ()=>{ speak(q.script, 0.65); };
    audioBar.appendChild(slowBtn);
    card.appendChild(audioBar);

    if(ST.mode === "practice"){
      const scriptTog = el('<div class="togglewrap"></div>');
      const scb = document.createElement("input");
      scb.type = "checkbox"; scb.checked = ST.showScriptText; scb.id = "scriptCb";
      scb.onchange = ()=>{ ST.showScriptText = scb.checked; render(); };
      const scl = document.createElement("label");
      scl.setAttribute("for","scriptCb");
      scl.textContent = tr(T.showScript);
      scriptTog.appendChild(scb); scriptTog.appendChild(scl);
      card.appendChild(scriptTog);
      if(ST.showScriptText){
        const scriptBox = el('<div class="passage" style="margin-top:8px;"></div>');
        renderJaInto(scriptBox, insertSentenceBreaks(q.script));
        card.appendChild(scriptBox);
      }
    }
  }

  if(q.p){
    const passage = el('<div class="passage"></div>');
    renderPaired(passage, q.p, { sentenceBreaks: true });
    card.appendChild(passage);
  }
  const qtext = el('<div class="qtext"></div>');
  renderPaired(qtext, q.q);
  card.appendChild(qtext);

  const numOptions = q.o.length;
  for(let i=0;i<numOptions;i++){
    const optBtn = document.createElement("button");
    optBtn.className = "opt";
    renderPaired(optBtn, q.o[i], { noFurigana: q.c === "hyoki" });
    if(alreadyAnswered){
      if(ST.mode==="practice"){
        if(i===q.a) optBtn.className += " correct";
        else if(i===ST.answers[ST.idx]) optBtn.className += " wrong";
      } else {
        if(i===ST.answers[ST.idx]) optBtn.className += " sel";
      }
    }
    optBtn.onclick = ()=>{
      if(ST.mode==="practice" && alreadyAnswered) return; // 練習は一度答えたら確定
      ST.answers[ST.idx] = i;
      if(ST.mode==="practice"){
        recordAnswer(q.id, i===q.a, q.subj);
      }
      render();
    };
    card.appendChild(optBtn);
  }

  if(showFeedback){
    const fb = el('<div class="feedback"></div>');
    const correct = ST.answers[ST.idx] === q.a;
    fb.className = "feedback " + (correct ? "ok":"ng");
    fb.textContent = (correct ? tr(T.correct) : tr(T.incorrect)) + "　" + tr(T.explanation) + "：" + tr(q.e);
    card.appendChild(fb);
  }

  wrap.appendChild(card);

  if(ST.mode === "practice"){
    const togWrap = el('<div style="margin-top:10px;"></div>');
    const furiTog = el('<div class="togglewrap"></div>');
    const fcb = document.createElement("input");
    fcb.type = "checkbox"; fcb.checked = ST.showFurigana; fcb.id = "furiCb";
    fcb.onchange = ()=>{ ST.showFurigana = fcb.checked; render(); };
    const flb = document.createElement("label");
    flb.setAttribute("for","furiCb");
    flb.textContent = tr(T.showFurigana);
    furiTog.appendChild(fcb); furiTog.appendChild(flb);
    togWrap.appendChild(furiTog);
    wrap.appendChild(togWrap);
  }

  if(ST.mode === "mock"){
    const note = el('<div class="progress" style="margin-top:10px;"></div>');
    note.textContent = "※ " + tr(["模試モードは本試験と同条件のため、ふりがな・母語表示はありません。","Mock exam mode has no furigana or native-language display, matching real exam conditions.","Mode ujian tidak ada furigana atau tampilan bahasa asli, sesuai kondisi ujian asli.","Walang furigana o native-language display sa mock exam mode, katulad ng tunay na exam."]);
    wrap.appendChild(note);
  }

  const nav = el('<div class="rowbtns" style="margin-top:16px;"></div>');
  if(ST.idx > 0){
    const prevBtn = document.createElement("button");
    prevBtn.className = "secondary"; prevBtn.textContent = "← ";
    prevBtn.onclick = ()=>{ ST.idx -= 1; render(); };
    nav.appendChild(prevBtn);
  }
  if(ST.idx < ST.queue.length - 1){
    const nextBtn = document.createElement("button");
    nextBtn.className = "primary"; nextBtn.textContent = tr(T.next);
    nextBtn.onclick = ()=>{ ST.idx += 1; render(); };
    nav.appendChild(nextBtn);
  } else {
    const doneBtn = document.createElement("button");
    doneBtn.className = "primary";
    doneBtn.textContent = ST.mode==="mock" ? tr(T.submit) : tr(T.back);
    doneBtn.onclick = ()=>{
      if(ST.mode==="mock") submitExamCheck();
      else { ST.view="home"; render(); }
    };
    nav.appendChild(doneBtn);
  }
  wrap.appendChild(nav);

  return wrap;
}

function submitExamCheck(){
  const unanswered = ST.queue.filter((q,i)=>ST.answers[i]===undefined).length;
  if(unanswered > 0){
    ask(tr(T.unanswered), ()=> submitExam(false));
  } else {
    submitExam(false);
  }
}

function submitExam(timeUp){
  clearTimer();
  let correct = 0;
  ST.queue.forEach((q,i)=>{
    const isC = ST.answers[i] === q.a;
    if(isC) correct++;
    recordAnswer(q.id, isC, q.subj);
  });
  const total = ST.queue.length;
  const pct = total? Math.round(correct/total*100) : 0;
  recordExam(ST.subject, correct, total, pct);
  ST.resultData = { correct, total, pct, timeUp, examgroup: ST.subject };
  ST.view = "result";
  render();
}

  const wrap = document.createElement("div");
  const r = ST.resultData;
  const card = el('<div class="card"></div>');

    row.innerHTML = '<div style="font-size:13px;font-weight:700;color:'+(ok?"var(--green)":"var(--red)")+'">'+(i+1)+". "+(ok?tr(T.correct):tr(T.incorrect))+'</div>';

    qt.style.fontSize="13px"; qt.style.margin="4px 0";
    qt.textContent = tr(q.q);
    row.appendChild(qt);
    const et = document.createElement("div");
    et.style.fontSize="12px"; et.style.color="#667";

  });
  wrap.appendChild(listCard);

  const homeBtn = document.createElement("button");
  homeBtn.className = "primary"; homeBtn.style.width="100%";
  homeBtn.textContent = tr(T.home);
  homeBtn.onclick = ()=>{ ST.view="home"; render(); };
  wrap.appendChild(homeBtn);

  return wrap;
}

// ---- init ----
if(!loadIds()){
  ST.view = "onboarding";
} else {
  syncActivity();
}
render();

})();
