<style>
:root{
  --navy:#14213D;
  --blue:#1D4ED8;
  --ink:#1E293B;
  --sub:#64748B;
  --line:#E2E8F0;
  --accent:#b5502f;
  --green:#3d7a52;
  --red:#b5502f;
  --bg:#ffffff;
  --bgpanel:#F8FAFC;
}
*{box-sizing:border-box;}
html{width:100%;overflow-x:hidden;}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);width:100%;overflow-x:hidden;min-height:100vh;min-height:100dvh;}
header{background:var(--bg);color:var(--ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;border-bottom:1px solid var(--line);}
header .headerTop{display:flex;flex-wrap:nowrap;justify-content:flex-start;align-items:center;gap:10px;max-width:600px;margin:0 auto;width:100%;}
.orgLogo{width:54px;height:auto;flex:0 0 auto;display:block;}
@supports not (padding-top: env(safe-area-inset-top)) { header{padding-top:14px;} }
header h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy);line-height:1.3;flex:1;min-width:0;}
header h1 .appTitleTop{display:block;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.02em;}
header h1 .appTitleMain{display:block;font-size:18px;font-weight:800;color:var(--blue);letter-spacing:.01em;margin-top:1px;}
.langbar{display:flex;flex:0 0 auto;position:relative;}
.langswitch{position:relative;}
.langswitchbtn{display:flex;align-items:center;gap:6px;background:#f3f6fb;border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink);}
.langswitchbtn .langflag{display:inline-block;width:16px;height:16px;border-radius:50%;overflow:hidden;border:1px solid var(--line);flex:0 0 auto;}
.langswitchbtn .langflag svg{display:block;}
.langswitchbtn .langname{font-weight:500;}
.langswitchbtn .langchev{width:14px;height:14px;color:var(--sub);}
.langmenu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(20,33,61,.12);min-width:210px;padding:6px;z-index:50;}
.langmenutitle{font-size:11px;color:var(--sub);padding:6px 10px 4px;}
.langmenuitem{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:13.5px;color:var(--ink);text-align:left;}
.langmenuitem:hover{background:#f3f6fb;}
.langmenuitem.active{font-weight:600;color:var(--blue);background:#eaf1fb;}
.langmenuitem .langflag{display:inline-block;width:18px;height:18px;border-radius:50%;overflow:hidden;border:1px solid var(--line);flex:0 0 auto;}
.langmenuitem .langflag svg{display:block;}
.langmenuitem .langname{flex:1;}
.langmenuitem .langcheck{width:16px;height:16px;flex:0 0 auto;}
.ratebtn{background:transparent;border:none;border-bottom:1px solid transparent;color:var(--sub);padding:2px 0;font-size:12px;cursor:pointer;letter-spacing:.03em;}
.ratebtn.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
main{max-width:600px;margin:0 auto;padding:0 20px 48px;width:100%;box-sizing:border-box;}
footer{text-align:center;font-size:11px;color:var(--sub);padding:16px 20px 28px;}
.tabbar{display:flex;border-bottom:1px solid var(--line);margin-bottom:8px;}
.tabbtn{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px 10px;cursor:pointer;color:var(--sub);font-size:12px;font-weight:500;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tabbtn svg{width:20px;height:20px;}
.tabbtn.active{color:var(--blue,var(--navy));border-bottom-color:var(--blue,var(--navy));font-weight:600;}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;border:1px solid var(--line);}
.milestone{background:var(--navy);color:#fff;border-radius:6px;padding:16px;margin-bottom:14px;}
.milestone .phaselabel{font-size:12px;opacity:.8;margin-bottom:4px;}
.milestone .phasename{font-size:17px;font-weight:700;}
.stats{display:flex;gap:10px;margin-top:10px;}
.stat{flex:1;background:#fff;border-radius:10px;padding:10px;text-align:center;}
.stat .num{font-size:20px;font-weight:700;color:var(--blue);}
.stat .lbl{font-size:11px;color:#667;}
h2.subject{font-size:18px;color:var(--ink);font-weight:700;letter-spacing:0;margin:32px 0 14px;padding-bottom:0;border-bottom:none;}
h2.subject:first-of-type{margin-top:4px;}
.rowbtns{display:flex;gap:8px;}
/* 問題画面の「次へ」等のボタンは、解説文が長い(特に英語などの翻訳表示時)と画面下に
   はみ出てタップできなくなることがあったため、画面下部に固定表示にする。
   mainと同じ幅・中央寄せにして、PC幅で見たときに横に間延びしないようにする。 */
.qnav-fixed{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;
  background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));
  z-index:200;box-sizing:border-box;}
button.primary{background:var(--navy);color:#fff;border:none;border-radius:4px;padding:14px 18px;font-size:14px;font-weight:600;cursor:pointer;flex:1;letter-spacing:.01em;}
button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 18px;font-size:14.5px;font-weight:700;cursor:pointer;flex:1;}
button.ghost{background:transparent;border:none;color:var(--sub);font-size:12px;cursor:pointer;padding:6px 0;}
.fbarwrap{margin:15px 0;}
.fbarrow{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:8px;}
.fbarlabel{color:var(--ink);font-weight:600;}
.fbarval{color:var(--sub);font-weight:700;}
.fbartrack{height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
.fbar{height:100%;background:var(--blue);border-radius:3px;}
.fbar.low{background:var(--accent);}
.catlist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.catchip{border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none;}
.catchip.sel{background:var(--navy);color:#fff;border-color:var(--navy);}
.qcard{background:#fff;border-radius:6px;padding:20px;border:1px solid var(--line);}
.passage{background:#fafafa;border-radius:4px;padding:12px;font-size:14px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;}
ruby rt{font-size:11px;color:var(--sub);user-select:none;}
.qtext{font-size:18px;font-weight:600;line-height:1.65;margin-bottom:16px;}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 15px;margin-bottom:9px;font-size:17px;cursor:pointer;line-height:1.5;}
.opt.sel{border-color:var(--navy);border-width:1.5px;}
.opt.correct{border-color:#3d7a52;border-width:1.5px;background:#f4f9f5;}
.opt.wrong{border-color:var(--accent);border-width:1.5px;background:#fbf3f0;}
.feedback{margin-top:12px;margin-bottom:4px;padding:12px;border-radius:4px;font-size:13px;line-height:1.6;border:1px solid var(--line);}
.feedback.ok{color:#3d7a52;}
.feedback.ng{color:var(--accent);}
.explanation-note{font-size:11px;color:var(--sub);line-height:1.5;padding:0 2px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.timer{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.timer.warn{color:var(--accent);}
.progress{font-size:12.5px;color:var(--ink);font-weight:500;opacity:.7;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:6px;padding:20px;max-width:360px;width:100%;}
.modal-box p{font-size:14px;line-height:1.6;margin:0 0 16px;}
.modal-box .rowbtns button{padding:10px;}
.togglewrap{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0;}
.footerlinks{text-align:center;margin-top:20px;}
.footerlinks .rowbtns{display:flex;justify-content:center;gap:12px;}
.footerlinks button{margin:0 6px;}
.gridnum{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-bottom:14px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.gridnum button{flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;}
.gridnum button.done{background:var(--bgpanel);border-color:var(--line);color:var(--sub);}
.gridnum button.current{background:var(--blue);color:#fff;border-color:var(--blue);}
.mockprogwrap{margin-bottom:12px;}
.mockproglabel{font-size:12px;color:var(--sub);margin-bottom:5px;font-variant-numeric:tabular-nums;}
.mockprogtrack{height:6px;border-radius:3px;background:var(--bgpanel);overflow:hidden;}
.mockprogfill{height:100%;background:var(--blue);border-radius:3px;transition:width .2s ease;}

// (認証導入前は端末内で1人分のデータしか想定していなかったため、

// 動作確認用のアカウントかどうか。
// 実習生IDが "TEST" で始まるものを動作確認用として扱う（例: TEST01）。
// Dekisugiの実習生IDは数字なので、実在の実習生と衝突しない。
function isTestAccount(){
  const code = AUTH.student && AUTH.student.dekisugi_student_code;
  return !!code && /^TEST/i.test(code);
}

function storageKey(){
  return AUTH.student ? (STORAGE_KEY_BASE + "__" + AUTH.student.id) : STORAGE_KEY_BASE;
}
const SETTINGS_KEY = "ntic_jlpt_settings_v1";
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(!raw) return { autoPlayAudio: true };
    const s = JSON.parse(raw);
    return { autoPlayAudio: s.autoPlayAudio !== false }; // 未設定・不正値はデフォルトON
  }catch(e){ return { autoPlayAudio: true }; }
}
function saveSettings(s){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){ /* noop */ }
}

const ALL_DATA = {
  moji: DATA_MOJI.concat(DATA_MOJI_2, DATA_MOJI_3, DATA_MOJI_4, DATA_MOJI_5, DATA_MOJI_6),
  bunpo: DATA_BUNPO.concat(DATA_BUNPO_2, DATA_BUNPO_3, DATA_BUNPO_4, DATA_BUNPO_5, DATA_BUNPO_6),
  dokkai: DATA_DOKKAI.concat(DATA_DOKKAI_2, DATA_DOKKAI_3, DATA_DOKKAI_4, DATA_DOKKAI_5, DATA_DOKKAI_6),

  tanbun:"bunpo_dokkai", chubun:"bunpo_dokkai", kensaku:"bunpo_dokkai",

// ---- id採番（ビルド時ではなく初回ロード時に配列順で採番） ----
let idCounter = 1;
Object.keys(ALL_DATA).forEach(subj=>{

});
const ALL_Q = [].concat(ALL_DATA.moji, ALL_DATA.bunpo, ALL_DATA.dokkai, ALL_DATA.choukai);
function qById(id){ return ALL_Q.find(x=>x.id===id); }

// ---- storage ----
let memoryFallback = null;
let storageBroken = false;
function load(){
  try{
    const raw = localStorage.getItem(storageKey());
    if(!raw){ return {v:1,q:{},exams:[]}; }
    return JSON.parse(raw);
  }catch(e){
    storageBroken = true;
    return memoryFallback || {v:1,q:{},exams:[]};
  }
}
function save(data){
  try{
    localStorage.setItem(storageKey(), JSON.stringify(data));
  }catch(e){
    storageBroken = true;
    memoryFallback = data;

}

// ---- 認証(Supabase Auth)・本人情報管理 ----
// Phase 1: 実習生は組合が発行したログインID(NTIC-000183等)とパスワードでログインする。
// Supabase Auth上は "NTIC-000183@ntic-academy.internal" のような内部専用の擬似メールアドレスを使う。
const AUTH_SESSION_KEY = "ntic_auth_session_v1";
const AUTH_EMAIL_DOMAIN = "@ntic-academy.internal";

let AUTH = {
  session: null,   // { access_token, refresh_token, expires_at }
  student: null,   // students テーブルの本人の行(id, name, company_id, language, status, ...)
  mustChangePassword: false
};

function loginIdToEmail(loginId){
  // ログインIDの大文字・小文字表記ゆれを吸収するため、常に小文字化してから内部メールアドレスを組み立てる。
  // (アカウント発行時も、必ずこの関数と同じ小文字化ルールでメールアドレスを作成すること)
  return loginId.trim().toLowerCase() + AUTH_EMAIL_DOMAIN;
}

function decodeJwtPayload(token){
  try{
    const payload = token.split(".")[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,"+").replace(/_/g,"/"))
      .split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  }catch(e){ return {}; }
}

function loadAuthSession(){
  try{
    const raw = localStorage.getItem(AUTH_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveAuthSession(session){
  try{ localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(session)); }catch(e){ /* noop */ }
}
function clearAuthSession(){
  try{ localStorage.removeItem(AUTH_SESSION_KEY); }catch(e){ /* noop */ }
}

// ログイン: ログインID・パスワードでSupabase Authに認証する
async function authLogin(loginId, password){
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: loginIdToEmail(loginId), password: password })
  });
  const data = await res.json();
  if(!res.ok || !data.access_token){
    throw new Error(data.error_description || data.msg || "login_failed");
  }
  const session = {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in || 3600) * 1000
  };
  saveAuthSession(session);
  AUTH.session = session;
  return session;
}

// リフレッシュトークンでセッションを更新する(アクセストークンの期限切れ対策)
async function authRefresh(refreshToken){
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: refreshToken })
  });
  const data = await res.json();
  if(!res.ok || !data.access_token) throw new Error("refresh_failed");
  const session = {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in || 3600) * 1000
  };
  saveAuthSession(session);
  AUTH.session = session;
  return session;
}

// ログアウト: Supabase Auth側のセッションを破棄し、ローカルの認証情報も消す
async function authLogout(){
  const session = AUTH.session;
  AUTH.session = null;
  AUTH.student = null;
  AUTH.mustChangePassword = false;
  clearAuthSession();
  if(session){
    try{
      await fetch(SUPABASE_URL + "/auth/v1/logout", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + session.access_token }
      });
    }catch(e){ /* ベストエフォート。失敗してもローカルのセッションは既に消えている */ }
  }
}

// 初回パスワード変更: Supabase Authに完全に任せる(NTLP側でパスワードは一切保持しない)
async function authChangePassword(newPassword){
  const res = await fetch(SUPABASE_URL + "/auth/v1/user", {
    method: "PUT",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + AUTH.session.access_token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      password: newPassword,
      data: { must_change_password: false } // 変更完了フラグをuser_metadataから外す
    })
  });
  if(!res.ok){
    const data = await res.json().catch(()=>({}));
    // 画面には利用者向けの短いメッセージしか出さないため、
    // 原因調査ができるようコンソールにはサーバーの生の理由を残す。
    console.warn("[auth] パスワード変更に失敗", res.status, data);
    throw new Error(data.error_description || data.msg || "password_change_failed");
  }

  // アクセストークンにはログイン時点のuser_metadataが埋め込まれており、
  // パスワードを変えただけでは must_change_password が true のまま残る。
  // トークンを取り直さないと、リロード時にまた変更画面へ戻されてしまう。
  try{
    await authRefresh(AUTH.session.refresh_token);
  }catch(e){
    // 取り直しに失敗しても、今のセッションは有効期限まで使えるので続行する。
    console.warn("[auth] パスワード変更後のトークン更新に失敗", e);
  }
  AUTH.mustChangePassword = false;
}

// 有効なセッションを前提に、ログイン中のJWTでSupabaseへアクセスするためのヘッダー
function authedHeaders(extra){
  const h = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + AUTH.session.access_token,
    "Content-Type": "application/json"
  };
  if(extra) Object.assign(h, extra);
  return h;
}

// ログイン中の本人のstudentsレコードを取得する
async function fetchOwnStudent(){
  const res = await fetch(SUPABASE_URL + "/rest/v1/students?select=id,name,company_id,language,status,dekisugi_student_code", {
    headers: authedHeaders()
  });
  if(!res.ok) throw new Error("student_fetch_failed");
  const rows = await res.json();
  return rows[0] || null;
}

// セッション確立〜本人特定までを行う。失敗したらnullを返す(呼び出し側でログイン画面に戻す)
async function establishSession(){
  let session = loadAuthSession();
  if(!session) return null;
  if(Date.now() >= session.expires_at - 60000){
    try{ session = await authRefresh(session.refresh_token); }
    catch(e){ clearAuthSession(); return null; }
  }
  AUTH.session = session;

  const payload = decodeJwtPayload(session.access_token);
  AUTH.mustChangePassword = !!(payload.user_metadata && payload.user_metadata.must_change_password);

  let student;
  try{ student = await fetchOwnStudent(); }
  catch(e){ return null; }
  if(!student || student.status !== "active"){
    // 実習生アカウントが見つからない、または在籍状態がactiveでない(帰国・失踪等)場合はログインさせない
    await authLogout();
    return null;
  }
  AUTH.student = student;
  return AUTH;
}

function tr(arr){ const i = LANGS.indexOf(ST.lang); const v = i>=0?arr[i]:arr[0]; return (v===undefined || v==="") ? arr[0] : v; }

// ---- ふりがな(ルビ)処理 ----
// 【】で囲まれた部分（漢字読み問題の出題対象語）はルビを振らない＝答えを教えない
const RUBY_KEYS = Object.keys(RUBY_DICT).sort((a,b)=> b.length - a.length);
// 音声合成(TTS)専用のキー一覧。「話」を含む単語(話して/話します/電話/会話 等)は、
// 全てひらがな化すると一部のブラウザ音声エンジンが「〜が＋は」を主語+助詞(＝「わ」)と
// 誤認識し、「はなす」が「わなす」のように聞こえてしまう不具合が確認されたため、
// 音声用の変換だけは対象から除外し、漢字の「話」を残す(画面のふりがな表示は影響を受けない)。
const SPEECH_RUBY_KEYS = RUBY_KEYS.filter(k => !k.includes("話"));
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function isHiraganaChar(ch){
  return ch >= "\u3040" && ch <= "\u309F";
}
// 辞書のキーには「お願い」→「おねがい」のように、漢字だけでなく前後の送り仮名まで
// 含んだ形で登録されているものが4割ほどある(動詞の活用形などをそのまま登録しているため)。
// そのまま<ruby>で囲むと、送り仮名の上にまでふりがなが乗っているように見えてしまうので、
// 表示直前に「前後の送り仮名」と「対応する読みの前後」を機械的に切り離し、
// ルビは漢字部分だけに絞る(送り仮名部分はそのまま平仮名として出力する)。
function isKanjiChar(ch){
  // 漢字と、繰り返し記号「々」を漢字として扱う
  return (ch >= "\u4e00" && ch <= "\u9fff") || ch === "\u3005";
}
function buildRubyHtml(word, reading){
  // 漢字を含まない語(カタカナ語など)にルビは不要。
  // 「アルバイト(あるばいと)」のような、読み方の助けにならない表示を避ける。
  let hasKanji = false;
  for(const ch of word){ if(isKanjiChar(ch)){ hasKanji = true; break; } }
  if(!hasKanji) return escapeHtml(word);

  // 語を「漢字のかたまり」と「かな(ひらがな・カタカナ)のかたまり」に分け、
  // かなの位置を手がかりに読みを区切って、漢字部分にだけルビを振る。
  //
  // 以前は語の前後の送り仮名しか剥がせず、「読み方(よみかた)」のように
  // 語の途中に送り仮名がある場合、語全体に読みが乗ってしまい
  // 「み」の上にまでふりがなが表示されていた。
  // 期待: 読(よ)み 方(かた)  ／ 誤り: 読み方(よみかた)
  const segs = [];
  let cur = "", curIsKanji = null;
  for(const ch of word){
    const k = isKanjiChar(ch);
    if(curIsKanji === null || k === curIsKanji){ cur += ch; curIsKanji = k; }
    else { segs.push({ text: cur, kanji: curIsKanji }); cur = ch; curIsKanji = k; }
  }
  if(cur) segs.push({ text: cur, kanji: curIsKanji });

  const parts = [];
  let pos = 0;
  for(let i = 0; i < segs.length; i++){
    const seg = segs[i];
    if(!seg.kanji){
      // かな部分。読みの中の同じ位置まで進める
      const idx = reading.indexOf(seg.text, pos);
      if(idx < 0){
        // 読みと文字列が対応しない(カタカナ表記の違い等)。
        // 無理に分割せず、語全体に読みを振る従来の形に戻す。
        return "<ruby>"+escapeHtml(word)+"<rt>"+escapeHtml(reading)+"</rt></ruby>";
      }
      parts.push({ text: seg.text, reading: null });
      pos = idx + seg.text.length;
      continue;
    }
    // 漢字部分。次のかなが現れる直前までが、この漢字の読み
    const next = (i+1 < segs.length && !segs[i+1].kanji) ? segs[i+1].text : null;
    if(next){
      const idx = reading.indexOf(next, pos);
      if(idx < 0){
        return "<ruby>"+escapeHtml(word)+"<rt>"+escapeHtml(reading)+"</rt></ruby>";
      }
      parts.push({ text: seg.text, reading: reading.slice(pos, idx) });
      pos = idx;
    } else {
      parts.push({ text: seg.text, reading: reading.slice(pos) });
      pos = reading.length;
    }
  }

  return parts.map(pt=>{
    if(pt.reading === null || pt.reading === "") return escapeHtml(pt.text);
    return "<ruby>"+escapeHtml(pt.text)+"<rt>"+escapeHtml(pt.reading)+"</rt></ruby>";
  }).join("");
}
function applyRubyToSegment(text){
  let out = "";
  let i = 0;
  while(i < text.length){
    let matched = false;
    for(const key of RUBY_KEYS){
      if(text.startsWith(key, i)){
        out += buildRubyHtml(key, RUBY_DICT[key]);
        i += key.length;
        matched = true;
        break;
      }
    }
    if(!matched){
      out += escapeHtml(text[i]);
      i += 1;
    }
  }
  return out;
}
// 音声合成(TTS)向けに、ふりがな辞書を使って漢字を読み仮名(ひらがな)に置き換える。
// ブラウザのTTSエンジン任せだと「大事」を「おおごと」と誤読する等の問題があるため、
// 既に持っている正しい読みのデータをそのまま音声にも活用する。
function toSpeechText(text){
  let out = "";
  let i = 0;
  while(i < text.length){
    let matched = false;
    for(const key of SPEECH_RUBY_KEYS){
      if(text.startsWith(key, i)){
        out += RUBY_DICT[key];
        i += key.length;
        matched = true;
        break;
      }
    }
    if(!matched){
      out += text[i];
      i += 1;
    }
  }
  return out;
}
function applyRuby(text){
  // 【対象語】を特定し、その対象語が文章中の他の場所(「」等での再掲を含む)に
  // 出てきても、ルビを振らずそのまま出力する（答えが割れるのを防ぐ）
  const bracketTargets = [];
  const bracketRe = /【([^】]*)】/g;
  let bm;
  while((bm = bracketRe.exec(text))){
    if(bm[1]) bracketTargets.push(bm[1]);
  }
  if(bracketTargets.length === 0){
    return applyRubyToSegment(text);
  }
  const escRe = (s)=> s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const sortedTargets = [...bracketTargets].sort((a,b)=> b.length - a.length);
  const altPattern = ["【[^】]*】"].concat(sortedTargets.map(escRe)).join("|");
  const parts = text.split(new RegExp("(" + altPattern + ")"));
  return parts.map(p=>{
    if(p === undefined || p === "") return "";
    if(/^【[^】]*】$/.test(p)) return escapeHtml(p);
    if(bracketTargets.includes(p)) return escapeHtml(p);
    return applyRubyToSegment(p);
  }).join("");
}
// 日本語テキストをルビ設定に応じて描画する（container に innerHTML/textContent をセット）
function renderJaInto(container, text){

  }

// ---- 音声読み上げ(Web Speech API) ----
// 話者ラベル(女：/男：/店員：等)ごとに、可能なら別の音声(声質)を、
// 1種類しか無い場合はピッチを大きく変えて聞き分けやすくする
function pickGenderVoices(voices){
  const jaVoices = voices.filter(v=>v.lang && v.lang.startsWith("ja"));
  if(jaVoices.length === 0) return { female:null, male:null };
  // 名前のヒントから女性/男性らしい音声を探す(端末やOSによって命名が異なるため複数パターンに対応)
  const femaleHints = /female|woman|女性|kyoko|o-ren|ava|samantha/i;
  const maleHints = /male|man|男性|otoya|daniel|alex/i;
  let female = jaVoices.find(v=>femaleHints.test(v.name));
  let male = jaVoices.find(v=>maleHints.test(v.name) && v !== female);
  // ヒントで見つからなくても、2種類以上あれば単純に別の音声を割り当てる
  if(!female) female = jaVoices[0];
  if(!male) male = jaVoices.find(v=>v !== female) || female;
  return { female, male };
}

// script: 読み上げるテキスト。rate: 再生速度。onState: 状態変化を通知するコールバック("playing"/"ended"/"error")
function speak(script, rate, onState){
  const notifyState = (state)=>{ if(onState) onState(state); };
  if(!("speechSynthesis" in window)){
    notifyState("error");
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const voices = window.speechSynthesis.getVoices();
    const { female, male } = pickGenderVoices(voices);
    const neutralVoice = female || voices.find(v=>v.lang && v.lang.startsWith("ja")) || null;
    // 実際に問題文で使用する話者ラベルのみを対象に分割する(誤検出防止)。
    // SPEAKER_LABELSはビルド時に全聴解データから自動生成される(gen_speaker_labels.js参照)。
    // 「客」と「乗客」のように、短いラベルが長いラベルの一部として偶然出現するケースがあるため、
    // 正規表現の全一致検索(split)ではなく、文頭から順に「その位置で一致する最長のラベル」を
    // 判定していく方式にする(ふりがな変換と同じ考え方)。
    const sortedLabels = [...SPEAKER_LABELS].sort((a,b)=> b.length - a.length);
    const parts = [];
    { 
      let i = 0, segStart = 0;
      while(i < script.length){
        let matchedLabel = null;
        for(const lb of sortedLabels){
          if(script.startsWith(lb + "：", i)){ matchedLabel = lb; break; }
        }
        if(matchedLabel){
          if(i > segStart) parts.push(script.slice(segStart, i));
          segStart = i;
          i += matchedLabel.length + 1; // ラベル＋「：」の分だけ進める
        } else {
          i += 1;
        }
      }
      if(segStart < script.length) parts.push(script.slice(segStart));
    }
    const filteredParts = parts.filter(p=>p.trim());
    if(filteredParts.length === 0){ notifyState("ended"); return; }
    let lastLabel = null;
    let toggle = false;
    const labelPattern = sortedLabels.map(l=>l.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    const utterances = filteredParts.map(part=>{
      const m = part.match(new RegExp(`^(${labelPattern})：`));
      let pitch = 1.0;
      let voice = neutralVoice;
      let spokenText = part;
      if(m){
        const label = m[1];
        spokenText = part.slice(m[0].length); // 話者ラベル自体は読み上げず、発言内容だけを話す
        if(label === "女"){ pitch = 1.25; voice = female || neutralVoice; }
        else if(label === "男"){ pitch = 0.82; voice = male || neutralVoice; }
        else {
          if(label !== lastLabel){ toggle = !toggle; lastLabel = label; }
          pitch = toggle ? 1.35 : 0.7;
          voice = toggle ? (female || neutralVoice) : (male || neutralVoice);
        }
      }
      const u = new SpeechSynthesisUtterance(toSpeechText(spokenText));
      u.lang = "ja-JP";
      u.rate = rate || 1.0;
      u.pitch = pitch;
      if(voice) u.voice = voice;
      return u;
    });
    utterances[0].onstart = ()=> notifyState("playing");
    utterances[utterances.length-1].onend = ()=> notifyState("ended");
    utterances.forEach(u=>{
      u.onerror = (e)=>{
        // 別の再生でcancel()された場合のエラーは無視する(意図した中断のため)
        if(e && (e.error === "interrupted" || e.error === "canceled")) return;
        notifyState("error");
      };
    });
    utterances.forEach(u=> window.speechSynthesis.speak(u));
    // ブラウザの自動再生制限で無音のまま何も起きないケースを検知するための保険。
    // 一定時間たっても実際に再生が始まった様子がなければ、エラー扱いにしてフォールバックを出す。
    setTimeout(()=>{
      if(!window.speechSynthesis.speaking && !window.speechSynthesis.pending){
        notifyState("error");
      }
    }, 700);
  }catch(e){
    notifyState("error");
  }
}

// ---- 学習記録ロジック ----
// 定着判定のしきい値: 翻訳なしで連続正解した回数がこの値以上になったら「定着」とみなす
const MASTERY_STREAK = 2;

function recordAnswer(qid, isCorrect, subj, translationUsed){
  const d = load();
  if(!d.q[qid]) d.q[qid] = {n:0,c:0,t:0,tn:0,tc:0,streak:0};
  // 古いデータ(このフィールド追加より前に作られた記録)にはtn/tc/streakが無いので補う
  if(d.q[qid].tn === undefined) d.q[qid].tn = 0;
  if(d.q[qid].tc === undefined) d.q[qid].tc = 0;
  if(d.q[qid].streak === undefined) d.q[qid].streak = 0;

  d.q[qid].n += 1;
  if(isCorrect) d.q[qid].c += 1;
  d.q[qid].t = Date.now();

  if(translationUsed){
    d.q[qid].tn += 1;
    if(isCorrect) d.q[qid].tc += 1;
    d.q[qid].streak = 0; // 翻訳を使った場合は「定着」の連続カウントをリセット
  } else if(isCorrect){
    d.q[qid].streak += 1; // 翻訳なしで正解した回数を積み上げる
  } else {
    d.q[qid].streak = 0; // 翻訳なしでも不正解ならリセット
  }

  // 日別・科目別の記録も更新(本人向け・管理者向けダッシュボードの推移表示に使う)
  const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
  if(!d.daily) d.daily = {};
  if(!d.daily[today]) d.daily[today] = {};
  if(subj){
    if(!d.daily[today][subj]) d.daily[today][subj] = {n:0,c:0};
    d.daily[today][subj].n += 1;
    if(isCorrect) d.daily[today][subj].c += 1;
  }

  save(d);
  syncProgress(qid);
  if(subj) syncDailySummary(today, subj, d.daily[today][subj]);
}

// 問題単位の学習状態: 未学習 / 学習中 / 定着
function questionState(qid){
  const d = load();
  const r = d.q[qid];
  if(!r || r.n === 0) return "not_started";
  const streak = r.streak || 0;
  if(streak >= MASTERY_STREAK) return "mastered";
  return "learning";
}
function recordExam(examgroup, correct, total, pct){
  const d = load();
  if(!d.exams) d.exams = [];
  d.exams.unshift({d:Date.now(), g:examgroup, c:correct, n:total, pct:pct});
  d.exams = d.exams.slice(0,20);
  save(d);
  syncExam(examgroup, correct, total, pct);
}
function overallStats(){
  const d = load();
  let studied=0, totalN=0, totalC=0;
  ALL_Q.forEach(q=>{
    const r = d.q[q.id];
    if(r && r.n>0){ studied++; totalN+=r.n; totalC+=r.c; }
  });
  return { studied, total: ALL_Q.length, rate: totalN? Math.round(totalC/totalN*100):0 };
}
function catRate(cat){
  const d = load();
  const qs = ALL_Q.filter(q=>q.c===cat);
  let n=0,c=0;
  qs.forEach(q=>{ const r=d.q[q.id]; if(r){ n+=r.n; c+=r.c; } });
  return n? Math.round(c/n*100): null;
}
function weakQuestions(limit){
  const d = load();
  const scored = ALL_Q.map(q=>{
    const r = d.q[q.id];
    let score;
    if(!r || r.n===0) score = 0.55;
    else score = r.c / r.n;
    const n = r? r.n : 0;
    return {q, score, n};
  });
  scored.sort((a,b)=>{
    if(a.score !== b.score) return a.score - b.score;
    return b.n - a.n;
  });
  return scored.slice(0, limit).map(x=>x.q);
}

function subjRate(subj){
  const d = load();
  const qs = ALL_DATA[subj];
  let n=0,c=0;
  qs.forEach(q=>{ const r=d.q[q.id]; if(r){ n+=r.n; c+=r.c; } });
  return { n, c, rate: n? Math.round(c/n*100): null };
}

// ---- 翻訳利用に関する集計 ----
// subjを省略すると全体、指定するとその科目のみ集計する
function translationStats(subj){
  const d = load();
  const qs = subj ? ALL_DATA[subj] : ALL_Q;
  let n=0, c=0, tn=0, tc=0;
  qs.forEach(q=>{
    const r = d.q[q.id];
    if(!r) return;
    n += r.n; c += r.c;
    tn += (r.tn || 0); tc += (r.tc || 0);
  });
  const jaN = n - tn, jaC = c - tc;
  return {
    n, c, tn, tc,
    rate: n ? Math.round(c/n*100) : null,               // 正答率
    translationUsageRate: n ? Math.round(tn/n*100) : null, // 翻訳利用率
    japaneseOnlyRate: jaN > 0 ? Math.round(jaC/jaN*100) : null // 日本語のみ正答率(翻訳を使わず解いた分だけで算出)
  };
}

function weeklyStats(){
  const d = load();
  const daily = d.daily || {};
  const today = new Date();
  let n=0, c=0;
  for(let i=0;i<7;i++){
    const dt = new Date(today); dt.setDate(dt.getDate()-i);
    const key = dt.toISOString().slice(0,10);
    const day = daily[key];
    if(!day) continue;
    Object.values(day).forEach(v=>{ n+=v.n; c+=v.c; });
  }
  return { n, c, rate: n? Math.round(c/n*100):0 };
}
function dailyTrendArray(days){
  const d = load();
  const daily = d.daily || {};
  const today = new Date();
  const arr = [];
  for(let i=(days-1);i>=0;i--){
    const dt = new Date(today); dt.setDate(dt.getDate()-i);
    const key = dt.toISOString().slice(0,10);
    const day = daily[key];
    let n=0,c=0;
    if(day) Object.values(day).forEach(v=>{ n+=v.n; c+=v.c; });
    arr.push({ date: key, n, c, rate: n? Math.round(c/n*100): null });
  }
  return arr;
}
function achievementScore(){
  const d = load();
  const exams = d.exams || [];
  if(exams.length > 0){
    const latestByGroup = {};
    exams.forEach(e=>{ if(!latestByGroup[e.g] || e.d > latestByGroup[e.g].d) latestByGroup[e.g] = e; });
    const vals = Object.values(latestByGroup).map(e=>e.pct);
    const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    return { score: avg, basedOnExam: true };
  }
  const s = overallStats();
  return { score: s.rate, basedOnExam: false };
}
function weakestSubject(){
  let worst = null;
  ["moji","bunpo","dokkai","choukai"].forEach(subj=>{
    const r = subjRate(subj);
    if(r.n === 0) return; // 未着手の科目は「弱点」ではなく「未着手」として別扱い
    if(!worst || r.rate < worst.rate) worst = { subj, rate: r.rate, n: r.n };
  });
  return worst;
}

// ---- ホーム到達フェーズ ----
function currentPhase(){
  const s = overallStats();
  if(s.rate >= 70 && s.studied >= Math.round(s.total*0.7)) return 3;
  if(s.rate >= 50 && s.studied >= Math.round(s.total*0.4)) return 2;
  return 1;
}

// スワイプで問題を送る/戻すための検出ヘルパー。
// 横方向にしっかり動いた場合だけ反応させ(縦スクロールや誤タップと区別)、
// 模試モードの問題番号バー(.gridnum、横スクロールが元々ある)の上から始まった操作は
// 既存の横スクロールを優先して、スワイプ判定の対象から外す。
function attachSwipeNav(targetEl, onSwipeLeft, onSwipeRight){
  const SWIPE_MIN_DIST = 60;
  const SWIPE_MAX_TIME = 600;
  let startX = null, startY = null, startTime = null, startOnGridnum = false;

  targetEl.addEventListener("touchstart", (ev)=>{
    if(ev.touches.length !== 1) return;
    startOnGridnum = !!ev.target.closest(".gridnum");
    if(startOnGridnum) return;
    startX = ev.touches[0].clientX;
    startY = ev.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });

  targetEl.addEventListener("touchend", (ev)=>{
    if(startOnGridnum || startX === null) { startX = null; return; }
    const endX = ev.changedTouches[0].clientX;
    const endY = ev.changedTouches[0].clientY;
    const dx = endX - startX, dy = endY - startY;
    const elapsed = Date.now() - startTime;
    startX = null;
    if(elapsed > SWIPE_MAX_TIME) return;
    if(Math.abs(dx) < SWIPE_MIN_DIST) return;
    if(Math.abs(dx) < Math.abs(dy) * 1.5) return; // 横方向より縦の動きが大きければスクロールとみなす
    if(dx < 0) onSwipeLeft();
    else onSwipeRight();
  }, { passive: true });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// 選択肢の並び順をシャッフルした「表示用コピー」を作る。
// 元データ(ALL_Q)は書き換えない。正解インデックス(a)もシャッフル後の位置に付け替える。
function shuffleQuestionOptions(q){
  const order = shuffle([...Array(q.o.length).keys()]);
  const newOptions = order.map(i=>q.o[i]);
  const newCorrect = order.indexOf(q.a);
  return Object.assign({}, q, { o: newOptions, a: newCorrect });
}

function startPractice(limit){
  const cats = ST.selectedCats.length ? ST.selectedCats : [...new Set(ALL_DATA[ST.subject].map(q=>q.c))];
  let pool = ALL_DATA[ST.subject].filter(q=>cats.includes(q.c));
  pool = shuffle(pool);
  if(limit) pool = pool.slice(0, limit);
  pool = pool.map(shuffleQuestionOptions);
  ST.mode = "practice";
  ST.queue = pool;
  ST.idx = 0; ST.answers = {}; ST.answered = {}; ST.revealed = {}; ST.lastAutoPlayedQid = null; ST.lastQid = null;
  ST.view = "question";
  render();
}

function startMock(examgroup){
  const cats = Object.keys(CAT_TO_EXAMGROUP).filter(c=>CAT_TO_EXAMGROUP[c]===examgroup);
  let pool = ALL_Q.filter(q=>cats.includes(q.c));
  pool = shuffle(pool);
  pool = pool.map(shuffleQuestionOptions);
  ST.mode = "mock";
  ST.subject = examgroup;
  ST.queue = pool;
  ST.idx = 0; ST.answers = {}; ST.answered = {}; ST.revealed = {}; ST.lastAutoPlayedQid = null; ST.lastQid = null;
  ST.mockTimeUp = false;
  ST.mockTimerSec = EXAMGROUP_MIN[examgroup]*60;

}

function startTimer(){

}

// ---- SVG折れ線グラフ(日々の正答率推移。外部ライブラリ不使用) ----
// ---- SVG円形プログレスリング(N4到達度) ----
function svgProgressRing(pct, colorClass){
  const size = 168, stroke = 14, r = (size-stroke)/2, c = 2*Math.PI*r;
  const p = Math.max(0, Math.min(100, pct));
  const offset = c * (1 - p/100);
  const color = colorClass === "good" ? "#3ddc97" : colorClass === "mid" ? "#F2C230" : "#ff8a80";
  return '<svg viewBox="0 0 '+size+' '+size+'" width="168" height="168" style="display:block;margin:0 auto;">'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'" stroke-linecap="round" '+
    'transform="rotate(-90 '+(size/2)+' '+(size/2)+')" class="ring-fill"/>'+
    '</svg>';
}

// ---- SVG棒+折れ線の複合グラフ(学習推移: 学習問題数を棒、正答率を線で) ----
function svgTrendCombo(trendArr){
  const withData = trendArr.filter(d=>d.n > 0);
  if(withData.length < 2) return "";
  const W = 320, H = 150, padL = 30, padR = 30, padT = 10, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = trendArr.length;
  const xStep = n > 1 ? plotW / (n - 1) : 0;
  const maxN = Math.max(1, ...trendArr.map(d=>d.n));

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:340px;display:block;margin:0 auto;">';

  // 棒(学習問題数)
  const barW = Math.min(18, xStep*0.5);
  trendArr.forEach((d,i)=>{
    if(d.n === 0) return;
    const x = padL + i*xStep - barW/2;
    const barH = (d.n/maxN) * plotH;
    const y = padT + plotH - barH;
    svg += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW+'" height="'+barH.toFixed(1)+'" rx="2" fill="#cdeadd"/>';
  });

  // 折れ線(正答率)
  let path = "";
  let started = false;
  trendArr.forEach((d,i)=>{
    if(d.rate === null) return;
    const x = padL + i*xStep;
    const y = padT + plotH - (d.rate/100*plotH);
    path += (!started ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    started = true;
  });
  svg += '<path d="'+path+'" fill="none" stroke="var(--blue)" stroke-width="2"/>';
  trendArr.forEach((d,i)=>{
    if(d.rate === null) return;
    const x = padL + i*xStep;
    const y = padT + plotH - (d.rate/100*plotH);
    svg += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="var(--blue)"/>';
  });

  const fmt = (iso)=>{ const p = iso.split("-"); return p[1]+"/"+p[2]; };
  trendArr.forEach((d,i)=>{
    if(i % Math.ceil(n/6) !== 0 && i !== n-1) return;
    const x = padL + i*xStep;
    svg += '<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" font-size="8.5" fill="#8a94a6" text-anchor="middle">'+fmt(d.date)+'</text>';
  });
  svg += '</svg>';
  return svg;
}

function svgDailyTrend(trendArr){
  const withData = trendArr.filter(d=>d.n > 0);
  if(withData.length < 2) return "";
  const W = 320, H = 140, padL = 30, padR = 10, padT = 10, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = trendArr.length;
  const xStep = n > 1 ? plotW / (n - 1) : 0;

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:340px;display:block;margin:0 auto;">';
  [0,50,100].forEach(v=>{
    const y = padT + plotH - (v/100*plotH);
    svg += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#e2e8f0" stroke-width="1"/>';
    svg += '<text x="'+(padL-5)+'" y="'+(y+3).toFixed(1)+'" font-size="9" fill="#8a94a6" text-anchor="end">'+v+'</text>';
  });

  let path = "";
  let started = false;
  trendArr.forEach((d,i)=>{
    if(d.rate === null) return;
    const x = padL + i*xStep;
    const y = padT + plotH - (d.rate/100*plotH);
    path += (!started ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    started = true;
  });
  svg += '<path d="'+path+'" fill="none" stroke="var(--blue)" stroke-width="2"/>';
  trendArr.forEach((d,i)=>{
    if(d.rate === null) return;
    const x = padL + i*xStep;
    const y = padT + plotH - (d.rate/100*plotH);
    svg += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="var(--blue)"/>';
  });

  const fmt = (iso)=>{ const p = iso.split("-"); return p[1]+"/"+p[2]; };
  svg += '<text x="'+padL+'" y="'+(H-4)+'" font-size="9" fill="#8a94a6" text-anchor="start">'+fmt(trendArr[0].date)+'</text>';
  svg += '<text x="'+(W-padR)+'" y="'+(H-4)+'" font-size="9" fill="#8a94a6" text-anchor="end">'+fmt(trendArr[n-1].date)+'</text>';
  svg += '</svg>';
  return svg;
}

// ---- 長文パッセージを句点ごとに改行して読みやすくする ----
function insertSentenceBreaks(text){
  // 文末の句点(。)の後に改行を入れる。「」内の句点や、文字列末尾の句点は対象外
  return text.replace(/。(?!」|』|\s*$)/g, "。\n");
}

// ---- 日本語＋翻訳を常に併記して表示する ----
// practice modeのみ翻訳を併記(模試は本試験と同条件でJapaneseのみ)。
// container に日本語(1行目)と、必要なら翻訳(2行目、やや小さく・グレー)を入れる。
function renderPaired(container, arr, opts){
  opts = opts || {};
  container.innerHTML = "";
  const jaText = opts.sentenceBreaks ? insertSentenceBreaks(arr[0]) : arr[0];
  const jaLine = document.createElement("div");
  if(ST.mode === "practice" && !opts.noFurigana){
    renderJaInto(jaLine, jaText);
  } else {
    jaLine.textContent = jaText;
  }
  container.appendChild(jaLine);

  const showTranslation = !opts.noTranslation && ST.mode === "practice" && ST.lang !== "ja" && ST.showTranslation && tr(arr).trim() !== arr[0].trim();
  if(showTranslation){
    const trLine = document.createElement("div");
    trLine.style.cssText = "font-size:.82em;color:#6b7789;margin-top:3px;font-weight:400;";
    trLine.textContent = tr(arr);
    container.appendChild(trLine);
  }
}

  if(isChoukai){

  // (無いと、固定されたボタンの下に本文の最後(ふりがなトグル等)が隠れてしまう)
  wrap.style.paddingBottom = "76px";

  // スワイプで問題送り: 左スワイプで次へ、右スワイプで前へ(それぞれボタンがある時だけ反応)。
  // 最後の問題での左スワイプは「提出/終了」を誤操作させないよう、あえて何もしない。
  attachSwipeNav(wrap,
    ()=>{ if(ST.idx < ST.queue.length - 1){ ST.idx += 1; render(); } },
    ()=>{ if(ST.idx > 0){ ST.idx -= 1; render(); } }
  );

  return wrap;
}

function submitExamCheck(){
  const unanswered = ST.queue.filter((q,i)=>ST.answers[i]===undefined).length;
  if(unanswered > 0){
    ask(tr(T.unanswered), ()=> submitExam(false));
  } else {
    submitExam(false);
  }
}

function submitExam(timeUp){
  clearTimer();
  let correct = 0;
  ST.queue.forEach((q,i)=>{
    const isC = ST.answers[i] === q.a;
    if(isC) correct++;
    recordAnswer(q.id, isC, q.subj, false); // 模試モードは翻訳を表示しないため常にfalse
  });
  const total = ST.queue.length;
  const pct = total? Math.round(correct/total*100) : 0;
  recordExam(ST.subject, correct, total, pct);
  ST.resultData = { correct, total, pct, timeUp, examgroup: ST.subject };
  ST.view = "result";
  render();
}

function renderResult(){
  const wrap = document.createElement("div");
  const r = ST.resultData;
  const card = el('<div class="card"></div>');
  const h = document.createElement("div");
  h.style.fontSize="18px"; h.style.fontWeight="700"; h.style.marginBottom="10px";
  h.textContent = tr(T.result) + (r.timeUp ? "（"+tr(["時間切れ","Time up","Waktu habis","Naubos ang oras","หมดเวลา"])+"）" : "");
  card.appendChild(h);

  const scoreLine = document.createElement("div");
  scoreLine.style.fontSize="28px"; scoreLine.style.fontWeight="700"; scoreLine.style.color="var(--blue)";
  scoreLine.textContent = r.correct+" / "+r.total+"（"+r.pct+"%）";
  card.appendChild(scoreLine);

  const passInfo = document.createElement("div");
  passInfo.style.marginTop="8px"; passInfo.style.fontSize="13px";
  passInfo.style.color = r.pct>=65 ? "var(--green)" : "var(--red)";
  passInfo.textContent = (r.pct>=65 ? tr(T.passed) : tr(T.notPassed));
  card.appendChild(passInfo);
  wrap.appendChild(card);

  const listCard = el('<div class="card"></div>');
  ST.queue.forEach((q,i)=>{
    const row = document.createElement("div");
    row.style.padding = "10px 0";
    row.style.borderBottom = "1px solid #eee";
    const ok = ST.answers[i] === q.a;
    row.innerHTML = '<div style="font-size:13px;font-weight:700;color:'+(ok?"var(--green)":"var(--red)")+'">'+(i+1)+". "+(ok?tr(T.correct):tr(T.incorrect))+'</div>';
    const qt = document.createElement("div");
    qt.style.fontSize="13px"; qt.style.margin="4px 0";
    qt.textContent = tr(q.q);
    row.appendChild(qt);
    const et = document.createElement("div");
    et.style.fontSize="12px"; et.style.color="#667";
    et.textContent = tr(T.explanation)+"："+tr(q.e);
    row.appendChild(et);
    listCard.appendChild(row);
  });
  wrap.appendChild(listCard);

  const listNote = el('<div class="explanation-note"></div>');
  listNote.style.margin = "10px 2px 0";
  listNote.textContent = tr(T.explanationNote);
  wrap.appendChild(listNote);

  const homeBtn = document.createElement("button");
  homeBtn.className = "primary"; homeBtn.style.width="100%";
  homeBtn.textContent = tr(T.home);
  homeBtn.onclick = ()=>{ ST.view="home"; render(); };
  wrap.appendChild(homeBtn);

  return wrap;
}

// ---- init ----
// セッション確認が終わるまでは、render()のガード処理により自動的にログイン画面が表示される
render();
establishSession().then(result=>{
  if(result){
    ST.view = AUTH.mustChangePassword ? "passwordChange" : "home";
    syncActivity();
  }
  render();
});

})();
</script>
</body>
</html>
