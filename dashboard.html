<style>
:root{
  --navy:#14213D; --blue:#2A4A7C; --blue-light:#f7f7f8;
  --yellow:#8a8f99; --green:#3d7a52; --green-bg:transparent;
  --red:#b5502f; --red-bg:transparent; --amber:#8a8f99; --amber-bg:transparent;
  --bg:#ffffff; --border:#e6e7ea; --text-main:#1a1f29; --text-sub:#8a8f99;
  --radius:6px; --radius-sm:4px;
  --shadow:none;

  /* ==== デザインシステム: タイポグラフィ ====
     同じ意味のテキストは必ずこのトークンを使う。個別に別サイズを指定しない。 */
  --fs-page-title:24px;   --fw-page-title:700;
  --fs-section-title:16px; --fw-section-title:700;
  --fs-card-title:13px;   --fw-card-title:600;
  --fs-kpi-num:30px;      --fw-kpi-num:700;
  --fs-kpi-num-lg:36px;   --fw-kpi-num-lg:700;
  --fs-body:13px;         --fw-body:400;
  --fs-caption:11px;      --fw-caption:400;
  --fs-small-label:10px;  --fw-small-label:500;

  /* ==== デザインシステム: 余白(8px単位のスケール) ==== */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px;

  /* ==== デザインシステム: カード共通ルール ==== */
  --card-radius:12px;
  --card-border:1px solid var(--border);
  --card-shadow:0 1px 2px rgba(20,33,61,.05);
  --card-padding:var(--sp-4);

  /* ==== デザインシステム: アイコン共通ルール ==== */
  --icon-size:24px;
  --icon-bg-size:32px;
  --icon-radius:8px;

  /* ==== デザインシステム: 波形アクセント(カード種別ごとに高さ・不透明度を固定) ==== */
  --wave-h-kpi:36px;      --wave-op-kpi:.55;   /* 通常のKPIカード(4枚) */
  --wave-h-small:26px;    --wave-op-small:.18; /* 小型カード(学習中・企業数など) */
}
*{box-sizing:border-box;}
/* iOS Safariでは body だけに overflow-x:hidden を指定しても効かないため、
   html 側にも指定して横スクロールを止める。これが無いと、画面幅を超える要素が
   あったときにページ全体が縮小表示され、文字が小さく(あるいは拡大されたように)見える。 */
html{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text-main);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;width:100%;}
/* 上から下へ引っ張って更新(プルリフレッシュ)のインジケーター。
   ページ最上部でのみ反応し、JSがtransformでtranslateYを動かして引っ張り具合を表現する。 */
.pull-refresh-indicator{position:fixed;top:0;left:0;right:0;height:56px;display:flex;
  align-items:center;justify-content:center;transform:translateY(-56px);z-index:200;
  transition:transform .2s ease;pointer-events:none;}
.pull-refresh-indicator.dragging{transition:none;}
.pull-refresh-spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);
  border-top-color:var(--green);transform:rotate(0deg);}
.pull-refresh-indicator.spinning .pull-refresh-spinner{animation:pull-refresh-spin .7s linear infinite;}
@keyframes pull-refresh-spin{to{transform:rotate(360deg);}}
header{background:var(--bg);color:var(--text-main);padding:10px 18px;
  padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--border);}
@supports not (padding-top: env(safe-area-inset-top)) { header{padding-top:14px;} }
header .headerTop{display:flex;flex-wrap:nowrap;justify-content:flex-start;align-items:center;
  gap:10px;max-width:900px;margin:0 auto;width:100%;}
.orgLogo{width:44px;height:auto;flex:0 0 auto;display:block;
  transition:opacity .15s ease, transform .15s ease;}
/* 概要タブへ戻れるときだけ、触れると反応する(cursorはJS側で切り替える) */
.orgLogo[style*="pointer"]:hover{opacity:.75;transform:scale(1.04);}
.orgLogo[style*="pointer"]:active{transform:scale(.96);}
header h1{font-size:18px;margin:0;font-weight:800;line-height:1.3;}
header h1 .appTitleTop{display:block;font-size:11px;font-weight:700;color:var(--text-sub);
  letter-spacing:.02em;}
header h1 .appTitleMain{display:block;font-size:17px;font-weight:800;color:var(--green);
  letter-spacing:.01em;margin-top:1px;}
.headerUserInfo{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.headerUserInfo .huiText{text-align:right;line-height:1.35;display:none;}
.headerUserInfo .huiEmail{font-size:12.5px;font-weight:600;color:var(--text-main);}
.headerUserInfo .huiRole{font-size:11px;color:var(--text-sub);}
.headerUserInfo .huiAvatar{width:32px;height:32px;border-radius:50%;background:var(--green);
  color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;
  font-size:13px;font-weight:700;}
@media (min-width: 640px){
  .headerUserInfo .huiText{display:block;}
}
main{max-width:900px;margin:0 auto;padding:var(--sp-6) var(--sp-4) 60px;width:100%;box-sizing:border-box;}
/* PC上部タブ */
.tabnav{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;}
.tabnav-btn{display:flex;align-items:center;gap:7px;background:none;border:none;border-bottom:2.5px solid transparent;
  padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--text-sub);cursor:pointer;white-space:nowrap;flex:0 0 auto;}
.tabnav-btn:hover{color:var(--text-main);}
.tabnav-btn.active{color:var(--green);border-bottom-color:var(--green);}
.tabnav-icon{width:16px;height:16px;display:flex;}
.tabnav-icon svg{width:16px;height:16px;}
/* 学習タブ内のサブナビ(セグメント型ボタン、タブより一段階下の階層だと分かるようにする) */
.subnav{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-6);flex-wrap:wrap;}
.subnav-btn{background:#fff;border:1px solid var(--border);border-radius:999px;padding:var(--sp-2) var(--sp-4);
  font-size:var(--fs-body);font-weight:600;color:var(--text-sub);cursor:pointer;}
.subnav-btn:hover{color:var(--text-main);border-color:#c7cad0;}
.subnav-btn.active{background:var(--green);border-color:var(--green);color:#fff;}
/* スマホ下部固定ナビ(PC幅では非表示) */
.mobile-bottomnav{display:none;}
/* 企業・事業所ミニサマリー(概要タブ用の簡易版) */
.company-mini-summary{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-4);flex:1;}
.company-mini-nums{display:flex;gap:var(--sp-6);align-items:baseline;}
.company-mini-num{font-size:var(--fs-kpi-num);font-weight:var(--fw-kpi-num);color:var(--text-main);}
.company-mini-unit{font-size:var(--fs-body);color:var(--text-sub);margin-left:var(--sp-1);}
.detail-link-btn{background:none;border:none;color:var(--green);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;}
.detail-link-btn:hover{text-decoration:underline;}
@media (max-width: 780px){
  .tabnav{display:none;}
  main{padding-bottom:96px;} /* 下部固定ナビの高さ分、コンテンツが隠れないよう余白を確保 */
  .mobile-bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;
    border-top:1px solid var(--border);z-index:150;padding-bottom:env(safe-area-inset-bottom);}
  .mobile-bottomnav-btn{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:none;border:none;padding:12px 2px 10px;min-height:60px;color:var(--text-sub);font-size:11px;font-weight:600;cursor:pointer;
    -webkit-tap-highlight-color:transparent;white-space:nowrap;}
  .mobile-bottomnav-btn:active{background:var(--blue-light);}
  .mobile-bottomnav-btn.active{color:var(--green);}
  .mobile-bottomnav-icon svg{width:25px;height:25px;}
}
/* 320px前後のごく小さい画面向け: 「企業・事業所」等の長いラベルでもはみ出さないよう
   文字サイズ・アイコンサイズ・paddingを少しだけ詰める(タップ領域はできるだけ維持する) */
@media (max-width: 340px){
  .mobile-bottomnav-btn{font-size:9.5px;padding:10px 1px 8px;min-height:56px;gap:3px;}
  .mobile-bottomnav-icon svg{width:22px;height:22px;}
}
footer{text-align:center;font-size:11px;color:var(--text-sub);padding:18px 20px 28px;}
/* ==== 共通カードコンポーネント。種類を問わずすべてのカードはこのルールに従う ====
   (以前は用途ごとに個別のpadding/radius/shadowを上書きしていたが、それをやめて統一する) */
.card{background:#fff;border-radius:var(--card-radius);padding:var(--card-padding);margin-bottom:0;
  border:var(--card-border);box-shadow:var(--card-shadow);max-width:100%;overflow-x:hidden;box-sizing:border-box;}
/* ==== 共通セクション見出し(Section Header)。「タイトル」→「必要なら説明」の同じ構造を全箇所で使う ==== */
.card-title{font-weight:var(--fw-section-title);font-size:var(--fs-section-title);color:var(--text-main);
  margin-bottom:var(--sp-4);line-height:1.3;
  border-left:none;padding-left:0;letter-spacing:0;text-transform:none;}
.card-desc{font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-sub);
  margin-top:calc(var(--sp-1) * -1);margin-bottom:var(--sp-4);line-height:1.5;}
/* ==== 入力欄の常時表示ラベル(2026/8/30新設) ====
   以前はplaceholderだけで項目名を示していたが、入力するとラベルが消えてしまい、
   「何を入れる欄なのか」が分からなくなっていた。実習生側(index.html)のログイン画面と
   同じく、入力中も常に見えるラベルを使う。 */
.field-label{font-size:13px;font-weight:700;margin:14px 0 4px;color:var(--text-main);}
.field-label:first-of-type{margin-top:0;}
input{padding:11px 0;border:none;border-bottom:1px solid var(--border);border-radius:0;font-size:14px;
  width:100%;max-width:100%;box-sizing:border-box;margin-bottom:10px;background:transparent;transition:border-color .15s;}
input:focus{outline:none;border-color:var(--green);}
select{padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;
  background:#fff;max-width:100%;box-sizing:border-box;}
button.primary{background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px 20px;
  font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.01em;}
button.primary:hover{background:#2f6142;}
button.secondary{background:#fff;color:var(--text-main);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;}
button.ghost{background:transparent;border:none;color:var(--text-sub);cursor:pointer;font-size:12px;
  font-weight:500;padding:4px 0;display:inline-flex;align-items:center;gap:4px;}
button.ghost:hover{text-decoration:underline;}
.errormsg{color:var(--red);font-size:13px;margin-bottom:10px;line-height:1.6;}
table{width:100%;border-collapse:collapse;font-size:13px;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px;}
.table-scroll table{min-width:640px;}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
th{color:var(--text-sub);font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  background:transparent;}
.badge{display:inline;padding:0;border-radius:0;font-size:12.5px;font-weight:600;color:var(--text-main);}
.badge.high{color:var(--text-main);}
.badge.mid{color:var(--text-sub);font-weight:500;}
.badge.low{color:var(--red);}
.filters{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filters input{flex:1;min-width:160px;margin-bottom:0;}
.loading{text-align:center;color:var(--text-sub);padding:36px 20px;font-size:13px;}
.stale{color:var(--red);}
tr.clickable{cursor:pointer;transition:background .12s;}
tr.clickable:hover{background:var(--blue-light);}
.katefbar{margin:15px 0;}
.katefbarrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:var(--text-main);}
.katefbarrow span:last-child{font-weight:600;color:var(--text-main);}
.katefbartrack{height:1px;background:var(--border);}
.katefbar-fill{height:100%;background:var(--green);}
.katefbar-fill.low{background:var(--red);}
.katefbar-fill.mid{background:var(--text-sub);}
.examrow{padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;}
.examrow:last-child{border-bottom:none;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:var(--radius);padding:24px;max-width:360px;width:100%;}
.modal-box p{font-size:14px;line-height:1.6;margin:0 0 18px;color:var(--text-main);}
.modal-box .rowbtns{display:flex;gap:10px;}
.modal-box .rowbtns button{flex:1;padding:11px;}
button.danger{background:#fff;color:var(--red);border:1px solid var(--red);border-radius:var(--radius-sm);
  padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;}
button.danger:hover{background:#faf3f0;}
.icon{width:13px;height:13px;flex:0 0 auto;vertical-align:middle;}
.icon-warn{color:var(--red);}
/* ==== 共通アイコン(全カード種別で同じサイズ・角丸。色だけカテゴリで変える) ==== */
.stat-icon{width:var(--icon-bg-size);height:var(--icon-bg-size);border-radius:var(--icon-radius);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.stat-icon svg{width:var(--icon-size);height:var(--icon-size);}

/* ==== KPI/小型カード共通の数値ブロック(stat-block)。実際の見た目は常に.kpi-cardと併用される。 ====
   構造を2段に固定する:
   ① stat-header = 「アイコン＋タイトル」を横1列で並べ、カード左上に固定する
   ② stat-numwrap = 「数字＋(補足)」。①より下の残り高さいっぱいに広がり、その中で縦中央に来る
   これにより、補足の有無でカードごとに数字の高さがブレなくなる。 */
.stat-block{background:transparent;border:none;border-radius:0;
  padding:0;text-align:left;display:flex;flex-direction:column;height:100%;}
.stat-header{display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto;}
.stat-numwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;}
.num-line{display:flex;align-items:baseline;justify-content:center;gap:var(--sp-1);flex-wrap:wrap;width:100%;}
.stat-block .num{font-size:var(--fs-kpi-num);font-weight:var(--fw-kpi-num);color:var(--text-main);
  letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;}
.stat-block .lbl{font-size:var(--fs-card-title);font-weight:var(--fw-card-title);color:var(--text-main);
  margin:0;}
.stat-block .stat-sub{font-size:var(--fs-kpi-num);color:var(--text-main);margin:0;font-weight:var(--fw-kpi-num);}
.stat-block.alert .num{color:var(--red);}
/* 320px前後のごく小さい画面向け: 「NTLP登録済」等の6文字前後のタイトルが、アイコンと
   並んだ状態で1行に収まりきらず折り返してしまうため、この幅だけタイトル文字とアイコンを
   少し縮める(ベース定義より後ろに書くことで確実に上書きする) */
@media (max-width: 340px){
  .kpi-card{padding:12px;}
  .stat-icon{width:26px;height:26px;}
  .stat-icon svg{width:18px;height:18px;}
  .stat-block .lbl{font-size:11.5px;}
}

.kpi-cardgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-bottom:0;}
.kpi-cardgrid.cols-2.stretch-fill{flex:1;align-content:stretch;}
.kpi-cardgrid.cols-2.stretch-fill .kpi-card{height:100%;}

/* ==== 共通KPIカード。同じ種類のカードは必ずこの1つの定義だけを使う ====
   構造(固定・2段): [アイコン＋タイトルの行(上固定)] / [数字＋補足(残り高さで縦中央)] */
.kpi-card{border-radius:var(--card-radius);padding:var(--card-padding);border:var(--card-border);
  position:relative;overflow:hidden;box-shadow:var(--card-shadow);
  display:flex;flex-direction:column;box-sizing:border-box;}
.kpi-card > *{position:relative;z-index:1;}
.kpi-card > svg.kpi-card-wave{position:absolute;left:0;right:0;bottom:0;width:100%;
  height:var(--wave-h-kpi);opacity:var(--wave-op-kpi);pointer-events:none;z-index:0;}
.kpi-card.wave-subtle > svg.kpi-card-wave{opacity:var(--wave-op-small);height:var(--wave-h-small);}
.kpi-card .num.num-long{font-size:var(--fs-section-title);}
@media (max-width: 640px){
  .kpi-cardgrid{grid-template-columns:repeat(2,1fr);}
  .kpi-card .num{font-size:24px;}
  .kpi-card .num.num-long{font-size:19px;}
}
.kpi-cardgrid.cols-2{grid-template-columns:repeat(2,1fr);}
.kpi-cardgrid.cols-3{grid-template-columns:repeat(3,1fr);}
@media (max-width: 640px){
  .kpi-cardgrid.cols-3{grid-template-columns:repeat(2,1fr);}
}

/* サマリー全体をflex columnにし、各セクションへ.dash-sec-*クラスで印を付けておくことで、
   スマホ幅だけ表示順を並び替えられるようにする(PC幅では通常のDOM順=現在の見た目のまま)。 */
#summaryWrap{display:flex;flex-direction:column;gap:var(--sp-8);}

/* 「概要の顔」：ページ上部の導入エリア。大きすぎない、視線の起点。 */
.overview-hero{padding:var(--sp-1) var(--sp-1) var(--sp-2);}
.overview-hero-eyebrow{font-size:var(--fs-caption);font-weight:700;color:var(--text-sub);letter-spacing:.04em;text-transform:uppercase;}
.overview-hero-title{font-size:var(--fs-page-title);font-weight:var(--fw-page-title);color:var(--text-main);margin-top:var(--sp-1);}
.overview-hero-desc{font-size:var(--fs-body);color:var(--text-sub);margin-top:var(--sp-1);}
.overview-hero-stats{font-size:var(--fs-body);color:var(--text-sub);margin-top:var(--sp-2);font-weight:600;}

/* セクションごとの「面」。カード自体は白のまま、その周りに薄い色の背景を敷いて塊を作る。
   色は淡く、ブランドカラー(緑)を基調に、要フォローはオレンジ、学習状況は寒色系。 */
.section-plate{border-radius:16px;padding:var(--sp-6);}
.section-plate-blue{background:#f7fafc;}
.section-plate-green{background:#f7faf8;}
.section-plate .dash-2col{margin-top:0;}

/* KPIカードの強弱: 要フォローだけ枠・影を強くして最重要アクションだと分かるようにする */
.kpi-card-priority{border-color:#e8b98f;box-shadow:0 2px 8px rgba(181,80,47,.12);}
.kpi-card-priority .stat-icon{background:#fff !important;}

.mobile-company-select{display:none;}
@media (max-width: 780px){
  .mobile-company-select{display:block;background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;}
  .mobile-company-select label{display:block;font-size:11.5px;color:var(--text-sub);margin-bottom:6px;font-weight:600;}
  .mobile-company-select select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff;}
  /* 以前はここで各セクションにCSS orderを付けて並び替えていたが、タブ構造の導入により
     DOM上の並びが既に望ましい順序(企業選択→KPI→要フォロー→学習状況→企業情報)になったため、
     orderによる並び替えは廃止した(むしろ「顔」エリア等の新セクションと衝突するバグの元だった)。 */
}

/* アカウント発行可能のリンク行(最上段KPIから外した分。控えめなクリッカブル行) */
.issue-link-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-sub);
  margin-top:10px;padding:0 2px;}
.issue-link-row svg{width:14px;height:14px;flex:0 0 auto;}
.issue-link-row b{color:var(--text-main);font-weight:700;}

/* 2カラムレイアウト(学習ステータス+学習状況サマリー)。スマホでは1カラムに積む。 */
.dash-2col{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);margin-top:var(--sp-6);align-items:stretch;}
.dash-2col > .card{height:100%;box-sizing:border-box;display:flex;flex-direction:column;}
@media (max-width: 860px){
  .dash-2col{grid-template-columns:1fr;}
}

/* ドーナツグラフ */
.donut-body{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.donut-wrap{position:relative;flex:0 0 auto;}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.donut-center-num{font-size:22px;font-weight:700;color:var(--text-main);line-height:1.1;}
.donut-center-lbl{font-size:10px;color:var(--text-sub);margin-top:2px;}
.donut-legend{flex:1 1 160px;display:flex;flex-direction:column;gap:10px;min-width:150px;}
.donut-legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.donut-legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.donut-legend-lbl{color:var(--text-sub);flex:1;}
.donut-legend-num{font-weight:700;color:var(--text-main);white-space:nowrap;}
.donut-legend-pct{font-weight:400;color:var(--text-sub);font-size:11px;}
.donut-trend-divider{border-top:1px solid var(--border);margin:20px 0 16px;}
.trend-subtitle{font-size:14px;margin-bottom:12px;}
/* 折れ線グラフの底を、右側カラム(学習状況サマリー)の下端に揃えるため、
   このセクションをカード内で残りの高さいっぱいに広げ、中の線グラフを一番下に押し付ける。 */
.donut-trend-section{display:flex;flex-direction:column;flex:1;}
.donut-trend-section .linechart-wrap{margin-top:auto;}

/* 折れ線グラフ */
.linechart-wrap{width:100%;margin-top:6px;}
.linechart-legend{display:flex;gap:16px;margin-bottom:4px;}
.linechart-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);}
.linechart-legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* 企業マッピング状況(進捗バー) */
.mapping-body{margin-top:var(--sp-1);padding:var(--sp-6);border-radius:var(--card-radius);text-align:center;}
.mapping-hero{font-size:var(--fs-kpi-num-lg);font-weight:var(--fw-kpi-num-lg);line-height:1.1;letter-spacing:-.02em;}
.mapping-hero-sub{font-size:var(--fs-body);color:var(--text-sub);font-weight:600;margin-top:var(--sp-2);margin-bottom:var(--sp-4);}
.mapping-nums{display:flex;gap:32px;margin-bottom:14px;}
.mapping-num{font-size:26px;font-weight:700;color:var(--text-main);line-height:1.2;}
.mapping-lbl{font-size:12px;color:var(--text-sub);margin-top:4px;}
.mapping-track{height:10px;border-radius:5px;background:rgba(255,255,255,.6);overflow:hidden;max-width:320px;margin:0 auto;}
.mapping-fill{height:100%;background:var(--green);border-radius:5px;transition:width .3s ease;}
.mapping-pct{font-size:11.5px;color:var(--text-sub);margin-top:10px;}

.summary-cardgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 0;margin-bottom:0;align-items:stretch;}
.summary-cardgrid + .summary-cardgrid{margin-top:20px;}
/* 枠(4辺のボックス)は使わず、列の間だけ縦線を1本入れる(1列目には付けない) */
.summary-cardgrid .stat-block{border-left:1px solid var(--border);padding-left:16px;}
.summary-cardgrid .stat-block:nth-child(4n+1){border-left:none;padding-left:0;}
@media (max-width: 520px){
  .summary-cardgrid{grid-template-columns:repeat(2,1fr);row-gap:16px;}
  .summary-cardgrid .stat-block:nth-child(4n+1){border-left:1px solid var(--border);padding-left:16px;}
  .summary-cardgrid .stat-block:nth-child(2n+1){border-left:none;padding-left:0;}
  /* スマホでは指でタップしやすいよう、ページャーのボタンを大きくする(目安44px角) */
  .pagination-page{width:40px;height:40px;font-size:14px;}
  .pagination-nav{padding:10px 12px;font-size:14px;}
  .pagination{gap:2px;}
}
.followup-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.followup-row:last-child{border-bottom:none;}
.followup-row:hover{background:var(--blue-light);}
.followup-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.followup-namewrap{min-width:0;flex:1 1 auto;overflow:hidden;}
.followup-row .badge{flex:0 0 auto;margin-left:12px;}
.followup-reason{font-size:11.5px;color:var(--text-sub);margin-top:2px;}
/* 要フォローは「対応が必要な情報」として、他のセクションより明確に目立たせる
   (オレンジ系のアイコン・タイトル、薄いオレンジのカード背景) */
.followup-card{background:#fffaf3;border:1px solid #f5deba;border-radius:var(--card-radius);padding:var(--sp-6) !important;}
.followup-titlewrap{display:flex;align-items:flex-start;gap:var(--sp-3);margin-bottom:var(--sp-4);}
.followup-titleicon{width:var(--icon-bg-size);height:var(--icon-bg-size);border-radius:var(--icon-radius);background:#fdf3e8;color:var(--red);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.followup-titleicon svg{width:var(--icon-size);height:var(--icon-size);}
.followup-title{font-size:var(--fs-section-title);font-weight:var(--fw-section-title);margin-bottom:var(--sp-1);}
.followup-subtitle{font-size:var(--fs-body);color:var(--text-sub);}
.followup-more-btn{margin-top:var(--sp-3);background:none;border:none;color:var(--green);font-weight:700;
  font-size:var(--fs-body);cursor:pointer;padding:var(--sp-2) 0;}
.followup-more-btn:hover{text-decoration:underline;}
.followup-empty{font-size:var(--fs-body);color:var(--text-sub);padding:var(--sp-2) 0;}
.subj-trend-row{margin:var(--sp-4) 0;}
.subj-trend-top{display:flex;justify-content:space-between;font-size:var(--fs-section-title);
  font-weight:600;margin-bottom:var(--sp-2);}
.subj-trend-track{height:10px;border-radius:5px;background:#eef0f2;overflow:hidden;}
.subj-trend-fill{height:100%;border-radius:5px;background:var(--green);transition:width .3s ease;}
/* 分野別傾向の棒グラフ */
.barchart-wrap{width:100%;}
/* 苦手ランキング(カテゴリ別、正答率が低い順)。
   [順位] [カテゴリ名] [参加率・正答率を並べた縦棒ミニグラフ] の3列構成。 */
.cat-rank-list{display:flex;flex-direction:column;}
.cat-rank-row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;
  border-bottom:1px solid var(--border);}
.cat-rank-row:last-child{border-bottom:none;}
.cat-rank-num{font-size:var(--fs-body);font-weight:700;color:var(--text-sub);
  width:20px;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.cat-rank-info{flex:1;min-width:0;}
.cat-rank-top{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;}
.cat-rank-label{font-size:var(--fs-card-title);font-weight:var(--fw-card-title);color:var(--text-main);}
.cat-rank-subj{font-size:var(--fs-caption);color:var(--text-sub);}
.cat-rank-chart{flex:0 0 auto;width:150px;}

/* 得意・苦手ハイライト(分野別サブタブの上部) */
.cat-highlight{border-radius:var(--card-radius);padding:var(--sp-6);text-align:center;}
.cat-highlight-lbl{font-size:var(--fs-body);font-weight:600;color:var(--text-sub);}
.cat-highlight-cat{font-size:var(--fs-section-title);font-weight:700;margin-top:var(--sp-2);}
.cat-highlight-subj{font-size:var(--fs-caption);color:var(--text-sub);font-weight:400;margin-left:var(--sp-2);}
.cat-highlight-rate{font-size:var(--fs-kpi-num-lg);font-weight:var(--fw-kpi-num-lg);margin-top:var(--sp-2);}
.cat-highlight-sub{font-size:var(--fs-caption);color:var(--text-sub);margin-top:var(--sp-1);}

/* 学習タブ「実習生別」の一覧行 */
/* 実習生別一覧のソート見出し行 */
.learner-mgmt-sortheader{display:flex;gap:var(--sp-4);padding-bottom:var(--sp-2);border-bottom:1px solid var(--border);
  margin-bottom:var(--sp-2);}
.learner-mgmt-sortbtn{background:none;border:none;font-size:var(--fs-caption);font-weight:600;color:var(--text-sub);
  cursor:pointer;padding:var(--sp-1) 0;display:flex;align-items:center;gap:3px;}
.learner-mgmt-sortbtn:hover{color:var(--text-main);}
.learner-mgmt-sortbtn.active{color:var(--green);}
.learner-mgmt-sortarrow{font-size:10px;}
.learner-mgmt-list{display:flex;flex-direction:column;}
.learner-mgmt-row{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) 0;
  border-bottom:1px solid var(--border);cursor:pointer;flex-wrap:wrap;}
.learner-mgmt-row:last-child{border-bottom:none;}
.learner-mgmt-row:hover{background:var(--blue-light);}
.learner-mgmt-main{flex:1 1 200px;min-width:0;}
.learner-mgmt-name{font-size:var(--fs-card-title);font-weight:700;color:var(--text-main);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.learner-mgmt-company{font-size:var(--fs-caption);color:var(--text-sub);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.learner-mgmt-metrics{display:flex;gap:var(--sp-6);flex:0 0 auto;}
.learner-mgmt-metric{text-align:center;}
.learner-mgmt-metric-lbl{display:block;font-size:var(--fs-small-label);color:var(--text-sub);}
.learner-mgmt-metric-val{display:block;font-size:var(--fs-card-title);font-weight:700;color:var(--text-main);
  font-variant-numeric:tabular-nums;margin-top:2px;}
.badge-pill{font-size:var(--fs-caption);font-weight:700;padding:4px 10px;border-radius:999px;flex:0 0 auto;}
/* 学習タブ「実習生別」：スマホでは縦積みのカード形式にする。
   (このブロックをbase定義より後ろに置くことで確実に上書きする。CSSの@media自体は
   詳細度を上げないため、base定義より前に書くと後勝ちでbaseに負けてしまう) */
@media (max-width: 780px){
  .learner-mgmt-row{flex-direction:column;align-items:flex-start;gap:var(--sp-2);flex-wrap:nowrap;}
  .learner-mgmt-main{flex:0 0 auto;width:100%;min-width:0;}
  .learner-mgmt-metrics{gap:var(--sp-4);width:100%;justify-content:flex-start;flex:0 0 auto;}
  .learner-mgmt-metric{text-align:left;}
  /* 実習生タブの一覧表：スマホでは分野別内訳・最新模試の列を隠し、主要な列だけを見せる。
     (分野別の詳細は学習タブの「分野別」「実習生別」で別途確認できるため) */
  .table-scroll th.col-hide-mobile, .table-scroll td.col-hide-mobile{display:none;}
  .table-scroll table{min-width:0;}
}

/* 学習タブ「学習履歴」 */
/* 個人カルテ「よく間違えている問題」カード。
   正答率が低い順に問題を並べ、デフォルトは上位5問だけを見せる(全問表示すると見づらいため)。
   1問=1カード。問題文・実習生の選んだ間違いやすさの目安(正答率)・正解・解説(対策のヒント)を並べる。 */
.missq-list{display:flex;flex-direction:column;gap:var(--sp-3);}
.missq-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--sp-3) var(--sp-4);background:#fff;}
.missq-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-2);margin-bottom:6px;flex-wrap:wrap;}
.missq-cat{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-light);border-radius:999px;padding:2px 10px;}
.missq-rate{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap;}
.missq-q{font-size:13.5px;font-weight:600;color:var(--text-main);line-height:1.6;margin-bottom:6px;}
.missq-a{font-size:12.5px;color:var(--green,#3d7a52);font-weight:700;margin-bottom:4px;}
.missq-your{font-size:12.5px;color:#c0392b;font-weight:700;margin-bottom:4px;}
.hist-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.hist-table th{text-align:left;color:var(--text-sub);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);}
.hist-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
.mode-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;}
.mode-badge.mode-practice{background:#e8f3ec;color:#2a7a4a;}
.mode-badge.mode-mock{background:#e9f0fb;color:#2a5da8;}
.cal-card{max-width:380px;}  /* 横幅いっぱいに広がって大きくなりすぎないよう、カード自体の幅を制限(マスは約48px) */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-weekday{text-align:center;font-size:11px;color:var(--text-sub);font-weight:700;padding:4px 0;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;background:var(--bg-alt,#f7f6f2);}
.cal-cell.cal-empty{background:transparent;}
.cal-daynum{font-size:11px;color:var(--text-sub);}
.cal-dot{width:7px;height:7px;border-radius:50%;margin-top:2px;display:inline-block;}
.cal-dot-practice{background:#3d9a5f;}
.cal-dot-mock{background:#3a6bc2;}
.cal-dot-both{background:linear-gradient(90deg,#3d9a5f 50%,#3a6bc2 50%);}
.cal-dot-unknown{background:#bbb;}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text-sub);align-items:center;}
.cal-legend span{display:flex;align-items:center;gap:4px;}
.cal-legend .cal-dot{margin-top:0;}
.missq-e{font-size:12.5px;color:var(--text-sub);line-height:1.6;}
.missq-more{margin-top:var(--sp-2);background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;}
.missq-more:hover{text-decoration:underline;}
.missq-empty{font-size:13px;color:var(--text-sub);padding:8px 0;}
.history-list{display:flex;flex-direction:column;}
.history-row{display:flex;align-items:baseline;gap:var(--sp-4);padding:var(--sp-3) 0;border-bottom:1px solid var(--border);}
.history-row:last-child{border-bottom:none;}
.history-date{font-size:var(--fs-caption);color:var(--text-sub);font-weight:600;flex:0 0 auto;width:78px;}
.history-main{flex:1;min-width:0;}
.history-name{font-size:var(--fs-card-title);font-weight:600;color:var(--text-main);}
.history-company{font-size:var(--fs-caption);color:var(--text-sub);font-weight:400;}
.history-detail{font-size:var(--fs-caption);color:var(--text-sub);margin-top:2px;}
.tree-company-header{display:flex;align-items:center;gap:10px;padding:12px 4px;
  font-weight:600;font-size:14px;border-bottom:1px solid var(--border);}
.tree-company-header .tree-company-name{user-select:none;}
.tree-company-header > div:first-child:hover{background:var(--blue-light);}
.tree-workplace-header{display:flex;align-items:center;gap:10px;padding:10px 4px 10px 26px;cursor:pointer;
  font-weight:500;font-size:13px;color:var(--text-main);border-bottom:1px solid var(--border);
  background:#fafafb;user-select:none;}
.tree-workplace-header:hover{background:var(--blue-light);}
.tree-toggle{color:var(--text-sub);font-size:11px;width:12px;flex:0 0 auto;}
.tree-company-name{flex:1;}
.tree-workplace-name{flex:1;}
.tree-count{color:var(--text-sub);font-size:12px;font-weight:400;}
.flag-badge{display:inline-block;width:17px;height:17px;border-radius:50%;overflow:hidden;
  vertical-align:-4px;margin-right:6px;border:1px solid var(--border);}
.flag-badge svg{display:block;}
.tree-workplace-body{padding-left:26px;margin-bottom:4px;}
.tree-pager{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 4px 2px;font-size:13px;}
.tree-pager-count{text-align:center;font-size:11.5px;color:var(--text-sub);padding-bottom:10px;}
.pagination-nav{background:none;border:none;color:var(--blue);cursor:pointer;font-size:13px;
  padding:6px 8px;border-radius:6px;}
.pagination-nav:hover{background:var(--blue-light);}
.pagination-nav:disabled{color:#c4c7cd;cursor:default;background:none;}
.pagination-page{width:28px;height:28px;border:none;background:transparent;border-radius:6px;
  cursor:pointer;font-size:13px;color:var(--text-main);}
.pagination-page:hover{background:var(--blue-light);}
.pagination-page.active{background:var(--green);color:#fff;font-weight:600;}
.pagination-ellipsis{color:var(--text-sub);padding:0 2px;}

/* =====================================================================
   ダッシュボード刷新(第2段階): 外枠(左メニュー・スマホの上バー/下タブ/ドロワー)と、概要タブ
   ・body.shell-on(ログイン後)のときだけ有効。ログイン画面・パスワード変更画面には影響しない。
   ・1100px以上=PC(左メニュー) / 1100px未満=スマホ・タブレット(上バー+下タブ+ドロワー)
   ===================================================================== */
:root{
  --nv-bg:#F3F5FA; --nv-navy:#0F1B33; --nv-navy-2:#17274A; --nv-text:#1B2437; --nv-sub:#6B7690; --nv-line:#E6EAF2;
  --nv-sidebar:#166534; /* PCの左メニューの帯の色(実習生アプリの紺と区別するため、緑) */
  --nv-sidebar-text:#D4EADB; --nv-sidebar-sub:#A7D3B8;
  --nv-blue:#3B82F6; --nv-blue-bg:#EAF2FF; --nv-green:#22B07D; --nv-green-bg:#E4F6EE;
  --nv-orange:#F59E3A; --nv-orange-bg:#FFF1DE; --nv-purple:#8B5CF6; --nv-purple-bg:#F0EAFF;
  --nv-red:#EF5B6F; --nv-red-bg:#FDEBEE; --nv-gray:#9AA3B5; --nv-gray-bg:#EEF0F5;
}
body.shell-on{background:var(--nv-bg);}
body.shell-on > header{display:none;}
body.shell-on main#app{max-width:none;width:100%;margin:0;padding:0;}
body.shell-on .tabnav, body.shell-on .subnav, body.shell-on .mobile-bottomnav{display:none !important;}

.shell{display:flex;min-height:100vh;}
.sb{width:236px;flex:0 0 236px;background:var(--nv-sidebar);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px 14px;box-sizing:border-box;overflow-y:auto;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;cursor:pointer;}
.sb-brand img{width:40px;height:40px;object-fit:contain;background:transparent;}
.sb-brand-t1{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.2;}
.sb-brand-t2{font-size:11px;color:var(--nv-sidebar-sub);margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:2px;}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--nv-sidebar-text);font-size:14px;font-weight:600;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-family:inherit;}
.sb-item:hover{background:rgba(255,255,255,.06);}
.sb-item.active{background:var(--nv-blue);color:#fff;}
.sb-item svg{width:20px;height:20px;flex:0 0 20px;}
.sb-item .chev{margin-left:auto;font-size:11px;opacity:.7;}
.sb-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 18px;padding-left:12px;border-left:1px solid rgba(255,255,255,.12);}
.sb-sub .sb-item{font-size:13px;font-weight:500;padding:8px 10px;}
.sb-sub .sb-item.active{background:rgba(59,130,246,.22);color:#fff;}
.sb-spacer{flex:1;}
.sb-user{display:flex;align-items:center;gap:10px;padding:12px 8px 6px;border-top:1px solid rgba(255,255,255,.1);margin-top:10px;}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--nv-blue);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 34px;}
.sb-user-t1{font-size:12px;font-weight:600;word-break:break-all;line-height:1.3;}
.sb-user-t2{font-size:10.5px;color:var(--nv-sidebar-sub);margin-top:2px;line-height:1.3;}
.sb-logout{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#F5A3AE;font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;cursor:pointer;font-family:inherit;}
.sb-logout:hover{background:rgba(255,255,255,.06);}
.sb-logout svg{width:18px;height:18px;}

.shell-main{flex:1;min-width:0;padding:24px 30px 40px;box-sizing:border-box;}
.shell-inner{max-width:1480px;margin:0 auto;}
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;}
.pg-title{font-size:24px;font-weight:800;color:var(--nv-text);display:flex;align-items:center;gap:10px;}
.pg-sub{font-size:13px;color:var(--nv-sub);margin-top:4px;}
.pg-tools{display:flex;align-items:center;gap:12px;flex:0 0 auto;}
.pg-upd{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--nv-sub);line-height:1.3;}
.pg-upd b{display:block;font-size:12px;color:var(--nv-text);font-weight:600;}
.pg-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--nv-line);background:#fff;color:var(--nv-text);font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;font-family:inherit;}
.pg-btn:disabled{opacity:.55;cursor:default;}
.pg-btn svg{width:16px;height:16px;}

/* スマホ・タブレット用の上バー/下タブ/ドロワー(PCでは非表示) */
.m-top,.m-upd,.m-bottom,.m-drawer-bg,.m-drawer{display:none;}
.m-seg{display:none;}

@media (max-width:1099px){
  .sb{display:none;}
  .shell{display:block;}
  .shell-main{padding:12px 14px 92px;}
  .pg-head{display:none;}
  .m-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:120;background:#fff;border-bottom:1px solid var(--nv-line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));}
  .m-top img{width:34px;height:34px;border-radius:8px;object-fit:contain;}
  .m-top-t1{font-size:15px;font-weight:800;color:var(--nv-text);line-height:1.2;}
  .m-top-t2{font-size:10.5px;color:var(--nv-sub);}
  .m-top-spacer{flex:1;}
  .m-icon-btn{width:38px;height:38px;border:1px solid var(--nv-line);background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--nv-text);padding:0;}

。","引っ越しをする人には「新しい生活、頑張ってください」のように励ますのが自然です。"],"Q292":["食事の前に何と言いますか。","いただきます。","食事の前は「いただきます」、食事の後は「ごちそうさまでした」と言います。"],"Q293":["「ちょっとお時間よろしいですか。」と言われました。何と答えますか。","はい、大丈夫です。","時間があるか聞かれたら「はい、大丈夫です」と答えるのが自然です。"],"Q294":["「日本語がお上手ですね。」と言われました。何と答えますか。","いいえ、まだまだです。","褒められたときは謙遜して「いいえ、まだまだです」と答えるのが自然です。"],"Q295":["「お大事に。」と言われました。何と答えますか。","ありがとうございます。","気遣いの言葉には「ありがとうございます」と答えるのが自然です。"],"Q296":["作業員はこれから何をしますか。","部品の数を数えてリストに記入する","班長が「この部品の数を数えて、リストに記入してください」と頼んでいます。"],"Q297":["アルバイトはまず何をしますか。","商品の棚を整理する","アルバイトが「棚からやりますね」と言っています。"],"Q298":["乗客はこれから何をしますか。","3番線で電車を待つ","駅員が「3番線です。あと5分で来ます」と言っています。"],"Q299":["新入社員はこれから何をしますか。","書類にサインをして総務部に届ける","部長が「この書類にサインをして、総務部に届けてください」と頼んでいます。"],"Q300":["夫はこれから何をしますか。","ゴミを出して郵便受けを見る","妻が「ゴミを出してきて」「郵便受けも見てきて」と2つ頼んでいます。"],"Q301":["学生はこれから何をしますか。","教科書の5章までを復習する","学生が「今日は5章まで復習します」と言っています。"],"Q302":["女の人はどの色のシャツを買いますか。","白","最後に「白をお願いします」と言っています。"],"Q303":["予約は何名になりましたか。","6名","「2名増えて6名になりました」とあります。"],"Q304":["会議は何時何分に始まりますか。","10時15分","「実は10時15分に変更になりました」とあります。"],"Q305":["荷物の重さはどれくらいですか。","10キロ","「ちょうど10キロです」とあります。"],"Q306":["二人はどこで昼ごはんを食べますか。","新しいイタリアンのお店","男が新しいイタリアンのお店を提案し、女も同意しています。"],"Q307":["荷物はどこに届けますか。","自宅","「会社ではなく、自宅にお願いします」とあります。"],"Q308":["エレベーターに乗るとき、他の人が先に降りるのを待って何と言いますか。","お先にどうぞ。","人に順番を譲るときは「お先にどうぞ」と言います。"],"Q309":["道を教えてあげた人に「ありがとうございます」と言われました。何と答えますか。","いいえ、どういたしまして。","お礼を言われたら「どういたしまして」と答えるのが自然です。"],"Q310":["会議に遅れて入るとき、何と言いますか。","遅れてすみません。","遅刻したときは「遅れてすみません」と謝ります。"],"Q311":["プレゼントをもらったとき、何と言いますか。","ありがとうございます、嬉しいです。","プレゼントをもらったら「ありがとうございます、嬉しいです」と喜びを伝えます。"],"Q312":["「駅までどれくらいかかりますか。」と聞かれました。何と答えますか。","歩いて10分くらいです。","時間を聞かれたら具体的な時間で答えます。"],"Q313":["「今何時ですか。」と聞かれました。何と答えますか。","3時半です。","時刻を聞かれたら具体的な時刻で答えます。"],"Q314":["「明日、暇ですか。」と聞かれました。何と答えますか。","はい、暇です。","予定を聞かれたら「はい/いいえ」で答えるのが自然です。"],"Q315":["「これ、使ってもいいですか。」と聞かれました。何と答えますか。","はい、どうぞ。","許可を求められたら「はい、どうぞ」と答えるのが自然です。"],"Q316":["「すみません、この席空いていますか。」と聞かれました。何と答えますか。","はい、どうぞ座ってください。","席が空いていることを伝えるときは「はい、どうぞ座ってください」が自然です。"],"Q317":["「体調はいかがですか。」と聞かれました。何と答えますか。","おかげさまで、だいぶ良くなりました。","体調を聞かれたら、今の状態を具体的に答えます。"],"Q318":["「休憩しませんか。」と聞かれました。何と答えますか。","そうですね、休憩しましょう。","休憩の誘いには「そうですね、休憩しましょう」と応じるのが自然です。"],"Q319":["「これでよろしいですか。」と聞かれました。何と答えますか。","はい、大丈夫です。","確認されたら「はい、大丈夫です」と答えるのが自然です。"],"Q320":["「何かお手伝いできることはありますか。」と聞かれました。何と答えますか。","大丈夫です、ありがとうございます。","手伝いを申し出られて不要な場合は「大丈夫です、ありがとうございます」と丁寧に断ります。"],"Q321":["男の人はコピーの後、何をしますか。","会議室に持っていく","「コピーが終わったら、会議室に持っていってください」と言っています。"],"Q322":["客は何色のかさを買いますか。","黒","青は売り切れで、最後に「黒をください」と言っています。"],"Q323":["パーティーは何曜日になりましたか。","土曜日","「金曜日は会議が入って、土曜日に変わりました」とあります。"],"Q324":["友達が試験に合格しました。何と言いますか。","おめでとうございます。","よいことがあった人には「おめでとうございます」と言います。"],"Q325":["「この資料、もらってもいいですか。」と聞かれました。何と答えますか。","はい、どうぞ。","許可を求められたら「はい、どうぞ」と答えます。「いただきます」はもらう側が言う言葉です。"],"Q326":["子どもはこれから何をしますか。","テーブルをかたづけて、おはしを出す","「テーブルの上をかたづけて」「おはしだけお願い」と言っています。お皿は出しません。"],"Q327":["学生はあした何を持ってきますか。","ぼうしと飲み物","ぼうしと飲み物が必要です。かさは「天気がいいので、いりません」と言っています。"],"Q328":["女の人はこのあとどこへ行きますか。","2階の会議室","最初は3階でしたが、田中さんが2階の会議室にいるので「そちらへお願いします」と変わりました。"],"Q329":["男の人はどうして遅れましたか。","かぎが見つからなかったから","「家を出るときにかぎが見つからなくて」と言っています。道は空いていました。"],"Q330":["客はいくら払いますか。","4,000円","3,000円＋2,000円の半額1,000円＝4,000円です。"],"Q331":["二人は何時に出発しますか。","7時30分","8時から「30分早く」なので7時30分です。"],"Q332":["女の人はだれに資料を送りますか。","鈴木さん","山田さんは休みなので「かわりに、鈴木さんに送ってください」と言っています。"],"Q333":["会社で、先に帰る同僚を見送るとき、何と言いますか。","お疲れさまでした。","先に帰る人を見送るときは「お疲れさまでした」と言います。"],"Q334":["重そうな荷物を持っている人を見ました。何と言いますか。","お持ちしましょうか。","手伝いを申し出るときは「お持ちしましょうか」と言います。"],"Q335":["友達の家に入るとき、何と言いますか。","おじゃまします。","入るときは「おじゃまします」、帰るときは「おじゃましました」と言います。"],"Q336":["「そのペン、貸してもらえますか。」と聞かれました。何と答えますか。","はい、どうぞ。","貸してほしいと頼まれたら「はい、どうぞ」と渡します。「借ります」は借りる側の言葉です。"],"Q337":["「今日は何時までですか。」と聞かれました。何と答えますか。","5時までです。","「何時まで」と聞かれているので「〜までです」と答えます。"],"Q338":["男の人はこれから何をしますか。","部長に資料を見せる","「部長に見てもらってください」と言われ、「すぐ持っていきます」と答えています。"],"Q339":["患者はこの後、まず何をしますか。","会計をする","「先にお会計をしてから、薬局へ行ってください」とあります。"],"Q340":["客はこの後どうしますか。","ほかの色のくつを見る","「ほかの色を見せてください」と言っています。"],"Q341":["女の人はどうして会社を休みましたか。","子どもの学校の用事があったから","「子どもの学校で用事があって」と言っています。体は大丈夫でした。"],"Q342":["二人はどこで食べますか。","駅前のそば屋","食堂は混んでいるので、「駅前のそば屋にしましょう」と決まりました。"],"Q343":["荷物はいつ届きますか。","あしたの午後2時から4時","最初は午前中でしたが、「午後2時から4時のあいだ」に変わりました。"],"Q344":["テストはいつありますか。","来週の木曜日","「水曜日は祝日なので、木曜日になりました」とあります。"],"Q345":["お店で、店員に商品の場所を聞きたいです。何と言いますか。","すみません、これはどこにありますか。","場所を聞くときは「どこにありますか」と言います。"],"Q346":["会社を早く帰りたいです。上司に何と言いますか。","すみません、今日は早く帰ってもいいですか。","許可を求めるときは「〜てもいいですか」と言います。"],"Q347":["道でぶつかりそうになりました。何と言いますか。","すみません。","人にぶつかりそうになったときは「すみません」とあやまります。"],"Q348":["「かさを持っていったほうがいいですよ。」と言われました。何と答えますか。","そうですね、持っていきます。","助言を受け入れるときは「そうですね」と同意して答えます。"],"Q349":["「この席、空いていますか。」と聞かれました。すでに人が座る予定です。何と答えますか。","すみません、人が来ます。","空いていないときは、理由を添えて断ります。ただ断るより丁寧です。"],"Q350":["部下はこの後、まず何をしますか。","電話に出る","「電話が終わってからでいいですよ」と言われているので、先に電話に出ます。"],"Q351":["子どもは何を買いに行きますか。","パン、牛乳、バター","パンと牛乳に加えて、バターも頼まれています。たまごはまだあるので買いません。"],"Q352":["乗客はこの後どうしますか。","まどぐちで切符を買う","「あちらのまどぐちで、もう一度お買い求めください」と言われています。"],"Q353":["電車がとまった理由はどれですか。","強い風","「強い風のせいだそうです」と言っています。事故ではありません。"],"Q354":["商品はどのくらいでできますか。","10日ほど","ふつうは1週間ですが、今は注文が多くて「10日ほど」かかります。"],"Q355":["男の人は何を忘れましたか。","プロジェクターの用意","資料もコピーもできていましたが、プロジェクターを忘れていました。"],"Q356":["学生は何時に来ますか。","8時40分","授業は9時からですが、準備のため「8時40分に来てください」と言われています。"],"Q357":["友達が病気だと聞きました。何と言いますか。","お大事に。","病気の人には「お大事に」と言います。"],"Q358":["会議室を使いたいです。使っている人に何と言いますか。","あと何分ぐらいかかりますか。","使っている人には、いつ空くかをていねいにたずねます。「すぐ出てください」は失礼です。"],"Q359":["食事をごちそうになりました。帰るとき何と言いますか。","ごちそうさまでした。","食事のあとは「ごちそうさまでした」と言います。"],"Q360":["「あしたの会議、何時からでしたか。」と聞かれました。何と答えますか。","たしか10時からです。","「何時から」と聞かれているので「〜からです」と答えます。"],"Q361":["「手伝いましょうか。」と言われましたが、もう終わりました。何と答えますか。","ありがとうございます、もう終わりました。","申し出には先にお礼を言い、それから断ります。「いいえ、けっこうです」だけだと冷たく聞こえます。"],"Q362":["ランさんは、今日、何をしますか。","病院へ行く","本文に「病院へ行ってから、薬をもらいます」とあります。今日は会社を休みます。あしたは仕事に行けると思っています。"],"Q363":["洗濯機について、正しいものはどれですか。","夜10時までに使う","「夜10時までに使ってください」とあります。朝について、本文には書いてありません。"],"Q364":["倉庫のカギは、どこにありますか。","事務所のつくえの引き出し","「事務所のつくえの引き出しに入っています」とあります。"],"Q365":["この人は、何をお願いしていますか。","会う時間を30分おそくすること","「6時30分でもいいですか」とあるので、会う時間を30分おそくしたいと言っています。場所はかえていません。"],"Q366":["はじめて機械を使う人は、どうしなければなりませんか。","先輩といっしょに使う","「先輩といっしょに使ってください。一人で使ってはいけません」とあります。"],"Q367":["本日の店について、正しいものはどれですか。","午後5時に閉まる","「本日は、店を午後5時に閉めます」とあります。いつもは午後8時ですが、今日だけ早く閉まります。"],"Q368":["来週、みなさんは何をしなければなりませんか。","宿題をする","来週のクラスは休みですが、宿題が2ページあります。次のクラスで出すので、宿題をしなければなりません。"],"Q369":["会社に行く人は、何をしたほうがいいですか。","会社に電話をする","「会社に行く人は、会社に電話をしたほうがいいです」とあります。"],"Q370":["この人は、どうして口座を作りましたか。","給料を受け取るため","「給料を受け取るために、口座が必要だった」とあります。国にお金を送るのは、来月の予定です。"],"Q371":["この人は、どうして朝に洗濯するようになりましたか。","朝は洗濯機が空いているから","夜は人が多くて空いていませんが、朝6時ごろは空いていると教えてもらいました。それで朝に洗濯するようになりました。"],"Q372":["この人は、次に病院へ行くとき、どうしたいですか。","症状を日本語で話せるようになりたい","最後の文に「症状を日本語で話せるように勉強したい」とあります。"],"Q373":["梅雨について、正しいものはどれですか。","6月ごろに雨の日が続く","「6月ごろに雨の日が続きます。これを梅雨といいます」とあります。洗濯物はかわきにくく、食べ物はくさりやすくなります。"],"Q374":["機械が動いたのは、どうしてですか。","先輩がてつだってくれたから","「先輩のおかげで、30分で機械が動きました」とあります。先輩がいっしょに直してくれました。"],"Q375":["この人は、どうして掃除に参加しましたか。","先輩に誘われたから","「会社の先輩に『いっしょに行かない？』と誘われたからです」とあります。"],"Q376":["日曜日の午前10時に、ATMでお金を引き出します。手数料はいくらですか。","110円","日曜日のATMは9:00〜19:00に使えます。無料なのは平日の8:45〜18:00だけなので、日曜日は手数料が110円かかります。"],"Q377":["8時までに駅Cに着きたいです。駅Aを、いちばんおそく出られる電車は、何時の電車ですか。","7:25の電車","7:25の急行は7:45に着きます。7:40の普通は8:10、7:55の急行は8:15に着くので、おそすぎます。8時までに着ける電車でいちばんおそいのは、7:25です。"],"Q378":["スピーチ大会に出たい人は、いつまでに申し込みますか。","10月31日","「申し込み：10月31日（金）までに」とあります。11月16日は、大会の日です。"],"Q379":["魚が食べたい人は、いくら払いますか。","450円","魚が入っているのは、A定食（焼き魚）です。450円です。"],"Q380":["つくえを出したいです。最初に何をしますか。","電話で申し込む","手順は①電話で申し込む→②シールを買う→③シールをはって出す、の順番です。最初は、電話で申し込みます。"],"Q381":["女性が夜9時にシャワーを使うとき、どこで使えますか。","1階と2階のどちらでも","夜20:00〜22:00は、男性も女性も、1階と2階のどちらでも使えます。"]};
const QUESTION_INFO_N3 = {"N3-Q1":["【突然】、大きな音がした。「突然」の読み方はどれですか。","とつぜん","「突然」は「とつぜん」と読みます。「急に、何の前触れもなく」という意味です。"],"N3-Q2":["彼の意見に【賛成】です。「賛成」の読み方はどれですか。","さんせい","「賛成」は「さんせい」と読みます。「意見に同意すること」という意味です。反対語は「反対」です。"],"N3-Q3":["この薬は【効果】があります。「効果」の読み方はどれですか。","こうか","「効果」は「こうか」と読みます。「ある行動や物事の結果として現れるよい働き」という意味です。"],"N3-Q4":["会社の【方針】が変わった。「方針」の読み方はどれですか。","ほうしん","「方針」は「ほうしん」と読みます。「今後どうしていくかという基本の考え方・方向性」という意味です。"],"N3-Q5":["この地域はしぜんが豊かだ。「しぜん」を漢字で書くとき、最もよいものはどれですか。","自然","「しぜん」は「自然」と書きます。「人の手が加わっていない、もとのままの状態」という意味です。"],"N3-Q6":["新しいせいさくが発表された。「せいさく」を漢字で書くとき、最もよいものはどれですか。","政策","「せいさく」は「政策」と書きます。「政府や組織が目標のために立てる方針」という意味です。"],"N3-Q7":["部長にほうこくしてください。「ほうこく」を漢字で書くとき、最もよいものはどれですか。","報告","「ほうこく」は「報告」と書きます。「状況や結果を相手に伝えること」という意味です。"],"N3-Q8":["しょうらいの夢は医者になることだ。「しょうらい」を漢字で書くとき、最もよいものはどれですか。","将来","「しょうらい」は「将来」と書きます。「これから先の時、未来」という意味です。「招来」は「まねき寄せる」という別の意味の言葉なので注意しましょう。"],"N3-Q9":["台風の影響で、電車が（　）している。","遅延","正解は「遅延」です。「遅延」は電車やバスなどが予定より遅れることに使います。「遅刻」は人が約束の時間に遅れることに使うので、ここでは合いません。"],"N3-Q10":["この問題については、もう少し（　）が必要だ。","検討","正解は「検討」です。「検討」は物事をよく考えること、「検査」や「点検」は機械や体の状態を調べることに使うので、ここでは合いません。"],"N3-Q11":["彼は失敗を（　）に、次はもっと注意するようになった。","きっかけ","正解は「きっかけ」です。「Nをきっかけに」で「Nが【原因】・機会となって」という意味を表します。「おかげ」はよい結果、「せい」は悪い結果の原因を表すときに使います。"],"N3-Q12":["説明書の（　）に従って、組み立ててください。","通り","正解は「通り」です。「Nの通りに」で「Nと同じように、Nに従って」という意味を表します。"],"N3-Q13":["彼はいつも冷静だ。","落ち着いている","「冷静」に最も意味が近いのは「落ち着いている」です。どちらも「感情に流されず、平静な様子」を表します。"],"N3-Q14":["その意見にほぼ同感です。","だいたい","「ほぼ」に最も意味が近いのは「だいたい」です。どちらも「完全ではないが、おおよそ」という意味を表します。"],"N3-Q15":["彼女は仕事に熱心だ。","一生懸命だ","「熱心」に最も意味が近いのは「一生懸命」です。どちらも「ものごとに一所懸命打ち込む様子」を表します。"],"N3-Q16":["この資料はかなり古い。","だいぶ","「かなり」に最も意味が近いのは「だいぶ」です。どちらも「予想より程度が大きいこと」を表します。"],"N3-Q17":["「対象」の使い方として最もよいものはどれですか。","この商品は20代の女性を対象にしている。","正解は「この商品は20代の女性を対象にしている。」です。「対象」は「働きかけ・目的の相手や範囲」という意味の名詞で、「Nを対象にする」の形でよく使われます。他の文は「対象」の意味に合いません。"],"N3-Q18":["「一方」の使い方として最もよいものはどれですか。","兄は医者で、一方弟は教師だ。","正解は「兄は医者で、一方弟は教師だ。」です。「一方」は「対照的な二つのことを並べて述べるとき」に使う言葉で、「Aで、一方Bは〜」の形でよく使われます。他の文は「一方」の意味に合いません。"],"N3-Q19":["「共通」の使い方として最もよいものはどれですか。","二人には共通の趣味がある。","正解は「二人には共通の趣味がある。」です。「共通」は「二つ以上のものに共に当てはまること」という意味の名詞で、「共通の〜」「〜に共通する」の形でよく使われます。他の文は「共通」の意味に合いません。"],"N3-Q20":["「維持」の使い方として最もよいものはどれですか。","健康を維持するために運動している。","正解は「健康を維持するために運動している。」です。「維持」は「今の状態を保ち続けること」という意味の動詞（する）で、「Nを維持する」の形でよく使われます。他の文は「維持」の意味に合いません。"],"N3-Q21":["この製品は品質を【重視】しています。「重視」の読み方はどれですか。","じゅうし","「重視」は「じゅうし」と読みます。「大切なものとして扱うこと」という意味です。"],"N3-Q22":["彼は【責任】を持って仕事をする。「責任」の読み方はどれですか。","せきにん","「責任」は「せきにん」と読みます。「自分が引き受けてやらなければならない務め」という意味です。"],"N3-Q23":["この機械は【正確】に動きます。「正確」の読み方はどれですか。","せいかく","「正確」は「せいかく」と読みます。「間違いがなく、正しいこと」という意味です。"],"N3-Q24":["事故の【原因】を調査しています。「原因」の読み方はどれですか。","げんいん","「原因」は「げんいん」と読みます。「ある結果を引き起こしたもと」という意味です。"],"N3-Q25":["会社のきそくを守ってください。「きそく」を漢字で書くとき、最もよいものはどれですか。","規則","「きそく」は「規則」と書きます。「守るべき決まり」という意味です。"],"N3-Q26":["彼はせっきょくてきに発言する。「せっきょくてき」を漢字で書くとき、最もよいものはどれですか。","積極的","「せっきょくてき」は「積極的」と書きます。「自分から進んで行動する様子」という意味です。"],"N3-Q27":["けいざいの状況が悪化している。「けいざい」を漢字で書くとき、最もよいものはどれですか。","経済","「けいざい」は「経済」と書きます。「ものやお金の生産・消費に関する仕組み」という意味です。"],"N3-Q28":["新しいせいどが導入された。「せいど」を漢字で書くとき、最もよいものはどれですか。","制度","「せいど」は「制度」と書きます。「社会や組織で定められた仕組み」という意味です。"],"N3-Q29":["この製品は海外にも（　）されている。","輸出","正解は「輸出」です。「輸出」は自国から外国へ物を送ること、「輸入」は外国から自国へ入れることなので、「海外にも」という文脈に合うのは「輸出」です。"],"N3-Q30":["彼の話には（　）がある。信用できない。","矛盾","正解は「矛盾」です。「矛盾」は「話の前後が食い違うこと」という意味で、「信用できない」という文脈に合います。"],"N3-Q31":["この会社は毎年、着実に売り上げを（　）ている。","伸ばし","正解は「伸ばし」です。「売り上げを伸ばす」で「会社が自分の力で売り上げを増やす」という意味になります。"],"N3-Q32":["彼女はどんな困難にも（　）ずに前へ進んだ。","負け","正解は「負け」です。「困難に負けずに」で「困難に打ち勝って」という意味を表す、よく使われる表現です。"],"N3-Q33":["彼は突然、意見を変えた。","急に","「突然」に最も意味が近いのは「急に」です。どちらも「前触れなく、いきなり」という意味を表します。"],"N3-Q34":["この地図はかなり正確だ。","精密だ","「正確」に最も意味が近いのは「精密」です。どちらも「細部まで間違いがないこと」を表します。"],"N3-Q35":["この店の店員はとても親切だ。","やさしい","「親切」に最も意味が近いのは「やさしい」です。どちらも「人に対する温かい思いやりがある様子」を表します。"],"N3-Q36":["彼の計画はとても複雑だ。","ややこしい","「複雑」に最も意味が近いのは「ややこしい」です。どちらも「物事が入り組んでいて分かりにくいこと」を表します。"],"N3-Q37":["「以上」の使い方として最もよいものはどれですか。","参加者は50人以上集まった。","正解は「参加者は50人以上集まった。」です。「以上」は「数量がその基準を含めてそれより多いこと」を表す言葉で、「N以上」の形でよく使われます。他の文は「以上」の意味に合いません。"],"N3-Q38":["「解決」の使い方として最もよいものはどれですか。","話し合いで問題を解決した。","正解は「話し合いで問題を解決した。」です。「解決」は「問題をうまく処理して終わらせること」という意味の動詞（する）で、「Nを解決する」の形でよく使われます。他の文は「解決」の意味に合いません。"],"N3-Q39":["「割合」の使い方として最もよいものはどれですか。","女性の割合が年々増えている。","正解は「女性の割合が年々増えている。」です。「割合」は「全体に対する部分の比率」という意味の名詞で、「Nの割合」の形でよく使われます。他の文は「割合」の意味に合いません。"],"N3-Q40":["「実現」の使い方として最もよいものはどれですか。","長年の夢がついに実現した。","正解は「長年の夢がついに実現した。」です。「実現」は「計画や望みが実際に現実のものになること」という意味の動詞（する）で、「Nが実現する」の形でよく使われます。他の文は「実現」の意味に合いません。"],"N3-Q41":["父が短気な（　）、母の方は気が長い。","に対して","正解は「に対して」です。「Aに対してB」で「Aとは反対・対照的にB」という意味を表します。前後で性質が対照的な内容が来ています。"],"N3-Q42":["この機械は、使い方（　）、とても便利にもなるし危険にもなる。","次第で","正解は「次第で」です。「Nしだいで」で「Nの状況によって結果が変わる」という意味を表します。"],"N3-Q43":["彼は疲れている（　）、最後まで仕事を終わらせた。","にもかかわらず","正解は「にもかかわらず」です。「Nにもかかわらず」で「Nという状況なのに、それに反することが起こる」という意味を表します。"],"N3-Q44":["この資料は、来週の会議（　）に準備しておいてください。","に向けて","正解は「に向けて」です。「Nに向けて」で「Nという目標・時点をめざして」という意味を表します。"],"N3-Q45":["田中さんは日本語（　）、フランス語も話せる。","はもちろん","正解は「はもちろん」です。「Aはもちろん、Bも」で「Aは当然として、それに加えてBも」という意味を表します。"],"N3-Q46":["彼女は忙しい（　）、いつも笑顔で私たちを迎えてくれる。","ながらも","正解は「ながらも」です。「Aながらも、B」で「Aという状態なのに、Bという逆のことをする」という意味を表します。"],"N3-Q47":["彼が来る（　）来ないかは、まだわからない。","か","正解は「か」です。「AかBか」で「AなのかBなのか、どちらかわからない」という不確かさを表します。"],"N3-Q48":["この店のラーメンは、安い（　）おいしい。","うえに","正解は「うえに」です。「Aうえに、B」で「Aに加えてBも」という、よい面や悪い面を重ねて述べるときに使います。"],"N3-Q49":["一度決めた（　）、最後までやり通すべきだ。","からには","正解は「からには」です。「Aからには、B」で「Aという以上、当然Bすべきだ」という強い意志・義務を表します。"],"N3-Q50":["彼は新人（　）、なかなかよく仕事ができる。","にしては","正解は「にしては」です。「Nにしては」で「Nという立場・条件から考えると、予想と違って」という意味を表します。"],"N3-Q51":["先週（　）レストランが、来週オープンする。","できたばかりの","正解は「できたばかりの」です。「Vたばかりの」で「Vしてから間もない」という意味を表します。"],"N3-Q52":["どうやったら、あんなに（　）不思議だ。","上手に踊れるのか","正解は「上手に踊れるのか」です。「どうやったら〜できるのか」で、方法が分からず不思議に思う気持ちを表します。"],"N3-Q53":["彼女が（　）、私には想像もつかない。","どれほど努力したか","正解は「どれほど努力したか」です。「どれほど〜か、想像もつかない」で「程度が全く分からないほどだ」という意味を表します。"],"N3-Q54":["この仕事は、（　）終わらせなければならない。","どんなに時間がかかっても","正解は「どんなに時間がかかっても」です。「どんなに〜ても」で「程度がどうであっても、結果は変わらない」という意味を表します。"],"N3-Q55":["先生に（　）、この問題は理解できなかっただろう。","教えていただかなかったら","正解は「教えていただかなかったら」です。「〜なかったら」で、実際にはあった過去の事実に反する仮定（もし〜がなかったなら）を表します。"],"N3-Q56":["彼は、忙しい（　）ちゃんと連絡をくれる。","にもかかわらず、いつも","正解は「にもかかわらず、いつも」です。「忙しいにもかかわらず」で「忙しいという状況に反して」という逆接を表し、「いつも」が肯定文と自然につながります。"],"N3-Q57":["この店の料理は、値段が（　）味はいまひとつだ。","高いわりに","正解は「高いわりに」です。「Aわりに、B」で「Aから予想されることに比べて、Bは意外な結果だ」という意味を表します。"],"N3-Q58":["社長の（　）、この計画は決して成功しなかっただろう。","おかげで","正解は「おかげで」です。ここでは文脈上「社長のおかげで（あったからこそ）成功しなかったはずがない」という肯定的な意味合いなので、良い結果を表す「おかげで」が合います。"],"N3-Q59":["こんなに雨が降っては、試合は（　）。","中止せざるを得ない","正解は「中止せざるを得ない」です。「〜ざるを得ない」で「そうしたくなくても、そうするしかない」という意味を表します。"],"N3-Q60":["彼女の説明を聞いて、（　）納得した。","ようやく","正解は「ようやく」です。「ようやく」は「時間がかかったが、最終的に」という意味で、「説明を聞いて理解できた」という文脈に合います。"],"N3-Q61":["彼女は日本に来た（　）、もう3年になる。","きり","正解は「きり」です。「Vたきり」で「Vしてから、その状態がずっと続いている」という意味を表します。"],"N3-Q62":["このレポートは、明日（　）提出しなければならない。","までに","正解は「までに」です。「Nまでに」で「Nという期限より前に、一度だけ動作が完了する」という意味を表します。「まで」は継続を表すので合いません。"],"N3-Q63":["彼は経験が浅い（　）、判断力はしっかりしている。","わりに","正解は「わりに」です。「Aわりに、B」で「Aから予想される内容に比べて、Bは意外な結果だ」という意味を表します。"],"N3-Q64":["彼が本気で怒った（　）、めったに見たことがない。","ところを","正解は「ところを」です。「Vたところを見たことがない」で「そのような場面を目にしたことがない」という意味になります。"],"N3-Q65":["健康の（　）、毎日運動することにしている。","ために","正解は「ために」です。「Nのために」で「Nという目的のために」という意味を表します。"],"N3-Q66":["彼女は歌手（　）、演技力もある。","としてだけでなく","正解は「としてだけでなく」です。「Nとしてだけでなく」で「Nの立場だけではなく、それに加えて」という意味を表します。"],"N3-Q67":["工場の機械は、24時間（　）稼働している。","休むことなく","正解は「休むことなく」です。「Vことなく」で「Vしないで、ずっと」という意味を表します。"],"N3-Q68":["彼の説明を聞けば聞く（　）、分からなくなってきた。","ほど","正解は「ほど」です。「Vば〜Vほど」で「Vする程度が増えるにつれて」という意味を表します。"],"N3-Q69":["この薬は、子ども（　）大人まで安心して使える。","から","正解は「から」です。「Nから〜まで」で「Nを始まりの範囲として」という意味を表します。"],"N3-Q70":["彼は約束の時間（　）遅れて来た。","より","正解は「より」です。「Nより遅れる」で「Nを基準として、それより後になる」という意味を表します。"],"N3-Q71":["彼は、忙しさの（　）家族との時間を大切にしている。","中でも","正解は「中でも」です。「Nの中でも」で「Nという状況の中にあってもなお」という意味を表します。"],"N3-Q72":["彼は、この仕事を（　）信頼できる人物だ。","任せられるほど","正解は「任せられるほど」です。「Vられるほど」で「Vできるくらい」という程度を表し、「この仕事を任せられるくらい信頼できる人物だ」という意味になります。"],"N3-Q73":["このニュースを聞いたら、彼は（　）だろう。","きっと驚く","正解は「きっと驚く」です。「きっと〜だろう」で未来の推量を表すので、現在形の「驚く」が合います。"],"N3-Q74":["田中さんは、部長（　）意見を求めた。","に加えて課長にも","正解は「に加えて課長にも」です。「Aに加えてBにも」で「Aだけでなく、それにBも追加して」という意味を表します。"],"N3-Q75":["彼女は、周りの反対を（　）留学を決めた。","押し切って","正解は「押し切って」です。「Vを押し切って」で「反対や抵抗を乗り越えて、自分の意志を貫いて」という意味を表します。"],"N3-Q76":["彼は経験が（　）にもかかわらず、リーダーに選ばれた。","少ない","正解は「少ない」です。「Aにもかかわらず、B」の「A」は名詞・形容詞・動詞の普通形が来るので、ここでは「少ない」が正しい形です。"],"N3-Q77":["この地域は、地震（　）自然災害が多い。","をはじめとする","正解は「をはじめとする」です。「Nをはじめとする」で「Nを代表例として、その他にも」という意味を表します。"],"N3-Q78":["彼は疲れて（　）、最後まで走り続けた。","いながらも","正解は「いながらも」です。「Vていながらも」で「Vしている状態なのに、それに反することをする」という意味を表します。"],"N3-Q79":["会議の資料は、（　）用意しておいたほうがいい。","多めに","正解は「多めに」です。「多めに」は「基準より少し多く」という意味の副詞的表現で、「用意する」を修飾します。"],"N3-Q80":["彼女の努力（　）、プロジェクトは成功した。","のかいあって","正解は「のかいあって」です。「Nのかいあって」で「Nという努力の結果が報われて」という意味を表します。"],"N3-Q81":["文章中の［1］に入る最もよいものはどれですか。","まず","正解は「まず」です。文章の最初に「最初に気づいたこと」を述べる場面なので、「まず」が合います。"],"N3-Q82":["文章中の［2］に入る最もよいものはどれですか。","さらに","正解は「さらに」です。前の文（丁寧な接客）に加えて、別の気づき（並んでいる様子）を続けて述べているので「さらに」が合います。"],"N3-Q83":["文章中の［3］に入る最もよいものはどれですか。","たくさんの","正解は「たくさんの」です。前の文の「並んでいる人がとても多かった」という内容と対応しています。"],"N3-Q84":["文章中の［4］に入る最もよいものはどれですか。","いつのまにか","正解は「いつのまにか」です。「いつのまにか」は「気づかないうちに」という意味で、店にいる間に天気が変わっていたという状況に合います。"],"N3-Q85":["文章中の［5］に入る最もよいものはどれですか。","買って","正解は「買って」です。自分が傘を買うという単純な動作なので、受身や使役の形は不要です。"],"N3-Q86":["文章中の［1］に入る最もよいものはどれですか。","すると","正解は「すると」です。「すると」は「前の出来事のすぐ後に」という意味で、提出後すぐに連絡があったという時間の流れに合います。"],"N3-Q87":["文章中の［2］に入る最もよいものはどれですか。","最初は","正解は「最初は」です。この後「それ以来ミスが減りました」と対比されているので、「最初は」落ち込んでいた、という時間的な対比が自然です。"],"N3-Q88":["文章中の［3］に入る最もよいものはどれですか。","おかげで","正解は「おかげで」です。この後「ミスが減りました」という良い結果が続いているので、良い結果を表す「おかげで」が合います。"],"N3-Q89":["文章中の［4］に入る最もよいものはどれですか。","初めて","正解は「初めて」です。「Aして初めてBできる」で「Aという経験があって、そこでようやくBが分かる・できる」という意味を表します。"],"N3-Q90":["文章中の［5］に入る最もよいものはどれですか。","失っていた","正解は「失っていた」です。仮定の話（もしあの時〜だったら）の中で、自分が自信を失うという単純な動作なので、受身や使役の形は不要です。"],"N3-Q91":["この文章で最も伝えたいことは何ですか。","休憩室の利用時間の変更と、使用後のお願い","本文には「利用時間が変わります」ということと、「使用後は…きれいにしてから退出してください」という2つのお願いが書かれています。"],"N3-Q92":["まなさんは、本屋で何をしましたか。","続きのシリーズを買った","本文に「続きのシリーズも読みたくなって、昨日本屋で買ってきました」とあります。"],"N3-Q93":["この文章の内容と合っているのはどれですか。","点検の時間は、状況によって変わることがある","本文に「状況により多少前後する場合があります」とあり、時間が変わる可能性が書かれています。"],"N3-Q94":["この人は、今日どんな気持ちでしたか。","友達と話せてうれしかった","本文に「いろいろな話ができてうれしかった」とはっきり書かれています。"],"N3-Q95":["「報連相」とは、どのような意味ですか。","報告・連絡・相談という3つの行動をまとめた言葉","本文の最初に「『報告・連絡・相談』の頭文字をとった言葉」と説明されています。"],"N3-Q96":["この人が積極的に相談するようになったきっかけは何ですか。","先輩に「分からないまま進めるほうが危ない」と言われたこと","本文に「先輩に『分からないまま進めるほうが危ない』と言われてから、積極的に相談するようになりました」とあります。"],"N3-Q97":["「やさしい日本語」の掲示について、正しいのはどれですか。","外国人だけでなく、日本人スタッフにも読みやすいと言われている","本文に「日本人スタッフからも『これなら自分たちも読みやすい』という声が上がっている」とあります。"],"N3-Q98":["この文章を書いた人は、言葉の壁についてどう感じていますか。","工夫次第で低くすることができる","本文の最後に「言葉の壁は、工夫次第で低くできるのだと感じている」とはっきり書かれています。"],"N3-Q99":["仕事が終わってから平日の夜に参加したい人は、どのクラスに申し込めばいいですか。","初級クラスか中級クラス","初級クラス（火曜19:00〜）と中級クラス（木曜19:00〜）が平日の夜に開催されています。会話クラスは土曜の午前中です。"],"N3-Q100":["会話クラスに参加するとき、注意しなければならないことは何ですか。","定員があるので、早く申し込む必要がある","本文に「会話クラスのみ、定員20名のため先着順となります」とあり、早めの申し込みが必要です。"],"N3-Q101":["この文章の内容と合っているのはどれですか。","機械の操作は一人で行ってはいけない","本文に「必ず二人以上で作業を行い、一人での作業は禁止です」とあります。"],"N3-Q102":["リンさんは、ハンさんに何を頼みたいと思っていますか。","引っ越しの手伝い","本文に「引っ越しの手伝いをお願いできますか」とあります。"],"N3-Q103":["この文章を読んで、パソコンを使っている人がすべきことは何ですか。","データを保存してから作業を中断する","本文に「データを保存してから作業を中断してください」とあります。"],"N3-Q104":["この人は、口座を開いたあと、どんな気持ちになりましたか。","自信がついた","本文に「一人で手続きができたことが、とても自信になった」とあります。"],"N3-Q105":["この人が最初にゴミの分別についてどう感じていましたか。","面倒だと感じていた","本文に「最初は面倒に感じ」とはっきり書かれています。"],"N3-Q106":["この人の考え方が変わったきっかけは何ですか。","同僚から分別の意味を教えてもらったこと","本文に「同僚に『分別することで、ゴミがリサイクルされて資源になる』と教えてもらってから、考え方が変わった」とあります。"],"N3-Q107":["「多言語ランチ会」とはどのような会ですか。","日本人と外国人が食事をしながら文化について話す会","本文の最初に「日本人スタッフと外国人スタッフが一緒に昼食を食べながら、お互いの文化や習慣について話す会だ」と説明されています。"],"N3-Q108":["この人は、ランチ会に参加して、どのように感じましたか。","想像以上に楽しく、職場の雰囲気もよくなったと感じた","本文に「参加してみると想像以上に楽しかった」「職場の雰囲気が前より明るくなったように感じている」とあります。"],"N3-Q109":["月曜日に利用できる施設はどれですか。","プールと体育館","トレーニングルームは月曜休館なので使えません。プール（火曜休館）と体育館（水曜休館）は月曜日に利用できます。"],"N3-Q110":["利用料を半額にしてもらうには、どうすればいいですか。","証明書を提示する","本文に「65歳以上の方、障がいをお持ちの方は、利用料が半額になります（証明書をご提示ください）」とあります。"],"N3-Q111":["スタッフはこの後まず何をしますか。","資料を読む","班長が「その前に、朝礼で配った資料を読んでおいてください」と言っているので、検査の前にまず資料を読みます。"],"N3-Q112":["患者はこの後まず何をしますか。","問診票に記入する","受付の人が「まず、こちらの問診票にご記入ください」と言っています。保険証は問診票と一緒に後で出します。"],"N3-Q113":["男の人はこの後まず何をしますか。","資料をコピーする","男の人は「今からコピーします」と言っており、これからまず資料のコピーをします。会議室の準備は女の人がします。"],"N3-Q114":["男の人は、なぜ旅行に行けると思っていますか。","熱がなくなり、病院で大丈夫だと言われたから","男の人は「病院に行ったら大丈夫だって言われたし、もう熱もない」と理由を説明しています。"],"N3-Q115":["会議室が変更になったのは、なぜですか。","会議室Aのエアコンが故障しているから","部長が「会議室Aは今エアコンが故障していて」と理由を説明しています。"],"N3-Q116":["洗濯機の音が大きかったのは、なぜですか。","洗濯機の調子が悪かったから","実習生が「洗濯機の調子が悪くて、いつもより大きい音がしていた」と説明しています。"],"N3-Q117":["先輩が重い荷物を運んでいます。何と言いますか。","お手伝いしましょうか。","誰かが大変そうなときは「お手伝いしましょうか」と声をかけるのが自然です。"],"N3-Q118":["会議に少し遅れて到着しました。部屋に入るとき、何と言いますか。","遅れて申し訳ありません。","遅刻したときは「遅れて申し訳ありません」と謝ってから入るのが自然です。"],"N3-Q119":["同僚が体調が悪そうで、早退することになりました。何と言いますか。","お大事にしてください。","体調が悪い人には「お大事にしてください」と声をかけるのが自然です。"],"N3-Q120":["「これ、来週までにお願いできますか。」と言われました。何と答えますか。","はい、分かりました。やっておきます。","依頼を受けるときは「分かりました。やっておきます」と答えるのが自然です。"],"N3-Q121":["「日本語、だいぶ上手になりましたね。」と言われました。何と答えますか。","ありがとうございます。まだまだですが。","ほめられたときは「ありがとうございます」とお礼を言うのが自然です。「まだまだですが」を添えると謙虚な返し方になります。"],"N3-Q122":["「今日の作業、少し危なかったですね。次から気をつけてください。」と言われました。何と答えますか。","すみません、気をつけます。","注意されたときは「すみません、気をつけます」と素直に謝るのが自然です。"],"N3-Q123":["社員はこの後まず何をしますか。","ホテルの予約を確認する","社員は「それはまだでした。今すぐ確認します」と言っているので、まずホテルの予約を確認します。資料と切符はすでに準備済みです。"],"N3-Q124":["学生はこの後まず何をしますか。","図書館で本を探す","学生は「まず図書館で本を探そうと思います」とはっきり言っています。"],"N3-Q125":["アルバイトはこの後まず何をしますか。","棚の商品を補充する","店長が「その前に、棚の商品の補充を先にお願いしてもいいですか」と頼み、アルバイトも「先に棚を補充します」と答えています。"],"N3-Q126":["子どもは、なぜ映画館に行こうと思っていますか。","雨の予報だから","子どもは「天気予報を見たら雨みたいなんだよね。だから、代わりに」と理由を説明しています。"],"N3-Q127":["プロジェクトが遅れているのは、なぜですか。","システムの不具合の修正に時間がかかったから","社員が「システムの不具合が見つかって、その修正に時間がかかってしまいました」と理由を説明しています。"],"N3-Q128":["男の人は、なぜバーベキューに行きませんか。","明日早くから仕事があるから","男の人は「明日の朝早くから仕事なんだ。だから、今日は早く寝ようと思って」と理由を説明しています。"],"N3-Q129":["会社で、同僚が新しいプロジェクトを任されて嬉しそうにしています。何と言いますか。","おめでとうございます。頑張ってください。","良いことがあった人には「おめでとうございます」と祝福の言葉をかけるのが自然です。"],"N3-Q130":["電車の中で、席が一つだけ空いています。近くにお年寄りが立っています。何と言いますか。","どうぞ、お座りください。","席を譲るときは「どうぞ、お座りください」と声をかけるのが自然です。"],"N3-Q131":["お客様に案内した場所が間違っていたことに気づきました。何と言いますか。","申し訳ございません。場所を間違えてお伝えしてしまいました。","自分のミスに気づいたときは「申し訳ございません」とすぐに謝るのが自然です。"],"N3-Q132":["「体調はいかがですか。もう大丈夫ですか。」と聞かれました。何と答えますか。","おかげさまで、だいぶよくなりました。","体調を気遣われたときは「おかげさまで、だいぶよくなりました」と答えるのが自然です。"],"N3-Q133":["「これ、私が作ったんですが、よかったら食べてみてください。」と言われました。何と答えますか。","わあ、ありがとうございます。いただきます。","食べ物をすすめられたときは「ありがとうございます。いただきます」と答えるのが自然です。"],"N3-Q134":["「この書類、明日までにお願いできますか。急で申し訳ないんですが。」と言われました。何と答えますか。","大丈夫です。やっておきます。","急な依頼を引き受けるときは「大丈夫です。やっておきます」と答えるのが自然です。"],"N3-Q135":["午後から、会議室を二階に【移動】します。「移動」の読み方はどれですか。","いどう","「移動」は「いどう」と読みます。「場所を変えること」という意味です。"],"N3-Q136":["出かける前に、ガスの火を消したか【確認】してください。「確認」の読み方はどれですか。","かくにん","「確認」は「かくにん」と読みます。「本当にそうか、はっきり調べること」という意味です。"],"N3-Q137":["最近、日本で働く外国人の数が【増加】している。「増加」の読み方はどれですか。","ぞうか","「増加」は「ぞうか」と読みます。「数や量が増えること」という意味です。反対の言葉は「減少（げんしょう）」です。"],"N3-Q138":["困ったことがあったら、いつでも先輩に【相談】してください。「相談」の読み方はどれですか。","そうだん","「相談」は「そうだん」と読みます。「困ったことについて、人に話して意見を聞くこと」という意味です。"],"N3-Q139":["明日の会議の【準備】はもうできましたか。「準備」の読み方はどれですか。","じゅんび","「準備」は「じゅんび」と読みます。「前もって用意すること」という意味です。"],"N3-Q140":["この川は深くて【危険】なので、泳いではいけません。「危険」の読み方はどれですか。","きけん","「危険」は「きけん」と読みます。「あぶないこと」という意味です。「きげん」は「期限」などの別の言葉です。"],"N3-Q141":["部屋の【温度】を25度に設定した。「温度」の読み方はどれですか。","おんど","「温度」は「おんど」と読みます。「あたたかさ・つめたさの度合い」という意味です。"],"N3-Q142":["今月から【給料】が少し上がった。「給料」の読み方はどれですか。","きゅうりょう","「給料」は「きゅうりょう」と読みます。「働いてもらうお金」という意味です。「きゅう」と「りょう」、どちらも長くのばす音です。"],"N3-Q143":["明日は朝7時にしゅっぱつします。「しゅっぱつ」を漢字で書くとき、最もよいものはどれですか。","出発","「しゅっぱつ」は「出発」と書きます。「ある場所から出かけること」という意味です。"],"N3-Q144":["工場で働いたけいけんがあります。「けいけん」を漢字で書くとき、最もよいものはどれですか。","経験","「けいけん」は「経験」と書きます。「実際にやってみたこと」という意味です。"],"N3-Q145":["あんぜんのために、ヘルメットをかぶってください。「あんぜん」を漢字で書くとき、最もよいものはどれですか。","安全","「あんぜん」は「安全」と書きます。「あぶなくないこと」という意味です。"],"N3-Q146":["足もとにちゅういしてください。「ちゅうい」を漢字で書くとき、最もよいものはどれですか。","注意","「ちゅうい」は「注意」と書きます。「気をつけること」という意味です。"],"N3-Q147":["こわれた機械をしゅうりしてもらった。「しゅうり」を漢字で書くとき、最もよいものはどれですか。","修理","「しゅうり」は「修理」と書きます。「こわれたものを直すこと」という意味です。"],"N3-Q148":["新しい機械の使い方をせつめいします。「せつめい」を漢字で書くとき、最もよいものはどれですか。","説明","「せつめい」は「説明」と書きます。「よくわかるように話すこと」という意味です。"],"N3-Q149":["引っ越しのひようは会社が払います。「ひよう」を漢字で書くとき、最もよいものはどれですか。","費用","「ひよう」は「費用」と書きます。「何かをするのにかかるお金」という意味です。"],"N3-Q150":["この用紙に新しいじゅうしょを書いてください。「じゅうしょ」を漢字で書くとき、最もよいものはどれですか。","住所","「じゅうしょ」は「住所」と書きます。「住んでいる場所」という意味です。「往」は「住」と形が似ているので注意しましょう。"],"N3-Q151":["田中さんは（　）な人なので、約束の時間を必ず守る。","まじめ","正解は「まじめ」です。「約束の時間を必ず守る」という内容に合います。「いいかげん」は反対の意味です。"],"N3-Q152":["引っ越しの荷物を段ボールに（　）。","詰めた","正解は「詰めた」です。「Nに（ものを）詰める」で、すき間なく入れるという意味です。「入った」は「を」をとらない動詞なので、ここでは使えません。"],"N3-Q153":["風邪を引いて、のどが（　）痛い。","ひりひり","正解は「ひりひり」です。のどや皮ふが刺すように痛むようすを表します。「ぴかぴか」は光るようす、「ぺらぺら」は外国語を上手に話すようす、「ふわふわ」はやわらかいようすです。"],"N3-Q154":["この書類に名前と住所を（　）してください。","記入","正解は「記入」です。「用紙などに書き入れること」という意味です。「記念」は思い出として残すこと、「記憶」は覚えていることです。"],"N3-Q155":["大切な会議なので、（　）遅れないように早めに家を出た。","絶対に","正解は「絶対に」です。「絶対に〜ないように」で、強く気をつける気持ちを表します。"],"N3-Q156":["新しい機械の使い方に（　）まで、少し時間がかかった。","慣れる","正解は「慣れる」です。「Nに慣れる」の形で使います。「覚える・習う・知る」は「Nを〜」の形なので、「使い方に」とは合いません。"],"N3-Q157":["駅前の道は、夕方になると車で（　）いる。","混んで","正解は「混んで」です。「Nで混んでいる」で、人や車がたくさんいるようすを表します。"],"N3-Q158":["毎月の（　）を計算して、お金をためることにした。","支出","正解は「支出」です。「出ていくお金」という意味です。反対の言葉は「収入」です。"],"N3-Q159":["この部屋は（　）がいいので、冬でも暖かい。","日当たり","正解は「日当たり」です。「日の光がよく入ること」という意味で、「暖かい」と合います。「風通し」は風がよく通ることです。"],"N3-Q160":["会議で出た意見を（　）て、部長に報告した。","まとめ","正解は「まとめ」です。「いくつかのものを一つに整理すること」という意味です。"],"N3-Q161":["このカードは、買い物をするたびにポイントが（　）。","たまる","正解は「たまる」です。「ポイントが」の後なので、自動詞の「たまる」を使います。「ためる」は「ポイントをためる」のように使います。"],"N3-Q162":["台風が近づいているので、窓の外の物を家の中に（　）。","しまった","正解は「しまった」です。「しまう」は「物を決まった場所に入れて片付ける」という意味です。"],"N3-Q163":["この仕事は、かなりきつい。","大変だ","「きつい」に最も意味が近いのは「大変だ」です。体や心に負担が大きいようすを表します。"],"N3-Q164":["彼女はとても賢い。","頭がいい","「賢い」に最も意味が近いのは「頭がいい」です。"],"N3-Q165":["会議はさっそく始まった。","すぐに","「さっそく」に最も意味が近いのは「すぐに」です。時間をおかずに何かを始めるようすを表します。"],"N3-Q166":["明日は必ず来てください。","きっと","「必ず」に最も意味が近いのは「きっと」です。「たぶん」「もしかしたら」は確かではない気持ちを表すので、意味が違います。"],"N3-Q167":["部屋がきちんと片付いている。","きれいに","「きちんと」に最も意味が近いのは「きれいに」です。乱れがなく、整っているようすを表します。"],"N3-Q168":["彼はうそをついた。","本当ではないことを言った","「うそをつく」は「本当ではないことを言う」という意味です。"],"N3-Q169":["「片付ける」の使い方として最もよいものはどれですか。","使った道具は、元の場所に片付けてください。","正解は「使った道具は、元の場所に片付けてください。」です。「片付ける」は「散らかったものを整理する・元の場所に戻す」という意味の動詞で、「Nを片付ける」の形で使います。他の文は「片付ける」の意味に合いません。"],"N3-Q170":["「さっぱり」の使い方として最もよいものはどれですか。","シャワーを浴びて、さっぱりした。","正解は「シャワーを浴びて、さっぱりした。」です。「さっぱり」は「汚れや疲れがとれて、気持ちがいい」ようすを表します。他の文は「さっぱり」の意味に合いません。"],"N3-Q171":["「期限」の使い方として最もよいものはどれですか。","この書類の提出期限は金曜日だ。","正解は「この書類の提出期限は金曜日だ。」です。「期限」は「いつまでにしなければならないか、決められた日時」という意味の名詞です。他の文は「期限」の意味に合いません。"],"N3-Q172":["「めったに」の使い方として最もよいものはどれですか。","彼はめったに仕事を休まない。","正解は「彼はめったに仕事を休まない。」です。「めったに」は後ろに「〜ない」がきて、「ほとんど〜ない」という意味を表します。他の文は「めったに」の意味に合いません。"],"N3-Q173":["「うっかり」の使い方として最もよいものはどれですか。","うっかりして、傘を電車に忘れてしまった。","正解は「うっかりして、傘を電車に忘れてしまった。」です。「うっかり」は「注意が足りなくて、つい何かをしてしまう」ようすを表します。「〜てしまう」とよく一緒に使います。他の文は「うっかり」の意味に合いません。"],"N3-Q174":["「交換」の使い方として最もよいものはどれですか。","古い部品を新しいものと交換した。","正解は「古い部品を新しいものと交換した。」です。「交換」は「ものを取りかえること」という意味で、「AをBと交換する」の形でよく使います。他の文は「交換」の意味に合いません。"],"N3-Q175":["この写真を見る（　）、国の家族を思い出す。","たびに","正解は「たびに」です。「Vるたびに」で「Vするときはいつも」という意味を表します。"],"N3-Q176":["郵便局へ行った（　）、スーパーで買い物をしてきた。","ついでに","正解は「ついでに」です。「Aついでに、B」で「Aをする機会を利用して、Bもする」という意味を表します。"],"N3-Q177":["暗くならない（　）、家に帰りましょう。","うちに","正解は「うちに」です。「〜ないうちに」で「その状態になる前に」という意味を表します。"],"N3-Q178":["天気予報（　）、明日は雪が降るそうだ。","によると","正解は「によると」です。「Nによると、〜そうだ」で、情報の出どころを表します。"],"N3-Q179":["毎朝、日本語のニュースを聞く（　）している。","ように","正解は「ように」です。「Vるようにしている」で「気をつけて、習慣としてVしている」という意味を表します。"],"N3-Q180":["来月から、大阪の工場で働く（　）になった。","こと","正解は「こと」です。「Vることになった」で「（自分ではなく、会社などが）Vすると決めた」という意味を表します。"],"N3-Q181":["あの店はいつも込んでいるから、おいしい（　）。","にちがいない","正解は「にちがいない」です。「〜にちがいない」で、理由をもとに強く確信していることを表します。"],"N3-Q182":["まじめな彼が、約束を忘れる（　）。","はずがない","正解は「はずがない」です。「〜はずがない」で「理由から考えて、絶対にそうではない」という意味を表します。"],"N3-Q183":["電気を（　）まま、寝てしまった。","つけた","正解は「つけた」です。「Vたまま」で「Vした状態を変えないで」という意味を表します。"],"N3-Q184":["日本料理が嫌いな（　）が、毎日食べるのは大変だ。","わけではない","正解は「わけではない」です。「〜わけではない」で「全部がそうだというのではない」という部分的な否定を表します。"],"N3-Q185":["子どもに、野菜をもっと食べて（　）と思っている。","ほしい","正解は「ほしい」です。「（人に）Vてほしい」で、ほかの人にしてもらいたいという希望を表します。"],"N3-Q186":["お金（　）あれば、世界中を旅行したい。","さえ","正解は「さえ」です。「Nさえ〜ば」で「Nという条件があれば、それだけで十分」という意味を表します。"],"N3-Q187":["雨が降った（　）、試合が中止になってしまった。","せいで","正解は「せいで」です。「〜せいで」は悪い結果の原因を表します。「おかげで」はよい結果に使います。"],"N3-Q188":["もし宝くじが当たった（　）、何を買いますか。","としたら","正解は「としたら」です。「もし〜としたら」で、実際には起きていないことを仮定するときに使います。"],"N3-Q189":["ドアに（　）、部屋に入れない。","鍵がかかっているので","正解は「鍵がかかっているので」です。「〜ので」で、部屋に入れない理由を表しています。"],"N3-Q190":["時間が（　）、もう一度確認してください。","あれば","正解は「あれば」です。「〜ば」で「その条件のとき」という意味を表し、後ろのお願いの文と自然につながります。"],"N3-Q191":["この仕事は、経験が（　）できるので、心配いりません。","なくても","正解は「なくても」です。「〜なくても」で「その条件がなくても、結果は変わらない」という意味を表します。"],"N3-Q192":["彼は日本に来て（　）、日本語がとても上手だ。","まだ半年なのに","正解は「まだ半年なのに」です。「〜のに」で「短い期間なのに、予想よりずっと上手だ」という驚きを表します。"],"N3-Q193":["忘れないように、（　）。","メモしておきました","正解は「メモしておきました」です。「Vておく」で「あとのために前もってVする」という意味を表し、「忘れないように」と合います。"],"N3-Q194":["先生が（　）本を、図書館で借りた。","紹介してくださった","正解は「紹介してくださった」です。先生（目上の人）が私のためにしてくれたことなので、「〜てくださる」を使います。「先生が〜ていただいた」は、主語と合いません。"],"N3-Q195":["文章中の［1］に入る最もよいものはどれですか。","より","正解は「より」です。「AはBよりずっと〜」で比べる形です。「ほど」は「Bほど〜ない」のように後ろに否定がきます。"],"N3-Q196":["文章中の［2］に入る最もよいものはどれですか。","そんなとき","正解は「そんなとき」です。体調を崩して困っていた、ちょうどそのときに教えてもらった、という流れです。"],"N3-Q197":["文章中の［3］に入る最もよいものはどれですか。","おかげで","正解は「おかげで」です。教えてもらったことがよい結果（体調を崩さなかった）につながったので、「おかげで」を使います。"],"N3-Q198":["文章中の［4］に入る最もよいものはどれですか。","こともあって","正解は「こともあって」です。「〜こともあって」で、理由の一つをやわらかく表します。"],"N3-Q199":["文章中の［5］に入る最もよいものはどれですか。","あげたい","正解は「あげたい」です。私が後輩のために伝えるので、「Vてあげたい」を使います。"],"N3-Q200":["文章中の［1］に入る最もよいものはどれですか。","しかし","正解は「しかし」です。「毎日勉強している」ことと「集中できない」ことは反対の内容なので、逆接の「しかし」を使います。"],"N3-Q201":["文章中の［2］に入る最もよいものはどれですか。","ことに","正解は「ことに」です。「Vることにする」で、自分で決めたことを表します。"],"N3-Q202":["文章中の［3］に入る最もよいものはどれですか。","います","正解は「います」です。「Vています」で、毎日くり返している習慣を表します。"],"N3-Q203":["文章中の［4］に入る最もよいものはどれですか。","うちに","正解は「うちに」です。「Vているうちに」で「続けている間に、自然に変化が起きた」という意味を表します。"],"N3-Q204":["文章中の［5］に入る最もよいものはどれですか。","つもり","正解は「つもり」です。「Vるつもりです」で、自分の予定や意志を表します。"],"N3-Q205":["ゴミの出し方について、正しいものはどれですか。","収集日の朝8時までに出す","本文に「収集日の朝8時までに出してください」とあります。前の日の夜に出すのはよくないと書かれています。"],"N3-Q206":["ロンさんは明日の朝、まず何をしなければなりませんか。","作業服に着替えて、7時45分までに食堂に行く","「作業服に着替えてから食堂に集まってください」「7時45分から始めます」とあるので、着替えてから7時45分までに食堂に行きます。"],"N3-Q207":["この人が一番言いたいことは何ですか。","少しでもいいから、日記を続けることが大切だ","最後の文に「1行でもいいから続けることが大切だと思っている」と、筆者の考えが書かれています。"],"N3-Q208":["10月1日から社員食堂で食事をするには、どうしなければなりませんか。","前もって社員証にお金を入れておく","「現金は使えなくなり、社員証での支払いだけになります」とあるので、社員証にお金を入れておく必要があります。"],"N3-Q209":["マリさんについて、正しいものはどれですか。","来週の試合には出ないが、応援に行く","「来週のサッカーの試合は休むことにしました。応援には行くつもりです」とあります。"],"N3-Q210":["自分の自転車を処分されたくない人は、どうすればいいですか。","10月15日までに、名前を書いたシールをはる","「使っている自転車には、10月15日までに、名前を書いたシールをはってください」とあります。"],"N3-Q211":["「5S」という名前は、どこから付けられましたか。","五つの言葉のローマ字の頭文字が、すべて「S」だから","本文に「五つの言葉をローマ字で書くと、どれも頭文字が『S』になることから付けられた名前だ」とあります。"],"N3-Q212":["この人が5Sの意味が分かったのは、どうしてですか。","工具が見つからず、作業が遅れたことがあったから","工具が見つからず作業が30分遅れたとき、班長の言葉を聞いて、5Sの意味が分かったと書かれています。"],"N3-Q213":["寮で特に困っていたことは何ですか。","夜7時ごろ、お風呂の前に列ができること","「特に困ったのは、お風呂の時間だった」「夜7時ごろになると、お風呂の前に列ができてしまう」とあります。仕事が終わる時間は「みんな同じ」です。"],"N3-Q214":["話し合いの結果、どうなりましたか。","順番を決めたので、待つ時間がなくなった","曜日ごとの順番表を作ってから「待つ時間がなくなり、けんかもしなくなった」と書かれています。"],"N3-Q215":["この人は、どうしてスマートフォンの使い方を変えましたか。","夜遅くまで動画を見て、次の日の仕事中に眠くなったから","「夜遅くまで動画を見てしまい、次の日の仕事中に眠くなったこともあった。そこで…」と、理由が書かれています。"],"N3-Q216":["使い方を変えた結果、どうなりましたか。","朝すっきり起きられるようになった","最後に「朝もすっきり起きられるようになった」とあります。"],"N3-Q217":["洗濯機を1回使い、乾燥機を1時間使うと、全部でいくらですか。","400円","洗濯機1回が200円、乾燥機は30分100円なので1時間で200円です。合計400円です。"],"N3-Q218":["コインランドリーの使い方として、正しいものはどれですか。","洗剤は自分で用意する","「洗剤は各自で用意してください」とあります。22時以降は使えず、1時間以上そのままの洗濯物は取り出されることがあります。"],"N3-Q219":["平日は18時まで仕事がある人が、仕事を休まずに病院に行けるのはいつですか。","土曜日の午前","平日の受付は16時までなので、18時まで働く人は行けません。日曜日と土曜日の午後は休診です。行けるのは土曜日の午前です。"],"N3-Q220":["午前10時に予約がある人は、どうしなければなりませんか。","9時50分までに受付をする","「予約時間の10分前までに受付をしてください」とあるので、10時の予約なら9時50分までに受付をします。"],"N3-Q221":["実習生はこの後まず何をしますか。","エアコンのフィルターを掃除する","管理人にフィルターの掃除を「今日中に」と頼まれ、実習生は「フィルターはすぐにやります」と答えています。部屋の掃除は週末です。"],"N3-Q222":["社員はこの後まず何をしますか。","資料の数字を確認する","課長が「その前に数字をもう一度確認してくれる？」と言い、社員も「確認してからコピーします」と答えています。"],"N3-Q223":["女の人はこの後まず何をしますか。","ICカードにチャージする","女の人は「先にチャージします」と言っています。ICカードを持っているので、切符は買いません。"],"N3-Q224":["実習生は明日、何を持っていきますか。","帽子","水は会社で用意し、手袋は倉庫のものを使うので、持っていくのは帽子だけです。"],"N3-Q225":["男の人はこの後まず何をしますか。","用紙に新しい住所を書く","係の人は「用紙を書いたら、在留カードと一緒に3番の窓口に出してください」と言っています。まず用紙を書きます。"],"N3-Q226":["男の人はこの後まず何をしますか。","出席するかどうか、みんなにメールで聞く","男の人は「すぐにメールを送ります」と言っています。店への電話は、人数が決まってからです。"],"N3-Q227":["男の人はどうして自転車を買いましたか。","新しい工場に自転車で通うため","「来月から働く工場が変わって、駅から遠くなる」「バスもないから、自転車で通う」と言っています。前の自転車はまだ乗れました。"],"N3-Q228":["女の人はどうして昼ご飯を食べませんでしたか。","会議の資料を作っていたから","「食欲がないわけじゃない」と言っているので、食欲は理由ではありません。「会議の資料がまだできていなくて」が理由です。"],"N3-Q229":["男の人は、何が一番難しいと言っていますか。","聴解","男の人は、漢字と文法は大丈夫だが「聴解がね…」「途中で分からなくなっちゃう」と言っています。"],"N3-Q230":["客はどうしてシャツを交換しますか。","シャツに穴があいていたから","客は「サイズはちょうどいい」と言い、「小さい穴があいていて」と理由を説明しています。"],"N3-Q231":["社員はどうして来週休みますか。","日本に来る兄に京都を案内するため","社員は「国に帰る」のではなく、「兄が日本に遊びに来る」「京都を案内しようと思って」と答えています。"],"N3-Q232":["二人はどうして今日、映画を見に行くのをやめましたか。","席がいっぱいだったから","女の人が「今日の分はもう席がいっぱいなんだって」と言っています。"],"N3-Q233":["会社で、先輩に仕事のやり方を聞きたいです。先輩は忙しそうです。何と言いますか。","今、ちょっとよろしいですか。","忙しそうな人に話しかけるときは「今、ちょっとよろしいですか」と、まず相手の都合を聞くのが自然です。"],"N3-Q234":["仕事が終わって、先に帰ります。まだ働いている人に何と言いますか。","お先に失礼します。","職場で先に帰るときは「お先に失礼します」と言います。「お邪魔しました」は人の家から帰るときに使います。"],"N3-Q235":["お客様を長い時間待たせてしまいました。何と言いますか。","大変お待たせいたしました。","相手を待たせたときは「大変お待たせいたしました」とおわびを言います。"],"N3-Q236":["同僚の電話番号を知りたいです。何と言いますか。","電話番号を教えてもらえませんか。","相手に何かをお願いするときは「Vてもらえませんか」を使います。「教えてあげましょうか」は、自分が教えるという意味です。"],"N3-Q237":["「すみません、この席、空いていますか。」と言われました。何と答えますか。","はい、どうぞ。","席が空いているか聞かれたら「はい、どうぞ」と答えるのが自然です。"],"N3-Q238":["「明日の飲み会、行けそう？」と言われました。何と答えますか。","ごめん、明日はちょっと用事があって。","これから行けるかどうかを聞かれているので、「用事があって」と行けない理由を伝えるのが自然です。"],"N3-Q239":["「このペン、ちょっとお借りしてもいいですか。」と言われました。何と答えますか。","ええ、どうぞ使ってください。","物を借りたいと言われたので、「どうぞ使ってください」と貸すのが自然です。「お借りします」は借りる人が言う言葉です。"],"N3-Q240":["「最近、元気がないね。何かあった？」と言われました。何と答えますか。","実は、仕事でミスが続いて、落ち込んでいるんです。","心配して理由を聞かれているので、「実は〜」と理由を話すのが自然です。"],"N3-Q241":["「会議、何時からでしたっけ？」と言われました。何と答えますか。","2時からですよ。","会議が始まる時間を聞かれているので、「2時からですよ」と答えます。"],"N3-Q242":["「すみません、もう一度言っていただけますか。」と言われました。何と答えますか。","はい、もう一度説明しますね。","もう一度言ってほしいと頼まれているので、「もう一度説明しますね」と答えるのが自然です。"],"N3-Q243":["「よかったら、今度一緒にご飯でもどうですか。」と言われました。何と答えますか。","いいですね。ぜひ行きましょう。","食事にさそわれているので、「いいですね。ぜひ」と受けるのが自然です。"],"N3-Q244":["「この荷物、どこに置いたらいいですか。」と言われました。何と答えますか。","あ、そこの机の上にお願いします。","置く場所を聞かれているので、「そこの机の上にお願いします」と場所を答えます。"],"N3-Q245":["ハンさんが日本に来たばかりのころ、同じミスを何度もしたのはなぜですか。","意味が分からないのに「はい」と答えていたから","「意味が分からないまま『はい』と答えてしまい、同じミスを何度もしました」とあります。"],"N3-Q246":["班長に言われたあと、ハンさんはどうするようにしましたか。","分からない言葉は、その場で聞くようにした","「それからは、分からない言葉があったら、その場で聞くようにしました」とあります。日本語教室は2年目からの話です。"],"N3-Q247":["ハンさんが日本語教室で気づいたことは何ですか。","日本語は、人とつながるための道具でもある","「日本語は、仕事のためだけでなく、人とつながるための道具なのだと気づきました」とあります。"],"N3-Q248":["ハンさんがアリさんに一番伝えたいことは何ですか。","分からないことをそのままにせず、仕事以外の時間も大切にしてほしい","手紙の最後に「分からないことをそのままにしないでください。そして、仕事以外の時間も大切にしてください」とあります。"],"N3-Q249":["筆者が日本の職場で一番驚いたことは何ですか。","あいさつが多いこと","最初に「一番驚いたのは、あいさつの多さだった」とあります。"],"N3-Q250":["日本に来てしばらくの間、筆者はあいさつについてどう感じていましたか。","知らない人にあいさつをするのが少し恥ずかしかった","「日本に来てしばらくは、知らない人にあいさつをするのが少し恥ずかしかった」とあります。"],"N3-Q251":["筆者の考え方が変わったきっかけは何ですか。","落ち込んでいた朝に、別のラインの人が声をかけてくれたこと","ミスをして落ち込んでいた朝に、別のラインの人が「昨日は大変だったね」と声をかけてくれたことがきっかけです。"],"N3-Q252":["筆者は、あいさつについてどう考えていますか。","相手を気にしていることを伝え、職場の雰囲気を作る大切なものだ","あいさつは「あなたのことを気にしていますよ」と伝える方法で、「職場の雰囲気を作る大切なこと」だと書かれています。"],"N3-Q253":["筆者が、最初はスーパーでばかり買い物をしていたのはなぜですか。","安くて品物が多く、店員と話さなくても買えたから","「値段が安く、品物も多いし、店員と話さなくても買い物ができる」ので便利だったと書かれています。"],"N3-Q254":["筆者が初めて商店街の八百屋に行ったのはなぜですか。","スーパーが休みだったから","「スーパーが休みだったので、しかたなく商店街の八百屋に行った」とあります。"],"N3-Q255":["商店街で買い物をするようになって、筆者にはどんな変化がありましたか。","日本語が少しずつ上手になった","「商店街で買い物をするようになってから、私の日本語は少しずつ上手になった」とあります。スーパーに行かなくなったとは書かれていません。"],"N3-Q256":["筆者にとって、商店街はどんな場所ですか。","人と出会える場所","最後に「商店街は、ただ物を買う場所ではなく、人と出会える場所になっている」とあります。安さではスーパーのほうがいいと書かれています。"],"N3-Q257":["課長は何について話していますか。","工場に入る場所が変わること","正門が工事で使えなくなり、東側の通用口から入るという話です。駐車場の場所は変わりません。"],"N3-Q258":["男の人が一番言いたいことは何ですか。","簡単なものでもいいから、朝ご飯を食べたほうがいい","最後に「簡単なものでいいので、何か口に入れるようにしましょう」と言っています。これが一番言いたいことです。"],"N3-Q259":["管理人は何について話していますか。","ゴミを出す日が変わること","燃えないゴミが月1回になり、ペットボトルが毎週出せるようになる、というゴミを出す日の変更の話です。"],"N3-Q260":["男の人はお花見についてどう考えていますか。","少しだけなら行く","男の人は試験があると言いましたが、最後に「夕方ちょっとだけ行こうかな」と言っています。"],"N3-Q261":["女の人は何について話していますか。","熱中症に気をつけること","熱中症は家の中でもなることがあるので、水分をとり、部屋の温度に気をつけるように、という話です。"],"N3-Q262":["先輩が一番伝えたいことは何ですか。","速さより、安全に作業することを大切にしてほしい","「けがをしないことが一番大切」「最初はゆっくりでいいので、手順を守って、安全に作業してください」と言っています。"],"N3-Q263":["市民は市の【方針】に反対した。\n「方針」の読み方はどれですか。","ほうしん","「方針」は「ほうしん」と読みます。「基本の考え方・方向性」という意味です。"],"N3-Q264":["この問題には【共通】の原因がある。\n「共通」の読み方はどれですか。","きょうつう","「共通」は「きょうつう」と読みます。「二つ以上に共に当てはまること」という意味です。"],"N3-Q265":["台風の【影響】で、電車が止まった。\n「影響」の読み方はどれですか。","えいきょう","「影響」は「えいきょう」と読みます。「あるものが他のものに作用すること」という意味です。"],"N3-Q266":["彼の意見は【極端】すぎると思う。\n「極端」の読み方はどれですか。","きょくたん","「極端」は「きょくたん」と読みます。「普通からかけ離れていること」という意味です。"],"N3-Q267":["その計画には【疑問】が残る。\n「疑問」の読み方はどれですか。","ぎもん","「疑問」は「ぎもん」と読みます。「はっきりせず、疑わしいこと」という意味です。"],"N3-Q268":["新しい制度が【導入】された。\n「導入」の読み方はどれですか。","どうにゅう","「導入」は「どうにゅう」と読みます。「新しいものを取り入れること」という意味です。"],"N3-Q269":["彼女は仕事に【誇り】を持っている。\n「誇り」の読み方はどれですか。","ほこり","「誇り」は「ほこり」と読みます。「自分の価値を信じて満足に思う気持ち」という意味です。"],"N3-Q270":["会社の【損失】は予想より大きかった。\n「損失」の読み方はどれですか。","そんしつ","「損失」は「そんしつ」と読みます。「失うこと、失った分」という意味です。"],"N3-Q271":["この製品は【耐久】性が高い。\n「耐久」の読み方はどれですか。","たいきゅう","「耐久」は「たいきゅう」と読みます。「長い間、壊れずにもつこと」という意味です。"],"N3-Q272":["彼は自分の【欠点】をよく知っている。\n「欠点」の読み方はどれですか。","けってん","「欠点」は「けってん」と読みます。「足りないところ、悪いところ」という意味です。"],"N3-Q273":["この地域はさいがいが多い。\n「さいがい」を漢字で書くとき、最もよいものはどれですか。","災害","「さいがい」は「災害」と書きます。「地震や台風などによる被害」という意味です。"],"N3-Q274":["この薬にはふくさようがある。\n「ふくさよう」を漢字で書くとき、最もよいものはどれですか。","副作用","「ふくさよう」は「副作用」と書きます。「薬などの、本来の目的以外の作用」という意味です。"],"N3-Q275":["会社のぎむを果たす。\n「ぎむ」を漢字で書くとき、最もよいものはどれですか。","義務","「ぎむ」は「義務」と書きます。「しなければならないこと」という意味です。"],"N3-Q276":["新しい薬のこうかを調べる。\n「こうか」を漢字で書くとき、最もよいものはどれですか。","効果","「こうか」は「効果」と書きます。「よい結果として現れる働き」という意味です。"],"N3-Q277":["彼はせきにんかんが強い。\n「せきにん」を漢字で書くとき、最もよいものはどれですか。","責任","「せきにん」は「責任」と書きます。「自分が引き受けてやるべき務め」という意味です。"],"N3-Q278":["この機械はこしょうしやすい。\n「こしょう」を漢字で書くとき、最もよいものはどれですか。","故障","「こしょう」は「故障」と書きます。「機械などが正しく動かなくなること」という意味です。"],"N3-Q279":["彼の話にはこんきょがない。\n「こんきょ」を漢字で書くとき、最もよいものはどれですか。","根拠","「こんきょ」は「根拠」と書きます。「考えや意見のもとになるもの」という意味です。"],"N3-Q280":["問題をかいけつする方法を考える。\n「かいけつ」を漢字で書くとき、最もよいものはどれですか。","解決","「かいけつ」は「解決」と書きます。「問題をうまく処理して終わらせること」という意味です。"],"N3-Q281":["環境をほごすることが大切だ。\n「ほご」を漢字で書くとき、最もよいものはどれですか。","保護","「ほご」は「保護」と書きます。「危険なものから守ること」という意味です。"],"N3-Q282":["彼は会社のけいえいを任されている。\n「けいえい」を漢字で書くとき、最もよいものはどれですか。","経営","「けいえい」は「経営」と書きます。「会社などを管理し、運営すること」という意味です。"],"N3-Q283":["この会社は、社員の意見を（　）する制度がある。","尊重","正解は「尊重」です。「意見を尊重する」で「相手の考えを大切にして認める」という意味になります。"],"N3-Q284":["急いでいたので、確認を（　）まま出発してしまった。","せずに","正解は「せずに」です。「Vずに」で「Vしないで」という意味を表します。"],"N3-Q285":["彼の説明は（　）で、誰にでも分かりやすい。","明確","正解は「明快」です。「明快」は「話がはっきりしていて分かりやすいこと」を表します。"],"N3-Q286":["この報告書には、いくつかの（　）がある。","誤り","正解は「誤り」です。文書の中の「間違っている部分」を指すときによく使われる言葉です。"],"N3-Q287":["彼女は忙しい（　）、いつも笑顔だ。","にもかかわらず","正解は「にもかかわらず」です。「〜にもかかわらず」で「〜という状況なのに」という逆接を表します。"],"N3-Q288":["その意見には、一部（　）できない点がある。","納得","正解は「納得」です。「納得できない」で「理由を聞いても心から受け入れられない」という意味になります。"],"N3-Q289":["この機械の操作には、特別な（　）が必要だ。","技術","正解は「技術」です。「操作に必要な技術」のように、特定の作業のための専門的な力を表します。"],"N3-Q290":["彼の提案は、コストの面で（　）がある。","問題","正解は「問題」です。「コストの面で問題がある」で「費用の点でよくない部分がある」という意味になります。"],"N3-Q291":["この地域は、人口が年々（　）している。","減少","正解は「減少」です。「人口が減少する」で「人口の数が少なくなる」という意味になります。反対は「増加」です。"],"N3-Q292":["彼女の意見に、多くの人が（　）した。","共感","正解は「共感」です。「共感する」で「他人の気持ちや考えに、自分もそうだと感じること」を表します。"],"N3-Q293":["この会社では、社員の健康を（　）した取り組みを行っている。","重視","正解は「重視」です。「Nを重視する」で「Nを特に大切なものとして扱う」という意味を表します。"],"N3-Q294":["この資料はとても詳細だ。","細かい","「詳細」に最も意味が近いのは「細かい」です。どちらも「くわしいこと」を表します。"],"N3-Q295":["彼はいつも冷静に判断する。","落ち着いて","「冷静に」に最も意味が近いのは「落ち着いて」です。どちらも「感情に流されない様子」を表します。"],"N3-Q296":["この件について、彼はかなり詳しい。","よく知っている","「詳しい」に最も意味が近いのは「よく知っている」です。"],"N3-Q297":["彼の計画はとても大胆だ。","思い切っている","「大胆」に最も意味が近いのは「思い切っている」です。どちらも「恐れずに思い切ってやる様子」を表します。"],"N3-Q298":["その方法は非常に効率的だ。","むだが少ない","「効率的」に最も意味が近いのは「むだが少ない」です。少ない労力で多くの成果を得られる様子を表します。"],"N3-Q299":["彼女の説明はあいまいだった。","はっきりしなかった","「あいまい」に最も意味が近いのは「はっきりしなかった」です。"],"N3-Q300":["この機械の操作は複雑ではない。","単純だ","「複雑ではない」に最も意味が近いのは「単純だ」です。"],"N3-Q301":["彼はその意見に強く反発した。","反対した","「反発した」に最も意味が近いのは「反対した」です。"],"N3-Q302":["その情報はまだ不確かだ。","はっきりしていない","「不確か」に最も意味が近いのは「はっきりしていない」です。"],"N3-Q303":["この地域は工業がさかんだ。","活発だ","「さかん」に最も意味が近いのは「活発だ」です。「活発に行われている様子」を表します。"],"N3-Q304":["「見直す」の使い方として最もよいものはどれですか。","予算を見直すことになった。","正解は「予算を見直すことになった。」です。「見直す」は「もう一度検討し、改善する」という意味の動詞で、「Nを見直す」の形で使います。"],"N3-Q305":["「取り組む」の使い方として最もよいものはどれですか。","彼は新しい課題に取り組んでいる。","正解は「彼は新しい課題に取り組んでいる。」です。「取り組む」は「真剣に物事に向かうこと」という意味の動詞で、「Nに取り組む」の形で使います。"],"N3-Q306":["「省く」の使い方として最もよいものはどれですか。","説明の一部を省いて話した。","正解は「説明の一部を省いて話した。」です。「省く」は「不要な部分を取り除くこと」という意味の動詞で、「Nを省く」の形で使います。"],"N3-Q307":["「見上げる」の使い方として最もよいものはどれですか。","空を見上げると星が見えた。","正解は「空を見上げると星が見えた。」です。「見上げる」は「上の方を見ること」という意味の動詞で、「Nを見上げる」の形で使います。"],"N3-Q308":["「差し支える」の使い方として最もよいものはどれですか。","寝不足は仕事に差し支える。","正解は「寝不足は仕事に差し支える。」です。「差し支える」は「都合が悪くなる、支障が出る」という意味の動詞で、「Nに差し支える」の形で使います。"],"N3-Q309":["「見込む」の使い方として最もよいものはどれですか。","今年は売り上げの増加を見込んでいる。","正解は「今年は売り上げの増加を見込んでいる。」です。「見込む」は「これから先のことをあらかじめ予想すること」という意味の動詞です。"],"N3-Q310":["「見なす」の使い方として最もよいものはどれですか。","連絡がなければ欠席と見なします。","正解は「連絡がなければ欠席と見なします。」です。「見なす」は「そのようなものとして扱うこと」という意味の動詞で、「NをMと見なす」の形で使います。"],"N3-Q311":["「心得る」の使い方として最もよいものはどれですか。","彼は仕事の基本を心得ている。","正解は「彼は仕事の基本を心得ている。」です。「心得る」は「よく理解して身につけていること」という意味の動詞です。"],"N3-Q312":["「割り込む」の使い方として最もよいものはどれですか。","列に割り込むのはマナー違反だ。","正解は「列に割り込むのはマナー違反だ。」です。「割り込む」は「順番などの間に無理に入ること」という意味の動詞です。"],"N3-Q313":["「持ちこたえる」の使い方として最もよいものはどれですか。","会社は不況をなんとか持ちこたえた。","正解は「会社は不況をなんとか持ちこたえた。」です。「持ちこたえる」は「厳しい状況でも、崩れずに耐えること」という意味の動詞です。"],"N3-Q314":["新しい事務所は、駅から近い（　）、家賃も手ごろだ。","うえに","正解は「うえに」です。「Aうえに、B」で「Aに加えてBも」という意味を表します。"],"N3-Q315":["彼は忙しい（　）、毎日運動している。","にもかかわらず","正解は「にもかかわらず」です。「〜にもかかわらず」で逆接を表します。"],"N3-Q316":["明日の会議に部長が出席する（　）しないかは、まだ聞いていない。","か","正解は「か」です。「AかBか」で「どちらか分からない」という不確かさを表します。"],"N3-Q317":["社長の指示（　）、作業を進めてください。","に従って","正解は「に従って」です。「Nに従って」で「Nの通りに」という意味を表します。"],"N3-Q318":["時間（　　）あれば、もう一度最初から見直したい。","さえ","正解は「さえ」です。「Nさえ〜ば」で「Nがあれば十分」という意味を表します。"],"N3-Q319":["この国の経済は、天候（　）、大きく左右される。","次第で","正解は「次第で」です。「Nしだいで」で「Nの状況によって結果が変わる」という意味を表します。"],"N3-Q320":["田中さんは英語（　）、フランス語も話せる。","はもちろん","正解は「はもちろん」です。「Aはもちろん、Bも」で「Aは当然、それに加えてBも」という意味を表します。"],"N3-Q321":["新商品は、来月の展示会（　）準備を進めています。","に向けて","正解は「に向けて」です。「Nに向けて」で「Nという目標をめざして」という意味を表します。"],"N3-Q322":["彼の部屋は、片付けても片付けても（　）散らかる。","すぐ","正解は「すぐ」です。「すぐ散らかる」で「片付けた後、短い時間で元に戻ってしまう」という状況を表します。"],"N3-Q323":["彼女は反対意見（　）、自分の考えをはっきり述べた。","をものともせず","正解は「をものともせず」です。「Nをものともせず」で「Nという困難があっても気にせず」という意味を表します。"],"N3-Q324":["彼の話し方は丁寧な（　）、少し回りくどく感じることもある。","だけに","正解は「だけに」です。「Aだけに、B」で「Aという理由から、当然Bという結果になる」という意味を表します。"],"N3-Q325":["
