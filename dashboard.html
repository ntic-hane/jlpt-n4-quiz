":["この人は、今日どんな一日を過ごしましたか。","部屋の掃除をして、すっきりした気持ちになった","「一日中部屋を掃除した」「心もすっきりした気がする」とあります。"],"N3-Q367":["来月から、どうなりますか。","うどんがなくなり、チャーハンが増える","「うどんは終了し、新たにチャーハンを追加します」とあります。"],"N3-Q368":["この人は、電話について今どう思っていますか。","緊張するが、少しずつ慣れたい","「電話は対面で話すより緊張するが、少しずつ慣れていきたい」とあります。"],"N3-Q369":["9月22日、自転車はどこに置けばいいですか。","裏門横の臨時駐輪場","9月22日は工事期間中なので、「裏門横の臨時駐輪場」を利用します。"],"N3-Q370":["この人が「やる気が出た」のは、なぜですか。","班長にほめられたから","「班長に『最近、作業が丁寧になったね』と言われた」「うれしくて」とあります。"],"N3-Q371":["「ヒヤリハット」とは、どのようなことですか。","事故には至らなかったが、危険を感じた出来事","「事故には至らなかったが、『ヒヤリ』としたり『ハッ』とした危険な出来事」と説明されています。"],"N3-Q372":["この人が報告をした後、どうなりましたか。","翌日、その場所に注意の表示が貼られた","「翌日には、その場所に注意の表示が貼られていた」とあります。"],"N3-Q373":["この人は、なぜ休暇の申請をためらっていましたか。","周りに迷惑をかけると思っていたから","「周りに迷惑をかけるのではないかと思い、なかなか申請できずにいた」とあります。"],"N3-Q374":["班長に相談した後、この人はどう感じましたか。","同僚のフォローを知り、ありがたく感じた","「同僚がフォローしてくれていたと後から知り、とてもありがたく思った」とあります。"],"N3-Q375":["この人が最初に不思議だと思ったのは、どんなことですか。","コンビニの商品が季節ごとに大きく変わること","「なぜこんなに頻繁に変えるのだろう」と不思議だったとあります。"],"N3-Q376":["この人は、今コンビニについてどう感じていますか。","季節の変化を感じられて楽しい","「季節の変化を感じられるのが楽しみの一つになっている」とあります。"],"N3-Q377":["この人は、医者に何と言われましたか。","生活習慣を見直したほうがいい","「今すぐ薬が必要なほどではないが、生活習慣を見直したほうがいい」とあります。"],"N3-Q378":["この人は、今何をしていますか。","階段を使い、塩分を控えている","「なるべく階段を使い、塩分の多い食事を控えるようにしている」とあります。"],"N3-Q379":["この寮の食事会は、どのようなものですか。","それぞれが自分の国の料理を一品持ち寄る会","「それぞれが自分の国の料理を一品ずつ作って持ってくる」とあります。"],"N3-Q380":["この人は、食事会を通してどう感じましたか。","料理を通して分かり合えることがある","「言葉があまり通じなくても、料理を通して分かり合えることがある」とあります。"],"N3-Q381":["この人が班長に提案したのは、どんなことですか。","作業の手順を変えること","「この順番を変えたらどうでしょうか」と提案したとあります。"],"N3-Q382":["提案の結果、どうなりましたか。","作業時間が短くなり、正式な方法になった","「実際にやってみると、確かに作業時間が短くなった」「正式なやり方として採用されている」とあります。"],"N3-Q383":["この相談会について、正しいものはどれですか。","予約なしで参加できる","「予約不要、直接お越しください」とあります。"],"N3-Q384":["通訳をお願いしたい人は、どうすればいいですか。","前日までに電話で連絡する","「通訳が必要な方は、前日までにお電話でご連絡ください」とあります。"],"N3-Q385":["小学生の子どもと大人二人で行く場合、料金はいくらですか。","1200円","大人500円×2人＝1000円、子ども200円で、合計1200円です。"],"N3-Q386":["月曜日が祝日の場合、休館日はいつですか。","火曜日","「休館日：毎週月曜日（祝日の場合は翌日）」とあるので、火曜日が休館日になります。"],"N3-Q387":["N3クラスに途中から参加したい人は、どうすればいいですか。","事前にセンターに連絡する","「途中からの参加も可能ですが、事前にセンターまでご連絡ください」とあります。"],"N3-Q388":["テキストについて、正しいものはどれですか。","センターでも購入できる","「テキストは各自でご用意ください（センターでも販売しています）」とあります。"],"N3-Q389":["携帯電話をなくしてしまった場合、どうすればいいですか。","すぐに総務部に届け出る","「紛失・破損した場合は、速やかに総務部へ届け出てください」とあります。"],"N3-Q390":["利用料金について、正しいものはどれですか。","上限を超えた分は自分で払う","「上限を超えた分は自己負担となります」とあります。"],"N3-Q391":["来月から、朝食はいつ食べられますか。","6:30から8:00まで","「朝食提供時間を6:30〜8:00に変更します」とあります。"],"N3-Q392":["食堂への要望は、どうすればいいですか。","食堂入口の意見箱に入れる","「ご要望があれば、食堂入口の意見箱にお入れください」とあります。"],"N3-Q393":["9月13日に、この店で買い物はできますか。","できない。休業期間中だから","休業期間は9月10日から16日までなので、9月13日は買い物できません。"],"N3-Q394":["新しい店は、どこにありますか。","現在の場所から徒歩5分の「みなと通り3丁目」","「新店舗は、現在の場所から徒歩5分の『みなと通り3丁目』に移転します」とあります。"],"N3-Q395":["このアンケートについて、正しいものはどれですか。","所要時間は約3分だ","「所要時間は約3分です」とあります。"],"N3-Q396":["この人は、病院に行ってどう感じましたか。","一人でもなんとかなると、自信がついた","「一人でもなんとかなるものだと、少し自信がついた」とあります。"],"N3-Q397":["非常用持ち出し袋について、何をしなければなりませんか。","月に一度、中身の消費期限を確認する","「中身の消費期限を、月に一度確認してください」とあります。"],"N3-Q398":["この人が最初に感じていたことは何ですか。","時間に厳しすぎるのではないかということ","「そこまで厳しくしなくても」と感じていたとあります。"],"N3-Q399":["この人の考えが変わったのは、なぜですか。","自分の遅刻が同僚に影響したから","「自分が3分遅刻したことで、次の工程の同僚を待たせてしまった」ことがきっかけです。"],"N3-Q400":["この人が最初、提案をしなかったのはなぜですか。","どうせ変わらないだろうと思っていたから","「どうせ変わらないだろうと思い、提案したことがなかった」とあります。"],"N3-Q401":["この人が提案するようになったきっかけは何ですか。","同僚の提案が採用され、作業が楽になったのを見たこと","同僚の提案が採用され作業が楽になったのを見て、自分も提案してみたとあります。"],"N3-Q402":["タイ語の通訳を希望する場合、どうすればいいですか。","事前に連絡する","「その他の言語は要事前連絡」とあるので、タイ語も事前連絡が必要です。"],"N3-Q403":["この相談会は、どのくらいの頻度で開かれますか。","月に2回","「第2・第4土曜日」とあるので、月に2回開かれます。"],"N3-Q404":["「やさしい日本語」とは、どのようなものですか。","難しい言葉を避け、外国人にも分かりやすくした日本語","第1段落に「難しい言葉や複雑な言い回しを避け、外国人にも分かりやすいように工夫された日本語のこと」と説明されています。"],"N3-Q405":["「やさしい日本語」が広まるきっかけとなった出来事は何ですか。","阪神・淡路大震災で、外国人の避難が遅れたこと","第2段落に「1995年の阪神・淡路大震災」で「避難が遅れたことが問題になった」とあります。"],"N3-Q406":["「やさしい日本語」のルールとして、本文に挙げられていないものはどれですか。","敬語を増やすこと","第3段落には「一文を短く」「二重否定を避ける」「擬音語・擬態語を減らす」「ふりがなをつける」が挙げられていますが、敬語についての記述はありません。"],"N3-Q407":["「至急ご対応願います」を「やさしい日本語」にすると、どうなりますか。","すぐに　しごとを　してください","第3段落の例に「『至急ご対応願います』ではなく『すぐに　しごとを　してください』のように書き換える」とあります。"],"N3-Q408":["「やさしい日本語」に対する批判的な意見として、本文に挙げられているのはどれですか。","日本語を簡単にするのは失礼ではないかという意見","第4段落に「日本語を簡単にするのは失礼ではないか」という意見があると書かれています。"],"N3-Q409":["この文章全体で、筆者が最も伝えたいことは何ですか。","「やさしい日本語」は多くの人に情報を届けるための工夫であるということ","最終段落で「難しい言葉を減らすことは、相手を見下すことではなく、より多くの人に情報を届けるための工夫なのだ」とまとめられています。"],"N3-Q410":["実習生はこの後まず何をしますか。","荷物を倉庫に運ぶ","班長が「その前に、荷物を倉庫に運んでもらえますか」と頼み、実習生も「先に荷物を運びます」と答えています。"],"N3-Q411":["部下はこの後まず何をしますか。","参加者リストを作る","上司が「参加者リストを作って、メールで送ってください」と頼み、部下は「今からすぐに作ります」と答えています。"],"N3-Q412":["実習生はこの後まず何をしますか。","参加者名簿を作る","実習生は「名簿を作ってから、案内を貼ります」と言っています。"],"N3-Q413":["アルバイトはこの後まず何をしますか。","お客様の対応をする","店長が「先にお客様が来たので、そちらの対応をお願いします」と言い、アルバイトも「まずお客様の対応をします」と答えています。"],"N3-Q414":["男の人はこの後まず何をしますか。","資料の数字を直す","女の人が「数字を直してから印刷してください」と頼み、男の人も「まず数字を直します」と答えています。"],"N3-Q415":["実習生はこの後まず何をしますか。","総務で作業服をもらう","班長が作業服の交換を先に頼み、実習生も「先に総務に行きます」と答えています。"],"N3-Q416":["患者はこの後まず何をしますか。","問診票に記入する","看護師が「先に書いていただけますか」と頼み、患者も「書きます」と答えています。"],"N3-Q417":["社員はこの後まず何をしますか。","メールの文面を部長に見せる","部長が「今すぐ見せてください」と言い、社員も「今持ってきます」と答えています。"],"N3-Q418":["実習生はこの後まず何をしますか。","部屋の荷物を端に寄せる","管理人が荷物を寄せておくよう頼み、実習生も「休みの前に片付けておきます」と答えています。"],"N3-Q419":["社員はこの後まず何をしますか。","予算を見直す","課長が予算の確認を頼み、社員も「予算を見直してから送ります」と答えています。"],"N3-Q420":["女の人はこの後まず何をしますか。","紛失届に記入する","駅員が「まず、こちらの紛失届に必要事項を記入してください」と言っています。"],"N3-Q421":["男の人はこの後まず何をしますか。","お茶を用意する","女の人がお茶の用意を頼み、男の人も「すぐにお茶を用意します」と答えています。"],"N3-Q422":["実習生はこの後まず何をしますか。","工具を洗って戻す","班長が工具の片付けを頼み、実習生も「工具を洗ってから、お昼にします」と答えています。"],"N3-Q423":["社員はこの後まず何をしますか。","部長のデザイン確認を待つ","社員は「確認していただいてから発注します」と言っており、部長の確認を待ちます。"],"N3-Q424":["女の人はこの後まず何をしますか。","班長にシフト交換の連絡をする","女の人は「先にシフトの交換をお願いしたくて、班長に連絡しないと」「そうする」と言っています。"],"N3-Q425":["二人は、なぜ行き先を変えましたか。","台風が多い時期だと分かったから","男の人が「その時期は台風が多いらしくて」と理由を説明しています。"],"N3-Q426":["発売が延期になったのはなぜですか。","部品に不具合が見つかったから","社員が「部品の一部に不具合が見つかりまして」と理由を説明しています。"],"N3-Q427":["男の人は、なぜ元気がないのですか。","父親が入院したと聞いたから","男の人が「父が入院したって聞いて。心配で」と理由を話しています。"],"N3-Q428":["女の人は、なぜ飲み会に行かないのですか。","試験の勉強をしたいから","女の人が「来週の試験の勉強がまだ終わっていなくて」と理由を話しています。"],"N3-Q429":["会議の時間が変更になったのは、なぜですか。","取引先の担当者の到着が遅れるから","課長が「取引先の担当者が、電車の遅延で到着が遅れるそうなんです」と理由を説明しています。"],"N3-Q430":["男の人は、なぜ新しい靴を買いましたか。","前の靴の底がすり減って危なかったから","男の人が「底がすり減っちゃって。滑りやすくて危なかった」と理由を話しています。"],"N3-Q431":["プロジェクトが成功したのは、なぜですか。","みんなが最後まで協力したから","男の人が「みんなが最後まで協力してくれたおかげです」と理由を話しています。"],"N3-Q432":["女の人は、なぜ日本語の勉強を始めましたか。","N3に合格すれば給料が上がると聞いたから","女の人が「N3に合格すれば、給料が少し上がるって聞いて」と理由を話しています。"],"N3-Q433":["出張が中止になったのは、なぜですか。","先方の会議が来月に延期になったから","部長が「先方の都合で、会議自体が来月に延期になった」と理由を説明しています。"],"N3-Q434":["女の人は、なぜ引っ越しを考えていますか。","隣の部屋の音がうるさくて眠れないから","女の人が「隣の部屋の音がうるさくて、夜あまり眠れない」と理由を話しています。"],"N3-Q435":["男の人は、なぜ昇進しましたか。","システム導入プロジェクトの成功が評価されたから","男の人が「新しいシステムの導入プロジェクトが、うまくいったことが評価された」と話しています。"],"N3-Q436":["会議が予定より長くなったのは、なぜですか。","新しい提案にいろいろな意見が出たから","男の人が「いろいろな意見が出て、なかなかまとまらなかった」と理由を話しています。"],"N3-Q437":["男の人は、なぜ国に帰ることになりましたか。","実習期間が終わるから","男の人が「実習期間が終わるんだ」と理由を話しています。"],"N3-Q438":["今月の売り上げが下がったのは、なぜですか。","連休で営業日が少なかったから","社員が「大型連休があった影響で、営業日が少なかった」と理由を話しています。"],"N3-Q439":["同僚が新しいプロジェクトのリーダーに選ばれました。何と言いますか。","おめでとうございます。頑張ってください。","良いことがあった人には「おめでとうございます」と祝福するのが自然です。"],"N3-Q440":["取引先との約束の時間に、少し遅れそうです。電話で何と言いますか。","申し訳ございません、少し遅れそうです。","遅れそうなときは、事前に「申し訳ございません、遅れそうです」と連絡するのが自然です。"],"N3-Q441":["先輩が、重い荷物を一人で運ぼうとしています。何と言いますか。","お持ちしましょうか。","誰かが大変そうなときは「お持ちしましょうか」と手伝いを申し出るのが自然です。"],"N3-Q442":["会議室に入るとき、すでに他の人たちが話し合いを始めていました。何と言いますか。","失礼します。","部屋に入るときは「失礼します」と言うのが自然です。「お邪魔しました」は出るときに使います。"],"N3-Q443":["同僚が仕事のミスで落ち込んでいます。何と言いますか。","誰にでもあることですよ。気にしないで。","落ち込んでいる人には、励ましの言葉をかけるのが自然です。"],"N3-Q444":["お客様に、担当者が席を外していると伝えたいです。何と言いますか。","申し訳ございません、ただいま席を外しております。","担当者が不在のときは「ただいま席を外しております」と丁寧に伝えます。"],"N3-Q445":["先輩から仕事のコツを教えてもらいました。何と言いますか。","ありがとうございます。参考になります。","何かを教えてもらったときは「ありがとうございます」とお礼を言うのが自然です。"],"N3-Q446":["駅で、切符の買い方が分からず困っている外国人観光客を見かけました。何と言いますか。","何かお手伝いしましょうか。","困っている人を見かけたときは「何かお手伝いしましょうか」と声をかけるのが自然です。"],"N3-Q447":["上司に、資料の作成が予定より遅れることを伝えなければなりません。何と言いますか。","申し訳ありません、資料の完成が少し遅れそうです。","予定が遅れるときは、早めに謝りながら状況を伝えるのが自然です。"],"N3-Q448":["後輩が、初めて一人で取引先に行くことになり、緊張しています。何と言いますか。","大丈夫、きっとうまくいくよ。","緊張している人には、励ましの言葉をかけるのが自然です。"],"N3-Q449":["「今日中にこの資料、まとめておいてもらえますか。」と言われました。何と答えますか。","はい、分かりました。","依頼を受けるときは「分かりました」と答えるのが自然です。"],"N3-Q450":["「日本の生活には、もう慣れましたか。」と聞かれました。何と答えますか。","はい、おかげさまで、だいぶ慣れました。","近況を聞かれたときは「おかげさまで」と答えるのが自然です。"],"N3-Q451":["「このデータ、確認していただけましたか。」と聞かれました。まだ確認していません。何と答えますか。","すみません、まだなんです。今すぐ確認します。","まだできていないときは、正直に伝え、すぐに対応する姿勢を示すのが自然です。"],"N3-Q452":["「体調、大丈夫ですか。顔色が悪いですよ。」と言われました。何と答えますか。","少し疲れているだけです。ご心配ありがとうございます。","心配されたときは、状況を伝えつつ感謝を伝えるのが自然です。"],"N3-Q453":["「これ、みんなで食べてください。」とお菓子をもらいました。何と言いますか。","わあ、ありがとうございます。みんなでいただきます。","何かをもらったときは、お礼を言って受け取るのが自然です。"],"N3-Q454":["「明日の会議、資料は何部用意すればいいですか。」と聞かれました。何と答えますか。","10部お願いします。","部数を聞かれているので、数で答えます。"],"N3-Q455":["「先輩、この漢字の読み方、教えていただけますか。」と聞かれました。何と答えますか。","ああ、これは「けいけん」と読みますよ。","読み方を聞かれているので、読み方を答えます。"],"N3-Q456":["「すみません、この席、どなたか座っていますか。」と聞かれました。席は空いています。何と答えますか。","いいえ、空いていますよ。どうぞ。","席が空いているか聞かれたら「空いていますよ、どうぞ」と答えるのが自然です。"],"N3-Q457":["「今度の休み、一緒に山に登りませんか。」と誘われました。何と答えますか。","いいですね。ぜひ行きたいです。","誘いを受けるときは「いいですね、ぜひ」と答えるのが自然です。"],"N3-Q458":["「レポートの締め切り、今週の金曜日でしたよね？」と確認されました。何と答えますか。","はい、金曜日までです。","締め切りの日を確認されているので、日にちで答えます。"],"N3-Q459":["この人は、夜勤についてどう感じましたか。","思ったより集中できたが、明け方は体が重くなった","「意外と集中できた」「明け方になると体が重くなり」とあります。"],"N3-Q460":["工具を借りた人は、何をしなければなりませんか。","使用後、その日のうちに返却する","「使用後は、その日のうちに返却し」とあります。"],"N3-Q461":["班長の言葉を聞いて、この人はどう感じましたか。","気持ちが楽になった","「その言葉で、少し気持ちが楽になった」とあります。"],"N3-Q462":["来週水曜日について、正しいものはどれですか。","昼食の提供が30分遅れる","「昼食の提供時間が通常より30分遅れます」「夕食には影響ありません」とあります。"],"N3-Q463":["この人は、N4合格後、何を思いましたか。","努力すれば結果につながると実感した","「努力すれば結果につながるのだと実感できた」とあります。"],"N3-Q464":["この文章で伝えたいことは何ですか。","資格がない人はフォークリフトを運転してはいけない","「無資格での運転は…固く禁止します」とあります。"],"N3-Q465":["この人は、誕生日にどんな気持ちになりましたか。","一人じゃないと感じ、嬉しかった","「一人じゃないんだと感じられた」「心から嬉しかった」とあります。"],"N3-Q466":["アンケートについて、正しいものはどれですか。","食堂入口のタブレットで答えられる","「食堂入口のタブレットから、1分程度で回答できます」とあります。"],"N3-Q467":["この人の考えは、どのように変わりましたか。","質問を我慢するより、すぐ聞くほうがいいと気づいた","「分からないままにしておくほうが、後で大きな問題になると気づいた」とあります。"],"N3-Q468":["安全靴について、正しいものはどれですか。","作業中は必ず着用しなければならない","「作業中は必ず着用してください」「私物のスニーカーなどでの作業は認められません」とあります。"],"N3-Q469":["この人は、注意されたことについて今どう思っていますか。","成長の機会だと思えるようになった","「今では、注 この人はどう変わりましたか。","他人ではなく、過去の自分と比べるようになった","「それからは、他人と比べるのではなく、過去の自分と比べるようにしている」とあります。"],"N3-Q493":["この人が応募したスローガンは、どうなりましたか。","採用され、工場の入口に貼られた","「私が応募した…スローガンが、なんと採用された」「工場の入口に…貼られている」とあります。"],"N3-Q494":["スローガンが貼られているのを見て、この人はどう感じましたか。","恥ずかしいような、誇らしいような不思議な気持ち","「恥ずかしいような、誇らしいような、不思議な気持ちになった」とあります。"],"N3-Q495":["この人が落ち着いて対応できたのは、なぜですか。","母国語と日本語が併記されたカードがあったから","「事前に配られていた『症状を伝えるためのカード』を使うことで、落ち着いて対応できた」とあります。"],"N3-Q496":["実習生の体調は、結局どうでしたか。","軽い食あたりで、大事には至らなかった","「その実習生は軽い食あたりで、大事には至らなかった」とあります。"],"N3-Q497":["このキャンペーンで、メニューはどう変わりましたか。","量が選べる「小盛り」「大盛り」が増えた","「量が選べる『小盛り』『大盛り』のメニューが増え」とあります。"],"N3-Q498":["このキャンペーンの結果、どうなりましたか。","食堂の残飯が以前よりかなり減った","「食堂の残飯も以前よりかなり減ったそうだ」とあります。"],"N3-Q499":["この人は、交流会について最初どう感じていましたか。","面倒で、時間の無駄だと感じていた","「以前は『面倒だ』『時間の無駄では』と感じていた」とあります。"],"N3-Q500":["交流会に参加して、どんな効果がありましたか。","写真マニュアルを取り入れ、新人教育が短縮された","「『作業手順の写真マニュアル』は…新人教育の時間が大幅に短縮された」とあります。"],"N3-Q501":["この人が指導を頼まれたとき、どう感じましたか。","うれしい反面、不安もあった","「うれしい反面、自分の日本語でちゃんと教えられるか不安もあった」とあります。"],"N3-Q502":["この人は、どうやって説明をうまく伝えられるようにしましたか。","絵や写真を使って説明した","「絵や写真を使って説明する方法を試したところ、言葉だけよりずっと伝わりやすくなった」とあります。"],"N3-Q503":["この人は、今回の経験から何を学びましたか。","声を上げてみないと何も変わらないということ","「声を上げてみないと何も変わらないのだと、身をもって学んだ」とあります。"],"N3-Q504":["ごみの分別について、正しいものはどれですか。","3種類に分けなければならない","「燃えるごみ、燃えないごみ、リサイクル可能な金属くずの3種類に分けてください」とあります。"],"N3-Q505":["この人にとって、今の楽しみは何ですか。","行動範囲が少しずつ広がっていくこと","「少しずつ行動範囲が広がっていくのが、今の楽しみになっている」とあります。"],"N3-Q506":["承認なしで残業した場合、どうなりますか。","原則として残業代の対象外になる","「承認なしの残業は、原則として残業代の対象外となります」とあります。"],"N3-Q507":["この人は、料理を作ってどうなりましたか。","仲間と一緒に作る約束ができた","「今度は皆で一緒に作ることになった」とあります。"],"N3-Q508":["防犯登録をするとき、何が必要ですか。","身分証明書","「身分証明書を持参のうえ行ってください」とあります。"],"N3-Q509":["この人は、班長の言葉を聞いてどう感じましたか。","時の流れを感じ、周りへの感謝を改めて感じた","「時の流れの速さを感じた」「周りが根気強く教えてくれたおかげだと改めて感謝した」とあります。"],"N3-Q510":["この文章の目的は何ですか。","部署ごとに休憩時間をずらし、混雑を緩和すること","「部署ごとに交代で休憩を取っていただくようご協力をお願いします」とあります。"],"N3-Q511":["この人にとって、日記を書くことはどんな意味がありますか。","気持ちを日本語で表現する練習になっている","「日記を通して、自分の気持ちを日本語で表現する練習にもなっていると感じる」とあります。"],"N3-Q512":["見学中、気をつけることは何ですか。","指定された通路以外を歩かないこと","「見学中は指定 ります。"],"N3-Q533":["朝の送迎バスは、来月からどうなりますか。","現在より10分早くなる","「朝は現在より10分早い6:20発に」とあります。"],"N3-Q534":["新しい時刻表は、どこで確認できますか。","寮の掲示板","「新しい時刻表は、寮の掲示板に貼り出しています」とあります。"],"N3-Q535":["この人は、なぜミスが減りましたか。","声に出しながら数えるようになったから","「声に出しながら数えてみたら」「驚くほどミスが減った」とあります。"],"N3-Q536":["声に出すことがミスを減らす理由は何だと説明されていますか。","目と耳の両方で確認できるから","「声に出すことで、目と耳の両方で確認できるから」と説明されています。"],"N3-Q537":["この人は、消火器を使ってみてどう感じましたか。","思ったより重く、扱いが難しいと感じた","「思ったより重く、扱いが難しいと感じた」とあります。"],"N3-Q538":["訓練を受けて、この人はどう変わりましたか。","日常の中の備えに、もっと目を向けようと思った","「日常の中の備えに、もっと目を向けようと思った」とあります。"],"N3-Q539":["この人は、プレゼントを送ってどう感じましたか。","これまでの苦労が報われた気がした","「これまでの苦労が報われた気がした」とあります。"],"N3-Q540":["喫煙について、正しいものはどれですか。","屋外の指定場所でのみ喫煙できる","「屋外の指定場所（駐車場奥）のみでの喫煙とします」とあります。"],"N3-Q541":["この人は、髪を切った後どう感じましたか。","同僚に褒められ、ほっとした","「『似合ってるよ』と言われ、ほっとした」とあります。"],"N3-Q542":["スリッパを使った後、何をすればいいですか。","消毒用アルコールで拭いて戻す","「使用後は、消毒用アルコールで拭いてから、元の場所にお戻しください」とあります。"],"N3-Q543":["この人は、この出来事からどう感じましたか。","知らない人からの優しさに、生活が温かく感じられた","「知らない人からの優しさに、日本での生活が少し温かく感じられた」とあります。"],"N3-Q544":["資源ごみは、いつから出すことができますか。","前日の夜から","「前日の夜から出すことができます」とあります。"],"N3-Q545":["上司の言葉を聞いて、この人はどう思いましたか。","必要なときにしっかり休もうと思った","「これからは必要なときにしっかり休もうと思う」とあります。"],"N3-Q546":["配属されたら、何をしなければなりませんか。","非常口までの経路を実際に歩いて確認する","「配属されたら、必ず一度、自分のエリアから最も近い非常口までの経路を実際に歩いて確認してください」とあります。"],"N3-Q547":["この人は、掃除を終えてどう感じましたか。","協力することの違いを実感した","「小さなことでも、協力するとこんなに違うのだと実感した」とあります。"],"N3-Q548":["参加を希望する場合、どうすればいいですか。","今月末までに幹事へ連絡する","「参加希望の方は今月末までに幹事へご連絡ください」とあります。"],"N3-Q549":["エレベーターで、後から人が乗ろうとしています。何と言いますか。","お待ちください。開けておきます。","誰かを待たせないよう配慮するときは「お待ちください」と声をかけるのが自然です。"],"N3-Q550":["同僚が体調を崩し、早退することになりました。何と言いますか。","お大事に。無理しないでくださいね。","体調が悪い人には「お大事に」と気遣うのが自然です。"],"N3-Q551":["会議室を使い終わって、次の人が入ってきました。何と言いますか。","お先に失礼しました。どうぞお使いください。","部屋を使い終えて出るときは「お先に失礼しました」と言うのが自然です。"],"N3-Q552":["取引先の方に、資料を渡します。何と言いますか。","こちら、資料でございます。ご確認ください。","資料などを渡すときは「こちら、〜でございます」と丁寧に伝えるのが自然です。"],"N3-Q553":["先輩が、あなたの作った資料をほめてくれました。何と言いますか。","ありがとうございます。うれしいです。","褒められたときは、素直にお礼を言うのが自然です。"],"N3-Q554":["後輩が、初めての大きな仕事を任されて不安そうです。何と言いますか。","何かあったら、いつでも相談してね。","不安そうな後輩には、頼れる存在であることを伝えるのが自然です。"],"N3-Q555":["お客様から、少し難しい質問をされました。すぐに答えられません。何と言いますか。","確認して、後ほどご連絡いたします。","すぐに答えられないときは、正直に伝え、後で対応する姿勢を示すのが自然です。"],"N3-Q556":["寮の共用スペースを、少し散らかしてしまいました。何と言いますか。","すみません、片付けます。","自分の不注意で迷惑をかけたときは「すみません」と謝るのが自然です。"],"N3-Q557":["上司に、企画書のミスを指摘されました。何と言いますか。","申し訳ございません。すぐに修正いたします。","ミスを指摘されたときは、素直に謝り、対応する姿勢を示すのが自然です。"],"N3-Q558":["同僚が、あなたの国の料理に興味を持っています。何と言いますか。","今度作ってきますよ。よかったら食べてみてください。","興味を持ってもらえたときは、気軽に提案するのが自然です。"],"N3-Q559":["会議で、自分の意見と違う意見が出ました。何と言いますか。","なるほど、そういう考え方もありますね。","異なる意見を受け止めるときは「なるほど」と一度受け入れる姿勢を見せるのが自然です。"],"N3-Q560":["研修が終わって、講師にお礼を言いたいです。何と言いますか。","本日はありがとうございました。とても勉強になりました。","研修などでお世話になった人には「勉強になりました」とお礼を伝えるのが自然です。"],"N3-Q561":["忙しそうな同僚に、飲み物を渡します。何と言いますか。","これ、よかったらどうぞ。","気遣いで何かを渡すときは「よかったらどうぞ」と気軽に言うのが自然です。"],"N3-Q562":["後輩のミスを、やさしく指摘したいです。何と言いますか。","ここ、こうするともっと良くなると思うよ。","後輩を傷つけないよう、前向きな言い方で指摘するのが自然です。"],"N3-Q563":["お世話になった先輩が、来月転勤することになりました。何と言いますか。","今まで本当にお世話になりました。新しい職場でも頑張ってください。","お世話になった人が去るときは、感謝と応援の言葉をかけるのが自然です。"],"N3-Q564":["「来週の研修、参加できますか。」と聞かれました。参加できません。何と答えますか。","すみません、その日は予定があって参加できません。","参加できないときは、理由を添えて断るのが自然です。"],"N3-Q565":["「体調はもういいんですか。」と聞かれました。もう大丈夫です。何と答えますか。","はい、おかげさまで、すっかり良くなりました。","回復を聞かれたときは「おかげさまで」と答えるのが自然です。"],"N3-Q566":["「この荷物、重そうですね。手伝いましょうか。」と言われました。何と答えますか。","ありがとうございます、助かります。","助けを申し出てもらったときは、お礼を言って受け入れるのが自然です。"],"N3-Q567":["「次の会議、何時からでしたっけ。」と聞かれました。何と答えますか。","午後2時からです。","時間を聞かれているので、時間で答えます。"],"N3-Q568":["「引っ越しの荷造り、終わりましたか。」と聞かれました。まだ半分も終わっていません。何と答えますか。","それが、まだ半分も終わっていないんです。","終わっていないときは、正直な状況を伝えるのが自然です。"],"N3-Q569":["「日本の食べ物で、何が一番好きですか。」と聞かれました。何と答えますか。","そうですね、ラーメンが一番好きです。","好きなものを聞かれているので、具体的な食べ物で答えます。"],"N3-Q570":["「明日は雨みたいですよ。傘、持っていますか。」と言われました。持っていません。何と答えますか。","あ、持っていないので、買っておきます。","持っていないときは、正直に伝え、対応を示すのが自然です。"],"N3-Q571":["「新しい寮の部屋、住み心地はどうですか。」と聞かれました。とても快適です。何と答えますか。","はい、とても快適で、気に入っています。","住み心地を聞かれているので、感想を具体的に答えます。"],"N3-Q572":["「このファイル、パスワードが分からなくて開けないんです。」と相談されました。何と答えますか。","それなら、IT担当の田中さんに聞いてみましょう。","解決方法が分からないときは、詳しい人を紹介するのが自然です。"],"N3-Q573":["「今度の休み、予定はありますか。」と聞かれました。特に予定はありません。何と答えますか。","いえ、特に予定はないです。","予定がないときは、そのまま素直に伝えるのが自然です。"],"N3-Q574":["「作業中に何か困ったことはありますか。」と班長に聞かれました。少し困っていることがあります。何と答えますか。","実は、手順の一部がまだよく分からなくて。","困っていることがあるときは、正直に伝えるのが自然です。"],"N3-Q575":["「日本語、だいぶ上手になりましたね。」と褒められました。何と答えますか。","ありがとうございます。まだまだですが、頑張ります。","褒められたときは、謙虚にお礼を言うのが自然です。"],"N3-Q576":["実習生はこの後まず何をしますか。","在庫確認の報告書をまとめる","班長が報告書の完成を確認し、実習生も「先にそちらを仕上げます」と答えています。"],"N3-Q577":["男の人はこの後まず何をしますか。","プロジェクターの動作確認をする","女の人がプロジェクターの確認を頼み、男の人も「今すぐ確認します」と答えています。"],"N3-Q578":["実習生はこの後まず何をしますか。","案内の内容を確認する","寮長が内容確認を先に頼み、実習生も「先に確認します」と答えています。"],"N3-Q579":["社員はこの後まず何をしますか。","デザイン案を部長にメールで送る","部長がデザイン案の送付を頼み、社員も「すぐに送ります」と答えています。"],"N3-Q580":["男の人はこの後まず何をしますか。","点検の日程を確認する","女の人が日程確認を頼み、男の人も「今から確認します」と答えています。"],"N3-Q581":["社員はこの後まず何をしますか。","参加人数を確認してお店に伝える","課長が人数確認を頼み、社員も「すぐに確認します」と答えています。"],"N3-Q582":["女の人はこの後まず何をしますか。","買い物に行く","女の人が「今日中に買い物に行かないと」「今から行ってくる」と言っています。"],"N3-Q583":["男の人はこの後まず何をしますか。","先方に日程を確認する","女の人が日程確認を先に頼み、男の人も「今からメールします」と答えています。"],"N3-Q584":["実習生はこの後まず何をしますか。","申込書のコピーを取る","班長がコピーを先に頼み、実習生も「先にコピーを取ります」と答えています。"],"N3-Q585":["社員はこの後まず何をしますか。","ポスターを会議室に持っていく","部長が会議室への持参を頼み、社員も「会議室に持っていきます」と答えています。"],"N3-Q586":["新商品の売れ行きが良いのは、なぜですか。","SNSの動画が話題になったから","男の人が「SNSで紹介した動画が話題になった」と理由を話しています。"],"N3-Q587":["男の人が転職を考えているのは、なぜですか。","新しい技術を学ぶ機会がないから","男の人が「新しい技術を学ぶ機会がなくて。将来が不安」と理由を話しています。"],"N3-Q588":["今月の会議室の予約が増えたのは、なぜですか。","各部署で来期の計画会議が行われているから","社員が「来期の計画会議が各部署で行われている」と理由を話しています。"],"N3-Q589":["女の人が引っ越しをやめたのは、なぜですか。","契約更新のほうが新しく借りるより安いと分かったから","女の人が「契約を更新するほうが、新しく借りるより安いと分かって」と理由を話しています。"],"N3-Q590":["工場のラインが一時止まったのは、なぜですか。","センサーの誤作動で、安全のため自動で止まったから","男の人が「センサーの誤作動があったみたいで、安全のため自動で止まる仕組み」と説明しています。"],"N3-Q591":["男の人が資格試験に落ちたのは、なぜだと言っていますか。","仕事が忙しくて勉強時間が取れなかったから","男の人が「仕事が忙しくて、あまり勉強時間が取れなかった」と理由を話しています。"],"N3-Q592":["取引先との契約が延びたのは、なぜですか。","先方の社内承認手続きに時間がかかっているから","社員が「先方の社内での承認手続きに時間がかかっている」と理由を話しています。"],"N3-Q593":["女の人が心が折れそうなのは、なぜですか。","資格の勉強が思ったより難しいから","女の人が「思ったより難しくて、正直心が折れそうで」と理由を話しています。"],"N3-Q594":["先輩に、道具の使い方をもう一度教えてほしいです。何と言いますか。","すみません、もう一度教えていただけますか。","もう一度教えてほしいときは、丁寧にお願いするのが自然です。"],"N3-Q595":["同僚が、あなたより先に仕事を終えて帰ります。何と言いますか。","お疲れさまでした。","先に帰る人を見送るときは「お疲れさまでした」と言うのが自然です。"],"N3-Q596":["取引先の方が、会社の入口で道に迷っているようです。何と言いますか。","どちらをお探しですか。ご案内します。","困っている様子の人には、声をかけて案内を申し出るのが自然です。"],"N3-Q597":["後輩から、仕事の相談を受けました。今は少し手が離せません。何と言いますか。","ごめん、10分だけ待ってもらえる？後で聞くね。","すぐに対応できないときは、いつなら対応できるか伝えるのが自然です。"],"N3-Q598":["お客様から、電話で会社の場所を聞かれました。何と言いますか。","駅から歩いて5分ほどのところにございます。","場所を聞かれたときは、具体的に説明するのが自然です。"],"N3-Q599":["初めて会う取引先の人に、自己紹介をします。何と言いますか。","初めまして、NTICの羽根と申します。","初対面のあいさつは「初めまして」で始めるのが自然です。"],"N3-Q600":["「明日、車で送りましょうか。」と言われました。お願いしたいです。何と答えますか。","ありがとうございます、お願いします。","提案を受け入れるときは「お願いします」と答えるのが自然です。"],"N3-Q601":["「今度の日本語クラス、レベルはどれにしますか。」と聞かれました。何と答えますか。","中級クラスでお願いします。","レベルを聞かれているので、クラスの名前で答えます。"],"N3-Q602":["「これ、賞味期限が近いので、早めに食べてくださいね。」と言われました。何と答えますか。","分かりました、教えてくれてありがとうございます。","有用な情報をもらったときは、お礼を言うのが自然です。"],"N3-Q603":["「会議室、片付けておいてもらえますか。」と頼まれました。何と答えますか。","はい、承知しました。","依頼を引き受けるときは「承知しました」と答えるのが自然です。"],"N3-Q604":["「先月のレポート、まだ受け取っていないんですが。」と言われました。もう送りました。何と答えますか。","あ、先週の水曜日にメールで送ったのですが、届いていませんか。","すでに対応済みのことを聞かれたら、状況を説明するのが自然です。"],"N3-Q605":["「今日は残業できますか。」と聞かれました。できません。何と答えますか。","すみません、今日は用事があって難しいです。","できないときは、理由を添えて丁寧に断るのが自然です。"],"N3-Q606":["「田中さん、もう帰りましたか。」と聞かれました。まだ会社にいます。何と答えますか。","いえ、まだいらっしゃいますよ。","まだいるときは、そのまま状況を伝えるのが自然です。"],"N3-Q607":["男の人はこの後まず何をしますか。","会場に人数を伝える","女の人が会場への連絡を頼み、男の人も「今から電話します」と答えています。"],"N3-Q608":["実習生はこの後まず何をしますか。","部品不足を事務所に報告する","班長が報告を先に頼み、実習生も「先に報告します」と答えています。"],"N3-Q609":["男の人が早起きを始めたのは、なぜですか。","朝のほうが集中できると聞いたから","男の人が「朝のほうが集中できるって聞いて試してみたら」と理由を話しています。"],"N3-Q610":["新しいオフィスへの移転が決まったのは、なぜですか。","社員が増えて、今のスペースが手狭になったから","社員が「社員が増えて、今のスペースでは手狭になってきた」と理由を話しています。"],"N3-Q611":["同僚が、あなたの代わりに残業してくれました。何と言いますか。","本当に助かりました。ありがとうございます。","代わりにやってもらったときは、感謝を具体的に伝えるのが自然です。"],"N3-Q612":["先輩の机に、書類を置いておきたいです。何と言いますか。","こちら、机に置いておきますね。","何かを置いておくときは、一言伝えるのが自然です。"],"N3-Q613":["会議中に、他の人の話をさえぎってしまいそうです。何と言いますか。","すみません、一つよろしいですか。","発言する前には「すみません」と断りを入れるのが自然です。"],"N3-Q614":["取引先から、無理な納期を頼まれました。難しいです。何と言いますか。","申し訳ございませんが、その納期は少し難しいです。","断るときも、丁寧な言葉を選ぶのが自然です。"],"N3-Q615":["後輩が、休憩中も熱心に勉強しています。何と言いますか。","熱心だね、応援してるよ。","頑張っている人には、応援の言葉をかけるのが自然です。"],"N3-Q616":["お客様が、長時間待たされて少し不満そうです。何と言いますか。","大変お待たせいたしました、申し訳ございません。","待たせてしまったときは、まずお詫びするのが自然です。"],"N3-Q617":["会社の忘年会で、幹事にお礼を言いたいです。何と言いますか。","準備、大変だったでしょう。ありがとうございました。","準備してくれた人には、労をねぎらう言葉をかけるのが自然です。"],"N3-Q618":["「今日中に、これ終わりそうですか。」と聞かれました。終わりそうです。何と答えますか。","はい、あと少しで終わりそうです。","終わりそうなときは、状況をそのまま伝えるのが自然です。"],"N3-Q619":["「その資料、私も見てもいいですか。」と聞かれました。何と答えますか。","はい、どうぞ。","見せてほしいと言われたら「どうぞ」と答えるのが自然です。"],"N3-Q620":["「休みの日は、何をしていることが多いですか。」と聞かれました。何と答えますか。","家でゆっくり映画を見ていることが多いです。","過ごし方を聞かれているので、具体的な行動で答えます。"],"N3-Q621":["「この漢字、読み方が分からないんですが。」と聞かれました。答えを知っています。何と答えますか。","ああ、それは「けいえい」と読みますよ。","読み方を知っているときは、そのまま教えるのが自然です。"],"N3-Q622":["「来月のシフト、希望はありますか。」と聞かれました。土日休みを希望します。何と答えますか。","できれば、土日にお休みをいただきたいです。","希望があるときは、具体的に伝えるのが自然です。"],"N3-Q623":["「新しい上司、どうですか。」と聞かれました。まだよく分かりません。何と答えますか。","まだ日が浅くて、正直よく分からないです。","まだ判断できないときは、正直にそう伝えるのが自然です。"],"N3-Q624":["「明日は早く来られますか。」と聞かれました。来られます。何と答えますか。","はい、大丈夫です。何時に伺えばいいですか。","対応できるときは「大丈夫です」と答え、詳細を確認するのが自然です。"],"N3-Q625":["「体調管理、気をつけてくださいね。」と言われました。何と答えますか。","ありがとうございます、気をつけます。","気遣ってもらったときは、素直にお礼を言うのが自然です。"],"N3-Q626":["「この漢字の意味、知っていますか。」と聞かれました。分かりません。何と答えますか。","すみません、それは分かりません。","分からないときは、正直に「分かりません」と伝えるのが自然です。"],"N3-Q627":["「今の会社に満足していますか。」と聞かれました。満足しています。何と答えますか。","はい、とても満足しています。","満足していることを伝えるときは、素直にそう答えるのが自然です。"],"N3-Q628":["「もう新しい環境には慣れましたか。」と聞かれました。まだ少し不安です。何と答えますか。","少しずつ慣れてきましたが、まだ不安な部分もあります。","完全ではないときは、そのまま正直な気持ちを伝えるのが自然です。"]};
function questionInfo(level, id){
  const map = level === "n3" ? QUESTION_INFO_N3 : QUESTION_INFO_N4;
  return map[id] || null; // [問題文, 正解, 解説] または見つからなければnull
}

<script>
(function(){
"use strict";

// ============================================================
// メンテナンスバナー機能
// Supabaseのapp_settingsテーブル(id=1)を見て、maintenance_mode=trueなら
// 画面上部に警告バナーを出す。管理者向け画面なので日本語のみ表示。
// ============================================================
async function checkMaintenanceBanner(){
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/app_settings?select=maintenance_mode,maintenance_message&id=eq.1", {
      headers: { "apikey": SUPABASE_KEY }
    });
    if(!res.ok) return;
    const rows = await res.json();
    const settings = rows[0];
    if(!settings || !settings.maintenance_mode) return;

    const msg = settings.maintenance_message
      || "ただいまアプリをアップデート中です。表示が一時的に不安定になる場合があります。";

    const banner = document.createElement("div");
    banner.id = "maintenanceBanner";
    banner.style.cssText = [
      "position:fixed", "top:0", "left:0", "right:0", "z-index:9999",
      "background:#b45309", "color:#fff", "padding:10px 16px",
      "font-size:13px", "line-height:1.5", "text-align:center",
      "box-shadow:0 2px 6px rgba(0,0,0,0.15)"
    ].join(";");
    banner.textContent = "⚠ " + msg;
    document.body.prepend(banner);
    document.body.style.paddingTop = (banner.offsetHeight || 44) + "px";
  }catch(e){
    // 取得失敗時は何も表示しない
  }
}

let session = null; // {access_token, refresh_token, expires_at, loginId, email}

function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }

// ==== ログインID→メールアドレスの自動判定変換(2026/8/30新設) ====
// このダッシュボードには2種類の利用者がログインしてくる。
//   ・NTIC管理者(ntic_admin)  : 組合で発行された実際のメールアドレスでログインする
//   ・企業代表/事業所担当者    : create_company_user_account() が発行する
//                               NTIC-OWNER-xxxxxx / NTIC-MGR-xxxxxx 形式のログインID
// Supabase Authは常にメールアドレスでの認証しか受け付けないため、後者は内部専用の
// 疑似メールアドレスへ変換してから送る必要がある。「@を含むかどうか」で自動判定し、
// 1つの入力欄で両方を受け付ける。
// ドメイン("@ntic-academy.internal")と小文字化のルールは、実習生側(index.html)の
// loginIdToEmail()、およびDB関数 create_company_user_account() / create_student_account()
// (どちらも lower(v_login_id) || '@ntic-academy.internal' でauth.usersを作成している)と
// 完全に一致させること。ここがズレると発行したIDでログインできなくなる。
const AUTH_EMAIL_DOMAIN = "@ntic-academy.internal";
function loginIdToEmail(rawInput){
  const trimmed = (rawInput || "").trim();
  if(trimmed.includes("@")) return trimmed.toLowerCase(); // 実メールアドレス(NTIC管理者)はそのまま
  return trimmed.toLowerCase() + AUTH_EMAIL_DOMAIN;       // ログインID(企業担当者)は内部ドメインを付与
}

// 直前に描画していた画面の種類。画面が切り替わったときだけ先頭へ戻すために覚えておく。
// タブ・サブタブ・カルテの開閉が変わったかどうかで判断する。
let lastRenderedScreen = null;
function currentScreenKey(){
  if(!session) return "login";
  if(session.mustChangePassword) return "passwordChange";
  if(dashState.selectedLearner) return "karte";
  return "tab:" + dashState.activeTab + "/" + dashState.learningSubTab;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!session){ document.body.classList.remove("shell-on"); app.appendChild(renderLogin()); }
  else if(session.mustChangePassword){ document.body.classList.remove("shell-on"); app.appendChild(renderPasswordChange()); }
  else {
    // ログイン後は、左メニュー(PC)/上バー・下タブ・ドロワー(スマホ)の外枠で包む
    const content = renderDashboard();
    document.body.classList.add("shell-on");
    app.appendChild(buildShell(content));
  }

  // ロゴタップで「概要」タブへ戻る。
  // 以前はカルテを開いている時しか反応しなかったが、
  // どのタブからでも最初の画面に戻れた方が分かりやすいので、
  // 概要タブ以外にいるときは常に押せるようにする。
  const logoEl = document.getElementById("orgLogo");
  if(logoEl){
    const atHome = !!session
      && !dashState.selectedLearner
      && dashState.activeTab === "overview";
    const canGoHome = !!session && !session.mustChangePassword && !atHome;
    logoEl.style.cursor = canGoHome ? "pointer" : "default";
    logoEl.title = canGoHome ? "概要にもどる" : "";
    logoEl.onclick = canGoHome ? ()=> goDashboardHome() : null;
  }

  renderHeaderUserInfo();

  // 別の画面へ移ったときは先頭から見せる。
  // 一覧を下までスクロールした状態でタブを切り替えると、
  // 次の画面が途中から表示されてしまうため。
  //
  // 同じ画面のままの再描画(フィルタ変更・ページ送り・一括発行の進捗更新など)では
  // 動かさない。そこで動かすと操作のたびに画面が跳ねて使いにくくなる。
  const screen = currentScreenKey();
  if(screen !== lastRenderedScreen){
    lastRenderedScreen = screen;
    requestAnimationFrame(()=>{ window.scrollTo({ top: 0, behavior: "auto" }); });
  }
}

// ヘッダー右上のログイン情報(メール・ロール・アバター)を更新する。
// 以前は本文側に「ログイン中: xxx」という行で表示していたが、参考デザインに合わせて
// ヘッダー内(ロゴの右側)に統合した。
function renderHeaderUserInfo(){
  const box = document.getElementById("headerUserInfo");
  if(!box) return;
  box.innerHTML = "";
  if(!session) return;

  const scope = sessionScope();
  let roleText = "";
  if(scope.isAdmin) roleText = "NTIC管理者・全社閲覧";
  else if(scope.role === "company_owner") roleText = "企業代表・自社全事業所閲覧";
  else if(scope.role === "workplace_manager") roleText = "事業所担当者・担当事業所のみ閲覧";
  else if(scope.role === "company_user_pending") roleText = "権限確認中...";
  else if(scope.companyId) roleText = "企業: " + scope.companyId + " の閲覧権限";
  else roleText = "閲覧権限が設定されていません";

  // 企業担当者は内部用の疑似メールアドレス(NTIC-OWNER-xxxxxx@ntic-academy.internal)で
  // 認証しているため、そのまま表示すると本人には見慣れない文字列になる。
  // 実際に入力してもらったログインIDの方を優先して表示する。
  const displayId = session.loginId || session.email;
  const text = document.createElement("div");
  text.className = "huiText";
  text.innerHTML = "<div class='huiEmail'>"+escapeHtml(displayId)+"</div><div class='huiRole'>"+escapeHtml(roleText)+"</div>";
  box.appendChild(text);

  const avatar = document.createElement("div");
  avatar.className = "huiAvatar";
  avatar.textContent = (displayId||"?").charAt(0).toUpperCase();
  avatar.title = displayId + "（" + roleText + "）タップでログアウト";
  avatar.onclick = doLogout;
  box.appendChild(avatar);
}

// ---- 個人カルテの開閉をブラウザ履歴に積む ----
// このアプリは1ページのSPAで、何もしないとブラウザ履歴が一切増えないため、
// カルテを開いた状態でマウスの戻るボタン(やスマホのスワイプバック)を押すと
// アプリごとタブの外に出てしまう。カルテを開く/閉じるたびに履歴を1つ積む・戻すことで、
// 「戻る」操作がまずカルテを閉じる動作になるようにする(ブラウザ標準のスワイプバックにも
// 同じ仕組みで反応するようになる)。
function openKarte(company_id, learner_id){
  dashState.selectedLearner = { company_id, learner_id };
  dashState.karteLevel = "n4"; // 別の学習者のカルテを開くたびN4表示にリセットする
  dashState.karteMissQShowCount = { moji:5, bunpo:5, dokkai:5, choukai:5 }; // 「よく間違えている問題」の表示件数もリセットする
  dashState.karteHistShowCount = 10; // 学習履歴の表示件数もリセットする
  dashState.karteCalendarDate = new Date(); // 学習カレンダーの表示月も今月にリセットする
  history.pushState({ view: "karte", company_id, learner_id }, "");
  render();  // 先頭へのスクロールはrender()側で一律に行う
}
function closeKarte(){
  // 履歴を1つ戻すことで、popstateハンドラがselectedLearnerを閉じてrenderする。
  // ブラウザの「戻る」ボタンを押した時と全く同じ経路になるよう統一している。
  history.back();
}
// ロゴから「概要」タブへ戻る。
// カルテを開いている場合は、まず履歴を戻してカルテを閉じる
// (ブラウザの「戻る」と同じ経路にするため)。
function goDashboardHome(){
  if(dashState.selectedLearner){
    closeKarte();
    return;
  }
  dashState.activeTab = "overview";
  dashState.learningSubTab = "overview";
  render();
}

window.addEventListener("popstate", (ev)=>{

function renderLogin(){
  const wrap = document.createElement("div");
  const card = el('<div class="card" style="max-width:380px;margin:40px auto;"></div>');
  const h = document.createElement("div");
  h.style.fontWeight="700"; h.style.fontSize="16px"; h.style.marginBottom="14px";
  h.textContent = "管理者ログイン";
  card.appendChild(h);

  const err = document.createElement("div");
  err.className = "errormsg"; err.style.display = "none";
  card.appendChild(err);

  // 入力欄は「ログインID」に一本化する。NTIC管理者は今まで通り本物のメールアドレスを、
  // 企業担当者は発行されたログインID(NTIC-OWNER-xxxxxx等)を、同じ欄に入力する。
  // 実際の変換・判定は loginIdToEmail() が行う。
  const idLabel = document.createElement("div");
  idLabel.className = "field-label";
  idLabel.textContent = "ログインID";
  card.appendChild(idLabel);
  const loginIdInput = document.createElement("input");
  loginIdInput.type = "text"; loginIdInput.autocomplete = "username";
  loginIdInput.placeholder = "メールアドレス または NTIC-OWNER-xxxxxx";
  card.appendChild(loginIdInput);

  const pwLabel = document.createElement("div");
  pwLabel.className = "field-label";
  pwLabel.textContent = "パスワード";
  card.appendChild(pwLabel);
  const pw = document.createElement("input");
  pw.type = "password"; pw.autocomplete = "current-password";
  card.appendChild(pw);

  const btn = document.createElement("button");
  btn.className = "primary"; btn.style.width="100%"; btn.textContent = "ログイン";
  const doLogin = async ()=>{
    btn.disabled = true; btn.textContent = "ログイン中...";
    err.style.display = "none";
    const rawInput = loginIdInput.value;
    try{
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email: loginIdToEmail(rawInput), password: pw.value })
      });
      const data = await res.json();
      if(!res.ok || !data.access_token){
        err.textContent = "ログインに失敗しました。ログインID・パスワードを確認してください。";
        err.style.display = "block";
        btn.disabled = false; btn.textContent = "ログイン";
        return;
      }
      session = { access_token: data.access_token, refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in || 3600) * 1000,
        loginId: rawInput.trim(), email: loginIdToEmail(rawInput) };
      // 初回ログイン等でパスワード変更が必須なアカウントかどうかをJWTから読み取っておく
      // (JWTのuser_metadataに、発行・リセット時に立てたmust_change_passwordフラグが入っている)
      const loginPayload = decodeJwt(session.access_token);
      session.mustChangePassword = !!(loginPayload.user_metadata && loginPayload.user_metadata.must_change_password);
      render();
    }catch(e){
      err.textContent = "通信エラーが発生しました。ネットワーク接続を確認してください。";
      err.style.display = "block";
      btn.disabled = false; btn.textContent = "ログイン";
    }
  };
  btn.onclick = doLogin;
  // パスワード欄でEnterキーを押してもログインできるようにする(index.html側と同じ挙動)
  pw.onkeydown = (e)=>{ if(e.key === "Enter") doLogin(); };
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
}

function decodeJwt(token){
  try{
    const payload = token.split(".")[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,"+").replace(/_/g,"/"))
      .split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  }catch(e){ return {}; }
}

// ---- パスワード変更(初回ログイン時に強制表示。index.html側と同じSupabase Auth APIを使う) ----
async function authChangePasswordDashboard(newPassword){
  const res = await fetch(SUPABASE_URL + "/auth/v1/user", {
    method: "PUT",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + session.access_token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      password: newPassword,
      data: { must_change_password: false }
    })
  });
  if(!res.ok){
    const data = await res.json().catch(()=>({}));
    throw new Error(data.error_description || data.msg || "パスワード変更に失敗しました。");
  }
  // JWT自体は変更されたuser_metadataを即座には反映しない(再ログインするまで古いまま)ため、
  // ローカルのフラグを直接falseにして、変更完了として扱う。
  session.mustChangePassword = false;
}

function renderPasswordChange(){

  card.appendChild(inputConfirm);

  card.appendChild(errorMsg);

  const btn = document.createElement("button");

      errorMsg.style.display = "block";
      return;

    btn.disabled = true; btn.textContent = "変更中...";

      render();

      errorMsg.style.display = "block";
      btn.disabled = false; btn.textContent = "パスワードを変更する";
    }
  };
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
}

function sessionScope(){
  if(!session) return { isAdmin:false, role:null, companyId:null };
  const payload = decodeJwt(session.access_token);
  const meta = (payload.app_metadata) || {};
  const jwtRole = meta.role || null;
  if(jwtRole === "ntic_admin"){
    return { isAdmin: true, role: "ntic_admin", companyId: null };
  }
  if(jwtRole === "company_user"){
    // JWTには"company_user"という粗い印だけを持たせている(認証=JWT、権限=DBの方針)。
    // 実際のロール(company_owner/workplace_manager)・所属企業は、
    // company_usersテーブルへの問い合わせ結果(dashState.companyUserInfo)を正とする。
    // まだ問い合わせ前(undefined)の間は「権限未確定」として扱い、解決後に確定させる。
    if(dashState.companyUserInfo){
      return { isAdmin:false, role: dashState.companyUserInfo.role, companyId: dashState.companyUserInfo.company_id };
    }
    return { isAdmin:false, role: "company_user_pending", companyId:null };
  }
  // 実習生本人など、それ以外のroleは対象外(companyIdはUI補助情報のみ、権限判定には使わない)
  return { isAdmin: false, role: jwtRole, companyId: meta.company_id || null };
}

// company_usersテーブルへ自分の所属・ロールを問い合わせる(RLSにより本人の行のみ返る)。
async function resolveCompanyUserInfo(){
  try{
    const payload = decodeJwt(session.access_token);
    const uid = payload.sub;
    const res = await fetch(SUPABASE_URL + "/rest/v1/company_users?auth_user_id=eq." + encodeURIComponent(uid) + "&status=eq.active&select=*", {
      headers: await getAuthHeaders()
    });
    const rows = res.ok ? await res.json() : [];
    dashState.companyUserInfo = rows.length > 0 ? rows[0] : null; // null = 該当なし(権限未設定)
  }catch(e){
    dashState.companyUserInfo = null;
  }
  render();
}

// ---- 自前の確認ダイアログ(confirm/alert禁止) ----
// yesLabelを省略した場合は既存の削除確認と同じ文言のまま(呼び出し元を壊さないため)
function ask(message, onYes, onNo, yesLabel){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<div class="modal-box"><p></p><div class="rowbtns"><button class="secondary" id="askNo">いいえ</button><button class="danger" id="askYes"></button></div></div>';
  bg.querySelector("p").textContent = message;
  bg.querySelector("#askYes").textContent = yesLabel || "はい、削除する";
  document.body.appendChild(bg);
  bg.querySelector("#askYes").onclick = function(){ document.body.removeChild(bg); if(onYes) onYes(); };
  bg.querySelector("#askNo").onclick = function(){ document.body.removeChild(bg); if(onNo) onNo(); };
}

// ---- NTLPアカウント発行(NTIC管理者のみ。DB関数側でもntic_adminチェックを行っている) ----
// 母国語・在籍フラグは、現時点ではdashboard側にDekisugi CSV由来のデータが無いため、
// 安全なデフォルト値(母国語:空→関数側で日本語にフォールバック, 在籍フラグ:0=在籍)を使う。
// 将来Dekisugi CSVのインポート機能ができたら、実データを渡すよう改修が必要。
async function issueAccount(learner){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/create_student_account", {
    method: "POST",
    headers: await getAuthHeaders(),
    body: JSON.stringify({
      p_dekisugi_student_code: learner.learner_id,
      p_name: learner.learnerName || learner.learner_id,
      p_dekisugi_company_id: learner.dekisugiCompanyId,
      p_native_language_raw: "",
      p_zairyu_flag: 0
    })
  });
  const data = await res.json();
  if(!res.ok){
    const msg = (data && (data.message || data.error_description)) || "アカウント発行に失敗しました。";
    throw new Error(msg);
  }
  // RPCはtable関数なので配列で返る
  return Array.isArray(data) ? data[0] : data;
}

// ==== Dekisugi CSV 取込 ====
// Dekisugiからエクスポートした実習生CSVを取り込み、roster/student_periods/
// student_workplaces/companies/workplaces を最新化する。
//
// 【なぜ必要か】
// 実習生は毎月のように入国してくるが、取込が手作業で止まっていたため、
// 新規実習生がダッシュボードに現れず、アカウントを発行できない状態だった。
//
// 【判定ルール】(2026/8/30に実データとDekisugi画面を確認して確定)
//   アカウント発行対象 = 在籍フラグ「在籍」 かつ 入国日が入力済み
//   Dekisugiの在籍フラグは入国前でも「在籍」になるため、入国日の確認が要る。
//   実習期間の日付は前後関係が矛盾する行が多く、終了判定には使えない。
//
// 【事業所IDについて】
//   「実習事業所(雇入れ直後)ID」には "235・236" のように複数のIDが入ることが
//   ある。これは異動履歴ではなく実習可能な事業所の列挙で、実際の所属は先頭の
//   1件（Dekisugi画面で確認済み）。分解はサーバー側のjn_normalize_importが
//   行うため、ここではCSVの値をそのまま送る。

// CSVから抜き出す列。Dekisugiの列順が変わっても動くよう、列名で探す。
const DEKISUGI_COLUMNS = {
  student_id:            "実習生ID",
  name:                  "実習生名(ローマ字)",
  kana:                  "実習生名(よみがな)",
  nationality:           "国籍",
  language:              "母国語（〇〇語と記載）",
  status:                "在籍フラグ名",
  dekisugi_company_id:   "実施者ID",
  company_name:          "実施者名",
  dekisugi_workplace_id: "実習事業所(雇入れ直後)ID",
  workplace_name:        "事業所名",
  kisei:                 "所属グループ名称",
  go:                    "実習生区分（〇号でも可）",
  entry_date:            "入国日",
  entry_planned_date:    "入国予定日"
};

// 1行分のCSVを配列に分解する(ダブルクォート内のカンマ・改行に対応)
function parseCsv(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ","){ row.push(field); field = ""; }
      else if(ch === "\r"){ /* 無視 */ }
      else if(ch === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else field += ch;
    }
  }
  if(field !== "" || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

// CSVテキスト → サーバーへ送るJSON配列。実習生IDで重複排除する。
// (企業に代表取締役が複数登録されていると、同じ実習生が複数行に現れるため)
function extractDekisugiRows(text){
  const rows = parseCsv(text);
  if(rows.length < 2) throw new Error("CSVにデータ行がありません。");
  const header = rows[0].map(h => (h||"").replace(/^\uFEFF/, "").trim());

  // 列名 → 列番号 の対応を作る。見つからない列があれば中断する。
  const colIdx = {};
  const missing = [];
  Object.keys(DEKISUGI_COLUMNS).forEach(key=>{
    const label = DEKISUGI_COLUMNS[key];
    const i = header.indexOf(label);
    if(i < 0) missing.push(label); else colIdx[key] = i;
  });
  if(missing.length){
    throw new Error("CSVに次の列が見つかりません：" + missing.join(" / ") +
      "\nDekisugiのエクスポート形式が変わった可能性があります。");
  }

  const seen = new Set();
  const out = [];
  for(let r = 1; r < rows.length; r++){
    const cells = rows[r];
    if(!cells || cells.length < 2) continue;
    const sid = (cells[colIdx.student_id] || "").trim();
    if(!sid || seen.has(sid)) continue;
    seen.add(sid);
    const rec = {};
    Object.keys(colIdx).forEach(key=>{
      rec[key] = (cells[colIdx[key]] || "").trim();
    });
    out.push(rec);
  }
  return out;
}

async function previewDekisugiImport(rows){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/preview_dekisugi_import", {
    method: "POST",
    headers: await getAuthHeaders(),
    body: JSON.stringify({ p_rows: rows })
  });
  const data = await res.json();
  if(!res.ok){
    throw new Error((data && (data.message || data.error_description)) || "プレビューに失敗しました。");
  }
  return Array.isArray(data) ? data : [];
}

async function applyDekisugiImport(rows){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/apply_dekisugi_import", {
    method: "POST",
    headers: await getAuthHeaders(),
    body: JSON.stringify({ p_rows: rows })
  });
  const data = await res.json();
  if(!res.ok){
    throw new Error((data && (data.message || data.error_description)) || "取込に失敗しました。");
  }
  return Array.isArray(data) ? data[0] : data;
}

// 一括発行の実処理。二重実行防止・進捗表示・1件完了ごとの結果反映を行う。
async function runBulkIssue(targets){
  if(dashState.bulkInProgress) return; // 二重クリック防止
  dashState.bulkInProgress = true;
  dashState.bulkTotal = targets.length;
  dashState.bulkDone = 0;
  dashState.bulkResults = [];
  render(); // 一括発行の進捗パネルへ切り替える

  for(const l of targets){
    let entry;
    const workplaceName = (l.workplaces && l.workplaces.length) ? l.workplaces.map(w=>w.workplace_name).join("・") : "未設定";
    try{
      const result = await issueAccount(l);
      entry = { name: l.learnerName || l.learner_id, company: l.companyName || l.company_id, workplace: workplaceName, loginId: result.login_id, password: result.initial_password, success: true, error: null };
    }catch(e){
      entry = { name: l.learnerName || l.learner_id, company: l.companyName || l.company_id, workplace: workplaceName, loginId: "-", password: "-", success: false, error: e.message || "不明なエラー" };
    }
    dashState.bulkResults.push(entry);
    dashState.bulkDone += 1;
    renderBulkResultPanelInPlace(); // 1件終わるごとに画面を更新(全部終わるまで待たない)
  }

  dashState.bulkInProgress = false;
  dashState.bulkSelected = {}; // 発行済みの選択状態はクリア
  dashState._fetchTriggered = false;
  await loadDashboardData(); // 最新のNTLP登録状況を反映
  renderBulkResultPanelInPlace();
}

  const container = document.getElementById("bulkResultContainer");

  container.innerHTML = "";
  container.appendChild(buildBulkResultContent());
}

// CSV生成・ダウンロード。ブラウザ内で完結し、どこにも送信・保存しない。
// 一括発行結果を「企業→事業所→氏名/ID/PW」のツリー形式のテキストに整形する。
// 発行に失敗した分(ID/PWが無い)は除外する。
function buildBulkTreeText(results){
  const successResults = results.filter(r=>r.success);
  const byCompany = {};
  successResults.forEach(r=>{
    if(!byCompany[r.company]) byCompany[r.company] = {};
    const wp = r.workplace || "未設定";
    if(!byCompany[r.company][wp]) byCompany[r.company][wp] = [];
    byCompany[r.company][wp].push(r);
  });
  const lines = [];
  Object.keys(byCompany).forEach(company=>{
    lines.push("■ " + company);
    Object.keys(byCompany[company]).forEach(workplace=>{
      lines.push("　▼ " + workplace);
      byCompany[company][workplace].forEach(r=>{
        lines.push("　　" + r.name + "　ID: " + r.loginId + "　PW: " + r.password);
      });
    });
    lines.push("");
  });
  return lines.join("\n").trim();
}

function downloadBulkResultCsv(results){
  const header = ["氏名","企業名","ログインID","初期パスワード","結果"];
  const rows = results.map(r=>[r.name, r.company, r.loginId, r.password, r.success ? "成功" : "失敗"]);
  const escapeCsv = (v)=>{
    const s = String(v==null?"":v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const csvLines = [header, ...rows].map(row=>row.map(escapeCsv).join(","));
  const csvContent = "\uFEFF" + csvLines.join("\r\n"); // BOM付きでExcelでの文字化けを防止
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().replace(/[:.]/g,"-");
  a.href = url;
  a.download = "ntlp_account_issue_" + ts + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function authHeaders(){
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + session.access_token,
    "Content-Type": "application/json"
  };
}

// アクセストークンは通常1時間ほどで失効する。以前は更新の仕組みが無く、
// 一括発行のように何百件も連続でリクエストする処理の途中でトークンが切れると、
// それ以降が全部「権限がありません」エラーで失敗する、という不具合があった。
// リクエストの直前に毎回これを呼び、期限が近ければ自動的にリフレッシュしてから
// ヘッダーを返すようにする(認証付きリクエストは必ずこちらを使うこと。authHeaders()を直接使わない)。
async function refreshSessionIfNeeded(){
  if(!session) return;
  const bufferMs = 60000; // 期限の60秒前から早めに更新する
  if(Date.now() < session.expires_at - bufferMs) return; // まだ十分に余裕がある
  if(!session.refresh_token) return; // リフレッシュトークンが無い(古いログイン等)場合は何もしない
  try{
    const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    const data = await res.json();
    if(res.ok && data.access_token){
      session.access_token = data.access_token;
      session.refresh_token = data.refresh_token || session.refresh_token;
      session.expires_at = Date.now() + (data.expires_in || 3600) * 1000;
    }
    // 失敗した場合は何もしない(次のリクエストが401になった際、既存の再ログイン導線に任せる)
  }catch(e){ /* ネットワークエラー等。同上 */ }
}

async function getAuthHeaders(){
  await refreshSessionIfNeeded();
  return authHeaders();
}

async function fetchAll(table, params){
  const url = SUPABASE_URL + "/rest/v1/" + table + "?" + (params||"select=*");
  const doFetch = async ()=> fetch(url, { headers: await getAuthHeaders() });
  let res = await doFetch();
  if(res.status === 401){
    // ログイン直後、発行されたばかりのトークンが一瞬だけ未反映で401になることがあるため、
    // 少し待って1回だけ自動的に再試行する(セッションを即座に破棄しない)。
    await new Promise(r=>setTimeout(r, 600));
    res = await doFetch();
  }
  if(!res.ok){
    if(res.status === 401){ session = null; render(); }
    throw new Error("fetch failed: " + table);
  }
  return res.json();
}

// Supabase(PostgREST)は1回のリクエストで最大1000件までしか返さない設定になっている。
// これはクライアント側から limit=... を指定しても超えられないサーバー側の上限のため、
// 1000件を超える可能性があるテーブル(roster/students/companies等)は、
// limit/offset をクエリパラメータとして直接URLに含める形で1000件ずつページ分けして取得し、
// 全件になるまで繰り返す。
// (Rangeヘッダー方式は、ブラウザのクロスオリジン制限で実際にはヘッダーが送信されず、
//  同じ1ページ目を繰り返し取得してしまう不具合があったため、この方式に変更した)
async function fetchAllPaged(table, params){
  const pageSize = 1000;
  const maxPages = 20; // 安全装置。20000件を超える想定は現状無い
  let all = [];
  let offset = 0;
  for(let page=0; page<maxPages; page++){
    const base = params || "select=*";
    const url = SUPABASE_URL + "/rest/v1/" + table + "?" + base + "&limit=" + pageSize + "&offset=" + offset;
    const doFetch = async ()=> fetch(url, { headers: await getAuthHeaders() });
    let res = await doFetch();
    if(res.status === 401){
      await new Promise(r=>setTimeout(r, 600));
      res = await doFetch();
    }
    if(!res.ok){
      if(res.status === 401){ session = null; render(); }
      throw new Error("fetch failed: " + table);
    }
    const rows = await res.json();
    all = all.concat(rows);
    offset += pageSize;
    if(rows.length < pageSize || rows.length === 0) break; // 最後のページ
  }
  return all;
}

function relTime(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff/60000);
  if(min < 1) return "たった今";
  if(min < 60) return min+"分前";
  const hr = Math.floor(min/60);
  if(hr < 24) return hr+"時間前";
  const day = Math.floor(hr/24);
  return day+"日前";
}

function buildLearnerSummary(){
  const map = {};
  const companyNames = {};
  const companyDekisugiMap = {}; // company_id -> dekisugi_company_id
  dashState.companies.forEach(c=>{
    companyNames[c.company_id] = c.company_name;
    companyDekisugiMap[c.company_id] = c.dekisugi_company_id || null;
  });
  const rosterMap = {};
  dashState.roster.forEach(r=>{ rosterMap[r.company_id + "::" + r.learner_id] = r; });
  // NTLP登録状況の名寄せキー: roster.learner_id = students.dekisugi_student_code
  const studentsByCode = {};
  dashState.students.forEach(s=>{ studentsByCode[s.dekisugi_student_code] = s; });

  // 勤務先(workplaces)の名寄せ: student_workplaces.dekisugi_student_code = roster.learner_id
  // 1人が複数事業所を持てるため、配列で保持する(Phase 3.5)。
  const workplaceById = {};
  dashState.workplaces.forEach(w=>{ workplaceById[w.id] = w; });
  const workplacesByCode = {}; // dekisugi_student_code -> [workplace, ...]
  dashState.studentWorkplaces.forEach(sw=>{
    const w = workplaceById[sw.workplace_id];
    if(!w) return;
    if(!workplacesByCode[sw.dekisugi_student_code]) workplacesByCode[sw.dekisugi_student_code] = [];
    workplacesByCode[sw.dekisugi_student_code].push(w);
  });

  // 期生・号(student_periods)の名寄せ: student_periods.dekisugi_student_code = roster.learner_id
  const periodByCode = {}; // dekisugi_student_code -> { kisei, go }
  dashState.studentPeriods.forEach(sp=>{ periodByCode[sp.dekisugi_student_code] = sp; });

  // ---- roster(組合の実習生管理台帳)を起点に、全員分のエントリを先に作る ----
  // これにより、まだ一度もNTLPを使っていない(学習データが0件の)実習生も一覧に表示される。
  dashState.roster.forEach(r=>{
    const key = r.company_id + "::" + r.learner_id;
    map[key] = { company_id:r.company_id, learner_id:r.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{}, catStats:{} };
  });

  // 学習記録(progress)は全件を読み込まず、データベース側(dash_learner_progress)で集計済みの
  // 「学習者ごと1行」を読む。メインの一覧・成績は今まで通りN4のみが対象(N3は個人カルテのN3タブで見る)。
  // subj={科目:{n,c,tn,tc}} cat={カテゴリ:{n,c}} は、問題とカテゴリの対応表(question_catalog)で集計済み。
  (dashState.progressAgg || []).forEach(r=>{
    const key = r.company_id + "::" + r.learner_id;
    if(!map[key]) map[key] = { company_id:r.company_id, learner_id:r.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{}, catStats:{} };
    map[key].n += r.n;
    map[key].c += r.c;
    map[key].tn += (r.tn || 0);
    map[key].tc += (r.tc || 0);
    map[key].questionsStudied += r.q;
    Object.keys(r.subj || {}).forEach(sj=>{
      const v = r.subj[sj];
      if(!map[key].subjStats[sj]) map[key].subjStats[sj] = {n:0,c:0,tn:0,tc:0};
      map[key].subjStats[sj].n += v.n; map[key].subjStats[sj].c += v.c;
      map[key].subjStats[sj].tn += (v.tn || 0); map[key].subjStats[sj].tc += (v.tc || 0);
    });
    Object.keys(r.cat || {}).forEach(ct=>{
      const v = r.cat[ct];
      if(!map[key].catStats[ct]) map[key].catStats[ct] = {n:0,c:0};
      map[key].catStats[ct].n += v.n; map[key].catStats[ct].c += v.c;
    });
  });
  dashState.exams.forEach(e=>{
    // 模試もメインの一覧ではN4のみ(N3の模試結果は個人カルテのN3タブで見る)
    if((e.level || "n4") !== "n4") return;
    const key = e.company_id + "::" + e.learner_id;
    if(!map[key]) map[key] = { company_id:e.company_id, learner_id:e.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{}, catStats:{} };
    if(!map[key].lastExam || new Date(e.taken_at) > new Date(map[key].lastExam.taken_at)){
      map[key].lastExam = e;
    }
  });
  dashState.activity.forEach(a=>{
    const key = a.company_id + "::" + a.learner_id;
    if(!map[key]) map[key] = { company_id:a.company_id, learner_id:a.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{}, catStats:{} };
    map[key].lastSeen = a.last_seen_at;
  });
  // 日別集計(daily_summary)・学習セッション(study_sessions)は、全件を読み込まない。
  // 個人カルテを開いたときに、その人の分だけ読み込む(loadKarteData)。
  // 推移グラフ用の「初回学習日」は、dash_first_seen で別に読み込んでいる(dashState.firstSeen)。

  Object.keys(map).forEach(key=>{
    const l = map[key];
    l.companyName = companyNames[l.company_id] || null;
    l.companyMapped = Object.prototype.hasOwnProperty.call(companyNames, l.company_id);
    const r = rosterMap[key];
    if(r){
      l.trainingEndDate = r.training_end_date;
      l.learnerName = r.learner_name || null;
      l.learnerNameKana = r.learner_name_kana || null;
      l.inRoster = true;
      l.program = r.program || "gino"; // 'gino'=技能実習 / 'tokutei'=特定技能
    } else {
      l.trainingEndDate = null;
      l.learnerName = null;
      l.learnerNameKana = null;
      l.inRoster = false;
      l.program = "gino";
    }

    // NTLP登録状況: roster.learner_id = students.dekisugi_student_code で名寄せ
    const student = studentsByCode[l.learner_id];
    l.ntlpRegistered = !!student;
    l.studentStatus = student ? student.status : null;

    // 勤務先事業所(Phase 3.5): student_workplaces経由。複数事業所を許容する配列。
    l.workplaces = workplacesByCode[l.learner_id] || [];

    // 期生・号・国籍・在籍フラグ(Phase 3.5): student_periods経由。
    const period = periodByCode[l.learner_id];
    l.kisei = period ? period.kisei : null;
    l.go = period ? period.go : null;
    l.nationality = period ? period.nationality : null;
    l.dekisugiStatus = period ? period.dekisugi_status : null;
    l.statusOverrideFinished = period ? !!period.status_override_finished : false;

    // 実習終了済み判定: roster.training_end_date はほぼ全員空欄で機能しないため、
    // Dekisugiの在籍フラグ名(dekisugi_status)を正とする。
    // 技能実習(program='gino')は「在籍」以外は全て終了済み扱い。
    // (中途帰国・帰国(実習完了)・特定活動中(特定技能等への移行)・他組合管理・入国キャンセル等)
    // 特定技能(program='tokutei')は在籍フラグの値自体が違う(所属中/就業中/転籍(他→自)等の
    // コード変換済みラベル)ため、DB側のjn_ssw_active_statusと同じ活動中ラベルの集合で判定する。
    // どちらも、在籍フラグ自体が無い(student_periodsに一致が無い)場合は判断材料が無いため
    // 終了済みにしない。status_override_finished(号は終了済みだが在籍フラグ未更新の疑い)は共通。
    const SSW_ACTIVE_STATUS_LABELS = ["所属中", "就業中", "転籍(他→自)"];
    if(l.program === "tokutei"){
      l.isFinished = l.dekisugiStatus
        ? (!SSW_ACTIVE_STATUS_LABELS.includes(l.dekisugiStatus) || l.statusOverrideFinished)
        : false;
    } else {
      l.isFinished = l.dekisugiStatus ? (l.dekisugiStatus !== "在籍" || l.statusOverrideFinished) : false;
    }

    // アカウント発行可否: 未登録 かつ 企業マスタに存在 かつ Dekisugi企業IDのマッピング済み
    // ※現時点でこの画面の「アカウント発行」ボタンはcreate_student_account(技能実習用)しか
    //   呼べないため、対象は技能実習(program='gino')のみに限定する。特定技能のアカウント発行は
    //   別途create_ssw_student_accountで対応する(今回はSQLでの一括発行のみ、画面のボタン化は未対応)。
    const dekisugiCompanyId = companyDekisugiMap[l.company_id];
    l.dekisugiCompanyId = dekisugiCompanyId || null;
    l.canIssueAccount = l.program === "gino" && !l.ntlpRegistered && l.companyMapped && !!dekisugiCompanyId;

    // 要フォロー判定: 3日以上未学習 / 進捗20%未満 / 正答率40%未満 / 正答率は高いが翻訳依存度も高い、のいずれか
    const rate = l.n > 0 ? Math.round(l.c/l.n*100) : 0;
    const totalQ = Object.keys(QID_CATEGORY_MAP).length || 191;
    const progressPct = Math.round((l.questionsStudied / totalQ) * 100);
    const daysSinceActive = l.lastSeen ? Math.floor((Date.now() - new Date(l.lastSeen).getTime())/86400000) : null;
    const translationUsageRate = l.n > 0 ? Math.round((l.tn||0)/l.n*100) : null;
    const jaOnlyN = l.n - (l.tn||0), jaOnlyC = l.c - (l.tc||0);
    const japaneseOnlyRate = jaOnlyN > 0 ? Math.round(jaOnlyC/jaOnlyN*100) : null;
    const reasons = [];
    if(daysSinceActive === null || daysSinceActive >= 3) reasons.push("学習停滞（"+(daysSinceActive===null?"未学習":daysSinceActive+"日未学習")+"）");
    if(l.questionsStudied > 0 && progressPct < 20) reasons.push("進捗が低い（"+progressPct+"%）");
    if(l.n > 0 && rate < 40) reasons.push("正答率が低い（"+rate+"%）");
    // 正答率は良好(70%以上)でも、翻訳利用率が高い(50%以上)場合は「日本語だけでは理解できていない可能性」として要フォローに
    if(l.n > 0 && rate >= 70 && translationUsageRate !== null && translationUsageRate >= 50){
      reasons.push("正答率は高いが翻訳利用率も高い（翻訳利用率"+translationUsageRate+"%）");
    }
    l.needsFollowUp = reasons.length > 0 && !l.isFinished && l.questionsStudied > 0; // 何も学習していない人は「未着手」として別枠にする
    l.followUpReasons = reasons;
    l.progressPct = progressPct;
    l.rate = rate;
    l.translationUsageRate = translationUsageRate;
    l.japaneseOnlyRate = japaneseOnlyRate;
    // 最も弱い科目
    let weakestSubj = null;
    Object.keys(l.subjStats).forEach(subj=>{
      const st = l.subjStats[subj];
      const r2 = st.n>0 ? Math.round(st.c/st.n*100) : null;
      if(r2 !== null && (!weakestSubj || r2 < weakestSubj.rate)) weakestSubj = { subj, rate: r2 };
    });
    l.weakestSubj = weakestSubj;
  });

  return Object.values(map).sort((a,b)=>{
    const at = a.lastSeen ? new Date(a.lastSeen).getTime() : 0;
    const bt = b.lastSeen ? new Date(b.lastSeen).getTime() : 0;
    return bt - at;
  });
}

// 企業別 平均進捗・平均正答率ランキング(降順)
function computeCompanyProgressRanking(learners){
  const byCompany = {};
  learners.forEach(l=>{
    if(!byCompany[l.company_id]) byCompany[l.company_id] = { company_id: l.company_id, companyName: l.companyName, learners: [] };
    byCompany[l.company_id].learners.push(l);
  });
  return Object.values(byCompany).map(g=>{
    const withRate = g.learners.filter(l=>l.n > 0);
    const avgRate = withRate.length ? Math.round(withRate.reduce((s,l)=>s+l.rate,0)/withRate.length) : 0;
    const avgProgress = g.learners.length ? Math.round(g.learners.reduce((s,l)=>s+l.progressPct,0)/g.learners.length) : 0;
    return { company_id: g.company_id, companyName: g.companyName, count: g.learners.length, avgRate, avgProgress };
  }).sort((a,b)=> b.avgProgress - a.avgProgress);
}

// 事業所別 要フォロー人数の分布
function computeWorkplaceFollowUpDistribution(learners){
  const byWorkplace = {};
  learners.forEach(l=>{
    const w = l.workplaces && l.workplaces[0];
    const key = w ? w.id : "__unset__";
    const label = w ? w.workplace_name : "未設定";
    if(!byWorkplace[key]) byWorkplace[key] = { workplace_id: key, label, total: 0, followUp: 0 };
    byWorkplace[key].total += 1;
    if(l.needsFollowUp) byWorkplace[key].followUp += 1;
  });
  return Object.values(byWorkplace).sort((a,b)=> b.followUp - a.followUp);
}

// 期生・号別の平均進捗・平均正答率比較
function computePeriodComparison(learners){
  const byPeriod = {};
  learners.forEach(l=>{
    const key = (l.kisei || "不明") + "・" + (l.go || "不明");
    if(!byPeriod[key]) byPeriod[key] = { label: key, learners: [] };
    byPeriod[key].learners.push(l);
  });
  return Object.values(byPeriod).map(g=>{
    const withRate = g.learners.filter(l=>l.n > 0);
    const avgRate = withRate.length ? Math.round(withRate.reduce((s,l)=>s+l.rate,0)/withRate.length) : 0;
    const avgProgress = g.learners.length ? Math.round(g.learners.reduce((s,l)=>s+l.progressPct,0)/g.learners.length) : 0;
    return { label: g.label, count: g.learners.length, avgRate, avgProgress };
  });
}

// 学習継続日数(直近の連続学習日数)。daily_summaryのdailyRowsから算出。
// 今日学習していれば今日から、まだ今日の学習が無ければ昨日から、さかのぼって連続した日数を数える
// (以前の書き方は、3日続いても2日までしか数えられない不具合があった)。
function computeStudyStreakDays(l){
  if(!l.dailyRows || l.dailyRows.length === 0) return 0;
  const pad = (n)=> String(n).padStart(2,"0");
  const fmt = (d)=> d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const dates = new Set(l.dailyRows.map(d=>String(d.summary_date).slice(0,10)));
  const cursor = new Date();
  cursor.setHours(12,0,0,0);  // 12時にそろえて、夏時間などで日付がずれないようにする
  if(!dates.has(fmt(cursor))) cursor.setDate(cursor.getDate()-1);   // 今日まだなら、昨日から数える
  let streak = 0;
  while(dates.has(fmt(cursor))){ streak += 1; cursor.setDate(cursor.getDate()-1); }
  return streak;
}

// 学習セッション集計(study_sessionsベース)。セッション数・累計学習時間(秒)を返す。
// study_sessionsは本機能の実装日以降しか記録がないため、それ以前の学習実績は含まれない。
function computeSessionStats(l){
  const rows = l.studySessions || [];
  const count = rows.length;
  const totalSeconds = rows.reduce((s,r)=> s + (r.duration_seconds || 0), 0);
  return { count, totalSeconds };
}
// 秒数を「1時間12分」「45分」のような表示用文字列にする。
function formatDuration(totalSeconds){
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.round((totalSeconds % 3600) / 60);
  if(h > 0) return h + "時間" + m + "分";
  return m + "分";
}
// 学習カレンダー用データ。year/monthで指定した月の日ごとに、その日の学習種別を返す。
// study_sessions(セッション記録)がある日は種別(練習/模試/両方)が分かる。
// それより前は、日次集計(daily_summary)しか手がかりが無く「学習あり(種別不明)」までしか分からない。
function buildCalendarMonthData(l, year, month){
  const sessionsByDate = {};
  (l.studySessions || []).forEach(s=>{
    const d = new Date(s.started_at);
    if(d.getFullYear() !== year || d.getMonth() !== month) return;
    const key = d.getDate();
    if(!sessionsByDate[key]) sessionsByDate[key] = { practice:false, mock:false };
    if(s.mode === "mock") sessionsByDate[key].mock = true; else sessionsByDate[key].practice = true;
  });
  const dailyDates = new Set();
  (l.dailyRows || []).forEach(d=>{
    const dt = new Date(d.summary_date);
    if(dt.getFullYear() !== year || dt.getMonth() !== month) return;
    dailyDates.add(dt.getDate());
  });
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const out = [];
  for(let day=1; day<=daysInMonth; day++){
    if(sessionsByDate[day]){
      out.push({ day, kind: (sessionsByDate[day].practice && sessionsByDate[day].mock) ? "both" : (sessionsByDate[day].mock ? "mock" : "practice") });
    } else if(dailyDates.has(day)){
      out.push({ day, kind: "unknown" });
    } else {
      out.push({ day, kind: "none" });
    }
  }
  return out;
}

// 模試(exam_log)関連の詳細指標: 科目別の平均点・受験回数
function computeExamDetailStats(exams){
  const byGroup = { moji: {n:0,total:0,attempts:0}, bunpo: {n:0,total:0,attempts:0}, choukai: {n:0,total:0,attempts:0} };
  exams.forEach(e=>{
    const g = e.exam_group === "moji" ? "moji" : e.exam_group === "choukai" ? "choukai" : "bunpo";
    if(!byGroup[g]) return;
    byGroup[g].n += e.correct || 0;
    byGroup[g].total += e.total || 0;
    byGroup[g].attempts += 1;
  });
  const result = {};
  Object.keys(byGroup).forEach(g=>{
    const st = byGroup[g];
    result[g] = { attempts: st.attempts, avgPct: st.total > 0 ? Math.round(st.n/st.total*100) : 0 };
  });
  return result;
}

// ---- データの読み込み(集計はデータベース側で行う) ----
// 以前は、学習記録(progress)・日別集計・学習セッションの全件を読み込んでいた。
// 1回に1,000件・最大20ページ(20,000件)までしか読めず、超えた分は、エラーも出さずに切り捨てられるため、
// 利用者が増えると、画面の数字が静かに少なくなる問題があった。
// 今は、データベース側の集計関数(dashboard_aggregation.sql)で、集計済みのデータだけを読む。
// 個人カルテは、開いたときに、その人の分だけ読み込む(loadKarteData)。

// RPC(データベースの関数の呼び出し)も、1回に1,000件までしか返らないため、limit/offsetで1,000件ずつ読む。
async function fetchRpcPaged(name, args, order){
  const pageSize = 1000;
  const maxPages = 50;
  let all = [];
  let offset = 0;
  for(let page=0; page<maxPages; page++){
    const url = SUPABASE_URL + "/rest/v1/rpc/" + name + "?limit=" + pageSize + "&offset=" + offset + (order ? "&order=" + order : "");
    const doFetch = async ()=> fetch(url, { method: "POST", headers: await getAuthHeaders(), body: JSON.stringify(args || {}) });
    let res = await doFetch();
    if(res.status === 401){
      await new Promise(r=>setTimeout(r, 600));
      res = await doFetch();
    }
    if(!res.ok){
      if(res.status === 401){ session = null; render(); }
      throw new Error("rpc failed: " + name);
    }
    const rows = await res.json();
    all = all.concat(rows);
    offset += pageSize;
    if(rows.length < pageSize) break;
  }
  return all;
}

// ---- 保険: 集計関数がデータベースにまだ無い場合(SQL未実行など)は、従来どおり全件を読んで、ここで同じ形に集計する ----
function aggregateProgressClient(rows){
  const by = {};
  rows.forEach(p=>{
    const level = p.level || (String(p.question_id||"").startsWith("N3-") ? "n3" : "n4");
    if(level !== "n4") return;
    const key = p.company_id + "::" + p.learner_id;
    if(!by[key]) by[key] = { company_id:p.company_id, learner_id:p.learner_id, n:0, c:0, tn:0, tc:0, q:0, subj:{}, cat:{} };
    const r = by[key];
    r.n += p.n_count; r.c += p.c_count; r.tn += (p.tn_count||0); r.tc += (p.tc_count||0); r.q += 1;
    const meta = QID_CATEGORY_MAP[p.question_id];
    if(meta){
      if(!r.subj[meta.subj]) r.subj[meta.subj] = {n:0,c:0,tn:0,tc:0};
      r.subj[meta.subj].n += p.n_count; r.subj[meta.subj].c += p.c_count;
      r.subj[meta.subj].tn += (p.tn_count||0); r.subj[meta.subj].tc += (p.tc_count||0);
      if(!r.cat[meta.cat]) r.cat[meta.cat] = {n:0,c:0};
      r.cat[meta.cat].n += p.n_count; r.cat[meta.cat].c += p.c_count;
    }
  });
  return Object.values(by);
}
function aggregateQuestionStatsClient(rows){
  const by = {};
  rows.forEach(p=>{
    const level = p.level || (String(p.question_id||"").startsWith("N3-") ? "n3" : "n4");
    const key = level + "|" + p.question_id;
    if(!by[key]) by[key] = { level, question_id:p.question_id, n:0, c:0 };
    by[key].n += p.n_count; by[key].c += p.c_count;
  });
  return Object.values(by);
}
function aggregateFirstSeenClient(rows){
  const by = {};
  rows.forEach(d=>{
    if(!d.learner_id || !d.summary_date) return;
    const key = d.company_id + "::" + d.learner_id;
    if(!by[key] || d.summary_date < by[key].first_seen) by[key] = { company_id:d.company_id, learner_id:d.learner_id, first_seen:d.summary_date };
  });
  return Object.values(by);
}

async function fetchDashboardBundle(){
  // 保険用の全件取得は、必要になったときに1回だけ行う(同時に複数が必要になっても、取得は1回)
  let rawProgressP = null, rawDailyP = null;
  const getRawProgress = ()=> rawProgressP || (rawProgressP = fetchAllPaged("progress"));
  const getRawDaily = ()=> rawDailyP || (rawDailyP = fetchAllPaged("daily_summary", "select=*&order=summary_date.desc").catch(()=>[]));
  const [progressAgg, questionStats, firstSeen, exams, activity, companies, roster, students, workplaces, studentWorkplaces, studentPeriods] = await Promise.all([
    fetchRpcPaged("dash_learner_progress", { p_level: "n4" }, "company_id,learner_id").catch(async ()=> aggregateProgressClient(await getRawProgress())),
    fetchRpcPaged("dash_question_stats", {}, "level,question_id").catch(async ()=> aggregateQuestionStatsClient(await getRawProgress())),
    fetchRpcPaged("dash_first_seen", {}, "company_id,learner_id").catch(async ()=> aggregateFirstSeenClient(await getRawDaily())),
    fetchAllPaged("exam_log", "select=*&order=taken_at.desc"),
    fetchAllPaged("learner_activity"),
    fetchAllPaged("companies", "select=*&order=company_id").catch(()=>[]),
    fetchAllPaged("roster", "select=*&order=company_id,learner_id").catch(()=>[]),
    fetchAllPaged("students", "select=*&order=id").catch(()=>[]),
    fetchAllPaged("workplaces", "select=*&order=company_id").catch(()=>[]),
    fetchAllPaged("student_workplaces", "select=*&order=dekisugi_student_code").catch(()=>[]),
    fetchAllPaged("student_periods", "select=*&order=dekisugi_student_code").catch(()=>[])
  ]);
  return { progressAgg, questionStats, firstSeen, exams, activity, companies, roster, students, workplaces, studentWorkplaces, studentPeriods };
}

// 個人カルテ: その人の学習記録・日別集計・学習セッションだけを読み込む
async function loadKarteData(sel){
  const key = sel.company_id + "::" + sel.learner_id;
  const cq = "company_id=eq." + encodeURIComponent(sel.company_id) + "&learner_id=eq." + encodeURIComponent(sel.learner_id);
  // 学習セッションは、学習者のID(学生コードではなくUUID)で保存されているため、学生コードから引く
  const st = (dashState.students || []).find(x=>x.dekisugi_student_code === sel.learner_id);
  try{
    const [progress, daily, sessions] = await Promise.all([
      fetchAllPaged("progress", "select=*&" + cq + "&order=question_id"),
      fetchAllPaged("daily_summary", "select=*&" + cq + "&order=summary_date.desc").catch(()=>[]),
      st ? fetchAllPaged("study_sessions", "select=*&student_id=eq." + encodeURIComponent(st.id) + "&order=started_at.desc").catch(()=>[]) : Promise.resolve([])
    ]);
    if(dashState.karteData && dashState.karteData.key === key){
      Object.assign(dashState.karteData, { progress, daily, sessions, loading:false });
    }
  }catch(e){
    if(dashState.karteData && dashState.karteData.key === key){
      dashState.karteData.loading = false; dashState.karteData.error = true;
    }
  }
}

// 学習履歴: 1ページ分(30件)を読み込む。集計関数が無い場合の保険として、全件を読んで切り出す。
async function loadHistoryPage(pageIdx, pageSize){
  dashState.historyPages = dashState.historyPages || {};
  try{
    const rows = await fetchRpcPaged("dash_history_page", { p_limit: pageSize, p_offset: pageIdx * pageSize });
    // この関数は1ページ分(最大200件)だけを返す。fetchRpcPagedの1,000件単位のページ分けとは別なので、
    // 返ってきた行をそのまま1ページ分として扱う。
    dashState.historyPages[pageIdx] = { rows: rows.slice(0, pageSize) };
    if(rows.length > 0) dashState.historyTotal = rows[0].total;
  }catch(e){
    if(!dashState._histFallbackRows){
      dashState._histFallbackRows = await fetchAllPaged("daily_summary", "select=*&n_count=gt.0&order=summary_date.desc").catch(()=>[]);
    }
    const all = dashState._histFallbackRows;
    dashState.historyTotal = all.length;
    dashState.historyPages[pageIdx] = { rows: all.slice(pageIdx*pageSize, pageIdx*pageSize + pageSize) };
  }
}

async function loadDashboardData(){
  dashState.loading = true; dashState.error = null;

  try{

    dashState.loading = false;
    dashState.error = "データの取得に失敗しました。時間をおいて再読み込みしてください。";

}

  if(dashState.selectedLearner) return ["学習者の詳細", "個人の学習状況を確認できます"];

  if(t === "overview") return ["学習ダッシュボード", "実習生の学習状況を可視化し、効率的なサポートにつなげます"];
  if(t === "learners") return ["実習生", "登録されている実習生の一覧と管理"];
  if(t === "learning"){
    const sub = (LEARNING_SUBTAB_DEFS.find(x=>x.id === dashState.learningSubTab) || {}).label || "";
    return ["学習" + (sub ? " ／ " + sub : ""), "学習状況の分析とフォロー"];
  }
  if(t === "companies") return ["企業・事業所", "企業・事業所の登録状況"];
  if(t === "reports") return ["レポート", "集計データの出力"];
  if(t === "settings") return ["設定", "アカウント情報"];
  return ["ダッシュボード", ""];
}

function ensureOverviewData(){

  Promise.all([
    fetchRpcPaged("dash_daily_series", { p_days: 31, p_level: "n4" }, "day"),

function ovNice(v){
  if(v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / p;
  const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return n * p;
}
function ovLine(o){
  const W = o.w || 600, H = o.h || 190, pl = 36, pr = 8, pt = 10, pb = 24;
  const iw = W - pl - pr, ih = H - pt - pb, n = o.labels.length;
  const all = o.series.reduce((a,s)=>a.concat(s.values), []);
  const maxV = o.max != null ? o.max : ovNice(Math.max(1, ...all) * 1.05);
  const x = (i)=> pl + (n <= 1 ? iw / 2 : iw * i / (n - 1));
  const y = (v)=> pt + ih - ih * (v / maxV);
  let g = "";
  for(let k = 0; k <= 4; k++){
    const v = maxV * k / 4, yy = y(v);
    g += '<line x1="'+pl+'" y1="'+yy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+yy.toFixed(1)+'" stroke="#E8ECF4" stroke-width="1"/>'+
         '<text class="ax" x="'+(pl-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+(o.fmt ? o.fmt(v) : Math.round(v))+'</text>';
  }
  const step = Math.max(1, Math.ceil(n / (W < 400 ? 5 : 7)));
  let xl = "";
  o.labels.forEach((lb,i)=>{ if(i % step === 0 || i === n - 1) xl += '<text class="ax" x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+lb+'</text>'; });
  let paths = "", defs = "";
  o.series.forEach((s,si)=>{
    const pts = s.values.map((v,i)=>[x(i), y(v)]);
    const d = pts.map((p,i)=>(i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    if(s.area){
      const id = "ovg" + si + Math.floor(Math.random()*1e6);
      defs += '<linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+s.color+'" stop-opacity=".25"/><stop offset="1" stop-color="'+s.color+'" stop-opacity=".02"/></linearGradient>';
      paths += '<path d="'+d+' L'+pts[pts.length-1][0].toFixed(1)+','+(pt+ih)+' L'+pts[0][0].toFixed(1)+','+(pt+ih)+' Z" fill="url(#'+id+')"/>';
    }
    paths += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    if(n <= 31) pts.forEach(p=>{ paths += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(n > 16 ? 2.2 : 3.2)+'" fill="#fff" stroke="'+s.color+'" stroke-width="1.8"/>'; });
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><defs>'+defs+'</defs>'+g+paths+xl+'</svg>';
}
function ovBars(o){
  const W = o.w || 600, H = o.h || 190, pl = 36, pr = 8, pt = 10, pb = 24;
  const iw = W - pl - pr, ih = H - pt - pb, n = o.labels.length;
  const maxV = ovNice(Math.max(0.1, ...o.values) * 1.1);
  const bw = Math.max(2, iw / n * 0.62), gap = iw / n;
  let g = "";
  for(let k = 0; k <= 4; k++){
    const v = maxV * k / 4, yy = pt + ih - ih * (v / maxV);
    g += '<line x1="'+pl+'" y1="'+yy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+yy.toFixed(1)+'" stroke="#E8ECF4" stroke-width="1"/>'+
         '<text class="ax" x="'+(pl-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+(o.fmt ? o.fmt(v) : Math.round(v))+'</text>';
  }
  let bars = "", xl = "";
  const step = Math.max(1, Math.ceil(n / (W < 400 ? 6 : 10)));
  o.values.forEach((v,i)=>{
    const h = ih * (v / maxV), xx = pl + gap * i + (gap - bw) / 2;
    bars += '<rect x="'+xx.toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="2" fill="'+o.color+'" opacity="'+(v > 0 ? 0.9 : 0.25)+'"/>';
    if(i % step === 0 || i === n - 1) xl += '<text class="ax" x="'+(xx+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+o.labels[i]+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+g+bars+xl+'</svg>';
}
function ovDonut(parts, total){
  const R = 70, C = 2 * Math.PI * R;
  let off = 0, s = '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="'+R+'" fill="none" stroke="#EEF1F7" stroke-width="26"/>';
  parts.forEach(p=>{
    if(p.v <= 0 || total <= 0) return;
    const len = C * p.v / total;
    s += '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="'+p.color+'" stroke-width="26" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off += len;
  });
  return s + '</svg>';
}
function ovChip(delta, unit, digits){
  if(delta === null || delta === undefined || !isFinite(delta)) return "";
  const d = digits != null ? Number(delta.toFixed(digits)) : Math.round(delta);
  if(d === 0) return '<span class="ov-chip flat">― 前週比 0'+unit+'</span>';
  return '<span class="ov-chip '+(d > 0 ? "up" : "down")+'">'+(d > 0 ? "▲ +"+d : "▼ "+Math.abs(d))+unit+' 前週比</span>';
}

  const isMobile = window.innerWidth < 1100;
  const wideW = isMobile ? 340 : 600, narrowW = isMobile ? 340 : 300;
  const mtab = dashState.ovMTab || "status";
  const hideUnless = (key)=> (key === "always" || key === mtab) ? "" : " ov-m-hide";

  // ---- 主要指標 ----
  // 前週比は「今週(直近7日)と、その前の7日」で比べられるものだけに出す(今週学習の人数・正答率)。
  // 学習対象・学習中・未学習・要フォロー・平均進捗は、過去の時点の記録が残っていないため、矢印は出さない。
  const accThis = wThis && wThis.questions > 0 ? wThis.correct / wThis.questions * 100 : null;
  const accPrev = wPrev && wPrev.questions > 0 ? wPrev.correct / wPrev.questions * 100 : null;
  const dWeekLearners = (wThis && wPrev && wPrev.learners > 0) ? wThis.learners - wPrev.learners : null;
  const dAcc = (accThis !== null && accPrev !== null) ? accThis - accPrev : null;
  const goFollow = ()=>{ dashState.learningLearnerFilter = "followup"; dashState.learningSubTab = "learners"; dashState.learningLearnerPage = 0; switchTab("learning"); };
  const kpi = (opt)=>{
    const col = OV_COLORS[opt.color];
    const k = el('<div class="ov-kpi'+(opt.onclick ? ' click' : '')+(opt.sec ? ' sec' : '')+'"></div>');
    k.innerHTML = '<div class="ov-kpi-top"><div class="ov-kpi-ico" style="background:'+col.bg+';color:'+col.c+';">'+STAT_ICONS[opt.icon]+'</div><div class="ov-kpi-lbl">'+opt.label+'</div></div>'+
      '<div class="ov-kpi-num"'+(opt.alert ? ' style="color:'+OV_COLORS.red.c+'"' : '')+'>'+opt.value+'<small>'+opt.unit+'</small></div>'+
      '<div class="ov-kpi-sub">'+(opt.chip || '')+'<span class="ov-cap">'+(opt.cap || '')+'</span></div>';
    if(opt.onclick) k.onclick = opt.onclick;
    return k;
  };
  const kpis = el('<div class="ov-kpis"></div>');
  kpis.appendChild(kpi({ icon:"users", color:"blue", label: c.scope.isAdmin ? "学習対象" : "学習対象", value: fmtNum(total), unit:"人", cap:"登録している実習生" }));
  kpis.appendChild(kpi({ icon:"book", color:"green", label:"学習中", value: fmtNum(c.studying.length), unit:"人", cap: pct(c.studying.length) }));
  kpis.appendChild(kpi({ icon:"userOff", color:"gray", label:"未学習", value: fmtNum(c.notStudied.length), unit:"人", cap: pct(c.notStudied.length) }));
  kpis.appendChild(kpi({ icon:"alertTriangle", color:"red", label:"要フォロー", value: fmtNum(c.followUps.length), unit:"人", alert: c.followUps.length > 0, cap: pct(c.followUps.length), onclick: c.followUps.length > 0 ? goFollow : null }));
  kpis.appendChild(kpi({ icon:"calendar", color:"purple", label:"今週学習", value: fmtNum(c.thisWeek.length), unit:"人", sec:true, chip: ovChip(dWeekLearners, "人"), cap: dWeekLearners === null ? pct(c.thisWeek.length) : "" }));
  kpis.appendChild(kpi({ icon:"trendingUp", color:"orange", label:"平均進捗", value: c.avgProgress, unit:"%", sec:true, cap:"全問題に対する消化率" }));
  kpis.appendChild(kpi({ icon:"target", color:"green", label:"平均正答率", value: c.avgRate, unit:"%", sec:true, chip: ovChip(dAcc, "pt", 1), cap: dAcc === null ? "学習した人の平均" : "" }));
  root.appendChild(kpis);

  // スマホ: 残り3つの指標を1行に並べる
  const strip = el('<div class="ov-m-strip"></div>');
  const sItem = (l, v, u, d)=> '<div class="it"><div class="l">'+l+'</div><div class="v">'+v+'<small>'+u+'</small></div>'+(d || '')+'</div>';
  const dTxt = (x, unit, dg)=>{ if(x === null || !isFinite(x)) return ''; const v = dg != null ? Number(x.toFixed(dg)) : Math.round(x); return '<div class="d '+(v > 0 ? 'up' : v < 0 ? 'down' : '')+'">'+(v > 0 ? '▲ +'+v : v < 0 ? '▼ '+Math.abs(v) : '― 0')+unit+' 前週比</div>'; };
  strip.innerHTML = sItem("今週学習", fmtNum(c.thisWeek.length), "人", dTxt(dWeekLearners, "人")) + sItem("平均進捗", c.avgProgress, "%", "") + sItem("平均正答率", c.avgRate, "%", dTxt(dAcc, "pt", 1));
  root.appendChild(strip);

  // スマホ: 切り替えボタン
  const seg = el('<div class="m-seg"></div>');
  [["status","学習状況"],["time","学習時間"],["grade","成績・模試"],["follow","要フォロー"]].forEach(([id,lb])=>{
    const b = el('<button'+(mtab === id ? ' class="active"' : '')+'></button>'); b.textContent = lb;
    b.onclick = ()=>{ dashState.ovMTab = id; render(); };
    seg.appendChild(b);
  });
  root.appendChild(seg);

  const grid = el('<div class="ov-grid"></div>');

  // ---- 学習者の状況(ドーナツ) ----
  {
    // 円は重ならない4区分(未学習 → 要フォロー → 今週学習 → 学習中(その他))に分ける。凡例の人数は、区分が重なる場合を含む。
    const nsSet = new Set(c.notStudied), fuSet = new Set(c.followUps), twSet = new Set(c.thisWeek);
    let pNot = 0, pFollow = 0, pWeek = 0, pOther = 0;
    c.learners.forEach(l=>{
      if(nsSet.has(l)) pNot++; else if(fuSet.has(l)) pFollow++; else if(twSet.has(l)) pWeek++; else pOther++;
    });
    const body = el('<div class="ov-donut-row"></div>');
    body.innerHTML =
      '<div class="ov-donut">'+ovDonut([{v:pWeek,color:OV_COLORS.green.c},{v:pOther,color:OV_COLORS.blue.c},{v:pFollow,color:OV_COLORS.red.c},{v:pNot,color:OV_COLORS.gray.c}], total)+'<div class="ov-donut-c"><b>'+fmtNum(total)+'</b><span>実習生</span></div></div>'+
      '<div class="ov-legend">'+
        '<div class="ov-lg"><i style="background:'+OV_COLORS.blue.c+'"></i><span class="nm">学習中</span><b>'+fmtNum(c.studying.length)+'人</b><em>('+pct(c.studying.length)+')</em></div>'+
        '<div class="ov-lg"><i style="background:'+OV_COLORS.green.c+'"></i><span class="nm">今週学習<small>学習中の内数</small></span><b>'+fmtNum(c.thisWeek.length)+'人</b><em>('+pct(c.thisWeek.length)+')</em></div>'+
        '<div class="ov-lg"><i style="background:'+OV_COLORS.red.c+'"></i><span class="nm">要フォロー</span><b>'+fmtNum(c.followUps.length)+'人</b><em>('+pct(c.followUps.length)+')</em></div>'+
        '<div class="ov-lg"><i style="background:'+OV_COLORS.gray.c+'"></i><span class="nm">未学習</span><b>'+fmtNum(c.notStudied.length)+'人</b><em>('+pct(c.notStudied.length)+')</em></div>'+
      '</div>';
    const wrapB = el('<div></div>'); wrapB.appendChild(body);
    wrapB.appendChild(el('<div class="ov-foot">※ 今週学習・要フォローは、他の区分と重複する場合があります</div>'));
    const col = ovCard("ov-g-a"+hideUnless("always"), "学習者の状況", STAT_ICONS.usersGroup || STAT_ICONS.users, "blue", wrapB);
    grid.appendChild(col);
  }

  // ---- 分野別 正答率 ----
  {
    const tot = {}; OV_SUBJ.forEach(s=>{ tot[s.id] = { n:0, c:0 }; });
    c.learners.forEach(l=>{ OV_SUBJ.forEach(s=>{ const v = (l.subjStats || {})[s.id]; if(v){ tot[s.id].n += v.n; tot[s.id].c += v.c; } }); });
    const hb = el('<div class="ov-hb"></div>');
    OV_SUBJ.forEach(s=>{
      const v = tot[s.id], r = v.n > 0 ? Math.round(v.c / v.n * 100) : null;
      const row = el('<div></div>');
      row.innerHTML = '<div class="ov-hb-row"><div class="ov-hb-lbl">'+s.label+'</div><div class="ov-hb-track"><div class="ov-hb-fill" style="width:'+(r === null ? 0 : r)+'%;background:'+s.color+'"></div></div><div class="ov-hb-val">'+(r === null ? '-' : r+'<small>%</small>')+'</div></div>';
      hb.appendChild(row);
    });
    grid.appendChild(ovCard("ov-g-b"+hideUnless("status"), "分野別 正答率（4科目）", STAT_ICONS.target, "green", hb));
  }

  // ---- 学習活動の推移 ----
  {
    const period = dashState.ovPeriod || 30, ttab = dashState.ovTrend || "learners";
    const body = el('<div></div>');
    const bar = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;"></div>');
    const tabs = el('<div class="ov-tabs"></div>');
    [["learners","学習者数"],["sessions","セッション数"],["questions","問題数"],["time","学習時間"]].forEach(([id,lb])=>{
      const b = el('<button class="ov-tab'+(ttab === id ? ' active' : '')+'"></button>'); b.textContent = lb;
      b.onclick = ()=>{ dashState.ovTrend = id; render(); };
      tabs.appendChild(b);
    });
    bar.appendChild(tabs);
