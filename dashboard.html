    const per = el('<div class="ov-period"></div>');
    [7,30].forEach(d=>{ const b = el('<button class="ov-tab'+(period === d ? ' active' : '')+'"></button>'); b.textContent = d+"日"; b.onclick = ()=>{ dashState.ovPeriod = d; render(); }; per.appendChild(b); });
    bar.appendChild(per);
    body.appendChild(bar);
    if(!rows){
      body.appendChild(el(ovWait(dashState.ovState === "error" ? "集計中" : "読み込み中...", dashState.ovState === "error" ? "推移のデータを準備しています(データベースの集計関数を設定すると表示されます)" : "")));
    } else {
      const sl = rows.slice(-period);
      const vals = sl.map(r=> ttab === "learners" ? r.learners : ttab === "sessions" ? r.sessions : ttab === "questions" ? r.questions : r.seconds / 3600);
      const hasData = vals.some(v=>v > 0);
      if(!hasData){
        body.appendChild(el(ovWait("集計中", ttab === "sessions" || ttab === "time" ? "セッション・学習時間は10/1から記録しています。データがたまると表示されます" : "この期間の学習データがありません")));
      } else {
        const colr = ttab === "learners" ? OV_COLORS.blue.c : ttab === "sessions" ? OV_COLORS.green.c : ttab === "questions" ? OV_COLORS.orange.c : OV_COLORS.purple.c;
        const ch = el('<div class="ov-chart"></div>');
        ch.innerHTML = ovLine({ labels: sl.map(r=>ovMD(r.day)), series:[{ values: vals, color: colr, area:true }], w: wideW, fmt: ttab === "time" ? (v)=> (Math.round(v*10)/10) : null });
        body.appendChild(ch);
        if(ttab === "sessions" || ttab === "time") body.appendChild(el('<div class="ov-foot">※ セッション・学習時間は10/1から記録しています</div>'));
      }
    }
    grid.appendChild(ovCard("ov-g-c"+hideUnless("status"), "学習活動の推移", STAT_ICONS.trendingUp, "blue", body));
  }

  // ---- 今月の学習時間 ----
  {
    const body = el('<div></div>');
    if(!rows){
      body.appendChild(el(ovWait("集計中", "")));
    } else {
      const ym = (function(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); })();
      const month = rows.filter(r=>String(r.day).slice(0,7) === ym);
      const secs = month.reduce((a,r)=>a + r.seconds, 0);
      if(secs <= 0){
        body.appendChild(el(ovWait("集計中", "学習時間は10/1から記録しています。データがたまると表示されます")));
      } else {
        const hrs = secs / 3600;
        body.appendChild(el('<div class="ov-big"><b>'+(Math.round(hrs*10)/10)+'</b><span>時間</span></div>'));
        const ch = el('<div class="ov-chart"></div>');
        const now0 = new Date(), dim = new Date(now0.getFullYear(), now0.getMonth()+1, 0).getDate();
        const byDay = {}; month.forEach(r=>{ byDay[Number(String(r.day).slice(8,10))] = r.seconds / 3600; });
        const dl = [], dv = []; for(let d = 1; d <= dim; d++){ dl.push(String(d)); dv.push(byDay[d] || 0); }
        ch.innerHTML = ovBars({ labels: dl, values: dv, color: OV_COLORS.blue.c, h:170, w: narrowW, fmt:(v)=>Math.round(v*10)/10 });
        body.appendChild(ch);
        body.appendChild(el('<div class="ov-foot">※ 10/1から記録しています</div>'));
      }
    }
    grid.appendChild(ovCard("ov-g-d"+hideUnless("time"), "今月の学習時間", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>', "blue", body));
  }

  // ---- 平均正答率の推移 ----
  {
    const body = el('<div></div>');
    const period = dashState.ovPeriod || 30;
    if(!rows){
      body.appendChild(el(ovWait("集計中", "")));
    } else {
      const sl = rows.slice(-period).filter(r=>r.questions > 0);
      if(sl.length < 2){
        body.appendChild(el(ovWait("集計中", "2日以上の学習データがたまると表示されます")));
      } else {
        const vals = sl.map(r=> Math.round(r.correct / r.questions * 1000) / 10);
        const last = vals[vals.length - 1];
        body.appendChild(el('<div class="ov-big"><b>'+last+'</b><span>%</span></div>'));
        const ch = el('<div class="ov-chart"></div>');
        ch.innerHTML = ovLine({ labels: sl.map(r=>ovMD(r.day)), series:[{ values: vals, color: OV_COLORS.red.c, area:true }], max:100, h:170, w: narrowW, fmt:(v)=>Math.round(v) });
        body.appendChild(ch);
      }
    }
    grid.appendChild(ovCard("ov-g-e"+hideUnless("grade"), "平均正答率の推移", STAT_ICONS.target, "red", body));
  }

  // ---- 模試成績 ----
  {
    const body = el('<div></div>');
    const exams = (dashState.exams || []).filter(e=> !e.level || e.level === "n4");
    const groups = [{ id:"moji", label:"文字・語彙", color:OV_COLORS.blue.c }, { id:"bunpo", label:"文法・読解", color:OV_COLORS.orange.c }, { id:"choukai", label:"聴解", color:OV_COLORS.purple.c }];
    if(exams.length === 0){
      body.appendChild(el(ovWait("集計中", "模試の受験データがたまると表示されます")));
    } else {
      const agg = {}; groups.forEach(g=>{ agg[g.id] = { c:0, t:0, a:0 }; });
      exams.forEach(e=>{ const g = e.exam_group === "moji" ? "moji" : e.exam_group === "choukai" ? "choukai" : "bunpo"; agg[g].c += e.correct || 0; agg[g].t += e.total || 0; agg[g].a += 1; });
      const hb = el('<div class="ov-hb"></div>');
      groups.forEach(g=>{
        const v = agg[g.id], r = v.t > 0 ? Math.round(v.c / v.t * 100) : null;
        const row = el('<div></div>');
        row.innerHTML = '<div class="ov-hb-row"><div class="ov-hb-lbl">'+g.label+'</div><div class="ov-hb-track"><div class="ov-hb-fill" style="width:'+(r === null ? 0 : r)+'%;background:'+g.color+'"></div></div><div class="ov-hb-val">'+(r === null ? '-' : r+'<small>%</small>')+'</div></div>';
        hb.appendChild(row);
      });
      body.appendChild(hb);
      body.appendChild(el('<div class="ov-foot">受験 '+fmtNum(exams.length)+' 回の合算</div>'));
    }
    grid.appendChild(ovCard("ov-g-f"+hideUnless("grade"), "模試成績", STAT_ICONS.fileText, "purple", body));
  }

  // ---- 要フォローの実習生 ----
  {
    const sorted = c.followUps.slice().sort((a,b)=>{
      const at = a.lastSeen ? new Date(a.lastSeen).getTime() : 0, bt = b.lastSeen ? new Date(b.lastSeen).getTime() : 0;
      return at - bt;
    });
    const body = el('<div></div>');
    if(sorted.length === 0){
      body.appendChild(el('<div class="ov-empty">要フォローの実習生はいません</div>'));
    } else {
      body.appendChild(el('<div class="ov-fl-head"><div>氏名</div><div>所属（企業・事業所）</div><div>フォロー理由</div><div style="text-align:right;">最終学習日</div></div>'));
      sorted.slice(0, 5).forEach(l=>{
        const row = el('<div class="ov-fl-row"></div>');
        const reason = (l.followUpReasons && l.followUpReasons[0]) || "要フォロー";
        const warn = !/未学習|停滞/.test(reason);
        const last = l.lastSeen ? new Date(l.lastSeen) : null;
        const co = (l.companyName || l.company_id) + (l.workplaceName ? "・" + l.workplaceName : "");
        row.innerHTML = '<div class="ov-fl-name">'+escapeHtml(l.learnerName || l.learner_id)+'</div><div class="ov-fl-co">'+escapeHtml(co)+'</div><div class="ov-fl-reasoncell"><span class="ov-reason'+(warn ? ' warn' : '')+'">'+escapeHtml(reason)+'</span></div><div class="ov-fl-date">'+(last ? last.getFullYear()+"/"+String(last.getMonth()+1).padStart(2,"0")+"/"+String(last.getDate()).padStart(2,"0") : "未学習")+'</div>';
        row.onclick = ()=> openKarte(l.company_id, l.learner_id);
        body.appendChild(row);
      });
    }
    const link = sorted.length > 5 ? '<button class="ov-card-link" id="ovFollowAll">すべて見る →</button>' : '';
    const col = ovCard("ov-g-g"+hideUnless("follow"), "要フォローの実習生 <span class='ov-card-note' style='color:"+OV_COLORS.red.c+"'>（"+fmtNum(sorted.length)+"人）</span>", STAT_ICONS.alertTriangle, "red", body, link);
    const lk = col.querySelector("#ovFollowAll"); if(lk) lk.onclick = goFollow;
    grid.appendChild(col);
  }

  root.appendChild(grid);
  wrap.appendChild(root);
}

function buildSummaryContent(wrap, tab){
  tab = tab || "overview";
  const scope = sessionScope();
  // 企業フィルタは表(テーブル)側だけの絞り込みなのでここでは適用しないが、
  // 実習終了済みの実習生は、この全体サマリーからも一律で除外する(現在学習中の実習生のみを扱う運用のため)。
  let learners = buildLearnerSummary().filter(l=>!l.isFinished);
  // 企業担当者はRLSで自社データしか取得できていないので、そのまま全件が対象になる

  const totalLearners = learners.length;
  const ntlpRegistered = learners.filter(l=>l.ntlpRegistered);
  const ntlpUnregistered = learners.filter(l=>!l.ntlpRegistered);
  const canIssue = learners.filter(l=>l.canIssueAccount);
  const companyMappingMissing = learners.filter(l=>!l.ntlpRegistered && l.companyMapped && !l.dekisugiCompanyId);
  const studying = learners.filter(l=>l.questionsStudied > 0 && !l.isFinished);
  const thisWeek = learners.filter(l=>l.lastSeen && (Date.now()-new Date(l.lastSeen).getTime()) <= 7*86400000);
  const followUps = learners.filter(l=>l.needsFollowUp);
  const notStudied = learners.filter(l=>l.questionsStudied === 0);
  const withRate = learners.filter(l=>l.n > 0);
  const avgRate = withRate.length ? Math.round(withRate.reduce((s,l)=>s+l.rate,0)/withRate.length) : 0;
  const avgProgress = learners.length ? Math.round(learners.reduce((s,l)=>s+l.progressPct,0)/learners.length) : 0;

  // 概要タブは、新しいデザイン(buildOverviewV2)で描く。他のタブの上部の要約は従来のまま。
  if(tab === "overview"){
    buildOverviewV2(wrap, { scope, learners, totalLearners, studying, thisWeek, followUps, notStudied, avgRate, avgProgress });
    return;
  }

  const KPI_WAVE_SVG_TPL = '<svg class="kpi-card-wave" style="color:COLORPLACEHOLDER;" viewBox="0 0 200 40" preserveAspectRatio="none"><path d="M0,28 C 30,10 50,34 80,20 C 110,6 130,30 160,18 C 180,10 190,20 200,14 L200,40 L0,40 Z" fill="currentColor"/></svg>';
  const block = (num, lbl, opts)=>{
    opts = opts || {};
    const color = opts.alert ? "red" : (opts.color || "gray");
    const c = STAT_COLORS[color];
    const cardStyle = opts.card ? " style='background:"+c.bg+";'" : "";
    // 数字が長すぎてカードからはみ出す場合だけ縮小する(例:「1,027人」のようにカンマ区切りで
    // 7文字以上になるケース)。「613人」「577人」のような普通の3桁+単位(4文字)までは
    // 縮小せず、同じ行のKPIカード同士でサイズが揃うようにする。
    const numLongClass = String(num).length >= 7 ? " num-long" : "";
    const b = el('<div class="stat-block'+(opts.card?' kpi-card':'')+(opts.waveSubtle?' wave-subtle':'')+(opts.alert?' alert':'')+'"'+cardStyle+'></div>');
    const waveHtml = opts.card ? KPI_WAVE_SVG_TPL.replace("COLORPLACEHOLDER", c.icon) : "";
    const iconHtml = opts.icon ? "<div class='stat-icon' style='background:"+(opts.card?"#fff":c.bg)+";color:"+c.icon+";'>"+STAT_ICONS[opts.icon]+"</div>" : "";
    // 構造を「アイコン+タイトル(1行、常に左上固定)」→「数字(補足)を1行で、残りの高さで縦中央」の
    // 2段に分ける。補足を数字の下ではなく同じ行に置くことで、補足の有無でカードの見た目の
    // 高さがブレないようにする(以前は補足が数字の下に来る2行構成で、補足の有無によって
    // 数字の位置がカードごとにズレて見えていた)。
    b.innerHTML = waveHtml +
      "<div class='stat-header'>"+iconHtml+"<div class='lbl'>"+lbl+"</div></div>"+
      "<div class='stat-numwrap'><div class='num-line'><span class='num"+numLongClass+"'"+(opts.alert?" style='color:"+STAT_COLORS.red.icon+"'":"")+">"+num+"</span>"+
      (opts.sub ? "<span class='stat-sub'>（"+opts.sub+"）</span>" : "")+"</div></div>";
    if(opts.onclick){ b.style.cursor = "pointer"; b.onclick = opts.onclick; }
    return b;
  };
  const pct = (part, total)=> total > 0 ? (Math.round(part/total*1000)/10) + "%" : "-";
  const scrollToFollowUp = ()=>{
    const target = document.getElementById("followupSection");
    if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
  };

  // ==== モバイル専用の企業選択は、以前は概要タブに置いていたが、企業フィルタは
  // 実習生タブの一覧表にしか効かない仕様のため、選んでも概要タブの数字が変わらず
  // 分かりにくかった。実習生タブ側(companySelectの直後)に移設する。 ====

  // ==== 「概要の顔」：ページ上部の導入エリア(overviewタブのみ。視線の起点を作る) ====
  if(tab === "overview"){
    const heroWrap = el('<div class="overview-hero"></div>');
    const heroLabel = scope.isAdmin ? "全体状況" : "自社の状況";
    const heroDesc = scope.isAdmin
      ? fmtNum(totalLearners)+"人の実習生を管理しています"
      : fmtNum(totalLearners)+"人の学習者を管理しています";
    const heroStatsParts = scope.isAdmin
      ? ["登録率 "+pct(ntlpRegistered.length, totalLearners), "学習中 "+fmtNum(studying.length)+"人", "要フォロー "+fmtNum(followUps.length)+"人"]
      : ["学習中 "+fmtNum(studying.length)+"人", "要フォロー "+fmtNum(followUps.length)+"人"];
    heroWrap.innerHTML =
      "<div class='overview-hero-eyebrow'>N.T.I.C Academy</div>"+
      "<div class='overview-hero-title'>"+heroLabel+"</div>"+
      "<div class='overview-hero-desc'>"+heroDesc+"</div>"+
      "<div class='overview-hero-stats'>"+heroStatsParts.join("　｜　")+"</div>";
    wrap.appendChild(heroWrap);
  }

  // ==== ① 最上段の重要KPI(4枚。overviewタブのみ) ====
  if(tab === "overview"){
  const kpiRow = el('<div class="kpi-cardgrid"></div>');
  kpiRow.appendChild(block(fmtNum(totalLearners)+"人", scope.isAdmin ? "対象実習生" : "対象学習者", {icon:"users", color:"green", card:true}));
  if(scope.isAdmin){
    kpiRow.appendChild(block(fmtNum(ntlpRegistered.length)+"人", "NTLP登録済", {sub: pct(ntlpRegistered.length, totalLearners), icon:"userCheck", color:"blue", card:true}));
    // 未登録の人を押したら、実習生タブでその人たちだけを表示する。
    // 「誰が未登録なのか」をすぐ確認できるようにするため。
    const goUnregistered = ()=>{
      dashState.onlyUnregistered = true;
      dashState.companyFilter = "";
      dashState.workplaceFilter = "";
      dashState.activeTab = "learners";
      render();
    };
    kpiRow.appendChild(block(fmtNum(ntlpUnregistered.length)+"人", "NTLP未登録", {
      sub: pct(ntlpUnregistered.length, totalLearners), icon:"userX", color:"purple",
      card:true, waveSubtle:true,
      onclick: ntlpUnregistered.length > 0 ? goUnregistered : null}));
  } else {
    kpiRow.appendChild(block(fmtNum(studying.length)+"人", "学習中", {icon:"book", color:"blue", card:true}));
    kpiRow.appendChild(block(fmtNum(notStudied.length)+"人", "未学習", {icon:"userOff", color:"purple", card:true, waveSubtle:true}));
  }
  const followUpKpi = block(fmtNum(followUps.length)+"人", "要フォロー", {alert: followUps.length>0, icon:"alertTriangle", card:true, onclick: followUps.length>0 ? scrollToFollowUp : null});
  if(followUps.length > 0) followUpKpi.classList.add("kpi-card-priority");
  kpiRow.appendChild(followUpKpi);
  kpiRow.classList.add("dash-sec-kpi");
  wrap.appendChild(kpiRow);
  }

  // NTLPアカウント発行可能は最上段から外し、小さなリンク行として登録状況の近くに残す(管理者のみ)。
  if(scope.isAdmin && canIssue.length > 0 && tab === "overview"){
    const issueLink = el('<div class="issue-link-row"></div>');
    issueLink.innerHTML = "<span>"+STAT_ICONS.idCard+"</span><span>アカウント発行可能な実習生が <b>"+fmtNum(canIssue.length)+"人</b> います</span>";
    issueLink.classList.add("dash-sec-kpi");
    wrap.appendChild(issueLink);
  }

  // ==== 要フォロー学習者(概要タブのみ。対応が必要な情報なので、KPIのすぐ下＝上位に配置する。
  //      「今どうなっているか」を一目で把握する場所という位置づけのため、最大3名だけ見せ、
  //      残りは「すべて見る」で展開する形にする) ====
  if(tab === "overview"){
  const fCard = el('<div class="card followup-card"></div>');
  fCard.id = "followupSection";
  const fTitleWrap = el('<div class="followup-titlewrap"></div>');
  fTitleWrap.innerHTML = "<span class='followup-titleicon'>"+STAT_ICONS.alertTriangle+"</span>"+
    "<div><div class='card-title followup-title'>要フォロー</div>"+
    "<div class='followup-subtitle'>学習停滞・正答率低下など、確認が必要な実習生</div></div>";
  fCard.appendChild(fTitleWrap);
  if(followUps.length > 0){
    followUps.sort((a,b)=>{
      const at = a.lastSeen ? new Date(a.lastSeen).getTime() : 0;
      const bt = b.lastSeen ? new Date(b.lastSeen).getTime() : 0;
      return at - bt; // 学習が止まっている人を上に
    });
    const FOLLOWUP_PREVIEW_COUNT = 3;
    const followUpList = el('<div class="followup-list"></div>');
    const renderFollowUpRow = (l)=>{
      const row = el('<div class="followup-row"></div>');
      const nameDiv = document.createElement("div");
      nameDiv.className = "followup-namewrap";
      const nameLine = document.createElement("div");
      nameLine.className = "followup-name";
      nameLine.innerHTML = programBadge(l.program) + flagBadge(l.nationality) + escapeHtml((l.learnerName || l.learner_id) + "（" + (l.companyName || l.company_id) + "）");
      const reasonLine = document.createElement("div");
      reasonLine.className = "followup-reason";
      reasonLine.textContent = l.followUpReasons.join(" / ");
      nameDiv.appendChild(nameLine); nameDiv.appendChild(reasonLine);
      const badge = el('<span class="badge low">要フォロー</span>');
      row.appendChild(nameDiv); row.appendChild(badge);
      row.onclick = ()=> openKarte(l.company_id, l.learner_id);
      return row;
    };
    followUps.slice(0, FOLLOWUP_PREVIEW_COUNT).forEach(l=> followUpList.appendChild(renderFollowUpRow(l)));
    fCard.appendChild(followUpList);
    if(followUps.length > FOLLOWUP_PREVIEW_COUNT){
      const moreList = el('<div class="followup-list" style="display:none;"></div>');
      followUps.slice(FOLLOWUP_PREVIEW_COUNT).forEach(l=> moreList.appendChild(renderFollowUpRow(l)));
      fCard.appendChild(moreList);
      const moreBtn = el('<button class="followup-more-btn"></button>');
      moreBtn.textContent = "すべて見る（"+followUps.length+"人）→";
      moreBtn.onclick = ()=>{
        moreList.style.display = "block";
        moreBtn.style.display = "none";
      };
      fCard.appendChild(moreBtn);
    }
  } else {
    const empty = el('<div class="followup-empty"></div>');
    empty.textContent = "現在、要フォローの学習者はいません。";
    fCard.appendChild(empty);
  }
  fCard.classList.add("dash-sec-followup");
  wrap.appendChild(fCard);
  }

  // ==== ② 学習ステータス(ドーナツ) + 学習状況サマリー の2カラム(overviewタブのみ) ====
  if(tab === "overview"){
  const statusSection = el('<div class="section-plate section-plate-blue"></div>');
  const twoCol = el('<div class="dash-2col"></div>');

  const donutCard = el('<div class="card"></div>');
  const donutTitle = el('<div class="card-title"></div>'); donutTitle.textContent = "学習ステータス";
  donutCard.appendChild(donutTitle);
  const donutBody = el('<div class="donut-body"></div>');
  const donutSegs = [
    {value: studying.length, color: STAT_COLORS.blue.icon, label:"学習中"},
    {value: Math.max(0, thisWeek.length - studying.length) , color: STAT_COLORS.purple.icon, label:"今週学習"},
    {value: followUps.length, color: STAT_COLORS.orange.icon, label:"要フォロー"},
    {value: notStudied.length, color: "#d7dade", label:"未学習"}
  ];
  const centerHtml = "<div class='donut-center-num'>"+fmtNum(totalLearners)+"</div><div class='donut-center-lbl'>対象学習者</div>";
  donutBody.appendChild(buildDonutChart(donutSegs, {centerLabel: centerHtml}));
  const donutLegend = el('<div class="donut-legend"></div>');
  const legendItems = [
    {c: STAT_COLORS.blue.icon, lbl:"学習中", n: studying.length},
    {c: STAT_COLORS.purple.icon, lbl:"今週学習", n: thisWeek.length},
    {c: STAT_COLORS.orange.icon, lbl:"要フォロー", n: followUps.length},
    {c: "#b7bcc4", lbl:"未学習", n: notStudied.length}
  ];
  legendItems.forEach(it=>{
    const row = el('<div class="donut-legend-row"></div>');
    row.innerHTML = "<span class='donut-legend-dot' style='background:"+it.c+";'></span>"+
      "<span class='donut-legend-lbl'>"+it.lbl+"</span>"+
      "<span class='donut-legend-num'>"+fmtNum(it.n)+"人 <span class='donut-legend-pct'>("+pct(it.n, totalLearners)+")</span></span>";
    donutLegend.appendChild(row);
  });
  donutBody.appendChild(donutLegend);
  donutCard.appendChild(donutBody);

  // ==== ③ 登録・学習推移(折れ線、直近6ヶ月) ====
  // ドーナツグラフのカードは、右側の「学習状況サマリー」(カード4枚)より縦に短くなり、
  // 下に余白ができてしまうため、その余白を使ってこの下に差し込む(独立カードにはしない)。
  // NTLP登録者数=students.created_at、学習開始者数=daily_summaryに記録がある学習者の初回記録日、
  // をそれぞれ月末時点の累計で集計する。実データが少ない期間はそのまま0近辺で表示する(誤魔化さない)。
  const trendSection = el('<div class="donut-trend-section"></div>');
  const trendDivider = el('<div class="donut-trend-divider"></div>');
  trendSection.appendChild(trendDivider);
  const trendLineTitle = el('<div class="card-title trend-subtitle"></div>'); trendLineTitle.textContent = "登録・学習推移（直近6ヶ月）";
  trendSection.appendChild(trendLineTitle);

  const monthLabels = [];
  const monthEnds = [];
  const now = new Date();
  for(let i=5; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i+1, 0, 23, 59, 59); // その月の月末
    monthLabels.push((d.getMonth()+1)+"月");
    monthEnds.push(d);
  }
  const studentsForTrend = scope.isAdmin ? dashState.students : dashState.students.filter(s=>learners.some(l=>l.learner_id===s.dekisugi_student_code));
  const regByMonth = monthEnds.map(end=>
    studentsForTrend.filter(s=>s.created_at && new Date(s.created_at) <= end).length
  );
  const learnerFirstSeen = {};
  (dashState.firstSeen || []).forEach(d=>{
    if(!d.learner_id || !d.first_seen) return;
    const t = new Date(d.first_seen).getTime();
    if(!learnerFirstSeen[d.learner_id] || t < learnerFirstSeen[d.learner_id]) learnerFirstSeen[d.learner_id] = t;
  });
  const relevantLearnerIds = scope.isAdmin ? null : new Set(learners.map(l=>l.learner_id));
  const studyByMonth = monthEnds.map(end=>
    Object.keys(learnerFirstSeen).filter(lid=>
      (!relevantLearnerIds || relevantLearnerIds.has(lid)) && learnerFirstSeen[lid] <= end.getTime()
    ).length
  );

  const lineSeries = [
    {label:"NTLP登録済", color: STAT_COLORS.green.icon, points: monthLabels.map((lbl,i)=>({x_label:lbl, y:regByMonth[i]}))},
    {label:"学習開始者数", color: STAT_COLORS.blue.icon, points: monthLabels.map((lbl,i)=>({x_label:lbl, y:studyByMonth[i]}))}
  ];
  const trendLegend = el('<div class="linechart-legend"></div>');
  lineSeries.forEach(s=>{
    const item = el('<span class="linechart-legend-item"></span>');
    item.innerHTML = "<span class='linechart-legend-dot' style='background:"+s.color+";'></span>"+s.label;
    trendLegend.appendChild(item);
  });
  trendSection.appendChild(trendLegend);
  trendSection.appendChild(buildLineChart(lineSeries, {height: 180}));
  donutCard.appendChild(trendSection);

  twoCol.appendChild(donutCard);

  const statusCard = el('<div class="card"></div>');
  const statusTitle = el('<div class="card-title"></div>'); statusTitle.textContent = "学習状況サマリー";
  statusCard.appendChild(statusTitle);
  const statusGrid = el('<div class="kpi-cardgrid cols-2 stretch-fill"></div>');
  statusGrid.appendChild(block(avgRate+"%", "平均正答率", {icon:"target", color:"green", card:true, waveSubtle:true}));
  statusGrid.appendChild(block(avgProgress+"%", "平均進捗", {icon:"trendingUp", color:"blue", card:true, waveSubtle:true}));
  statusGrid.appendChild(block(fmtNum(studying.length)+"人", "学習中", {icon:"book", color:"purple", card:true, waveSubtle:true}));
  statusGrid.appendChild(block(fmtNum(notStudied.length)+"人", "未学習", {icon:"userOff", color:"gray", card:true, waveSubtle:true}));
  statusCard.appendChild(statusGrid);
  twoCol.appendChild(statusCard);

  statusSection.appendChild(twoCol);
  statusSection.classList.add("dash-sec-status");
  wrap.appendChild(statusSection);
  }

  // ==== ③' overviewタブ向けの企業・事業所ミニサマリー(数字だけ、詳細はcompaniesタブへ) ====
  // ==== ③' overviewタブ向けの「企業・事業所ミニサマリー」＋「企業マッピング状況」の2カラム
  //      (どちらも縦に長くないので、横並びにして画面の高さを節約する) ====
  const overviewBottomRow = tab === "overview" && scope.isAdmin ? el('<div class="dash-2col dash-sec-company"></div>') : null;

  if(tab === "overview" && scope.isAdmin){
    const miniCard = el('<div class="card"></div>');
    const miniTitle = el('<div class="card-title"></div>'); miniTitle.textContent = "企業・事業所";
    miniCard.appendChild(miniTitle);
    const miniBody = el('<div class="company-mini-summary"></div>');
    miniBody.innerHTML =
      "<div class='company-mini-nums'>"+
        "<div><span class='company-mini-num'>"+fmtNum(dashState.companies.length)+"</span><span class='company-mini-unit'>社</span></div>"+
        "<div><span class='company-mini-num'>"+fmtNum(dashState.workplaces.length)+"</span><span class='company-mini-unit'>事業所</span></div>"+
      "</div>";
    const detailLink = el('<button class="detail-link-btn"></button>');
    detailLink.textContent = "詳細を見る →";
    detailLink.onclick = ()=>{ dashState.activeTab = "companies"; render(); };
    miniBody.appendChild(detailLink);
    miniCard.appendChild(miniBody);
    overviewBottomRow.appendChild(miniCard);
  }

  // ==== ④ 企業・事業所サマリー(companiesタブのみ。企業担当者には自社の情報しか無く意味が薄いため管理者限定) ====
  if(tab === "companies" && scope.isAdmin){
    const withWorkplace = learners.filter(l=>l.workplaces && l.workplaces.length > 0);
    const withoutWorkplace = learners.filter(l=>!l.workplaces || l.workplaces.length === 0);
    const companyWpCard = el('<div class="card"></div>');
    const companyWpTitle = el('<div class="card-title"></div>'); companyWpTitle.textContent = "企業・事業所サマリー";
    companyWpCard.appendChild(companyWpTitle);
    const companyWpGrid = el('<div class="kpi-cardgrid"></div>');
    companyWpGrid.appendChild(block(fmtNum(dashState.companies.length)+"社", "企業数", {icon:"building", color:"green", card:true, waveSubtle:true}));
    companyWpGrid.appendChild(block(fmtNum(dashState.workplaces.length)+"事業所", "事業所数", {icon:"building2", color:"blue", card:true, waveSubtle:true}));
    companyWpGrid.appendChild(block(fmtNum(withWorkplace.length)+"人", "勤務先設定済", {icon:"usersGroup", color:"purple", card:true, waveSubtle:true}));
    companyWpGrid.appendChild(block(fmtNum(withoutWorkplace.length)+"人", "勤務先未設定", {alert: withoutWorkplace.length>0, icon:"userOff", card:true, waveSubtle:true}));
    companyWpCard.appendChild(companyWpGrid);
    companyWpCard.classList.add("dash-sec-company");
    wrap.appendChild(companyWpCard);
  }

  // ==== ⑤ 企業マッピング状況(「◯%」を主役にした構成。完了なら緑、未完了ならオレンジ。
  //      overview(概要)・companies(企業・事業所)、両方のタブに出す ====
  if((tab === "overview" || tab === "companies") && scope.isAdmin){
    const mappedCompanies = dashState.companies.filter(c=>c.dekisugi_company_id).length;
    const totalCompanies = dashState.companies.length;
    const mappingPct = totalCompanies > 0 ? Math.round(mappedCompanies/totalCompanies*100) : 0;
    const mappingDone = mappingPct >= 100;
    const mappingTone = mappingDone ? STAT_COLORS.green : STAT_COLORS.orange;
    const mapCard = el('<div class="card"></div>');
    const mapTitle = el('<div class="card-title"></div>'); mapTitle.textContent = "企業マッピング状況";
    mapCard.appendChild(mapTitle);
    const mapBody = el('<div class="mapping-body"></div>');
    mapBody.style.background = mappingTone.bg;
    mapBody.innerHTML =
      "<div class='mapping-hero' style='color:"+mappingTone.icon+"'>"+mappingPct+"%</div>"+
      "<div class='mapping-hero-sub'>"+fmtNum(mappedCompanies)+" / "+fmtNum(totalCompanies)+"社"+(mappingDone?"（完了）":"")+"</div>"+
      "<div class='mapping-track'><div class='mapping-fill' style='width:"+mappingPct+"%;background:"+mappingTone.icon+";'></div></div>"+
      (mappingDone ? "" : "<div class='mapping-pct'>未設定："+fmtNum(totalCompanies-mappedCompanies)+"社</div>");
    mapCard.appendChild(mapBody);
    if(tab === "overview"){
      overviewBottomRow.appendChild(mapCard);
    } else {
      mapCard.classList.add("dash-sec-company");
      wrap.appendChild(mapCard);
    }
  }
  if(overviewBottomRow && overviewBottomRow.children.length > 0){
    const companySection = el('<div class="section-plate section-plate-green"></div>');
    companySection.appendChild(overviewBottomRow);
    wrap.appendChild(companySection);
  }

  // ==== 全社一括発行カード(companiesタブ専用、2026/8/30新設) ====
  // 118社・243事業所を1件ずつ手作業で発行するのは現実的ではないため、
  // 「まだアカウントが無い企業・事業所」だけを対象に一括発行する。
  // 押す前に対象件数を表示し、確認してから実行する2段構えにしている。
  if(tab === "companies" && scope.isAdmin){
    const bulkCard = el('<div class="card dash-sec-company"></div>');
    const bulkTitle = el('<div class="card-title"></div>');
    bulkTitle.textContent = "企業代表・事業所担当者アカウントの一括発行";
    bulkCard.appendChild(bulkTitle);
    const bulkDesc = el('<div class="card-desc"></div>');
    bulkDesc.textContent = "1企業につき企業代表1件、1事業所につき事業所担当者1件を発行します。すでにアカウントがある企業・事業所は自動的にスキップされるため、何度実行しても重複しません。";
    bulkCard.appendChild(bulkDesc);

    const previewWrap = el('<div id="companyBulkPreviewWrap" style="font-size:13px;color:var(--text-sub);margin-bottom:var(--sp-3);"></div>');
    previewWrap.textContent = "対象件数を確認しています...";
    bulkCard.appendChild(previewWrap);

    const bulkBtn = document.createElement("button");
    bulkBtn.className = "primary";
    bulkBtn.textContent = "対象件数を確認中...";
    bulkBtn.disabled = true;
    bulkCard.appendChild(bulkBtn);
    wrap.appendChild(bulkCard);

    // 対象件数を非同期で取得してボタンを有効化する
    (async ()=>{
      try{
        const p = await previewBulkCompanyUsers();
        const total = p.total_count || 0;
        if(total === 0){
          previewWrap.textContent = "未発行の企業・事業所はありません（すべて発行済みです）。";
          bulkBtn.textContent = "発行対象なし";
          bulkBtn.disabled = true;
          return;
        }
        previewWrap.innerHTML = "発行対象：<b>企業代表 " + fmtNum(p.owner_count) + "件</b>／<b>事業所担当者 " +
          fmtNum(p.manager_count) + "件</b>　合計 <b>" + fmtNum(total) + "件</b>";
        bulkBtn.textContent = fmtNum(total) + "件を一括発行";
        bulkBtn.disabled = false;
        bulkBtn.onclick = ()=>{
          ask("未発行の企業・事業所に、合計" + fmtNum(total) + "件のアカウントを発行します。\n\n" +
              "発行後に表示されるログインID・初期パスワードは、その画面でしか確認できません。" +
              "必ずCSVのダウンロードまたはコピーで控えてから閉じてください。よろしいですか？", async ()=>{
            dashState.companyBulkInProgress = true;
            render();
            try{
              const rows = await bulkCreateCompanyUsers();
              dashState.companyBulkResults = rows;
            }catch(e){
              dashState.companyBulkResults = null;
              dashState.companyBulkInProgress = false;
              render();
              const errBox = el('<div class="errormsg"></div>');
              errBox.textContent = e.message || "一括発行に失敗しました。";
              const c = document.getElementById("companyBulkPreviewWrap");
              if(c) c.after(errBox);
              return;
            }
            dashState.companyBulkInProgress = false;
            dashState._fetchTriggered = false;
            await loadDashboardData();
          }, null, fmtNum(total) + "件を発行する");
        };
      }catch(e){
        previewWrap.innerHTML = "<span class='errormsg'>" + escapeHtml(e.message || "対象件数の取得に失敗しました。") + "</span>";
        bulkBtn.textContent = "一括発行";
        bulkBtn.disabled = true;
      }
    })();
  }

  // ==== 企業選択プルダウン(companiesタブ専用、2026/8/30新設) ====
  // このタブの「選択中の企業のサマリー」「企業代表・事業所担当者アカウント発行」は、
  // dashState.companyFilter に企業が入っている時だけ表示される。しかし以前は、その値を
  // 設定するプルダウンが「実習生」タブの中にしか無かったため、企業・事業所タブを開いても
  // 企業を選ぶ手段が無く、発行フォームに永久にたどり着けない状態だった。
  // タブ単体で操作が完結するよう、このタブにも同じ選択UIを置く(状態は共有のまま)。
  if(tab === "companies" && scope.isAdmin){
    const selCard = el('<div class="card dash-sec-company"></div>');
    const selTitle = el('<div class="card-title"></div>');
    selTitle.textContent = "企業を選択";
    selCard.appendChild(selTitle);
    const selDesc = el('<div class="card-desc"></div>');
    selDesc.textContent = "企業を選ぶと、その企業のサマリーと、企業代表・事業所担当者アカウントの発行フォームが表示されます。";
    selCard.appendChild(selDesc);

    const companySelectC = document.createElement("select");
    companySelectC.id = "companyFilterSelectCompaniesTab";
    companySelectC.style.cssText = "padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;width:100%;max-width:420px;background:#fff;";
    const allOptC = document.createElement("option");
    allOptC.value = ""; allOptC.textContent = "企業を選択してください";
    companySelectC.appendChild(allOptC);
    dashState.companies.slice()
      .sort((a,b)=> a.company_name.localeCompare(b.company_name,"ja"))
      .forEach(c=>{
        const opt = document.createElement("option");
        opt.value = c.company_id;
        opt.textContent = c.company_name + "（" + c.company_id + "）";
        if(dashState.companyFilter === c.company_id) opt.selected = true;
        companySelectC.appendChild(opt);
      });
    companySelectC.onchange = ()=>{
      dashState.companyFilter = companySelectC.value;
      // 企業が変わったら事業所フィルタ・ページャーは実習生タブ側と同じくリセットしておく
      dashState.workplaceFilter = "";
      dashState.companyPage = 0;
      render();
    };
    selCard.appendChild(companySelectC);
    wrap.appendChild(selCard);
  }

  // ==== 選択中の企業のサマリー(companiesタブ限定。ntic_adminが企業フィルタで1社に絞っている時だけ表示) ====
  if(tab === "companies" && scope.isAdmin && dashState.companyFilter.trim()){
    const companyId = dashState.companyFilter.trim();
    const companyLearners = learners.filter(l=>l.company_id === companyId);
    // 在籍中の実習生が0人の企業(全員実習終了済み等)を選んだ場合、以前はサマリーも発行フォームも
    // 何も表示されず「選んでも反応が無い」ように見えていた。企業マスタに存在する企業なら、
    // 学習者が0人でもアカウント発行はできる必要があるため、その旨を案内する。
    if(companyLearners.length === 0){
      const emptyCard = el('<div class="card dash-sec-company"></div>');
      const emptyCompany = dashState.companies.find(c=>c.company_id === companyId);
      const emptyTitle = el('<div class="card-title"></div>');
      emptyTitle.textContent = (emptyCompany ? emptyCompany.company_name : companyId) + "：現在学習中の実習生はいません";
      emptyCard.appendChild(emptyTitle);
      const emptyDesc = el('<div class="card-desc"></div>');
      emptyDesc.textContent = "この企業には、在籍中の実習生が登録されていません（全員が実習終了済みの可能性があります）。アカウント発行は下のフォームから行えます。";
      emptyCard.appendChild(emptyDesc);
      wrap.appendChild(emptyCard);
    }
    if(companyLearners.length >= 0){
      const companyName = (companyLearners.length > 0 ? companyLearners[0].companyName : null)
        || (dashState.companies.find(c=>c.company_id === companyId)||{}).company_name
        || companyId;
      const cRegistered = companyLearners.filter(l=>l.ntlpRegistered).length;
      const cStudying = companyLearners.filter(l=>l.questionsStudied > 0).length;
      const cFollowUps = companyLearners.filter(l=>l.needsFollowUp).length;
      const cWithRate = companyLearners.filter(l=>l.n > 0);
      const cAvgRate = cWithRate.length ? Math.round(cWithRate.reduce((s,l)=>s+l.rate,0)/cWithRate.length) : 0;
      const cAvgProgress = Math.round(companyLearners.reduce((s,l)=>s+l.progressPct,0)/companyLearners.length);

      // 学習者が0人の企業では平均値が計算できない(0除算)ため、サマリーKPI自体を出さない。
      if(companyLearners.length > 0){
      const companyCard = el('<div class="card"></div>');
      const companyCardTitle = el('<div class="card-title"></div>');
      companyCardTitle.textContent = "選択中の企業のサマリー：" + companyName;
      companyCard.appendChild(companyCardTitle);
      const companyGrid = el('<div class="kpi-cardgrid"></div>');
      companyGrid.appendChild(block(fmtNum(companyLearners.length)+"人", "対象学習者", {icon:"users", color:"green", card:true}));
      companyGrid.appendChild(block(fmtNum(cRegistered)+"人", "NTLP登録済", {sub: pct(cRegistered, companyLearners.length), icon:"userCheck", color:"blue", card:true}));
      companyGrid.appendChild(block(fmtNum(cStudying)+"人", "学習中", {icon:"book", color:"purple", card:true}));
      companyGrid.appendChild(block(fmtNum(cFollowUps)+"人", "要フォロー", {alert: cFollowUps>0, icon:"alertTriangle", card:true}));
      companyCard.appendChild(companyGrid);
      const companySubGrid = el('<div class="kpi-cardgrid cols-2"></div>');
      companySubGrid.appendChild(block(cAvgRate+"%", "平均正答率", {icon:"target", color:"green", card:true}));
      companySubGrid.appendChild(block(cAvgProgress+"%", "平均進捗", {icon:"trendingUp", color:"blue", card:true}));
      companyCard.appendChild(companySubGrid);
      companyCard.classList.add("dash-sec-company");
      wrap.appendChild(companyCard);
      } // ← サマリーKPIここまで(学習者0人の企業では出さない)

      // ==== 企業代表・事業所担当者アカウントの発行(この企業限定) ====
      const issueCard = el('<div class="card dash-sec-company"></div>');
      const issueTitle = el('<div class="card-title"></div>');
      issueTitle.textContent = "企業代表・事業所担当者アカウント発行：" + companyName;
      issueCard.appendChild(issueTitle);
      const issueDesc = el('<div class="card-desc"></div>');
      issueDesc.textContent = "ログインIDは会社名や連番から推測できないよう、ランダムな文字列で発行されます。";
      issueCard.appendChild(issueDesc);

      const existingWrap = el('<div id="companyUsersExistingWrap" style="margin:var(--sp-3) 0;"></div>');
      issueCard.appendChild(existingWrap);

      const roleRow = el('<div style="margin-bottom:var(--sp-3);"></div>');
      const roleLabel = document.createElement("label");
      roleLabel.textContent = "発行するアカウント種別　";
      roleLabel.style.cssText = "font-size:13px;font-weight:600;margin-right:8px;";
      const roleSelect = document.createElement("select");
      [["company_owner","企業代表(自社全事業所を閲覧)"],["workplace_manager","事業所担当者(担当事業所のみ閲覧)"]].forEach(([v,label])=>{
        const opt = document.createElement("option"); opt.value = v; opt.textContent = label;
        roleSelect.appendChild(opt);
      });
      roleRow.appendChild(roleLabel); roleRow.appendChild(roleSelect);
      issueCard.appendChild(roleRow);

      // 事業所担当者を選んだ時だけ、この企業の事業所一覧をチェックボックスで表示(複数選択可)
      const wpWrap = el('<div style="margin-bottom:var(--sp-3);display:none;"></div>');
      const wpLabel = document.createElement("div");
      wpLabel.textContent = "担当事業所を選択(複数選択可)";
      wpLabel.style.cssText = "font-size:13px;font-weight:600;margin-bottom:6px;";
      wpWrap.appendChild(wpLabel);
      const companyWorkplaces = dashState.workplaces.filter(w=>w.company_id === companyId);
      companyWorkplaces.forEach(w=>{
        const line = document.createElement("label");
        line.style.cssText = "display:block;font-size:13px;margin-bottom:4px;";
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.value = w.id; cb.className = "wp-issue-checkbox";
        // 汎用input{}ルール(テキスト入力欄向けにwidth:100%等が設定されている)がチェックボックスにも
        // 適用されて表示が崩れるため、ここで明示的に打ち消す
        cb.style.cssText = "width:auto;max-width:none;padding:0;margin:0 6px 0 0;border:1px solid var(--border);vertical-align:middle;";
        line.appendChild(cb);
        line.appendChild(document.createTextNode(w.workplace_name));
        wpWrap.appendChild(line);
      });
      if(companyWorkplaces.length === 0){
        wpWrap.appendChild(el('<div style="font-size:12.5px;color:var(--text-sub);">この企業には事業所が登録されていません。</div>'));
      }
      issueCard.appendChild(wpWrap);
      roleSelect.onchange = ()=>{ wpWrap.style.display = roleSelect.value === "workplace_manager" ? "block" : "none"; };

      const issueBtn = document.createElement("button");
      issueBtn.className = "primary";
      issueBtn.textContent = "アカウントを発行";
      issueBtn.onclick = ()=>{
        const role = roleSelect.value;
        const roleLabelText = role === "company_owner" ? "企業代表" : "事業所担当者";
        let workplaceIds = [];
        if(role === "workplace_manager"){
          workplaceIds = Array.from(wpWrap.querySelectorAll(".wp-issue-checkbox:checked")).map(cb=>cb.value);
          if(workplaceIds.length === 0){
            const errBox = el('<div class="errormsg"></div>');
            errBox.textContent = "事業所担当者を発行するには、担当事業所を1つ以上選択してください。";
            issueCard.appendChild(errBox);
            setTimeout(()=>errBox.remove(), 4000);
            return;
          }
        }
        ask(companyName + "に「" + roleLabelText + "」アカウントを新規発行します。よろしいですか？", async ()=>{
          issueBtn.disabled = true; issueBtn.textContent = "発行中...";
          try{
            const result = await issueCompanyUserAccount(companyId, role, workplaceIds);
            issueBtn.disabled = false; issueBtn.textContent = "アカウントを発行";
            showIssueResultModal(result.login_id, result.initial_password, {
              title: roleLabelText + "アカウントを発行しました",
              desc: "この情報は今だけ表示されます。担当者様へ控えていただくか、紙等で案内してください。"
            });
            loadCompanyUsersList();
          }catch(e){
            issueBtn.disabled = false; issueBtn.textContent = "アカウントを発行";
            const errBox = el('<div class="errormsg"></div>');
            errBox.textContent = e.message || "発行に失敗しました。時間をおいて再度お試しください。";
            issueCard.appendChild(errBox);
          }
        }, null, "はい、発行する");
      };
      issueCard.appendChild(issueBtn);
      wrap.appendChild(issueCard);

      // 既存アカウント一覧を非同期で読み込む(発行後も再読込する)
      async function loadCompanyUsersList(){
        existingWrap.innerHTML = "読み込み中...";
        try{
          const rows = await fetchCompanyUsersForCompany(companyId);
          if(rows.length === 0){
            existingWrap.innerHTML = "<div style='font-size:12.5px;color:var(--text-sub);'>この企業には、まだ企業代表・事業所担当者アカウントがありません。</div>";
            return;
          }
          const wpNameById = {};
          dashState.workplaces.forEach(w=>{ wpNameById[w.id] = w.workplace_name; });
          existingWrap.innerHTML = "";
          const listTitle = document.createElement("div");
          listTitle.textContent = "発行済みアカウント（" + rows.length + "件）";
          listTitle.style.cssText = "font-size:12.5px;font-weight:600;color:var(--text-sub);margin-bottom:6px;";
          existingWrap.appendChild(listTitle);
          rows.forEach(r=>{
            const roleLabelText = r.role === "company_owner" ? "企業代表" : "事業所担当者";
            const wpNames = (r.company_user_workplaces||[]).map(x=>wpNameById[x.workplace_id]).filter(Boolean).join("・");
            const line = document.createElement("div");
            line.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);";
            // 同じ企業に複数のアカウントがある場合、種別名だけでは「どれを操作しているのか」が
            // 区別できない(実際に企業代表が2件並んで見分けられない事象が起きた)。
            // 発行日を併記して識別できるようにする。
            // ※ログインIDはauth.usersにしか無くRESTからは取得できないため、ここでは出せない。
            const labelSpan = document.createElement("div");
            let issuedAt = "";
            if(r.created_at){
              const d = new Date(r.created_at);
              issuedAt = d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+
                String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
            }
            labelSpan.innerHTML = escapeHtml(roleLabelText + (wpNames ? "（" + wpNames + "）" : "")) +
              (issuedAt ? "<div style='font-size:11px;color:var(--text-sub);margin-top:2px;'>発行日: "+escapeHtml(issuedAt)+"</div>" : "");
            line.appendChild(labelSpan);

            const btnWrap = document.createElement("div");
            btnWrap.style.cssText = "display:flex;gap:6px;flex:0 0 auto;";

            // 無効化(論理削除)ボタン
            const deactBtn = document.createElement("button");
            deactBtn.className = "danger";
            deactBtn.style.cssText = "font-size:11.5px;padding:5px 10px;flex:0 0 auto;";
            deactBtn.textContent = "無効化";
            deactBtn.onclick = ()=>{
              ask("「" + roleLabelText + (wpNames ? "（" + wpNames + "）" : "") + "」アカウントを無効化します。" +
                  "このアカウントではログインできなくなります（学習データは削除されません）。よろしいですか？", async ()=>{
                deactBtn.disabled = true; deactBtn.textContent = "処理中...";
                try{
                  await deactivateCompanyUser(r.id);
                  loadCompanyUsersList();
                }catch(e){
                  deactBtn.disabled = false; deactBtn.textContent = "無効化";
                  const errBox = el('<div class="errormsg" style="margin-top:4px;"></div>');
                  errBox.textContent = e.message || "無効化に失敗しました。時間をおいて再度お試しください。";
                  line.after(errBox);
                  setTimeout(()=>errBox.remove(), 4000);
                }
              }, null, "はい、無効化する");
            };

            const resetBtn = document.createElement("button");
            resetBtn.className = "secondary";
            resetBtn.style.cssText = "font-size:11.5px;padding:5px 10px;flex:0 0 auto;";
            resetBtn.textContent = "パスワードをリセット";
            resetBtn.onclick = ()=>{
              ask("「" + roleLabelText + "」アカウントのパスワードをリセットし、新しい初期パスワードを発行します。現在のパスワードは使えなくなります。よろしいですか？", async ()=>{
                resetBtn.disabled = true; resetBtn.textContent = "リセット中...";
                try{
                  const result = await resetCompanyUserPassword(r.id);
                  resetBtn.disabled = false; resetBtn.textContent = "パスワードをリセット";
                  showIssueResultModal(result.login_id, result.new_password, {
                    title: roleLabelText + "のパスワードをリセットしました",
                    desc: "この情報は今だけ表示されます。担当者様へ控えていただくか、紙等で案内してください。"
                  });
                }catch(e){
                  resetBtn.disabled = false; resetBtn.textContent = "パスワードをリセット";
                  const errBox = el('<div class="errormsg" style="margin-top:4px;"></div>');
                  errBox.textContent = e.message || "リセットに失敗しました。時間をおいて再度お試しください。";
                  line.after(errBox);
                  setTimeout(()=>errBox.remove(), 4000);
                }
              }, null, "はい、リセットする");
            };
            btnWrap.appendChild(resetBtn);
            btnWrap.appendChild(deactBtn);
            line.appendChild(btnWrap);
            existingWrap.appendChild(line);
          });
        }catch(e){
          existingWrap.innerHTML = "<div class='errormsg'>読み込みに失敗しました。</div>";
        }
      }
      loadCompanyUsersList();
    }
  }

  // ==== 全体の分野別傾向(learningタブのみ)。左に4分野の概要グラフ、右に15カテゴリの苦手ランキング ====
  if(tab === "learning"){
  wrap.appendChild(buildLearningSubNav());
  const learningWrap = el('<div></div>');
  learningWrap.classList.add("dash-sec-detail");

  // ==== サブタブ: 学習概要 ====
  if(dashState.learningSubTab === "overview"){
    // KPIカードをタップしたら、実習生別タブでその条件の人だけに絞り込んで表示する。
    // (絞り込みなしだと未学習者が多すぎて、学習中の人を探すのが大変なため)
    const goToLearnerFilter = (filterId)=>{
      dashState.learningLearnerFilter = filterId;
      dashState.learningLearnerPage = 0;
      dashState.learningSubTab = "learners";
      render();
    };
    const kpiRow1 = el('<div class="kpi-cardgrid"></div>');
    kpiRow1.appendChild(block(fmtNum(totalLearners)+"人", "学習対象", {icon:"users", color:"green", card:true, onclick: totalLearners>0 ? ()=>goToLearnerFilter("all") : null}));
    kpiRow1.appendChild(block(fmtNum(studying.length)+"人", "学習中", {icon:"book", color:"blue", card:true, onclick: studying.length>0 ? ()=>goToLearnerFilter("studying") : null}));
    kpiRow1.appendChild(block(fmtNum(notStudied.length)+"人", "未学習", {icon:"userOff", color:"gray", card:true, waveSubtle:true, onclick: notStudied.length>0 ? ()=>goToLearnerFilter("notstudied") : null}));
    kpiRow1.appendChild(block(fmtNum(followUps.length)+"人", "要フォロー", {alert: followUps.length>0, icon:"alertTriangle", card:true, onclick: followUps.length>0 ? ()=>goToLearnerFilter("followup") : null}));
    learningWrap.appendChild(kpiRow1);
    const kpiRow2 = el('<div class="kpi-cardgrid cols-3" style="margin-top:var(--sp-4);"></div>');
    kpiRow2.appendChild(block(fmtNum(thisWeek.length)+"人", "今週学習", {icon:"calendar", color:"purple", card:true, waveSubtle:true, onclick: thisWeek.length>0 ? ()=>goToLearnerFilter("thisweek") : null}));
    kpiRow2.appendChild(block(avgProgress+"%", "平均進捗", {icon:"trendingUp", color:"blue", card:true, waveSubtle:true}));
    kpiRow2.appendChild(block(avgRate+"%", "平均正答率", {icon:"target", color:"green", card:true, waveSubtle:true}));
    learningWrap.appendChild(kpiRow2);

    const ov2col = el('<div class="dash-2col" style="margin-top:var(--sp-6);"></div>');
    const donutCard2 = el('<div class="card"></div>');
    const donutTitle2 = el('<div class="card-title"></div>'); donutTitle2.textContent = "学習ステータス";
    donutCard2.appendChild(donutTitle2);
    const donutBody2 = el('<div class="donut-body"></div>');
    const donutSegs2 = [
      {value: studying.length, color: STAT_COLORS.blue.icon, label:"学習中"},
      {value: Math.max(0, thisWeek.length - studying.length), color: STAT_COLORS.purple.icon, label:"今週学習"},
      {value: followUps.length, color: STAT_COLORS.orange.icon, label:"要フォロー"},
      {value: notStudied.length, color: "#d7dade", label:"未学習"}
    ];
    donutBody2.appendChild(buildDonutChart(donutSegs2, {centerLabel: "<div class='donut-center-num'>"+fmtNum(totalLearners)+"</div><div class='donut-center-lbl'>学習対象</div>"}));
    const donutLegend2 = el('<div class="donut-legend"></div>');
    [{c:STAT_COLORS.blue.icon,lbl:"学習中",n:studying.length},{c:STAT_COLORS.purple.icon,lbl:"今週学習",n:thisWeek.length},
     {c:STAT_COLORS.orange.icon,lbl:"要フォロー",n:followUps.length},{c:"#b7bcc4",lbl:"未学習",n:notStudied.length}].forEach(it=>{
      const row = el('<div class="donut-legend-row"></div>');
      row.innerHTML = "<span class='donut-legend-dot' style='background:"+it.c+";'></span><span class='donut-legend-lbl'>"+it.lbl+"</span>"+
        "<span class='donut-legend-num'>"+fmtNum(it.n)+"人 <span class='donut-legend-pct'>("+pct(it.n,totalLearners)+")</span></span>";
      donutLegend2.appendChild(row);
    });
    donutBody2.appendChild(donutLegend2);
    donutCard2.appendChild(donutBody2);
    ov2col.appendChild(donutCard2);

    const subjChartCard = el('<div class="card"></div>');
    const subjChartTitle = el('<div class="card-title"></div>'); subjChartTitle.textContent = "分野別正答率";
    subjChartCard.appendChild(subjChartTitle);
    const subjDataOv = ["moji","bunpo","dokkai","choukai"].map(subj=>{
      let n=0,c=0;
      learners.forEach(l=>{ const st=l.subjStats&&l.subjStats[subj]; if(st){n+=st.n;c+=st.c;} });
      return { label: SUBJECT_LABEL[subj], value: n>0?Math.round(c/n*100):0 };
    });
    subjChartCard.appendChild(buildBarChart(subjDataOv.map(d=>({label:d.label, value:d.value, color:STAT_COLORS.green.icon})), {height:200}));
    ov2col.appendChild(subjChartCard);
    learningWrap.appendChild(ov2col);

    // 学習開始者数の推移(直近6ヶ月、daily_summaryの初出日ベース)
    const trendCardOv = el('<div class="card" style="margin-top:var(--sp-6);"></div>');
    const trendTitleOv = el('<div class="card-title"></div>'); trendTitleOv.textContent = "学習開始者数の推移（直近6ヶ月）";
    trendCardOv.appendChild(trendTitleOv);
    const monthLabelsOv = [], monthEndsOv = [];
    const nowOv = new Date();
    for(let i=5;i>=0;i--){ const d=new Date(nowOv.getFullYear(), nowOv.getMonth()-i+1, 0, 23,59,59); monthLabelsOv.push((d.getMonth()+1)+"月"); monthEndsOv.push(d); }
    const learnerFirstSeenOv = {};
    (dashState.firstSeen || []).forEach(d=>{
      if(!d.learner_id || !d.first_seen) return;
      const t = new Date(d.first_seen).getTime();
      if(!learnerFirstSeenOv[d.learner_id] || t < learnerFirstSeenOv[d.learner_id]) learnerFirstSeenOv[d.learner_id] = t;
    });
    const relevantIdsOv = scope.isAdmin ? null : new Set(learners.map(l=>l.learner_id));
    const studyByMonthOv = monthEndsOv.map(end => Object.keys(learnerFirstSeenOv).filter(lid=>
      (!relevantIdsOv || relevantIdsOv.has(lid)) && learnerFirstSeenOv[lid] <= end.getTime()
    ).length);
    trendCardOv.appendChild(buildLineChart([{label:"学習開始者数", color:STAT_COLORS.blue.icon, points: monthLabelsOv.map((lbl,i)=>({x_label:lbl, y:studyByMonthOv[i]}))}], {height:180}));
    learningWrap.appendChild(trendCardOv);
  }

  // ==== サブタブ: 実習生別(検索・フィルターできる一覧。学習管理の中心) ====
  else if(dashState.learningSubTab === "learners"){
    const filterDefs = [
      { id:"all", label:"すべて" },
      { id:"studying", label:"学習中" },
      { id:"thisweek", label:"今週学習" },
      { id:"notstudied", label:"未学習" },
      { id:"stale", label:"7日以上未学習" },
      { id:"lowprogress", label:"進捗が低い" },
      { id:"lowrate", label:"正答率が低い" },
      { id:"followup", label:"要フォロー" }
    ];
    const filterRow = el('<div class="subnav" style="margin-bottom:var(--sp-3);"></div>');
    filterDefs.forEach(f=>{
      const btn = el('<button class="subnav-btn"></button>');
      if(dashState.learningLearnerFilter === f.id) btn.classList.add("active");
      btn.textContent = f.label;
      btn.onclick = ()=>{ dashState.learningLearnerFilter = f.id; dashState.learningLearnerPage = 0; render(); };
      filterRow.appendChild(btn);
    });
    learningWrap.appendChild(filterRow);

    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = "氏名で検索";
    searchInput.value = dashState.learningLearnerSearch;
    searchInput.style.marginBottom = "var(--sp-4)";
    searchInput.oninput = ()=>{ dashState.learningLearnerSearch = searchInput.value; dashState.learningLearnerPage = 0; renderLearningLearnersOnly(); };
    learningWrap.appendChild(searchInput);

    const listCard = el('<div class="card"></div>');
    const listWrap = el('<div id="learningLearnersWrap"></div>');
    listCard.appendChild(listWrap);
    learningWrap.appendChild(listCard);
    setTimeout(()=> renderLearningLearnersOnly(), 0);
  }

  // ==== サブタブ: 分野別(4科目のサマリー + 15カテゴリの苦手ランキング) ====
  else if(dashState.learningSubTab === "subjects"){
    const totalForRate = learners.length;
    const subjData = ["moji","bunpo","dokkai","choukai"].map(subj=>{
      let n=0,c=0,participants=0;
      learners.forEach(l=>{
        const st = l.subjStats && l.subjStats[subj];
        if(st && st.n>0){ n+=st.n; c+=st.c; participants+=1; }
      });
      return { subj, label: SUBJECT_LABEL[subj], n, rate: n>0 ? Math.round(c/n*100) : null, participants, notStudied: totalForRate - participants };
    });

    const subjSummaryGrid = el('<div class="kpi-cardgrid"></div>');
    const subjSummaryTitle = el('<div class="card-title"></div>'); subjSummaryTitle.textContent = "科目別サマリー";
    learningWrap.appendChild(subjSummaryTitle);
    const subjSummaryDesc = el('<div class="card-desc"></div>');
    subjSummaryDesc.textContent = "上段の％＝その科目の平均正答率、（）内＝その科目を1問以上学習した人数";
    learningWrap.appendChild(subjSummaryDesc);
    subjData.forEach(d=>{
      subjSummaryGrid.appendChild(block(d.rate===null?"データなし":d.rate+"%", d.label,
        {sub: fmtNum(d.participants)+"人", icon:"book", color:"green", card:true}));
    });
    learningWrap.appendChild(subjSummaryGrid);

    const chartCard = el('<div class="card" style="margin-top:var(--sp-6);"></div>');
    const chartTitle = el('<div class="card-title"></div>'); chartTitle.textContent = "全体の分野別傾向";
    chartCard.appendChild(chartTitle);
    chartCard.appendChild(buildBarChart(subjData.map(d=>({label:d.label, value:d.rate||0, color:STAT_COLORS.green.icon})), {height:210}));
    learningWrap.appendChild(chartCard);

    // 15カテゴリごとに、正答率(全体の解答をまとめて集計)と参加率(1問でも取り組んだ人の割合)を出す。
    // 参加率が低いカテゴリは「たまたま少人数が解いて高正答率」等の誤解を避けるために必要。
    const catRanking = Object.keys(CAT_LABEL).map(cat=>{
      let n=0,c=0,participants=0;
      learners.forEach(l=>{
        const st = l.catStats && l.catStats[cat];
        if(st && st.n > 0){ n += st.n; c += st.c; participants += 1; }
      });
      const subj = Object.keys(QID_CATEGORY_MAP).map(k=>QID_CATEGORY_MAP[k]).find(m=>m.cat===cat)?.subj;
      return { cat, label: CAT_LABEL[cat], subj, n, rate: n>0 ? Math.round(c/n*100) : null,
        participationRate: totalForRate>0 ? Math.round(participants/totalForRate*1000)/10 : 0 };
    }).sort((a,b)=>{
      if(a.rate === null && b.rate === null) return 0;
      if(a.rate === null) return 1;
      if(b.rate === null) return -1;
      return a.rate - b.rate;
    });

    // 「最も得意」「最も苦手」は、企業全体の解答数が少ないカテゴリだと
    // (例:全体で2回しか解かれておらず、たまたま2回とも正解/不正解だった等)
    // 数字が安定せず、実態と違うカテゴリが選ばれてしまう。
    // そのため、企業全体で合計10回以上解答されたカテゴリだけを対象にする。
    // (苦手ランキング本体には、この条件を適用しない。あくまで「代表1件」を選ぶ場面だけの絞り込み)
    const MIN_N_FOR_HIGHLIGHT = 10;
    const catWithData = catRanking.filter(d=>d.rate !== null && d.n >= MIN_N_FOR_HIGHLIGHT);
    if(catWithData.length > 0){
      const bestWorstGrid = el('<div class="dash-2col"></div>');
      const worst = catWithData[0];
      const best = catWithData[catWithData.length - 1];
      const highlightCard = (d, kind)=>{
        const tone = kind === "best" ? STAT_COLORS.green : STAT_COLORS.red;
        const card = el('<div class="card"></div>');
        const inner = el('<div class="cat-highlight" style="background:'+tone.bg+';"></div>');
        inner.innerHTML =
          "<div class='cat-highlight-lbl'>"+(kind==="best"?"最も得意な分野":"最も苦手な分野")+"</div>"+
          "<div class='cat-highlight-cat' style='color:"+tone.icon+";'>"+d.label+"<span class='cat-highlight-subj'>"+(SUBJECT_LABEL[d.subj]||"")+"</span></div>"+
          "<div class='cat-highlight-rate' style='color:"+tone.icon+";'>"+d.rate+"%</div>"+
          "<div class='cat-highlight-sub'>参加率 "+d.participationRate+"%</div>";
        card.appendChild(inner);
        return card;
      };
      bestWorstGrid.appendChild(highlightCard(best, "best"));
      bestWorstGrid.appendChild(highlightCard(worst, "worst"));
      learningWrap.appendChild(bestWorstGrid);
    }

    const rankCard = el('<div class="card" style="margin-top:var(--sp-6);"></div>');
    const rankTitle = el('<div class="card-title"></div>'); rankTitle.textContent = "苦手ランキング（カテゴリ別・正答率が低い順）";
    rankCard.appendChild(rankTitle);
    const rankDesc = el('<div class="card-desc"></div>');
    rankDesc.textContent = "参加率＝対象学習者のうち、1問以上取り組んだ人の割合";
    rankCard.appendChild(rankDesc);
    const rankList = el('<div class="cat-rank-list"></div>');
    catRanking.forEach((d,i)=>{
      const row = el('<div class="cat-rank-row"></div>');
      const toneColor = d.rate === null ? STAT_COLORS.gray.icon : d.rate < 40 ? STAT_COLORS.red.icon : d.rate < 70 ? STAT_COLORS.orange.icon : STAT_COLORS.green.icon;
      const numEl = el('<div class="cat-rank-num"></div>');
      numEl.textContent = i+1;
      row.appendChild(numEl);
      const infoEl = el('<div class="cat-rank-info"></div>');
      infoEl.innerHTML = "<div class='cat-rank-top'><span class='cat-rank-label'>"+d.label+"</span>"+
        "<span class='cat-rank-subj'>"+(SUBJECT_LABEL[d.subj]||"")+"</span></div>";
      row.appendChild(infoEl);
      // 「取り組み(参加率)」と「正答率」を、縦棒グラフで横並びに見せる。
      // テキストだけより、2本の棒の高さで直接比べられた方が分かりやすいため。
      const miniChart = buildBarChart([
        { label:"参加率", value: d.participationRate, color: STAT_COLORS.blue.icon },
        { label:"正答率", value: d.rate || 0, color: toneColor }
      ], { width:150, height:118 });
      miniChart.classList.add("cat-rank-chart");
      row.appendChild(miniChart);
      rankList.appendChild(row);
    });
    rankCard.appendChild(rankList);
    learningWrap.appendChild(rankCard);

    // 「よくある間違いの例」カード。
    // 苦手ランキングの数字だけでなく、企業全体でどの問題が実際によく間違えられているかを、
    // 苦手な分野TOP3について具体例つきで見せる(カローラ富山様の面談運用と同じ考え方)。
    // 個人カルテと違い、ここでは学習者を横断して問題ごとに集計する。
    const qAgg = {}; // key: level+"|"+question_id -> {n,c,level,qid}
    (dashState.questionStats || []).forEach(r=>{
      const key = r.level + "|" + r.question_id;
      if(!qAgg[key]) qAgg[key] = { n:0, c:0, level: r.level, qid: r.question_id };
      qAgg[key].n += r.n; qAgg[key].c += r.c;
    });
    // 「よくある間違いの例」も同じ理由で、最低解答数の条件をかけたカテゴリから選ぶ
    // (そもそも各問題側にもn>=3の条件があるが、カテゴリの選定自体にもかけておく)
    const worstCats = catRanking.filter(d=>d.rate !== null && d.n >= MIN_N_FOR_HIGHLIGHT).slice(0, 3);
    if(worstCats.length > 0){
      const exCard = el('<div class="card" style="margin-top:var(--sp-6);"></div>');
      const exTitle = el('<div class="card-title"></div>'); exTitle.textContent = "よくある間違いの例（苦手な分野トップ3）";
      exCard.appendChild(exTitle);
      const exDesc = el('<div class="card-desc"></div>');
      exDesc.textContent = "各分野で、企業全体として実際によく間違えられている問題です(3回以上解答された問題のみ)。";
      exCard.appendChild(exDesc);
      worstCats.forEach(catD=>{
        const qidMap = (lv)=> lv === "n3" ? QID_CATEGORY_MAP_N3 : QID_CATEGORY_MAP_N4;
        const examples = Object.values(qAgg)
          .filter(a => a.n >= 3 && a.c < a.n)
          .filter(a => { const m = qidMap(a.level)[a.qid]; return m && m.cat === catD.cat; })
          .map(a => ({ a, info: questionInfo(a.level, a.qid), rate: a.c / a.n }))
          .filter(x => x.info)
          .sort((x,y)=> x.rate - y.rate || y.a.n - x.a.n)
          .slice(0, 3);
        if(examples.length === 0) return;
        const catBlock = el('<div style="margin-bottom:var(--sp-4);"></div>');
        const catHead = document.createElement("div");
        catHead.style.cssText = "font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px;";
        catHead.textContent = catD.label + "（" + (SUBJECT_LABEL[catD.subj]||"") + "）";
        catBlock.appendChild(catHead);
        const listEl = el('<div class="missq-list"></div>');
        examples.forEach(x=>{
          const item = el('<div class="missq-item"></div>');
          const top = el('<div class="missq-top"></div>');
          const rateSpan = document.createElement("span");
          rateSpan.className = "missq-rate";
          rateSpan.textContent = "全体正答率 " + Math.round(x.rate*100) + "%（" + x.a.c + "/" + x.a.n + "回正解）";
          top.appendChild(rateSpan);
          item.appendChild(top);
          const qEl = document.createElement("div"); qEl.className = "missq-q"; qEl.textContent = x.info[0];
          item.appendChild(qEl);
          const aEl = document.createElement("div"); aEl.className = "missq-a"; aEl.textContent = "正解：" + x.info[1];
          item.appendChild(aEl);
          if(x.info[2]){ const eEl = document.createElement("div"); eEl.className = "missq-e"; eEl.textContent = x.info[2]; item.appendChild(eEl); }
          listEl.appendChild(item);
        });
        catBlock.appendChild(listEl);
        exCard.appendChild(catBlock);
      });
      learningWrap.appendChild(exCard);
    }
  }

  // ==== サブタブ: 学習履歴(daily_summaryベース。誰が・いつ・何を学習したか) ====
  else if(dashState.learningSubTab === "history"){
    // 学習履歴は全件を読み込まず、データベース側(dash_history_page)から30件ずつ読む。
    // 閲覧できる範囲(企業は自社分だけ等)はデータベースの閲覧ルール(RLS)で決まる。
    const nameByKey = {};
    learners.forEach(l=>{ nameByKey[l.company_id+"::"+l.learner_id] = l; });
    const PAGE_SIZE = 30;
    const pageIdx = dashState.learningLearnerPage || 0;
    const histCard = el('<div class="card"></div>');
    const histTitle = el('<div class="card-title"></div>'); histTitle.textContent = "学習履歴";
    histCard.appendChild(histTitle);
    const cached = (dashState.historyPages || {})[pageIdx];
    if(!cached){
      histCard.appendChild(el('<div class="loading">読み込み中...</div>'));
      if(!dashState._histLoading){
        dashState._histLoading = true;
        loadHistoryPage(pageIdx, PAGE_SIZE).finally(()=>{ dashState._histLoading = false; render(); });
      }
    } else if(cached.rows.length === 0 && pageIdx === 0){
      histCard.appendChild(el('<div class="loading">まだ学習履歴がありません。</div>'));
    } else {
      const total = dashState.historyTotal || cached.rows.length;
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      const histList = el('<div class="history-list"></div>');
      cached.rows.forEach(d=>{
        const l = nameByKey[d.company_id+"::"+d.learner_id];
        const r = { date: d.summary_date, learnerName: l ? (l.learnerName||d.learner_id) : d.learner_id,
                    companyName: l ? (l.companyName||d.company_id) : d.company_id,
                    subj: d.subj, n: d.n_count, c: d.c_count };
        const row = el('<div class="history-row"></div>');
        const rateStr = r.n>0 ? Math.round(r.c/r.n*100)+"%" : "-";
        row.innerHTML =
          "<div class='history-date'>"+escapeHtml(r.date)+"</div>"+
          "<div class='history-main'>"+
            "<div class='history-name'>"+escapeHtml(r.learnerName)+" <span class='history-company'>（"+escapeHtml(r.companyName)+"）</span></div>"+
            "<div class='history-detail'>"+(SUBJECT_LABEL[r.subj]||r.subj)+"　"+fmtNum(r.n)+"問（正答率 "+rateStr+"）</div>"+
          "</div>";
        histList.appendChild(row);
      });
      histCard.appendChild(histList);
      if(totalPages > 1){
        histCard.appendChild(buildPaginationControl(pageIdx, totalPages, (newPage)=>{ dashState.learningLearnerPage = newPage; render(); }));
      }
    }
    learningWrap.appendChild(histCard);
  }

  wrap.appendChild(learningWrap);
  }

  return wrap;
}

// 企業フィルタ変更時に、サマリーカード部分だけを再構築する(全体再描画によるチラつきを避けるため)。
function renderSummaryOnly(){
  const summaryWrap = document.getElementById("summaryWrap");
  if(!summaryWrap) return;
  summaryWrap.innerHTML = "";
  buildSummaryContent(summaryWrap, dashState.activeTab);
}

// 事業所フィルタの選択肢を組み立てる(企業フィルタに応じて絞り込む)。
// companySelect変更時にこれだけを呼んで再構築できるよう、renderDashboard()から切り出す。
function populateWorkplaceFilterOptions(selectEl){
  selectEl.innerHTML = "";
  const allWpOpt = document.createElement("option");
  allWpOpt.value = ""; allWpOpt.textContent = "すべての事業所";
  selectEl.appendChild(allWpOpt);
  // 現在の企業フィルタに応じて、選択肢となる事業所を絞る(ntic_adminが企業未選択なら全事業所)
  let wpCandidates = dashState.workplaces;
  if(dashState.companyFilter.trim()){
    wpCandidates = wpCandidates.filter(w=>w.company_id === dashState.companyFilter.trim());
  }
  const sortedWorkplaces = wpCandidates.slice().sort((a,b)=> a.workplace_name.localeCompare(b.workplace_name,"ja"));
  sortedWorkplaces.forEach(w=>{
    const opt = document.createElement("option");
    opt.value = w.id;
    // 同じ企業内で、事業所名が同じでもdekisugi_workplace_idの有無で別枠になっているケースがあるため
    // (例: 現場作業員向けの法人代表扱いと、実際に特定の事業所IDを持つ本社勤務が両方存在する)、
    // IDが無い方には注記を付けて区別できるようにする。
    opt.textContent = w.workplace_name + (w.dekisugi_workplace_id ? "" : "（事業所未特定・法人代表扱い）");
    if(dashState.workplaceFilter === w.id) opt.selected = true;
    selectEl.appendChild(opt);
  });
}
function refreshWorkplaceFilterOptions(){
  const selectEl = document.getElementById("workplaceFilterSelect");
  if(selectEl) populateWorkplaceFilterOptions(selectEl);
}

// タブ構成。id=dashState.activeTabに対応する値。adminOnly=trueは企業担当者には出さない
// (自社の一覧はexistingの実習生タブで十分閲覧できるため、企業マスタ管理・レポートは組合管理者限定)。
const TAB_DEFS = [
  { id: "overview", label: "概要", icon: "home" },
  { id: "learners", label: "実習生", icon: "users" },
  { id: "learning", label: "学習", icon: "book" },
  { id: "companies", label: "企業・事業所", icon: "building", adminOnly: true },
  { id: "reports", label: "レポート", icon: "fileText", adminOnly: true }
];
function visibleTabs(scope){
  return TAB_DEFS.filter(t => !t.adminOnly || scope.isAdmin);
}
function switchTab(tabId){
  dashState.activeTab = tabId;
  dashState.selectedLearner = null;
  // タブを自分で切り替えたときは、概要から持ち込んだ絞り込みを解除する。
  // 残っていると「実習生が減った」と誤解されるため。
  dashState.onlyUnregistered = false;
  render();  // 先頭へのスクロールはrender()側で一律に行う
}
// 学習タブ内のサブナビ構成。「見るだけ」ではなく「概要→実習生別→分野別→履歴」の流れで
// 管理・分析・フォローまでたどり着けるようにする。
const LEARNING_SUBTAB_DEFS = [
  { id: "overview", label: "学習概要" },
  { id: "learners", label: "実習生別" },
  { id: "subjects", label: "分野別" },
  { id: "history", label: "学習履歴" }
];
function switchLearningSubTab(id){
  dashState.learningSubTab = id;
  render();  // 先頭へのスクロールはrender()側で一律に行う
}
function buildLearningSubNav(){
  const nav = el('<div class="subnav"></div>');
  LEARNING_SUBTAB_DEFS.forEach(t=>{
    const btn = el('<button class="subnav-btn"></button>');
    if(t.id === dashState.learningSubTab) btn.classList.add("active");
    btn.textContent = t.label;
    btn.onclick = ()=> switchLearningSubTab(t.id);
    nav.appendChild(btn);
  });
  return nav;
}
// PC用の上部タブ
function buildTabNav(scope){
  const nav = el('<div class="tabnav"></div>');
  visibleTabs(scope).forEach(t=>{
    const btn = el('<button class="tabnav-btn"></button>');
    if(t.id === dashState.activeTab) btn.classList.add("active");
    btn.innerHTML = "<span class='tabnav-icon'>"+STAT_ICONS[t.icon]+"</span><span>"+t.label+"</span>";
    btn.onclick = ()=> switchTab(t.id);
    nav.appendChild(btn);
  });
  return nav;
}
// スマホ用の下部固定ナビ(CSSでPC幅では非表示にする)
function buildMobileBottomNav(scope){
  const nav = el('<div class="mobile-bottomnav"></div>');
  visibleTabs(scope).forEach(t=>{
    const btn = el('<button class="mobile-bottomnav-btn"></button>');
    if(t.id === dashState.activeTab) btn.classList.add("active");
    btn.innerHTML = "<span class='mobile-bottomnav-icon'>"+STAT_ICONS[t.icon]+"</span><span>"+t.label+"</span>";
    btn.onclick = ()=> switchTab(t.id);
    nav.appendChild(btn);
  });
  return nav;
}

// ---- 所属事業所の変更モーダル ----
// 同じ企業の事業所を一覧で出し、1つ選んで変更する。
// 現在の所属には印を付け、各事業所の在籍人数も出して選びやすくする。
function openWorkplaceChange(learner, valueEl){
  const bg = el('<div class="modal-bg"></div>');
  const box = el('<div class="modal-box" style="max-width:460px;"></div>');

  const title = document.createElement("div");
  title.className = "card-title";
  title.textContent = "所属事業所の変更";
  box.appendChild(title);

  const who = document.createElement("div");
  who.style.cssText = "font-size:13px;color:var(--text-sub);margin-bottom:14px;";
  who.textContent = (learner.learnerName || learner.learner_id) + "（" + (learner.companyName || learner.company_id) + "）";
  box.appendChild(who);

  const listWrap = document.createElement("div");
  listWrap.style.cssText = "max-height:320px;overflow-y:auto;margin-bottom:14px;";
  listWrap.innerHTML = '<div class="loading">読み込んでいます...</div>';
  box.appendChild(listWrap);

  const btnRow = el('<div style="display:flex;gap:10px;justify-content:flex-end;"></div>');
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "secondary";
  cancelBtn.textContent = "閉じる";
  cancelBtn.onclick = ()=> document.body.removeChild(bg);
  btnRow.appendChild(cancelBtn);
  box.appendChild(btnRow);

  bg.appendChild(box);
  document.body.appendChild(bg);

  listWorkplacesForStudent(learner.learner_id).then(rows=>{
    listWrap.innerHTML = "";
    if(rows.length === 0){
      const empty = document.createElement("div");
      empty.className = "loading";
      empty.textContent = "この企業には事業所が登録されていません。";
      listWrap.appendChild(empty);
      return;
    }
    rows.forEach(w=>{
      const item = document.createElement("button");
      item.style.cssText = "display:block;width:100%;text-align:left;background:" +
        (w.is_current ? "#eef7f1" : "#fff") + ";border:1px solid " +
        (w.is_current ? "var(--green)" : "var(--line)") +
        ";border-radius:8px;padding:11px 13px;margin-bottom:7px;cursor:pointer;font-size:13.5px;";
      item.innerHTML =
        "<div style='font-weight:700;color:var(--text-main);'>" + escapeHtml(w.workplace_name) +
          (w.is_current ? " <span style='font-size:11px;color:var(--green);font-weight:600;'>（現在）</span>" : "") + "</div>" +
        "<div style='font-size:11.5px;color:var(--text-sub);margin-top:2px;'>" +
          "在籍 " + fmtNum(w.learner_count) + "人" +
          (w.dekisugi_workplace_id ? "" : "　※Dekisugi未登録") +
        "</div>";
      if(w.is_current){
        item.disabled = true;
        item.style.cursor = "default";
      } else {
        item.onclick = ()=>{
          ask("所属事業所を「" + w.workplace_name + "」に変更します。よろしいですか？", async ()=>{
            item.disabled = true;
            try{
              await setStudentWorkplace(learner.learner_id, w.workplace_id);
              document.body.removeChild(bg);
              if(valueEl) valueEl.textContent = w.workplace_name;
              dashState._fetchTriggered = false;
              await loadDashboardData();
            }catch(e){
              item.disabled = false;
              const errBox = document.createElement("div");
              errBox.className = "errormsg";
              errBox.textContent = e.message || "変更に失敗しました。";
              listWrap.appendChild(errBox);
            }
          }, null, "はい、変更する");
        };
      }
      listWrap.appendChild(item);
    });
  }).catch(e=>{
    listWrap.innerHTML = "";
    const errBox = document.createElement("div");
    errBox.className = "errormsg";
    errBox.textContent = e.message || "事業所の一覧を取得できませんでした。";
    listWrap.appendChild(errBox);
  });
}

// ---- Dekisugi CSV取込カード ----
// ファイル選択 → ブラウザ内で解析 → プレビュー(差分表示) → 確認して取込、の流れ。
// いきなり書き込まないのは、想定外のデータが混ざっていた場合に気づけるようにするため。
function buildImportCard(){
  const card = el('<div class="card" style="margin-top:var(--sp-6);"></div>');
  const title = el('<div class="card-title"></div>');
  title.textContent = "Dekisugi CSV取込";
  card.appendChild(title);
  const desc = el('<div class="card-desc"></div>');
  desc.textContent = "Dekisugiからエクスポートした実習生CSVを読み込み、実習生・企業・事業所の情報を最新化します。取り込む前に必ず差分が表示されるので、内容を確認してから実行してください。";
  card.appendChild(desc);

  const note = document.createElement("div");
  note.style.cssText = "font-size:12px;color:var(--text-sub);line-height:1.7;margin-bottom:var(--sp-3);";
  note.innerHTML =
    "・アカウント発行の対象は「在籍フラグ＝在籍」かつ「入国日が入力済み」の実習生です。入国前の方は取り込んでも発行対象になりません。<br>" +
    "・所属事業所は、Dekisugiの「実習事業所(雇入れ直後)」に複数登録されている場合、先頭の1件を現在の所属として扱います。<br>" +
    "・CSVから消えた実習生は削除されません（学習履歴を保持するため）。<br>" +
    "・手動で「終了済み」に設定した実習生の判定は、取込で上書きされません。";
  card.appendChild(note);

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = ".csv,text/csv";
  fileInput.style.cssText = "border:none;padding:8px 0;margin-bottom:8px;";
  card.appendChild(fileInput);

  const statusEl = document.createElement("div");
  statusEl.style.cssText = "font-size:13px;color:var(--text-sub);margin-bottom:var(--sp-3);";
  card.appendChild(statusEl);

  const resultWrap = document.createElement("div");
  card.appendChild(resultWrap);

  fileInput.onchange = async ()=>{
    const file = fileInput.files && fileInput.files[0];
    if(!file) return;
    resultWrap.innerHTML = "";
    statusEl.textContent = "CSVを読み込んでいます...";
    let rows;
    try{
      const text = await file.text();
      rows = extractDekisugiRows(text);
    }catch(e){
      statusEl.textContent = "";
      const err = el('<div class="errormsg"></div>');
      err.textContent = e.message || "CSVの読み込みに失敗しました。";
      resultWrap.appendChild(err);
      return;
    }

    statusEl.textContent = "読み込み完了：" + fmtNum(rows.length) + "名分（重複行を除く）。差分を確認しています...";

    let preview;
    try{
      preview = await previewDekisugiImport(rows);
    }catch(e){
      statusEl.textContent = "";
      const err = el('<div class="errormsg"></div>');
      err.textContent = e.message || "差分の確認に失敗しました。";
      resultWrap.appendChild(err);
      return;
    }

    statusEl.textContent = "読み込み完了：" + fmtNum(rows.length) + "名分（重複行を除く）";
    resultWrap.appendChild(buildImportPreview(rows, preview, resultWrap, statusEl));
  };

  return card;
}

// プレビュー結果(差分の表)と「取り込む」ボタンを組み立てる

  const box = document.createElement("div");

  const t = el('<div class="card-title" style="margin-top:var(--sp-4);"></div>');

  table.innerHTML = "<thead><tr><th>区分</th><th>内容</th><th>件数</th></tr></thead>";
  const tbody = document.createElement("tbody");
  preview.forEach(p=>{
    const tr = document.createElement("tr");
    const isWarn = p.category === "注意";
    tr.innerHTML =
      "<td>"+escapeHtml(p.category)+"</td>"+
      "<td>"+escapeHtml(p.detail)+"</td>"+
      "<td"+(isWarn?" style='color:var(--red);font-weight:700;'":" style='font-weight:700;'")+">"+fmtNum(p.cnt)+"</td>";
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  box.appendChild(tableWrap);

  const btnRow = el('<div style="display:flex;gap:10px;margin-top:var(--sp-4);flex-wrap:wrap;"></div>');
  const applyBtn = document.createElement("button");
  applyBtn.className = "primary";
  applyBtn.textContent = "この内容で取り込む";
  applyBtn.onclick = ()=>{
    ask("上記の内容でDekisugiのデータを取り込みます。実習生・企業・事業所の情報が更新されます。よろしいですか？", async ()=>{
      applyBtn.disabled = true; applyBtn.textContent = "取込中...";
      statusEl.textContent = "取り込んでいます。件数が多いと時間がかかります...";
      try{
        const r = await applyDekisugiImport(rows);
        resultWrap.innerHTML = "";
        const done = el('<div class="card" style="background:#eef7f1;border-color:#cfe4d7;"></div>');
        const dt = el('<div class="card-title"></div>');

        const dl = document.createElement("div");
        dl.style.cssText = "font-size:13.5px;line-height:2;";
        dl.innerHTML =
          "新しく追加された企業：<b>"+fmtNum(r.new_companies)+"社</b><br>"+
          "新しく追加された事業所：<b>"+fmtNum(r.new_workplaces)+"事業所</b><br>"+
          "新しく登録された実習生：<b>"+fmtNum(r.new_students)+"名</b><br>"+
          "在籍状況を更新した実習生：<b>"+fmtNum(r.updated_status)+"名</b><br>"+
          "氏名を更新した実習生：<b>"+fmtNum(r.updated_name)+"名</b>"+
          (r.skipped_workplaces > 0
            ? "<br><span style='color:var(--text-sub);font-size:12.5px;'>名称を確定できず登録しなかった事業所："
              + fmtNum(r.skipped_workplaces) + "件（実習生は所属先が未設定になります）</span>"
            : "");
        done.appendChild(dl);
        resultWrap.appendChild(done);
        statusEl.textContent = "";
        dashState._fetchTriggered = false;
        await loadDashboardData();
      }catch(e){
        applyBtn.disabled = false; applyBtn.textContent = "この内容で取り込む";
        statusEl.textContent = "";

        err.textContent = e.message || "取込に失敗しました。";

  cancelBtn.className = "secondary";
  cancelBtn.textContent = "やめる";
  cancelBtn.onclick = ()=>{ resultWrap.innerHTML = ""; statusEl.textContent = ""; };
  btnRow.appendChild(cancelBtn);

  box.appendChild(btnRow);
  return box;
}

function renderDashboard(){

  const scope = sessionScope();

  // 企業担当者が管理者限定タブ(companies/reports)を直接踏んでいた場合は概要に戻す
  // (URLで直接指定されたわけではないが、念のための安全策)。

    dashState.activeTab = "overview";
  }

  // company_users問い合わせがまだの場合、先にそれを解決してから権限判定する
  if(scope.role === "company_user_pending"){
    const pendingCard = el('<div class="card"></div>');
    pendingCard.appendChild(el('<div class="loading">権限を確認しています...</div>'));
    wrap.appendChild(pendingCard);
    if(!dashState._companyUserFetchTriggered){
      dashState._companyUserFetchTriggered = true;

    wrap.appendChild(card);

  } else if(dashState.activeTab === "reports"){

// ---- SVG折れ線グラフ(模試の得点推移。外部ライブラリ不使用) ----
function svgExamTrend(exams){
  // exams: taken_atの昇順に並んだ配列 [{taken_at, pct, exam_group}, ...]
  if(exams.length < 2) return "";
  const W = 340, H = 170, padL = 32, padR = 12, padT = 12, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = exams.length;
  const xStep = plotW / (n - 1);
  const colorFor = ()=> "#3d7a52";

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:360px;display:block;margin:0 auto;">';

  [0,25,50,75,100].forEach(v=>{
    const y = padT + plotH - (v/100*plotH);
    svg += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#eef1f6" stroke-width="1"/>';
    svg += '<text x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" font-size="9" fill="#8a94a6" text-anchor="end">'+v+'</text>';
  });

  let path = "";
  exams.forEach((e,i)=>{
    const x = padL + i*xStep;
    const y = padT + plotH - (Math.max(0,Math.min(100,e.pct))/100*plotH);
    path += (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
  });
  svg += '<path d="'+path+'" fill="none" stroke="#cbd5e1" stroke-width="1.5" class="trend-line"/>';

  exams.forEach((e,i)=>{
    const x = padL + i*xStep;
    const y = padT + plotH - (Math.max(0,Math.min(100,e.pct))/100*plotH);
    svg += '<circle class="trend-dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="'+colorFor(e.exam_group)+'"/>';
  });

  // 最初と最後の日付だけラベル表示(混雑を避けるため)
  const fmtDate = (iso)=>{ const d = new Date(iso); return (d.getMonth()+1)+"/"+d.getDate(); };
  svg += '<text x="'+padL+'" y="'+(H-6)+'" font-size="9" fill="#8a94a6" text-anchor="start">'+fmtDate(exams[0].taken_at)+'</text>';
  svg += '<text x="'+(W-padR)+'" y="'+(H-6)+'" font-size="9" fill="#8a94a6" text-anchor="end">'+fmtDate(exams[n-1].taken_at)+'</text>';

  svg += '</svg>';
  return svg;
}
