<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>N.T.I.C Academy - 管理者ダッシュボード</title>
<style>
:root{
  --navy:#14213D; --blue:#2A4A7C; --blue-light:#f7f7f8;
  --yellow:#8a8f99; --green:#1a1f29; --green-bg:transparent;
  --red:#b5502f; --red-bg:transparent; --amber:#8a8f99; --amber-bg:transparent;
  --bg:#ffffff; --border:#e6e7ea; --text-main:#1a1f29; --text-sub:#8a8f99;
  --radius:6px; --radius-sm:4px;
  --shadow:none;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text-main);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;width:100%;}
header{background:var(--navy);color:#fff;padding:16px 18px;}
header h1{font-size:13px;margin:0;font-weight:500;letter-spacing:.02em;opacity:.9;
  line-height:1.5;}
main{max-width:900px;margin:0 auto;padding:28px 20px 60px;width:100%;box-sizing:border-box;}
.card{background:#fff;border-radius:var(--radius);padding:22px 0;margin-bottom:0;
  border:none;border-bottom:1px solid var(--border);max-width:100%;overflow-x:hidden;}
.card:first-of-type{padding-top:2px;}
.card-title{font-weight:600;font-size:11px;color:var(--text-sub);margin-bottom:16px;
  border-left:none;padding-left:0;letter-spacing:.07em;text-transform:uppercase;}
input{padding:11px 0;border:none;border-bottom:1px solid var(--border);border-radius:0;font-size:14px;
  width:100%;max-width:100%;box-sizing:border-box;margin-bottom:10px;background:transparent;transition:border-color .15s;}
input:focus{outline:none;border-color:var(--navy);}
select{padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;
  background:#fff;max-width:100%;box-sizing:border-box;}
button.primary{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px 20px;
  font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.01em;}
button.primary:hover{background:#0d1830;}
button.secondary{background:#fff;color:var(--text-main);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;}
button.ghost{background:transparent;border:none;color:var(--text-sub);cursor:pointer;font-size:12px;
  font-weight:500;padding:4px 0;display:inline-flex;align-items:center;gap:4px;}
button.ghost:hover{text-decoration:underline;}
.errormsg{color:var(--red);font-size:13px;margin-bottom:10px;line-height:1.6;}
table{width:100%;border-collapse:collapse;font-size:13px;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px;}
.table-scroll table{min-width:640px;}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
th{color:var(--text-sub);font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  background:transparent;}
.badge{display:inline;padding:0;border-radius:0;font-size:12.5px;font-weight:600;color:var(--text-main);}
.badge.high{color:var(--text-main);}
.badge.mid{color:var(--text-sub);font-weight:500;}
.badge.low{color:var(--red);}
.filters{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filters input{flex:1;min-width:160px;margin-bottom:0;}
.loading{text-align:center;color:var(--text-sub);padding:36px 20px;font-size:13px;}
.stale{color:var(--red);}
tr.clickable{cursor:pointer;transition:background .12s;}
tr.clickable:hover{background:var(--blue-light);}
.katefbar{margin:15px 0;}
.katefbarrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:var(--text-main);}
.katefbarrow span:last-child{font-weight:600;color:var(--text-main);}
.katefbartrack{height:1px;background:var(--border);}
.katefbar-fill{height:100%;background:var(--navy);}
.katefbar-fill.low{background:var(--red);}
.katefbar-fill.mid{background:var(--text-sub);}
.examrow{padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;}
.examrow:last-child{border-bottom:none;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:var(--radius);padding:24px;max-width:360px;width:100%;}
.modal-box p{font-size:14px;line-height:1.6;margin:0 0 18px;color:var(--text-main);}
.modal-box .rowbtns{display:flex;gap:10px;}
.modal-box .rowbtns button{flex:1;padding:11px;}
button.danger{background:#fff;color:var(--red);border:1px solid var(--red);border-radius:var(--radius-sm);
  padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;}
button.danger:hover{background:#faf3f0;}
.icon{width:13px;height:13px;flex:0 0 auto;vertical-align:middle;}
.icon-warn{color:var(--red);}
.stat-block{background:transparent;border-radius:0;
  padding:0;text-align:left;border:none;display:flex;flex-direction:column;}
.stat-block .num{font-size:26px;font-weight:300;color:var(--text-main);letter-spacing:-.02em;line-height:1.2;}
.stat-block .lbl{font-size:11px;color:var(--text-sub);margin-top:5px;font-weight:400;}
.stat-block .stat-sub{font-size:10.5px;color:var(--text-sub);margin-top:2px;font-weight:500;}
.stat-block.alert .num{color:var(--red);}
.summary-cardgrid{display:grid;gap:22px 16px;margin-bottom:0;align-items:start;}
.summary-cardgrid + .summary-cardgrid{margin-top:20px;}
.summary-cardgrid.cols-3{grid-template-columns:repeat(3,1fr);}
.summary-cardgrid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width: 520px){
  .summary-cardgrid.cols-3{grid-template-columns:repeat(2,1fr);}
  .summary-cardgrid.cols-4{grid-template-columns:repeat(2,1fr);}
}
.followup-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.followup-row:last-child{border-bottom:none;}
.followup-row:hover{background:var(--blue-light);}
.followup-name{font-size:13.5px;font-weight:600;}
.followup-reason{font-size:11.5px;color:var(--text-sub);margin-top:2px;}
.subj-trend-row{margin:13px 0;}
.subj-trend-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.subj-trend-track{height:1px;background:var(--border);}
.subj-trend-fill{height:100%;background:var(--navy);}
.tree-company-header{display:flex;align-items:center;gap:10px;padding:12px 4px;
  font-weight:600;font-size:14px;border-bottom:1px solid var(--border);}
.tree-company-header .tree-company-name{user-select:none;}
.tree-company-header > div:first-child:hover{background:var(--blue-light);}
.tree-workplace-header{display:flex;align-items:center;gap:10px;padding:10px 4px 10px 26px;cursor:pointer;
  font-weight:500;font-size:13px;color:var(--text-main);border-bottom:1px solid var(--border);
  background:#fafafb;user-select:none;}
.tree-workplace-header:hover{background:var(--blue-light);}
.tree-toggle{color:var(--text-sub);font-size:11px;width:12px;flex:0 0 auto;}
.tree-company-name{flex:1;}
.tree-workplace-name{flex:1;}
.tree-count{color:var(--text-sub);font-size:12px;font-weight:400;}
.tree-workplace-body{padding-left:26px;margin-bottom:4px;}
.tree-pager{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 4px 2px;font-size:13px;}
.tree-pager-count{text-align:center;font-size:11.5px;color:var(--text-sub);padding-bottom:10px;}
.pagination-nav{background:none;border:none;color:var(--blue);cursor:pointer;font-size:13px;
  padding:6px 8px;border-radius:6px;}
.pagination-nav:hover{background:var(--blue-light);}
.pagination-nav:disabled{color:#c4c7cd;cursor:default;background:none;}
.pagination-page{width:28px;height:28px;border:none;background:transparent;border-radius:6px;
  cursor:pointer;font-size:13px;color:var(--text-main);}
.pagination-page:hover{background:var(--blue-light);}
.pagination-page.active{background:var(--navy);color:#fff;font-weight:600;}
.pagination-ellipsis{color:var(--text-sub);padding:0 2px;}
</style>

<script>
(function(){
"use strict";

let session = null; // {access_token, email}

function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!session) app.appendChild(renderLogin());
  else app.appendChild(renderDashboard());
}

function renderLogin(){
  const wrap = document.createElement("div");
  const card = el('<div class="card" style="max-width:380px;margin:40px auto;"></div>');
  const h = document.createElement("div");
  h.style.fontWeight="700"; h.style.fontSize="16px"; h.style.marginBottom="14px";
  h.textContent = "管理者ログイン";
  card.appendChild(h);

  const err = document.createElement("div");
  err.className = "errormsg"; err.style.display = "none";
  card.appendChild(err);

  const email = document.createElement("input");
  email.type = "email"; email.placeholder = "メールアドレス";
  card.appendChild(email);

  const pw = document.createElement("input");
  pw.type = "password"; pw.placeholder = "パスワード";
  card.appendChild(pw);

  const btn = document.createElement("button");
  btn.className = "primary"; btn.style.width="100%"; btn.textContent = "ログイン";
  btn.onclick = async ()=>{
    btn.disabled = true; btn.textContent = "ログイン中...";
    err.style.display = "none";
    try{
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.value, password: pw.value })
      });
      const data = await res.json();
      if(!res.ok || !data.access_token){
        err.textContent = "ログインに失敗しました。メールアドレス・パスワードを確認してください。";
        err.style.display = "block";
        btn.disabled = false; btn.textContent = "ログイン";
        return;
      }
      session = { access_token: data.access_token, email: email.value };
      render();
    }catch(e){
      err.textContent = "通信エラーが発生しました。ネットワーク接続を確認してください。";
      err.style.display = "block";
      btn.disabled = false; btn.textContent = "ログイン";
    }
  };
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
}

function decodeJwt(token){
  try{
    const payload = token.split(".")[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,"+").replace(/_/g,"/"))
      .split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  }catch(e){ return {}; }
}

function sessionScope(){
  if(!session) return { isAdmin:false, role:null, companyId:null };
  const payload = decodeJwt(session.access_token);
  const meta = (payload.app_metadata) || {};
  const jwtRole = meta.role || null;
  if(jwtRole === "ntic_admin"){
    return { isAdmin: true, role: "ntic_admin", companyId: null };
  }
  if(jwtRole === "company_user"){
    // JWTには"company_user"という粗い印だけを持たせている(認証=JWT、権限=DBの方針)。
    // 実際のロール(company_owner/workplace_manager)・所属企業は、
    // company_usersテーブルへの問い合わせ結果(dashState.companyUserInfo)を正とする。
    // まだ問い合わせ前(undefined)の間は「権限未確定」として扱い、解決後に確定させる。
    if(dashState.companyUserInfo){
      return { isAdmin:false, role: dashState.companyUserInfo.role, companyId: dashState.companyUserInfo.company_id };
    }
    return { isAdmin:false, role: "company_user_pending", companyId:null };
  }
  // 実習生本人など、それ以外のroleは対象外(companyIdはUI補助情報のみ、権限判定には使わない)
  return { isAdmin: false, role: jwtRole, companyId: meta.company_id || null };
}

// ---- NTLPアカウント発行(NTIC管理者のみ。DB関数側でもntic_adminチェックを行っている) ----
// 母国語・在籍フラグは、現時点ではdashboard側にDekisugi CSV由来のデータが無いため、
// 安全なデフォルト値(母国語:空→関数側で日本語にフォールバック, 在籍フラグ:0=在籍)を使う。
// 将来Dekisugi CSVのインポート機能ができたら、実データを渡すよう改修が必要。
async function issueAccount(learner){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/create_student_account", {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({
      p_dekisugi_student_code: learner.learner_id,
      p_name: learner.learnerName || learner.learner_id,
      p_dekisugi_company_id: learner.dekisugiCompanyId,
      p_native_language_raw: "",
      p_zairyu_flag: 0
    })
  });
  const data = await res.json();
  if(!res.ok){
    const msg = (data && (data.message || data.error_description)) || "アカウント発行に失敗しました。";
    throw new Error(msg);
  }
  // RPCはtable関数なので配列で返る
  return Array.isArray(data) ? data[0] : data;
}

// 一括発行の実処理。二重実行防止・進捗表示・1件完了ごとの結果反映を行う。
async function runBulkIssue(targets){
  if(dashState.bulkInProgress) return; // 二重クリック防止
  dashState.bulkInProgress = true;
  dashState.bulkTotal = targets.length;
  dashState.bulkDone = 0;
  dashState.bulkResults = [];
  render(); // 一括発行の進捗パネルへ切り替える

  for(const l of targets){
    let entry;
    try{
      const result = await issueAccount(l);
      entry = { name: l.learnerName || l.learner_id, company: l.companyName || l.company_id, loginId: result.login_id, password: result.initial_password, success: true, error: null };
    }catch(e){
      entry = { name: l.learnerName || l.learner_id, company: l.companyName || l.company_id, loginId: "-", password: "-", success: false, error: e.message || "不明なエラー" };
    }
    dashState.bulkResults.push(entry);
    dashState.bulkDone += 1;
    renderBulkResultPanelInPlace(); // 1件終わるごとに画面を更新(全部終わるまで待たない)
  }

  dashState.bulkInProgress = false;
  dashState.bulkSelected = {}; // 発行済みの選択状態はクリア
  dashState._fetchTriggered = false;
  await loadDashboardData(); // 最新のNTLP登録状況を反映
  renderBulkResultPanelInPlace();
}

// CSV生成・ダウンロード。ブラウザ内で完結し、どこにも送信・保存しない。
function downloadBulkResultCsv(results){
  const header = ["氏名","企業名","ログインID","初期パスワード","結果"];
  const rows = results.map(r=>[r.name, r.company, r.loginId, r.password, r.success ? "成功" : "失敗"]);
  const escapeCsv = (v)=>{
    const s = String(v==null?"":v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const csvLines = [header, ...rows].map(row=>row.map(escapeCsv).join(","));
  const csvContent = "\uFEFF" + csvLines.join("\r\n"); // BOM付きでExcelでの文字化けを防止
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().replace(/[:.]/g,"-");
  a.href = url;
  a.download = "ntlp_account_issue_" + ts + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function authHeaders(){
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + session.access_token,
    "Content-Type": "application/json"
  };
}

async function fetchAll(table, params){
  const url = SUPABASE_URL + "/rest/v1/" + table + "?" + (params||"select=*");
  const doFetch = ()=> fetch(url, { headers: authHeaders() });
  let res = await doFetch();
  if(res.status === 401){
    // ログイン直後、発行されたばかりのトークンが一瞬だけ未反映で401になることがあるため、
    // 少し待って1回だけ自動的に再試行する(セッションを即座に破棄しない)。
    await new Promise(r=>setTimeout(r, 600));
    res = await doFetch();
  }
  if(!res.ok){
    if(res.status === 401){ session = null; render(); }
    throw new Error("fetch failed: " + table);
  }
  return res.json();
}

// Supabase(PostgREST)は1回のリクエストで最大1000件までしか返さない設定になっている。
// これはクライアント側から limit=... を指定しても超えられないサーバー側の上限のため、
// 1000件を超える可能性があるテーブル(roster/students/companies等)は、
// limit/offset をクエリパラメータとして直接URLに含める形で1000件ずつページ分けして取得し、
// 全件になるまで繰り返す。
// (Rangeヘッダー方式は、ブラウザのクロスオリジン制限で実際にはヘッダーが送信されず、
//  同じ1ページ目を繰り返し取得してしまう不具合があったため、この方式に変更した)
async function fetchAllPaged(table, params){
  const pageSize = 1000;
  const maxPages = 20; // 安全装置。20000件を超える想定は現状無い
  let all = [];
  let offset = 0;
  for(let page=0; page<maxPages; page++){
    const base = params || "select=*";
    const url = SUPABASE_URL + "/rest/v1/" + table + "?" + base + "&limit=" + pageSize + "&offset=" + offset;
    const doFetch = ()=> fetch(url, { headers: authHeaders() });
    let res = await doFetch();
    if(res.status === 401){
      await new Promise(r=>setTimeout(r, 600));
      res = await doFetch();
    }
    if(!res.ok){
      if(res.status === 401){ session = null; render(); }
      throw new Error("fetch failed: " + table);
    }
    const rows = await res.json();
    all = all.concat(rows);
    offset += pageSize;
    if(rows.length < pageSize || rows.length === 0) break; // 最後のページ
  }
  return all;
}

function relTime(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff/60000);
  if(min < 1) return "たった今";
  if(min < 60) return min+"分前";
  const hr = Math.floor(min/60);
  if(hr < 24) return hr+"時間前";
  const day = Math.floor(hr/24);
  return day+"日前";
}

function buildLearnerSummary(){
  const map = {};
  const companyNames = {};
  const companyDekisugiMap = {}; // company_id -> dekisugi_company_id
  dashState.companies.forEach(c=>{
    companyNames[c.company_id] = c.company_name;
    companyDekisugiMap[c.company_id] = c.dekisugi_company_id || null;
  });
  const rosterMap = {};
  dashState.roster.forEach(r=>{ rosterMap[r.company_id + "::" + r.learner_id] = r; });
  // NTLP登録状況の名寄せキー: roster.learner_id = students.dekisugi_student_code
  const studentsByCode = {};
  dashState.students.forEach(s=>{ studentsByCode[s.dekisugi_student_code] = s; });

  // 勤務先(workplaces)の名寄せ: student_workplaces.dekisugi_student_code = roster.learner_id
  // 1人が複数事業所を持てるため、配列で保持する(Phase 3.5)。
  const workplaceById = {};
  dashState.workplaces.forEach(w=>{ workplaceById[w.id] = w; });
  const workplacesByCode = {}; // dekisugi_student_code -> [workplace, ...]
  dashState.studentWorkplaces.forEach(sw=>{
    const w = workplaceById[sw.workplace_id];
    if(!w) return;
    if(!workplacesByCode[sw.dekisugi_student_code]) workplacesByCode[sw.dekisugi_student_code] = [];
    workplacesByCode[sw.dekisugi_student_code].push(w);
  });

  // 期生・号(student_periods)の名寄せ: student_periods.dekisugi_student_code = roster.learner_id
  const periodByCode = {}; // dekisugi_student_code -> { kisei, go }
  dashState.studentPeriods.forEach(sp=>{ periodByCode[sp.dekisugi_student_code] = sp; });

  // ---- roster(組合の実習生管理台帳)を起点に、全員分のエントリを先に作る ----
  // これにより、まだ一度もNTLPを使っていない(学習データが0件の)実習生も一覧に表示される。
  dashState.roster.forEach(r=>{
    const key = r.company_id + "::" + r.learner_id;
    map[key] = { company_id:r.company_id, learner_id:r.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{} };
  });

  dashState.progress.forEach(p=>{
    const key = p.company_id + "::" + p.learner_id;
    if(!map[key]) map[key] = { company_id:p.company_id, learner_id:p.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{} };
    map[key].n += p.n_count;
    map[key].c += p.c_count;
    map[key].tn += (p.tn_count || 0);
    map[key].tc += (p.tc_count || 0);
    map[key].questionsStudied += 1;
    const meta = QID_CATEGORY_MAP[p.question_id];
    const subj = meta ? meta.subj : null;
    if(subj){
      if(!map[key].subjStats[subj]) map[key].subjStats[subj] = {n:0,c:0,tn:0,tc:0};
      map[key].subjStats[subj].n += p.n_count;
      map[key].subjStats[subj].c += p.c_count;
      map[key].subjStats[subj].tn += (p.tn_count || 0);
      map[key].subjStats[subj].tc += (p.tc_count || 0);
    }
  });
  dashState.exams.forEach(e=>{
    const key = e.company_id + "::" + e.learner_id;
    if(!map[key]) map[key] = { company_id:e.company_id, learner_id:e.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{} };
    if(!map[key].lastExam || new Date(e.taken_at) > new Date(map[key].lastExam.taken_at)){
      map[key].lastExam = e;
    }
  });
  dashState.activity.forEach(a=>{
    const key = a.company_id + "::" + a.learner_id;
    if(!map[key]) map[key] = { company_id:a.company_id, learner_id:a.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{} };
    map[key].lastSeen = a.last_seen_at;
  });
  (dashState.dailySummary || []).forEach(d=>{
    const key = d.company_id + "::" + d.learner_id;
    if(!map[key]) map[key] = { company_id:d.company_id, learner_id:d.learner_id, n:0, c:0, tn:0, tc:0, questionsStudied:0, subjStats:{} };
    if(!map[key].dailyRows) map[key].dailyRows = [];
    map[key].dailyRows.push(d);
  });

  Object.keys(map).forEach(key=>{
    const l = map[key];
    l.companyName = companyNames[l.company_id] || null;
    l.companyMapped = Object.prototype.hasOwnProperty.call(companyNames, l.company_id);
    const r = rosterMap[key];
    if(r){
      l.trainingEndDate = r.training_end_date;
      l.learnerName = r.learner_name || null;
      l.inRoster = true;
      l.isFinished = r.training_end_date ? (new Date(r.training_end_date) < new Date()) : false;
    } else {
      l.trainingEndDate = null;
      l.learnerName = null;
      l.inRoster = false;
      l.isFinished = false;
    }

    // NTLP登録状況: roster.learner_id = students.dekisugi_student_code で名寄せ
    const student = studentsByCode[l.learner_id];
    l.ntlpRegistered = !!student;
    l.studentStatus = student ? student.status : null;

    // 勤務先事業所(Phase 3.5): student_workplaces経由。複数事業所を許容する配列。
    l.workplaces = workplacesByCode[l.learner_id] || [];

    // 期生・号(Phase 3.5): student_periods経由。
    const period = periodByCode[l.learner_id];
    l.kisei = period ? period.kisei : null;
    l.go = period ? period.go : null;

    // アカウント発行可否: 未登録 かつ 企業マスタに存在 かつ Dekisugi企業IDのマッピング済み
    const dekisugiCompanyId = companyDekisugiMap[l.company_id];
    l.dekisugiCompanyId = dekisugiCompanyId || null;
    l.canIssueAccount = !l.ntlpRegistered && l.companyMapped && !!dekisugiCompanyId;

    // 要フォロー判定: 3日以上未学習 / 進捗20%未満 / 正答率40%未満 / 正答率は高いが翻訳依存度も高い、のいずれか
    const rate = l.n > 0 ? Math.round(l.c/l.n*100) : 0;
    const totalQ = Object.keys(QID_CATEGORY_MAP).length || 191;
    const progressPct = Math.round((l.questionsStudied / totalQ) * 100);
    const daysSinceActive = l.lastSeen ? Math.floor((Date.now() - new Date(l.lastSeen).getTime())/86400000) : null;
    const translationUsageRate = l.n > 0 ? Math.round((l.tn||0)/l.n*100) : null;
    const jaOnlyN = l.n - (l.tn||0), jaOnlyC = l.c - (l.tc||0);
    const japaneseOnlyRate = jaOnlyN > 0 ? Math.round(jaOnlyC/jaOnlyN*100) : null;
    const reasons = [];
    if(daysSinceActive === null || daysSinceActive >= 3) reasons.push("学習停滞（"+(daysSinceActive===null?"未学習":daysSinceActive+"日未学習")+"）");
    if(l.questionsStudied > 0 && progressPct < 20) reasons.push("進捗が低い（"+progressPct+"%）");
    if(l.n > 0 && rate < 40) reasons.push("正答率が低い（"+rate+"%）");
    // 正答率は良好(70%以上)でも、翻訳利用率が高い(50%以上)場合は「日本語だけでは理解できていない可能性」として要フォローに
    if(l.n > 0 && rate >= 70 && translationUsageRate !== null && translationUsageRate >= 50){
      reasons.push("正答率は高いが翻訳利用率も高い（翻訳利用率"+translationUsageRate+"%）");
    }
    l.needsFollowUp = reasons.length > 0 && !l.isFinished && l.questionsStudied > 0; // 何も学習していない人は「未着手」として別枠にする
    l.followUpReasons = reasons;
    l.progressPct = progressPct;
    l.rate = rate;
    l.translationUsageRate = translationUsageRate;
    l.japaneseOnlyRate = japaneseOnlyRate;
    // 最も弱い科目
    let weakestSubj = null;
    Object.keys(l.subjStats).forEach(subj=>{
      const st = l.subjStats[subj];
      const r2 = st.n>0 ? Math.round(st.c/st.n*100) : null;
      if(r2 !== null && (!weakestSubj || r2 < weakestSubj.rate)) weakestSubj = { subj, rate: r2 };
    });
    l.weakestSubj = weakestSubj;
  });

  return Object.values(map).sort((a,b)=>{
    const at = a.lastSeen ? new Date(a.lastSeen).getTime() : 0;
    const bt = b.lastSeen ? new Date(b.lastSeen).getTime() : 0;
    return bt - at;
  });
}

// 以下5つは、今回④で「データだけ利用可能にして画面には出さない」とした指標。
// 既存の取得済みデータ(learners配列・dashState)から計算するだけで、
// 新規のSupabaseアクセスは発生しない。まだどこからも呼び出していない
// (呼べば値を返すだけの純粋関数。将来、必要になったセクションから呼ぶ想定)。
// ============================================================

// 企業別 平均進捗・平均正答率ランキング(降順)
function computeCompanyProgressRanking(learners){
  const byCompany = {};
  learners.forEach(l=>{
    if(!byCompany[l.company_id]) byCompany[l.company_id] = { company_id: l.company_id, companyName: l.companyName, learners: [] };
    byCompany[l.company_id].learners.push(l);
  });
  return Object.values(byCompany).map(g=>{
    const withRate = g.learners.filter(l=>l.n > 0);
    const avgRate = withRate.length ? Math.round(withRate.reduce((s,l)=>s+l.rate,0)/withRate.length) : 0;
    const avgProgress = g.learners.length ? Math.round(g.learners.reduce((s,l)=>s+l.progressPct,0)/g.learners.length) : 0;
    return { company_id: g.company_id, companyName: g.companyName, count: g.learners.length, avgRate, avgProgress };
  }).sort((a,b)=> b.avgProgress - a.avgProgress);
}

// 事業所別 要フォロー人数の分布
function computeWorkplaceFollowUpDistribution(learners){
  const byWorkplace = {};
  learners.forEach(l=>{
    const w = l.workplaces && l.workplaces[0];
    const key = w ? w.id : "__unset__";
    const label = w ? w.workplace_name : "未設定";
    if(!byWorkplace[key]) byWorkplace[key] = { workplace_id: key, label, total: 0, followUp: 0 };
    byWorkplace[key].total += 1;
    if(l.needsFollowUp) byWorkplace[key].followUp += 1;
  });
  return Object.values(byWorkplace).sort((a,b)=> b.followUp - a.followUp);
}

// 期生・号別の平均進捗・平均正答率比較
function computePeriodComparison(learners){
  const byPeriod = {};
  learners.forEach(l=>{
    const key = (l.kisei || "不明") + "・" + (l.go || "不明");
    if(!byPeriod[key]) byPeriod[key] = { label: key, learners: [] };
    byPeriod[key].learners.push(l);
  });
  return Object.values(byPeriod).map(g=>{
    const withRate = g.learners.filter(l=>l.n > 0);
    const avgRate = withRate.length ? Math.round(withRate.reduce((s,l)=>s+l.rate,0)/withRate.length) : 0;
    const avgProgress = g.learners.length ? Math.round(g.learners.reduce((s,l)=>s+l.progressPct,0)/g.learners.length) : 0;
    return { label: g.label, count: g.learners.length, avgRate, avgProgress };
  });
}

// 学習継続日数(直近の連続学習日数)。daily_summaryのdailyRowsから算出。
function computeStudyStreakDays(l){
  if(!l.dailyRows || l.dailyRows.length === 0) return 0;
  const dates = [...new Set(l.dailyRows.map(d=>d.summary_date))].sort().reverse();
  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0,0,0,0);
  for(const dateStr of dates){
    const d = new Date(dateStr);
    d.setHours(0,0,0,0);
    const diffDays = Math.round((cursor - d) / 86400000);
    if(diffDays === streak){ streak += 1; cursor = d; }
    else break;
  }
  return streak;
}

// 模試(exam_log)関連の詳細指標: 科目別の平均点・受験回数
function computeExamDetailStats(exams){
  const byGroup = { moji: {n:0,total:0,attempts:0}, bunpo: {n:0,total:0,attempts:0}, choukai: {n:0,total:0,attempts:0} };
  exams.forEach(e=>{
    const g = e.exam_group === "moji" ? "moji" : e.exam_group === "choukai" ? "choukai" : "bunpo";
    if(!byGroup[g]) return;
    byGroup[g].n += e.correct || 0;
    byGroup[g].total += e.total || 0;
    byGroup[g].attempts += 1;
  });
  const result = {};
  Object.keys(byGroup).forEach(g=>{
    const st = byGroup[g];
    result[g] = { attempts: st.attempts, avgPct: st.total > 0 ? Math.round(st.n/st.total*100) : 0 };
  });
  return result;
}

  const ntlpUnregistered = learners.filter(l=>!l.ntlpRegistered);
  const canIssue = learners.filter(l=>l.canIssueAccount);
  const companyMappingMissing = learners.filter(l=>!l.ntlpRegistered && l.companyMapped && !l.dekisugiCompanyId);
  const studying = learners.filter(l=>l.questionsStudied > 0 && !l.isFinished);
  const thisWeek = learners.filter(l=>l.lastSeen && (Date.now()-new Date(l.lastSeen).getTime()) <= 7*86400000);
  const followUps = learners.filter(l=>l.needsFollowUp);
  const withRate = learners.filter(l=>l.n > 0);
  const avgRate = withRate.length ? Math.round(withRate.reduce((s,l)=>s+l.rate,0)/withRate.length) : 0;
  const avgProgress = learners.length ? Math.round(learners.reduce((s,l)=>s+l.progressPct,0)/learners.length) : 0;

  const block = (num, lbl, opts)=>{
    opts = opts || {};
    const b = el('<div class="stat-block'+(opts.alert?' alert':'')+'"></div>');
    b.innerHTML = "<div class='num'>"+num+"</div><div class='lbl'>"+lbl+"</div>"+
      (opts.sub ? "<div class='stat-sub'>"+opts.sub+"</div>" : "");
    return b;
  };
  const pct = (part, total)=> total > 0 ? (Math.round(part/total*1000)/10) + "%" : "-";

  // ---- NTLPアカウント登録状況カード(組合管理者のみ表示。企業担当者には出さない) ----
  if(scope.isAdmin){
    const regCard = el('<div class="card"></div>');
    const regTitle = document.createElement("div");
    regTitle.className = "card-title";
    regTitle.textContent = "NTLPアカウント登録状況";
    regCard.appendChild(regTitle);
    const regGrid1 = el('<div class="summary-cardgrid cols-3"></div>');
    regGrid1.appendChild(block(totalLearners+"人", "対象実習生"));
    regGrid1.appendChild(block(ntlpRegistered.length+"人", "NTLP登録済", {sub: pct(ntlpRegistered.length, totalLearners)}));
    regGrid1.appendChild(block(ntlpUnregistered.length+"人", "NTLP未登録", {sub: pct(ntlpUnregistered.length, totalLearners)}));
    regCard.appendChild(regGrid1);
    const regGrid2 = el('<div class="summary-cardgrid cols-3"></div>');
    regGrid2.appendChild(block(canIssue.length+"人", "アカウント発行可能"));
    regGrid2.appendChild(block(companyMappingMissing.length+"人", "企業マッピング未設定", {alert: companyMappingMissing.length>0}));
    regCard.appendChild(regGrid2);
    wrap.appendChild(regCard);
  }

  // ---- 全体サマリーカード ----
  const notStudied = learners.filter(l=>l.questionsStudied === 0);
  const summaryCard = el('<div class="card"></div>');
  const summaryTitle = document.createElement("div");
  summaryTitle.className = "card-title";
  summaryTitle.textContent = "全体サマリー";
  summaryCard.appendChild(summaryTitle);
  const gridA = el('<div class="summary-cardgrid cols-3"></div>');
  gridA.appendChild(block(totalLearners+"人", "対象学習者"));
  gridA.appendChild(block(studying.length+"人", "学習中"));
  gridA.appendChild(block(thisWeek.length+"人", "今週学習した人数"));
  summaryCard.appendChild(gridA);
  const gridB = el('<div class="summary-cardgrid cols-4"></div>');
  gridB.appendChild(block(notStudied.length+"人", "未学習"));
  gridB.appendChild(block(followUps.length+"人", "要フォロー", {alert: followUps.length>0}));
  gridB.appendChild(block(avgRate+"%", "平均正答率"));
  gridB.appendChild(block(avgProgress+"%", "平均進捗"));
  summaryCard.appendChild(gridB);
  wrap.appendChild(summaryCard);

  // ---- 企業・事業所カード ----
  // 企業数・事業所数はマスタ件数そのもの(companies/workplacesテーブルの全件)。
  // 勤務先設定済/未設定は、対象学習者のうちstudent_workplacesで事業所が紐づいているかどうか。
  const withWorkplace = learners.filter(l=>l.workplaces && l.workplaces.length > 0);
  const withoutWorkplace = learners.filter(l=>!l.workplaces || l.workplaces.length === 0);
  const companyWpCard = el('<div class="card"></div>');
  const companyWpTitle = document.createElement("div");
  companyWpTitle.className = "card-title";
  companyWpTitle.textContent = "企業・事業所";
  companyWpCard.appendChild(companyWpTitle);

  companyWpGrid.appendChild(block(dashState.companies.length+"社", "企業数"));
  companyWpGrid.appendChild(block(dashState.workplaces.length+"事業所", "事業所数"));
  companyWpGrid.appendChild(block(withWorkplace.length+"人", "勤務先設定済"));
  companyWpGrid.appendChild(block(withoutWorkplace.length+"人", "勤務先未設定", {alert: withoutWorkplace.length>0}));
  companyWpCard.appendChild(companyWpGrid);
  wrap.appendChild(companyWpCard);

  // ---- 要フォロー学習者 ----
  if(followUps.length > 0){
    const fCard = el('<div class="card"></div>');
    const fTitle = document.createElement("div");
    fTitle.className = "card-title";
    fTitle.textContent = "要フォロー学習者（" + followUps.length + "人）";
    fCard.appendChild(fTitle);
    followUps.sort((a,b)=>{
      const at = a.lastSeen ? new Date(a.lastSeen).getTime() : 0;
      const bt = b.lastSeen ? new Date(b.lastSeen).getTime() : 0;
      return at - bt; // 学習が止まっている人を上に
    });
    followUps.forEach(l=>{
      const row = el('<div class="followup-row"></div>');
      const nameDiv = document.createElement("div");
      const nameLine = document.createElement("div");
      nameLine.className = "followup-name";
      nameLine.textContent = (l.learnerName || l.learner_id) + "（" + (l.companyName || l.company_id) + "）";
      const reasonLine = document.createElement("div");
      reasonLine.className = "followup-reason";
      reasonLine.textContent = l.followUpReasons.join(" / ");
      nameDiv.appendChild(nameLine); nameDiv.appendChild(reasonLine);
      const badge = el('<span class="badge low">要フォロー</span>');
      row.appendChild(nameDiv); row.appendChild(badge);
      row.onclick = ()=>{ dashState.selectedLearner = { company_id: l.company_id, learner_id: l.learner_id }; render(); };
      fCard.appendChild(row);
    });
    wrap.appendChild(fCard);
  }

  // ---- 全体の分野別傾向 ----
  const trendCard = el('<div class="card"></div>');
  const trendTitle = document.createElement("div");
  trendTitle.className = "card-title";
  trendTitle.textContent = "全体の分野別傾向";
  trendCard.appendChild(trendTitle);
  ["moji","bunpo","dokkai","choukai"].forEach(subj=>{
    let n=0,c=0;
    learners.forEach(l=>{
      const st = l.subjStats && l.subjStats[subj];
      if(st){ n+=st.n; c+=st.c; }
    });
    const rate = n>0 ? Math.round(c/n*100) : 0;
    const row = el('<div class="subj-trend-row"></div>');
    const top = el('<div class="subj-trend-top"></div>');
    top.innerHTML = "<span>"+SUBJECT_LABEL[subj]+"</span><span style='font-weight:700;'>"+(n>0?rate+"%":"データなし")+"</span>";
    const track = el('<div class="subj-trend-track"></div>');
    const fill = document.createElement("div");
    fill.className = "subj-trend-fill";
    fill.style.width = rate + "%";
    track.appendChild(fill);
    row.appendChild(top); row.appendChild(track);
    trendCard.appendChild(row);
  });
  wrap.appendChild(trendCard);

  return wrap;
}

// 事業所フィルタの選択肢を組み立てる(企業フィルタに応じて絞り込む)。

function populateWorkplaceFilterOptions(selectEl){
  selectEl.innerHTML = "";
  const allWpOpt = document.createElement("option");
  allWpOpt.value = ""; allWpOpt.textContent = "すべての事業所";
  selectEl.appendChild(allWpOpt);
  // 現在の企業フィルタに応じて、選択肢となる事業所を絞る(ntic_adminが企業未選択なら全事業所)
  let wpCandidates = dashState.workplaces;
  if(dashState.companyFilter.trim()){
    wpCandidates = wpCandidates.filter(w=>w.company_id === dashState.companyFilter.trim());
  }
  const sortedWorkplaces = wpCandidates.slice().sort((a,b)=> a.workplace_name.localeCompare(b.workplace_name,"ja"));
  sortedWorkplaces.forEach(w=>{
    const opt = document.createElement("option");
    opt.value = w.id;
    // 同じ企業内で、事業所名が同じでもdekisugi_workplace_idの有無で別枠になっているケースがあるため
    // (例: 現場作業員向けの法人代表扱いと、実際に特定の事業所IDを持つ本社勤務が両方存在する)、
    // IDが無い方には注記を付けて区別できるようにする。
    opt.textContent = w.workplace_name + (w.dekisugi_workplace_id ? "" : "（事業所未特定・法人代表扱い）");
    if(dashState.workplaceFilter === w.id) opt.selected = true;
    selectEl.appendChild(opt);
  });
}

    const warnCard = el('<div class="card errormsg"></div>');

    wrap.appendChild(warnCard);
    return wrap;
  }

  const card = el('<div class="card"></div>');

  if(dashState.loading){
    card.appendChild(el('<div class="loading">読み込み中...</div>'));
    wrap.appendChild(card);
    if(!dashState._fetchTriggered){
      dashState._fetchTriggered = true;
      loadDashboardData();
    }
    return wrap;
  }
  if(dashState.error){
    const errBox = el('<div class="errormsg"></div>');
    errBox.textContent = dashState.error;
    card.appendChild(errBox);
    const retryBtn = document.createElement("button");
    retryBtn.className = "primary"; retryBtn.textContent = "再読み込み";
    retryBtn.onclick = ()=>{ dashState._fetchTriggered = false; loadDashboardData(); };
    card.appendChild(retryBtn);
    wrap.appendChild(card);
    return wrap;
  }

  if(dashState.selectedLearner){
    wrap.appendChild(renderLearnerKarte());
    return wrap;
  }

  if(dashState.bulkResults !== null){
    wrap.appendChild(renderBulkResultPanel());
    return wrap;
  }

  wrap.appendChild(renderOverallSummary());

  const filters = el('<div class="filters"></div>');
  if(scope.isAdmin){
    const companySelect = document.createElement("select");
    companySelect.style.cssText = "padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;flex:1;min-width:160px;background:#fff;";
    const allOpt = document.createElement("option");
    allOpt.value = ""; allOpt.textContent = "すべての企業";
    companySelect.appendChild(allOpt);
    const sortedCompanies = dashState.companies.slice().sort((a,b)=> a.company_name.localeCompare(b.company_name,"ja"));
    sortedCompanies.forEach(c=>{
      const opt = document.createElement("option");
      opt.value = c.company_id;
      opt.textContent = c.company_name + "（" + c.company_id + "）";
      if(dashState.companyFilter === c.company_id) opt.selected = true;
      companySelect.appendChild(opt);
    });
    companySelect.onchange = ()=>{ dashState.companyFilter = companySelect.value; dashState.workplaceFilter = ""; dashState.companyPage = 0; refreshWorkplaceFilterOptions(); renderTableOnly(); renderBulkBar(); };
    filters.appendChild(companySelect);
  }
  // 事業所フィルタ(Phase 3.5): ntic_admin・company_ownerのみ表示。
  // workplace_managerはRLSで最初から担当事業所だけが返ってくるため、選ぶ意味が無く非表示にする。
  if(scope.isAdmin || scope.role === "company_owner"){
    const workplaceSelect = document.createElement("select");
    workplaceSelect.id = "workplaceFilterSelect";
    workplaceSelect.style.cssText = "padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;flex:1;min-width:160px;background:#fff;";
    populateWorkplaceFilterOptions(workplaceSelect);
    workplaceSelect.onchange = ()=>{ dashState.workplaceFilter = workplaceSelect.value; renderTableOnly(); renderBulkBar(); };
    filters.appendChild(workplaceSelect);
  }
  const refreshBtn = document.createElement("button");
  refreshBtn.className = "primary"; refreshBtn.textContent = "更新";
  refreshBtn.onclick = ()=>{ dashState._fetchTriggered = false; loadDashboardData(); };
  filters.appendChild(refreshBtn);
  card.appendChild(filters);

  if(scope.isAdmin){
    const bulkBarWrap = document.createElement("div");
    bulkBarWrap.id = "bulkBarWrap";
    card.appendChild(bulkBarWrap);
  }

  const tableWrap = document.createElement("div");
  tableWrap.id = "tableWrap";
  tableWrap.className = "table-scroll";
  card.appendChild(tableWrap);
  wrap.appendChild(card);

  setTimeout(()=>{ renderTableOnly(); renderBulkBar(); }, 0);
  return wrap;
}

// ---- SVG折れ線グラフ(模試の得点推移。外部ライブラリ不使用) ----
function svgExamTrend(exams){
  // exams: taken_atの昇順に並んだ配列 [{taken_at, pct, exam_group}, ...]
  if(exams.length < 2) return "";
  const W = 340, H = 170, padL = 32, padR = 12, padT = 12, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = exams.length;
  const xStep = plotW / (n - 1);
  const colorFor = ()=> "#14213D";

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:360px;display:block;margin:0 auto;">';

  [0,25,50,75,100].forEach(v=>{
    const y = padT + plotH - (v/100*plotH);
    svg += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#eef1f6" stroke-width="1"/>';
    svg += '<text x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" font-size="9" fill="#8a94a6" text-anchor="end">'+v+'</text>';
  });

  let path = "";
  exams.forEach((e,i)=>{
    const x = padL + i*xStep;
    const y = padT + plotH - (Math.max(0,Math.min(100,e.pct))/100*plotH);
    path += (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
  });
  svg += '<path d="'+path+'" fill="none" stroke="#cbd5e1" stroke-width="1.5" class="trend-line"/>';

  exams.forEach((e,i)=>{
    const x = padL + i*xStep;
    const y = padT + plotH - (Math.max(0,Math.min(100,e.pct))/100*plotH);
    svg += '<circle class="trend-dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="'+colorFor(e.exam_group)+'"/>';
  });

  // 最初と最後の日付だけラベル表示(混雑を避けるため)
  const fmtDate = (iso)=>{ const d = new Date(iso); return (d.getMonth()+1)+"/"+d.getDate(); };
  svg += '<text x="'+padL+'" y="'+(H-6)+'" font-size="9" fill="#8a94a6" text-anchor="start">'+fmtDate(exams[0].taken_at)+'</text>';
  svg += '<text x="'+(W-padR)+'" y="'+(H-6)+'" font-size="9" fill="#8a94a6" text-anchor="end">'+fmtDate(exams[n-1].taken_at)+'</text>';

  svg += '</svg>';
  return svg;
}

function renderLearnerKarte(){
  const wrap = document.createElement("div");
  const sel = dashState.selectedLearner;
  const key = sel.company_id + "::" + sel.learner_id;
  const karteScope = sessionScope();

  const backBtn = document.createElement("button");

  backBtn.onclick = ()=>{ dashState.selectedLearner = null; render(); };
  topRow.appendChild(backBtn);

  if(karteScope.isAdmin){
    const delBtn = document.createElement("button");
    delBtn.className = "danger";
    delBtn.textContent = "この学習者のデータを削除";
    delBtn.onclick = ()=>{
      ask("実習生ID「"+ sel.learner_id +"」（企業ID: "+ sel.company_id +"）の学習記録をすべて削除します。この操作は取り消せません。よろしいですか？", async ()=>{

          await deleteLearnerData(sel.company_id, sel.learner_id);

          delBtn.disabled = false; delBtn.textContent = "この学習者のデータを削除";

          errBox.className = "errormsg";
          errBox.textContent = "削除に失敗しました。時間をおいて再度お試しください。";
          delBtn.parentElement.appendChild(errBox);
        }
      });
    };
    topRow.appendChild(delBtn);
  }
  wrap.appendChild(topRow);

  const learners = buildLearnerSummary();
  const l = learners.find(x=>(x.company_id+"::"+x.learner_id) === key);
  if(!l){
    const notFound = el('<div class="card errormsg"></div>');
    notFound.textContent = "この学習者のデータが見つかりませんでした。";
    wrap.appendChild(notFound);
    return wrap;
  }

  // ヘッダーカード
  const headCard = el('<div class="card"></div>');
  const nameEl = document.createElement("div");
  nameEl.style.cssText = "font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.01em;";
  nameEl.textContent = l.learnerName || l.learner_id;
  headCard.appendChild(nameEl);
  const subEl = document.createElement("div");
  subEl.style.cssText = "font-size:13px;color:var(--text-sub);margin-top:6px;font-weight:600;";
  subEl.textContent = (l.companyName || l.company_id) + " ／ 実習生ID: " + l.learner_id +
    (l.trainingEndDate ? " ／ 実習終了予定: " + l.trainingEndDate + (l.isFinished ? "（終了済み）" : "") : "");
  headCard.appendChild(subEl);

  const rate = l.n > 0 ? Math.round(l.c / l.n * 100) : 0;
  const stats = el('<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;"></div>');
  const statBox = (num, lbl, extra)=>{
    const s = el('<div class="stat-block"></div>');
    s.innerHTML = "<div class='num'>"+num+"</div><div class='lbl'>"+lbl+"</div>" + (extra ? "<div class='lbl' style='margin-top:2px;'>"+extra+"</div>" : "");
    return s;
  };
  stats.appendChild(statBox(l.questionsStudied + "/" + Object.keys(QID_CATEGORY_MAP).length, "学習済み問題数"));
  const jaOnlyExtra = (l.translationUsageRate !== null && l.translationUsageRate > 0 && l.japaneseOnlyRate !== null) ? "日本語のみ " + l.japaneseOnlyRate + "%" : null;
  stats.appendChild(statBox(rate + "%", "通算正答率", jaOnlyExtra));
  stats.appendChild(statBox(l.lastSeen ? relTime(l.lastSeen) : "-", "最終学習"));
  headCard.appendChild(stats);
  wrap.appendChild(headCard);

  // 分野別正答率カード
  const catCard = el('<div class="card"></div>');
  const catTitle = document.createElement("div");
  catTitle.className = "card-title";
  catTitle.textContent = "分野別正答率";
  catCard.appendChild(catTitle);

  const myProgress = dashState.progress.filter(p=>p.company_id===sel.company_id && p.learner_id===sel.learner_id);
  const catStats = {}; // cat -> {n,c,qCount}  qCount=着手した問題数(distinct)
  const subjStats = {}; // subj -> {n,c,tn,tc}  (科目別サマリー用の集計)
  myProgress.forEach(p=>{
    const meta = QID_CATEGORY_MAP[p.question_id];
    const cat = meta ? meta.cat : "不明";
    const subj = meta ? meta.subj : "不明";
    if(!catStats[cat]) catStats[cat] = { n:0, c:0, qCount:0 };
    catStats[cat].n += p.n_count;
    catStats[cat].c += p.c_count;
    catStats[cat].qCount += 1; // progressは1行=1問題なので、行数がそのまま着手済み問題数になる
    if(!subjStats[subj]) subjStats[subj] = { n:0, c:0, tn:0, tc:0 };
    subjStats[subj].n += p.n_count;
    subjStats[subj].c += p.c_count;
    subjStats[subj].tn += (p.tn_count || 0);
    subjStats[subj].tc += (p.tc_count || 0);
  });

  // 分野ごとの全問題数(問題バンク全体に何問あるか)を集計。分母として使う
  const categoryTotalCounts = {};
  Object.values(QID_CATEGORY_MAP).forEach(meta=>{
    categoryTotalCounts[meta.cat] = (categoryTotalCounts[meta.cat] || 0) + 1;
  });

  // 科目別サマリー(4科目: 文字語彙/文法/読解/聴解)。装飾なしのフラットな数値表示
  const subjOrder = ["moji","bunpo","dokkai","choukai"];
  const hasAnyData = Object.keys(subjStats).length > 0;
  if(hasAnyData){
    const subjSummary = el('<div style="display:flex;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:14px 0;"></div>');
    subjOrder.forEach(s=>{
      const st = subjStats[s];
      const rate = st && st.n > 0 ? Math.round(st.c/st.n*100) : null;
      const jaOnlyN = st ? st.n - st.tn : 0;
      const jaOnlyC = st ? st.c - st.tc : 0;
      const jaOnlyRate = (st && st.tn > 0 && jaOnlyN > 0) ? Math.round(jaOnlyC/jaOnlyN*100) : null;
      const cell = document.createElement("div");
      cell.innerHTML = "<div style='font-size:20px;font-weight:300;color:"+(rate===null?"var(--text-sub)":"var(--text-main)")+";'>"+(rate===null?"—":rate+"%")+"</div>"+
        "<div style='font-size:11px;color:var(--text-sub);margin-top:4px;'>"+SUBJECT_LABEL[s]+"</div>" +
        (jaOnlyRate !== null ? "<div style='font-size:10.5px;color:var(--text-sub);margin-top:2px;'>日本語のみ "+jaOnlyRate+"%</div>" : "");
      subjSummary.appendChild(cell);
    });
    catCard.appendChild(subjSummary);
  }

  const detailTitle = document.createElement("div");
  detailTitle.style.cssText = "font-weight:700;margin:14px 0 8px;font-size:13px;color:#556;";
  detailTitle.textContent = "分野別の内訳（消化数・正答率）";
  catCard.appendChild(detailTitle);

  // 科目ごとに、試験の出題順に沿った固定の並び順で表示する(データの出現順だとバラバラになるため)
  const SUBJECT_CAT_ORDER = {
    moji:    ["kanji","hyoki","bunmyaku","ruigi","youho"],
    bunpo:   ["bunpo1","bunpo2","bunsho"],
    dokkai:  ["tanbun","chubun","kensaku"],
    choukai: ["kadai","point","hatsuwa","sokuji"]
  };

  const catKeys = Object.keys(catStats);
  if(catKeys.length === 0){
    catCard.appendChild(el('<div class="loading">まだ学習記録がありません。</div>'));
  } else {
    ["moji","bunpo","dokkai","choukai"].forEach(subj=>{
      const catsInSubj = SUBJECT_CAT_ORDER[subj].filter(cat=>catStats[cat]);
      if(catsInSubj.length === 0) return;

      const subjHeader = document.createElement("div");
      subjHeader.style.cssText = "font-size:12px;font-weight:700;color:var(--blue);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border);";
      subjHeader.textContent = SUBJECT_LABEL[subj];
      catCard.appendChild(subjHeader);

      catsInSubj.forEach(cat=>{
        const cs = catStats[cat];
        const cRate = cs.n > 0 ? Math.round(cs.c / cs.n * 100) : 0;
        const row = el('<div class="katefbar"></div>');
        const rowTop = el('<div class="katefbarrow"></div>');
        const lbl = document.createElement("span");
        const catTotal = categoryTotalCounts[cat] || cs.qCount;
        lbl.textContent = (CAT_LABEL[cat] || cat) + "（" + cs.qCount + "/" + catTotal + "問消化）";
        const val = document.createElement("span");
        val.textContent = cRate + "%";
        rowTop.appendChild(lbl); rowTop.appendChild(val);
        const track = el('<div class="katefbartrack"></div>');
        const fill = document.createElement("div");
        fill.className = "katefbar-fill" + (cRate < 40 ? " low" : cRate < 70 ? " mid" : "");
        fill.style.width = cRate + "%";
        track.appendChild(fill);
        row.appendChild(rowTop); row.appendChild(track);
        catCard.appendChild(row);
      });
    });

    // どの科目定義にも該当しない分野(想定外データ等)は末尾にまとめて表示
    const knownCats = Object.values(SUBJECT_CAT_ORDER).flat();
    const unknownCats = catKeys.filter(c=>!knownCats.includes(c));
    if(unknownCats.length > 0){
      const otherHeader = document.createElement("div");
      otherHeader.style.cssText = "font-size:12px;font-weight:700;color:#889;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border);";
      otherHeader.textContent = "その他";
      catCard.appendChild(otherHeader);
      unknownCats.forEach(cat=>{
        const cs = catStats[cat];
        const cRate = cs.n > 0 ? Math.round(cs.c / cs.n * 100) : 0;
        const row = el('<div class="katefbar"></div>');
        const rowTop = el('<div class="katefbarrow"></div>');
        const lbl = document.createElement("span");
        const catTotal = categoryTotalCounts[cat] || cs.qCount;
        lbl.textContent = (CAT_LABEL[cat] || cat) + "（" + cs.qCount + "/" + catTotal + "問消化）";
        const val = document.createElement("span");
        val.textContent = cRate + "%";
        rowTop.appendChild(lbl); rowTop.appendChild(val);
        const track = el('<div class="katefbartrack"></div>');
        const fill = document.createElement("div");
        fill.className = "katefbar-fill" + (cRate < 40 ? " low" : cRate < 70 ? " mid" : "");
        fill.style.width = cRate + "%";
        track.appendChild(fill);
        row.appendChild(rowTop); row.appendChild(track);
        catCard.appendChild(row);
      });
    }
  }
  wrap.appendChild(catCard);

  // 模試履歴カード
  const examCard = el('<div class="card"></div>');
  const examTitle = document.createElement("div");
  examTitle.className = "card-title";
  examTitle.textContent = "模試履歴";
  examCard.appendChild(examTitle);

  const myExams = dashState.exams
    .filter(e=>e.company_id===sel.company_id && e.learner_id===sel.learner_id)
    .sort((a,b)=> new Date(b.taken_at) - new Date(a.taken_at));

  if(myExams.length === 0){
    examCard.appendChild(el('<div class="loading">模試の受験履歴はまだありません。</div>'));
  } else {
    const examsAsc = [...myExams].sort((a,b)=> new Date(a.taken_at) - new Date(b.taken_at));
    const trendSvg = svgExamTrend(examsAsc);
    if(trendSvg){
      const trendWrap = document.createElement("div");
      trendWrap.innerHTML = trendSvg;
      examCard.appendChild(trendWrap);
    } else if(myExams.length === 1){
      const hint = document.createElement("div");
      hint.style.cssText = "text-align:center;font-size:12px;color:#889;margin-bottom:12px;";
      hint.textContent = "模試をもう1回以上受けると、得点の推移グラフが表示されます。";
      examCard.appendChild(hint);
    }
    myExams.forEach(e=>{
      const row = el('<div class="examrow"></div>');
      const eg = e.exam_group === "moji" ? "文字語彙" : e.exam_group === "choukai" ? "聴解" : "文法・読解";
      const d = new Date(e.taken_at);
      const dateStr = d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
      row.innerHTML = "<b>"+eg+"</b>　"+e.correct+"/"+e.total+"（"+e.pct+"%）　<span style='color:#889;'>"+dateStr+"</span>";
      examCard.appendChild(row);
    });
  }
  wrap.appendChild(examCard);

  return wrap;
}

// フィルタ(企業名・終了済み表示)を適用した学習者一覧を返す。
// renderTableOnlyとrenderBulkBar(全選択の対象範囲)の両方から使う共通ロジック。
function getFilteredLearners(){
  let learners = buildLearnerSummary();
  if(dashState.companyFilter.trim()){
    const f = dashState.companyFilter.trim().toLowerCase();
    learners = learners.filter(l=>l.company_id.toLowerCase().includes(f) || (l.companyName||"").toLowerCase().includes(f));
  }
  // 事業所フィルタ(Phase 3.5、UI上の絞り込みのみ。セキュリティ境界はRLS側)
  if(dashState.workplaceFilter){
    learners = learners.filter(l=> (l.workplaces||[]).some(w=>w.id === dashState.workplaceFilter));
  }
  // 実習終了済みの実習生はダッシュボードの対象外(現在学習中の実習生のみを扱う運用のため)
  learners = learners.filter(l=>!l.isFinished);
  return learners;
}

function bulkKey(l){ return l.company_id + "::" + l.learner_id; }

// 期生・号の並び替え用キー(数値昇順、未設定は末尾)
function kiseiSortKey(l){
  if(!l.kisei) return 9999;
  const m = l.kisei.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 9999;
}
function goSortKey(l){
  if(!l.go) return 9;
  const m = l.go.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 9;
}

// 企業名と重複する接頭辞(例:「アサヒグローバルホーム株式会社　○○店」の企業名部分)は省いて店舗名だけ表示する。
// 完全一致(店舗名が無く企業名そのものの場合)は省くと空になるため、元の名前のまま表示する。
function stripCompanyPrefix(name, companyName){
  if(!companyName || !name.startsWith(companyName)) return name;
  const rest = name.slice(companyName.length).replace(/^[\s　]+/, "");
  return rest || name;
}

  else if(l.go) periodCell = escapeHtml(l.go);
  else periodCell = "-";
  let learnerCell = escapeHtml(l.learner_id);
  const warnIcon = '<svg class="icon icon-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21.5 20h-19L12 3.5Z"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>';
  if(!l.inRoster) learnerCell += " <span title='ロースターとID不一致の可能性'>"+warnIcon+"</span>";
  let nameCell = l.learnerName ? escapeHtml(l.learnerName) : "-";

  let ntlpCell;
  if(l.ntlpRegistered){
    ntlpCell = "<span class='badge high'>登録済</span>";
  } else if(scopeForTable.isAdmin && l.canIssueAccount){
    ntlpCell = "<span class='badge mid' style='margin-right:6px;'>未登録</span>";
  } else if(!l.companyMapped || !l.dekisugiCompanyId){
    ntlpCell = "<span class='badge mid' title='企業マッピング未設定のため発行できません'>未登録</span>";
  } else {
    ntlpCell = "<span class='badge mid'>未登録</span>";
  }

  const subjCell = (subj)=>{
    const st = l.subjStats && l.subjStats[subj];
    if(!st || st.n === 0) return "-";
    const r = Math.round(st.c/st.n*100);
    const cls = r >= 70 ? "high" : r >= 40 ? "mid" : "low";
    return "<span class='badge "+cls+"'>"+r+"%</span>";
  };

  let statusCell;
  if(l.isFinished) statusCell = "<span class='badge mid'>終了済み</span>";
  else if(l.questionsStudied === 0) statusCell = "<span class='badge mid'>未着手</span>";
  else if(l.needsFollowUp) statusCell = "<span class='badge low' title='"+escapeHtml(l.followUpReasons.join(' / '))+"'>要フォロー</span>";
  else if(rate >= 70) statusCell = "<span class='badge high'>順調</span>";
  else statusCell = "<span class='badge mid'>要確認</span>";

  const ntlpTd = document.createElement("td");
  ntlpTd.innerHTML = ntlpCell;
  if(scopeForTable.isAdmin && l.canIssueAccount){
    const issueBtn = document.createElement("button");
    issueBtn.className = "secondary";
    issueBtn.style.cssText = "padding:4px 10px;font-size:11.5px;";
    issueBtn.textContent = "アカウント発行";
    issueBtn.onclick = (ev)=>{
      ev.stopPropagation();
      ask("実習生ID「"+l.learner_id+"」（"+(l.learnerName||"")+"）のNTLPアカウントを発行します。よろしいですか？", async ()=>{
        issueBtn.disabled = true; issueBtn.textContent = "発行中...";
        try{
          const result = await issueAccount(l);
          dashState._fetchTriggered = false;
          await loadDashboardData();
          showIssueResultModal(result.login_id, result.initial_password);
        }catch(e){
          issueBtn.disabled = false; issueBtn.textContent = "アカウント発行";
          const errBox = document.createElement("div");
          errBox.className = "errormsg";
          errBox.style.marginTop = "4px";
          errBox.textContent = e.message || "発行に失敗しました。";
          ntlpTd.appendChild(errBox);
        }
      }, null, "はい、発行する");
    };
    ntlpTd.appendChild(issueBtn);
  }

  let checkboxTd = null;
  if(scopeForTable.isAdmin){
    checkboxTd = document.createElement("td");
    if(l.canIssueAccount){
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!dashState.bulkSelected[bulkKey(l)];
      cb.onclick = (ev)=>{ ev.stopPropagation(); };
      cb.onchange = ()=>{
        if(cb.checked) dashState.bulkSelected[bulkKey(l)] = true;
        else delete dashState.bulkSelected[bulkKey(l)];
        renderBulkBar();
      };
      checkboxTd.appendChild(cb);
    }
  }

  tr.innerHTML =
    (checkboxTd ? "<td></td>" : "")+
    "<td>"+nameCell+"</td>"+
    "<td>"+learnerCell+"</td>"+
    "<td></td>"+ // NTLP状態セルは後でDOM要素として挿入(ボタンのため)
    "<td>"+periodCell+"</td>"+
    "<td>"+l.questionsStudied+"</td>"+
    "<td><span class='badge "+badgeClass+"'>"+rate+"%</span></td>"+
    "<td>"+subjCell("moji")+"</td>"+
    "<td>"+subjCell("bunpo")+"</td>"+
    "<td>"+subjCell("dokkai")+"</td>"+
    "<td>"+subjCell("choukai")+"</td>"+
    "<td>"+escapeHtml(examCell)+"</td>"+
    "<td class='"+staleClass+"'>"+escapeHtml(lastSeenCell)+"</td>"+
    "<td>"+statusCell+"</td>";
  const ntlpTdIndex = checkboxTd ? 3 : 2;
  tr.children[ntlpTdIndex].replaceWith(ntlpTd);
  if(checkboxTd) tr.children[0].replaceWith(checkboxTd);
  tr.className = "clickable";
  tr.title = "クリックで詳細(個人カルテ)を見る";
  tr.onclick = ()=>{
    dashState.selectedLearner = { company_id: l.company_id, learner_id: l.learner_id };
    render();
  };
  return tr;
}

function toggleCompanyExpand(companyId){
  dashState.expandedCompanies[companyId] = !dashState.expandedCompanies[companyId];
  renderTableOnly();
}
function toggleWorkplaceExpand(key){
  dashState.expandedWorkplaces[key] = !dashState.expandedWorkplaces[key];
  renderTableOnly();
}

const STUDENTS_PER_PAGE = 10;
const COMPANIES_PER_PAGE = 5;

// クリックで並び替えできる列の定義。値取得関数(getValue)を統一して比較する。
const SORT_GETTERS = {
  name: l => l.learnerName || "",
  learnerId: l => l.learner_id || "",
  period: l => kiseiSortKey(l)*10 + goSortKey(l),
  questions: l => l.questionsStudied || 0,
  rate: l => l.n > 0 ? l.c / l.n : -1,
  lastSeen: l => l.lastSeen ? new Date(l.lastSeen).getTime() : -1,
};
const HEADER_DEFS = [
  { label: "氏名", key: "name" },
  { label: "実習生ID", key: "learnerId" },
  { label: "NTLP状態", key: null },
  { label: "期生・号", key: "period" },
  { label: "学習済み問題数", key: "questions" },
  { label: "通算正答率", key: "rate" },
  { label: "文字語彙", key: null },
  { label: "文法", key: null },
  { label: "読解", key: null },
  { label: "聴解", key: null },
  { label: "最新模試", key: null },
  { label: "最終学習", key: "lastSeen" },
  { label: "状態", key: null },
];

// 選択中の並び替え列があればそれで、無ければデフォルト(期生・号順)で並び替える。
function sortLearnersForDisplay(learners){
  const col = dashState.sortColumn;
  if(col && SORT_GETTERS[col]){
    const dir = dashState.sortDirection === "desc" ? -1 : 1;
    const getValue = SORT_GETTERS[col];
    return learners.slice().sort((a,b)=>{
      const va = getValue(a), vb = getValue(b);
      if(va < vb) return -1*dir;
      if(va > vb) return 1*dir;
      return 0;
    });
  }
  return learners.slice().sort((a,b)=>{
    const ka = kiseiSortKey(a), kb = kiseiSortKey(b);
    if(ka !== kb) return ka - kb;
    const ga = goSortKey(a), gb = goSortKey(b);
    if(ga !== gb) return ga - gb;
    return (a.learnerName||"").localeCompare(b.learnerName||"", "ja");
  });
}

// 並び替え可能な列見出しを構築する(クリックで昇順⇄降順、別の列をクリックするとその列の昇順から)。
function buildSortableThead(checkboxHeader){
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  if(checkboxHeader) headRow.appendChild(document.createElement("th"));
  HEADER_DEFS.forEach(h=>{
    const th = document.createElement("th");
    if(h.key){
      th.style.cursor = "pointer";
      th.title = "クリックで並び替え";
      let arrow = "";
      if(dashState.sortColumn === h.key) arrow = dashState.sortDirection === "desc" ? " ▼" : " ▲";
      th.textContent = h.label + arrow;
      th.onclick = ()=>{
        if(dashState.sortColumn === h.key){
          dashState.sortDirection = dashState.sortDirection === "asc" ? "desc" : "asc";
        } else {
          dashState.sortColumn = h.key;
          dashState.sortDirection = "asc";
        }
        renderTableOnly();
      };
    } else {
      th.textContent = h.label;
    }
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  return thead;
}

// ページネーションUI(番号ボタン＋省略記号)を組み立てる。
// currentPageIdxは0始まり。onChangeには新しいページ番号(0始まり)が渡される。
function buildPaginationControl(currentPageIdx, totalPages, onChange){
  const wrap = document.createElement("div");
  wrap.className = "pagination";

  const prevBtn = document.createElement("button");
  prevBtn.className = "pagination-nav";
  prevBtn.innerHTML = "‹ 前へ";
  prevBtn.disabled = currentPageIdx === 0;
  prevBtn.onclick = ()=> onChange(currentPageIdx - 1);
  wrap.appendChild(prevBtn);

  // 表示するページ番号を決める: 先頭・末尾は常に表示、現在ページの前後1つも表示、間は省略記号
  const last = totalPages - 1;
  const pages = [];
  const addPage = p=>{ if(!pages.includes(p)) pages.push(p); };
  addPage(0);
  for(let p = currentPageIdx-1; p <= currentPageIdx+1; p++){ if(p >= 0 && p <= last) addPage(p); }
  addPage(last);
  pages.sort((a,b)=>a-b);

  let prevShown = -1;
  pages.forEach(p=>{
    if(prevShown !== -1 && p - prevShown > 1){
      const ellipsis = document.createElement("span");
      ellipsis.className = "pagination-ellipsis";
      ellipsis.textContent = "…";
      wrap.appendChild(ellipsis);
    }
    const btn = document.createElement("button");
    btn.className = "pagination-page" + (p === currentPageIdx ? " active" : "");
    btn.textContent = String(p+1);
    btn.onclick = ()=> onChange(p);
    wrap.appendChild(btn);
    prevShown = p;
  });

  const nextBtn = document.createElement("button");
  nextBtn.className = "pagination-nav";
  nextBtn.innerHTML = "次へ ›";
  nextBtn.disabled = currentPageIdx >= last;
  nextBtn.onclick = ()=> onChange(currentPageIdx + 1);
  wrap.appendChild(nextBtn);

  return wrap;
}

function toggleCompanyFlatMode(companyId){
  dashState.companyFlatMode[companyId] = !dashState.companyFlatMode[companyId];
  renderTableOnly();
}

// 実習生一覧テーブル(並び替え・5件ページング込み)を組み立てる。事業所ごとの表示と、
// 企業まとめて表示の両方から呼べるよう、ページング状態のキー(pageKey)だけ呼び出し側で変える。
function renderStudentTableBlock(learners, pageKey, scopeForTable){
  const sortedLearners = sortLearnersForDisplay(learners);

  const totalPages = Math.max(1, Math.ceil(sortedLearners.length / STUDENTS_PER_PAGE));
  let page = dashState.studentPageByWorkplace[pageKey] || 0;
  if(page >= totalPages) page = totalPages - 1;
  if(page < 0) page = 0;
  const pageLearners = sortedLearners.slice(page*STUDENTS_PER_PAGE, page*STUDENTS_PER_PAGE + STUDENTS_PER_PAGE);

  const body = document.createElement("div");
  body.className = "tree-workplace-body";

  const table = document.createElement("table");
  const checkboxHeader = scopeForTable.isAdmin;
  table.appendChild(buildSortableThead(checkboxHeader));
  const tbody = document.createElement("tbody");
  pageLearners.forEach(l=> tbody.appendChild(buildLearnerRow(l, scopeForTable)));
  table.appendChild(tbody);
  body.appendChild(table);

  if(totalPages > 1){
    const pager = buildPaginationControl(page, totalPages, (newPage)=>{
      dashState.studentPageByWorkplace[pageKey] = newPage;
      renderTableOnly();
    });
    pager.classList.add("tree-pager");
    const countLabel = document.createElement("div");
    countLabel.className = "tree-pager-count";
    countLabel.textContent = sortedLearners.length + "人";
    body.appendChild(pager);
    body.appendChild(countLabel);
  }
  return body;
}

function renderTableOnly(){
  const tableWrap = document.getElementById("tableWrap");
  if(!tableWrap) return;
  let learners = getFilteredLearners();

  if(learners.length === 0){
    tableWrap.innerHTML = '<div class="loading">該当する学習記録がまだありません。</div>';
    return;
  }

  const scopeForTable = sessionScope();

  // ---- 企業 → 勤務先 → 実習生、の階層にグルーピングする ----
  const companyGroups = {}; // company_id -> { companyName, learners:[], workplaceMap:{ key -> {label, learners:[]} } }
  learners.forEach(l=>{
    if(!companyGroups[l.company_id]){
      companyGroups[l.company_id] = { companyName: l.companyName || l.company_id, workplaceMap: {} };
    }
    const g = companyGroups[l.company_id];
    const w = (l.workplaces && l.workplaces[0]) ? l.workplaces[0] : null;
    const key = w ? w.id : "__unset__";
    if(!g.workplaceMap[key]){
      g.workplaceMap[key] = { label: w ? stripCompanyPrefix(w.workplace_name, g.companyName) : "未設定", learners: [] };
    }
    g.workplaceMap[key].learners.push(l);
  });

  const companyIds = Object.keys(companyGroups).sort((a,b)=>
    companyGroups[a].companyName.localeCompare(companyGroups[b].companyName, "ja"));

  // フィルタで企業が1社だけに絞られている場合は、毎回クリックさせずに自動展開する
  const soleCompany = companyIds.length === 1 ? companyIds[0] : null;

  const container = document.createElement("div");

  // 企業一覧も5社ずつページング(企業が1社に絞られている時はページングの意味が無いので出さない)
  let pagedCompanyIds = companyIds;
  let companyTotalPages = 1;
  let companyPageIdx = 0;
  if(!soleCompany){
    companyTotalPages = Math.max(1, Math.ceil(companyIds.length / COMPANIES_PER_PAGE));
    companyPageIdx = dashState.companyPage || 0;
    if(companyPageIdx >= companyTotalPages) companyPageIdx = companyTotalPages - 1;
    if(companyPageIdx < 0) companyPageIdx = 0;
    pagedCompanyIds = companyIds.slice(companyPageIdx*COMPANIES_PER_PAGE, companyPageIdx*COMPANIES_PER_PAGE + COMPANIES_PER_PAGE);
  }

  pagedCompanyIds.forEach(companyId=>{
    const g = companyGroups[companyId];
    const companyLearnerCount = Object.values(g.workplaceMap).reduce((s,wg)=>s+wg.learners.length, 0);
    const isExpanded = soleCompany ? true : !!dashState.expandedCompanies[companyId];
    // 事業所が2つ以上ある企業だけ、「事業所ごと／まとめて」の切り替えを出す
    // (社長など、全事業所のスタッフを一気に見たい人向け。店長など事業所が1つしかない人には出す意味がない)
    const workplaceCount = Object.keys(g.workplaceMap).length;
    const flatMode = workplaceCount > 1 && !!dashState.companyFlatMode[companyId];

    const companyHeaderRow = document.createElement("div");
    companyHeaderRow.className = "tree-company-header";
    const companyHeaderMain = document.createElement("div");
    companyHeaderMain.style.cssText = "display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;";
    companyHeaderMain.innerHTML =
      "<span class='tree-toggle'>"+(isExpanded ? "▼" : "▶")+"</span>"+
      "<span class='tree-company-name'>"+escapeHtml(g.companyName)+"</span>";
    if(!soleCompany){
      companyHeaderMain.onclick = ()=> toggleCompanyExpand(companyId);
    } else {
      companyHeaderMain.style.cursor = "default";
    }
    companyHeaderRow.appendChild(companyHeaderMain);
    if(workplaceCount > 1){
      const flatToggle = document.createElement("button");
      flatToggle.className = "ghost";
      flatToggle.style.cssText = "font-size:11.5px;padding:2px 8px;margin-right:10px;";
      flatToggle.textContent = flatMode ? "事業所ごとに見る" : "全員まとめて見る";
      flatToggle.onclick = (ev)=>{ ev.stopPropagation(); toggleCompanyFlatMode(companyId); };
      companyHeaderRow.appendChild(flatToggle);
    }
    const companyCountEl = document.createElement("span");
    companyCountEl.className = "tree-count";
    companyCountEl.textContent = companyLearnerCount + "人";
    companyHeaderRow.appendChild(companyCountEl);
    container.appendChild(companyHeaderRow);

    if(!isExpanded) return;

    // ---- まとめて表示: 事業所の区切りを出さず、企業内の全員を1つの表にする ----
    if(flatMode){
      const allLearners = [];
      Object.values(g.workplaceMap).forEach(wg=> allLearners.push(...wg.learners));
      container.appendChild(renderStudentTableBlock(allLearners, "company::"+companyId, scopeForTable));
      return;
    }

    const workplaceKeys = Object.keys(g.workplaceMap).sort((a,b)=>{
      if(a === "__unset__") return 1;
      if(b === "__unset__") return -1;
      return g.workplaceMap[a].label.localeCompare(g.workplaceMap[b].label, "ja");
    });

    const soleWorkplace = workplaceKeys.length === 1 ? workplaceKeys[0] : null;

    workplaceKeys.forEach(wpKey=>{
      const wg = g.workplaceMap[wpKey];
      const fullKey = companyId + "::" + wpKey;
      const wpExpanded = soleWorkplace ? true : !!dashState.expandedWorkplaces[fullKey];

      const wpHeader = document.createElement("div");
      wpHeader.className = "tree-workplace-header";
      wpHeader.innerHTML =
        "<span class='tree-toggle'>"+(wpExpanded ? "▼" : "▶")+"</span>"+
        "<span class='tree-workplace-name'>"+escapeHtml(wg.label)+"</span>"+
        "<span class='tree-count'>"+wg.learners.length+"人</span>";
      if(!soleWorkplace){
        wpHeader.onclick = ()=> toggleWorkplaceExpand(fullKey);
      } else {
        wpHeader.style.cursor = "default";
      }
      container.appendChild(wpHeader);

      if(!wpExpanded) return;

      container.appendChild(renderStudentTableBlock(wg.learners, fullKey, scopeForTable));
    });
  });

  // 企業一覧のページャー(企業が2社以上あり、絞り込まれていない時だけ表示)
  if(!soleCompany && companyTotalPages > 1){
    const companyPager = buildPaginationControl(companyPageIdx, companyTotalPages, (newPage)=>{
      dashState.companyPage = newPage;
      renderTableOnly();
    });
    companyPager.classList.add("tree-pager");
    container.appendChild(companyPager);
    const countLabel = document.createElement("div");
    countLabel.className = "tree-pager-count";
    countLabel.textContent = companyIds.length + "社";
    container.appendChild(countLabel);
  }

  tableWrap.innerHTML = "";
  tableWrap.appendChild(container);
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

render();
})();
</script>
