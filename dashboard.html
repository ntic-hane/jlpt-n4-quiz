function renderLearnerKarte(){
  const wrap = document.createElement("div");
  const sel = dashState.selectedLearner;
  const key = sel.company_id + "::" + sel.learner_id;
  const karteScope = sessionScope();

  const topRow = el('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;"></div>');
  const backBtn = document.createElement("button");
  backBtn.className = "ghost"; backBtn.textContent = "← 一覧に戻る";
  backBtn.onclick = ()=> closeKarte();
  topRow.appendChild(backBtn);

  if(karteScope.isAdmin){
    const delBtn = document.createElement("button");
    delBtn.className = "danger";
    delBtn.textContent = "この学習者のデータを削除";
    delBtn.onclick = ()=>{
      ask("実習生ID「"+ sel.learner_id +"」（企業ID: "+ sel.company_id +"）の学習記録をすべて削除します。この操作は取り消せません。よろしいですか？", async ()=>{
        delBtn.disabled = true; delBtn.textContent = "削除中...";
        try{
          await deleteLearnerData(sel.company_id, sel.learner_id);
          closeKarte();
          dashState._fetchTriggered = false;
          loadDashboardData();
        }catch(e){
          delBtn.disabled = false; delBtn.textContent = "この学習者のデータを削除";
          const errBox = document.createElement("div");
          errBox.className = "errormsg";
          errBox.textContent = "削除に失敗しました。時間をおいて再度お試しください。";
          delBtn.parentElement.appendChild(errBox);
        }
      });
    };
    topRow.appendChild(delBtn);
  }
  wrap.appendChild(topRow);

  const learners = buildLearnerSummary();
  const l = learners.find(x=>(x.company_id+"::"+x.learner_id) === key);
  if(!l){
    const notFound = el('<div class="card errormsg"></div>');
    notFound.textContent = "この学習者のデータが見つかりませんでした。";
    wrap.appendChild(notFound);
    return wrap;
  }

  // この学習者の詳細データ(学習記録・日別集計・学習セッション)は、カルテを開いたときにだけ読み込む。
  // (一覧用の集計は、データベース側で集計済みのものを使っているため、ここで個別に読み込む)
  if(!dashState.karteData || dashState.karteData.key !== key){
    dashState.karteData = { key, loading:true, error:false, progress:[], daily:[], sessions:[] };
    loadKarteData(sel).finally(()=>{ render(); });
  }
  const kd = dashState.karteData;
  if(kd.loading){
    wrap.appendChild(el('<div class="loading">この学習者のデータを読み込み中...</div>'));
    return wrap;
  }
  if(kd.error){
    const errCard = el('<div class="card errormsg"></div>');
    errCard.textContent = "この学習者の詳細データの取得に失敗しました。時間をおいて、もう一度開いてください。";
    wrap.appendChild(errCard);
    return wrap;
  }
  l.dailyRows = kd.daily;
  l.studySessions = kd.sessions;

  // パスワードリセット(NTIC管理者のみ・既にNTLP登録済みの人だけ対象)。
  // 「本人が紙を無くした」等、発行後に繰り返し起こりうる運用のための機能。
  if(karteScope.isAdmin && l.ntlpRegistered){
    const resetBtn = document.createElement("button");
    resetBtn.className = "secondary";
    resetBtn.textContent = "パスワードをリセット";
    resetBtn.onclick = ()=>{
      ask("実習生ID「"+l.learner_id+"」（"+(l.learnerName||"")+"）のパスワードをリセットし、新しい初期パスワードを発行します。現在のパスワードは使えなくなります。よろしいですか？", async ()=>{
        resetBtn.disabled = true; resetBtn.textContent = "リセット中...";
        try{
          const result = await resetStudentPassword(l);
          resetBtn.disabled = false; resetBtn.textContent = "パスワードをリセット";
          showIssueResultModal(result.login_id, result.new_password, {
            title: "パスワードをリセットしました",
            desc: "この情報は今だけ表示されます。実習生本人に控えてもらうか、紙等で案内してください。"
          });
        }catch(e){
          resetBtn.disabled = false; resetBtn.textContent = "パスワードをリセット";
          const errBox = document.createElement("div");
          errBox.className = "errormsg";
          errBox.textContent = e.message || "リセットに失敗しました。時間をおいて再度お試しください。";
          resetBtn.parentElement.appendChild(errBox);
        }
      }, null, "はい、リセットする");
    };
    topRow.appendChild(resetBtn);
  }

  // ---- ヘッダー(新デザイン): 名前・バッジ・所属事業所 + 主要な数字6枚 ----
  const rate = l.n > 0 ? Math.round(l.c / l.n * 100) : 0;
  const sessionStats = computeSessionStats(l);
  const streakDays = computeStudyStreakDays(l);
  const totalQBank = Object.keys(QID_CATEGORY_MAP_N4).length;
  const days30 = (l.dailyRows||[]).filter(d=>{ const diff=(new Date()-new Date(d.summary_date))/86400000; return diff<=30; }).map(d=>d.summary_date).filter((v,i,a)=>a.indexOf(v)===i).length;
  const jaOnlyExtra = (l.translationUsageRate !== null && l.translationUsageRate > 0 && l.japaneseOnlyRate !== null) ? "日本語のみ " + l.japaneseOnlyRate + "%" : null;

  const headCard = el('<div class="k-head"></div>');
  const dispName = l.learnerName || l.learner_id;
  const initial = String(dispName).trim().charAt(0).toUpperCase() || "?";
  const kanaHtml = l.learnerNameKana ? "<span class='k-kana'>"+escapeHtml(l.learnerNameKana)+"</span>" : "";
  const subText = (l.companyName || l.company_id) + " ／ 実習生ID: " + l.learner_id +
    (l.dekisugiStatus ? " ／ 在籍状況: " + l.dekisugiStatus : "") +
    (l.statusOverrideFinished ? "（号は終了済み・特定技能等へ移行の可能性）" : "");
  headCard.innerHTML =
    "<div class='k-avatar'>"+escapeHtml(initial)+"</div>"+
    "<div class='k-head-body'>"+
      "<div class='k-name'>"+escapeHtml(dispName)+kanaHtml+"</div>"+
      "<div class='k-badges'>"+programBadge(l.program)+flagBadge(l.nationality)+"</div>"+
      "<div class='k-sub'>"+escapeHtml(subText)+"</div>"+
    "</div>";
  // ---- 所属事業所(NTIC管理者のみ変更可能)。店舗異動があったときに、Dekisugiの取込を待たずにここで直せるようにする。 ----
  const wpBox = el('<div class="k-wp"></div>');
  const wpLabel = document.createElement("span");
  wpLabel.className = "k-wp-l"; wpLabel.textContent = "所属事業所";
  wpBox.appendChild(wpLabel);
  const wpValue = document.createElement("span");
  wpValue.className = "k-wp-v";
  wpValue.textContent = (l.workplaces && l.workplaces.length) ? l.workplaces.map(w=>w.workplace_name).join("・") : "未設定";
  wpBox.appendChild(wpValue);
  if(karteScope.isAdmin){
    const wpEditBtn = document.createElement("button");
    wpEditBtn.className = "secondary k-wp-btn";
    wpEditBtn.textContent = "変更";
    wpEditBtn.onclick = ()=> openWorkplaceChange(l, wpValue);
    wpBox.appendChild(wpEditBtn);
  }
  headCard.appendChild(wpBox);
  wrap.appendChild(headCard);

  const kk = (icon, color, label, value, unit, cap)=>{
    const col = OV_COLORS[color];
    const k = el('<div class="ov-kpi"></div>');
    k.innerHTML = '<div class="ov-kpi-top"><div class="ov-kpi-ico" style="background:'+col.bg+';color:'+col.c+';">'+STAT_ICONS[icon]+'</div><div class="ov-kpi-lbl">'+label+'</div></div>'+
      '<div class="ov-kpi-num">'+value+'<small>'+unit+'</small></div>'+
      '<div class="ov-kpi-sub"><span class="ov-cap">'+(cap || '')+'</span></div>';
    return k;
  };
  const kpiRow = el('<div class="ov-kpis k-kpis"></div>');
  kpiRow.appendChild(kk("book","blue","学習済み問題数", l.questionsStudied, "/"+totalQBank+"問", totalQBank > 0 ? Math.round(l.questionsStudied/totalQBank*100)+"% 消化" : ""));
  kpiRow.appendChild(kk("target","green","通算正答率", rate, "%", jaOnlyExtra || "N4の学習状況"));
  kpiRow.appendChild(kk("calendar","purple","最終学習", l.lastSeen ? relTime(l.lastSeen) : "-", "", ""));
  kpiRow.appendChild(kk("users","orange","学習セッション数", sessionStats.count, "回", sessionStats.count === 0 ? "10/1から記録" : ""));
  kpiRow.appendChild(kk("trendingUp","blue","累計学習時間", sessionStats.totalSeconds > 0 ? formatDuration(sessionStats.totalSeconds) : "-", "", sessionStats.count === 0 ? "10/1から記録" : ""));
  kpiRow.appendChild(kk("alertTriangle","red","学習継続日数", streakDays, "日", streakDays > 0 ? "直近30日で"+days30+"日学習" : ""));
  wrap.appendChild(kpiRow);
  const kgrid = el('<div class="k-grid"></div>');
  wrap.appendChild(kgrid);
  const kadd = (card, cls)=>{ const c = el('<div class="'+cls+'"></div>'); c.appendChild(card); kgrid.appendChild(c); };

  // 分野別正答率カード
  const catCard = el('<div class="card"></div>');
  const catTitleRow = el('<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"></div>');
  const catTitle = document.createElement("div");
  catTitle.className = "card-title";
  catTitle.textContent = "分野別正答率";
  catTitleRow.appendChild(catTitle);

  // N4/N3切り替えタブ
  const levelTabs = el('<div style="display:flex;background:#EFF2F8;border-radius:16px;padding:3px;"></div>');
  ["n4","n3"].forEach(lv=>{
    const tb = document.createElement("button");
    const active = dashState.karteLevel === lv;
    tb.textContent = lv.toUpperCase();
    tb.style.cssText = "border:none;border-radius:13px;padding:4px 16px;font-size:12.5px;font-weight:700;cursor:pointer;" +
      (active ? "background:var(--nv-blue,#3B82F6);color:#fff;" : "background:transparent;color:var(--text-sub);");
    tb.onclick = ()=>{ if(dashState.karteLevel !== lv){ dashState.karteLevel = lv; dashState.karteMissQShowCount = { moji:5, bunpo:5, dokkai:5, choukai:5 }; render(); } };
    levelTabs.appendChild(tb);
  });
  catTitleRow.appendChild(levelTabs);
  catCard.appendChild(catTitleRow);

  const karteLevel = dashState.karteLevel;
  const karteQidMap = karteLevel === "n3" ? QID_CATEGORY_MAP_N3 : QID_CATEGORY_MAP_N4;
  const myProgress = kd.progress.filter(p=>{
    const pLevel = p.level || (String(p.question_id||"").startsWith("N3-") ? "n3" : "n4");
    return pLevel === karteLevel;
  });
  const catStats = {}; // cat -> {n,c,qCount}  qCount=着手した問題数(distinct)
  const subjStats = {}; // subj -> {n,c,tn,tc}  (科目別サマリー用の集計)
  myProgress.forEach(p=>{
    const meta = karteQidMap[p.question_id];
    const cat = meta ? meta.cat : "不明";
    const subj = meta ? meta.subj : "不明";
    if(!catStats[cat]) catStats[cat] = { n:0, c:0, qCount:0 };
    catStats[cat].n += p.n_count;
    catStats[cat].c += p.c_count;
    catStats[cat].qCount += 1; // progressは1行=1問題なので、行数がそのまま着手済み問題数になる
    if(!subjStats[subj]) subjStats[subj] = { n:0, c:0, tn:0, tc:0 };
    subjStats[subj].n += p.n_count;
    subjStats[subj].c += p.c_count;
    subjStats[subj].tn += (p.tn_count || 0);
    subjStats[subj].tc += (p.tc_count || 0);
  });

  // 分野ごとの全問題数(問題バンク全体に何問あるか)を集計。分母として使う
  const categoryTotalCounts = {};
  Object.values(karteQidMap).forEach(meta=>{
    categoryTotalCounts[meta.cat] = (categoryTotalCounts[meta.cat] || 0) + 1;
  });

  // 科目別サマリー(4科目): 科目ごとの色つきの棒 + 日本語のみの正答率
  const subjOrder = ["moji","bunpo","dokkai","choukai"];
  const SUBJ_COLOR = { moji:"#3B82F6", bunpo:"#22B07D", dokkai:"#F59E3A", choukai:"#8B5CF6" };
  const hasAnyData = Object.keys(subjStats).length > 0;
  if(hasAnyData){
    const hb = el('<div class="ov-hb" style="margin-bottom:18px;"></div>');
    subjOrder.forEach(sj=>{
      const st = subjStats[sj];
      const r = st && st.n > 0 ? Math.round(st.c/st.n*100) : null;
      const jaOnlyN = st ? st.n - st.tn : 0, jaOnlyC = st ? st.c - st.tc : 0;
      const jaOnlyRate = (st && st.tn > 0 && jaOnlyN > 0) ? Math.round(jaOnlyC/jaOnlyN*100) : null;
      const row = el('<div></div>');
      row.innerHTML = '<div class="ov-hb-row"><div class="ov-hb-lbl">'+SUBJECT_LABEL[sj]+'</div><div class="ov-hb-track"><div class="ov-hb-fill" style="width:'+(r === null ? 0 : r)+'%;background:'+SUBJ_COLOR[sj]+'"></div></div><div class="ov-hb-val">'+(r === null ? '-' : r+'<small>%</small>')+'</div></div>'+
        (jaOnlyRate !== null ? '<div class="k-jaonly">日本語のみ '+jaOnlyRate+'%</div>' : '');
      hb.appendChild(row);
    });
    catCard.appendChild(hb);
  }

  const detailTitle = document.createElement("div");
  detailTitle.className = "ov-sec-title";
  detailTitle.textContent = "分野別の内訳（消化数・正答率）";
  catCard.appendChild(detailTitle);

  // 科目ごとに、試験の出題順に沿った固定の並び順で表示する(データの出現順だとバラバラになるため)
  const SUBJECT_CAT_ORDER = {
    moji:    ["kanji","hyoki","bunmyaku","ruigi","youho"],
    bunpo:   ["bunpo1","bunpo2","bunsho"],
    dokkai:  ["tanbun","chubun","kensaku"],
    choukai: ["kadai","point","hatsuwa","sokuji"]
  };
  const catRow = (cat, color)=>{
    const cs = catStats[cat];
    const cRate = cs.n > 0 ? Math.round(cs.c / cs.n * 100) : 0;
    const catTotal = categoryTotalCounts[cat] || cs.qCount;
    const row = el('<div class="k-cat-row"></div>');
    row.innerHTML = '<div class="k-cat-top"><span>'+escapeHtml(CAT_LABEL[cat] || cat)+'<small>（'+cs.qCount+'/'+catTotal+'問消化）</small></span><b'+(cRate < 40 ? ' class="low"' : '')+'>'+cRate+'%</b></div>'+
      '<div class="k-cat-track"><div class="k-cat-fill" style="width:'+cRate+'%;background:'+color+'"></div></div>';
    return row;
  };
  const catKeys = Object.keys(catStats);
  if(catKeys.length === 0){
    catCard.appendChild(el('<div class="loading">まだ学習記録がありません。</div>'));
  } else {
    const cgrid = el('<div class="k-cat-grid"></div>');
    subjOrder.forEach(subj=>{
      const catsInSubj = SUBJECT_CAT_ORDER[subj].filter(cat=>catStats[cat]);
      if(catsInSubj.length === 0) return;
      const box = el('<div class="k-cat-box"></div>');
      const hd = el('<div class="k-cat-hd"></div>');
      hd.innerHTML = '<i style="background:'+SUBJ_COLOR[subj]+'"></i>'+SUBJECT_LABEL[subj];
      box.appendChild(hd);
      catsInSubj.forEach(cat=> box.appendChild(catRow(cat, SUBJ_COLOR[subj])));
      cgrid.appendChild(box);
    });
    // どの科目定義にも該当しない分野(想定外データ等)は末尾にまとめて表示
    const knownCats = Object.values(SUBJECT_CAT_ORDER).flat();
    const unknownCats = catKeys.filter(c=>!knownCats.includes(c));
    if(unknownCats.length > 0){
      const box = el('<div class="k-cat-box"></div>');
      const hd = el('<div class="k-cat-hd"></div>'); hd.innerHTML = '<i style="background:#9AA3B5"></i>その他'; box.appendChild(hd);
      unknownCats.forEach(cat=> box.appendChild(catRow(cat, "#9AA3B5")));
      cgrid.appendChild(box);
    }
    catCard.appendChild(cgrid);
  }
  kadd(catCard, "k-cat");

  // 「よく間違えている問題」カード。
  // カローラ富山様からのご要望(社内e-learningと同じく、事前に間違えた問題を把握してから
  // 本人と対策の面談をしたい)に応えるためのもの。カテゴリ別の正答率(数字)だけでなく、
  // 実際にどの問題で間違えているかを、問題文・正解・解説(=対策のヒント)つきで見せる。
  // 「文字語彙だけ・文法だけに偏る」のを防ぐため、4科目(文字語彙・文法・読解・聴解)ごとに
  // 正答率が低い順で最大5問=最大20問を表示する(1科目に偏ると、他科目の苦手が埋もれるため)。
  // 科目ごとに「もっと見る」を押すと、その科目だけ5問ずつ追加表示する。
  const missQCard = el('<div class="card"></div>');
  const missQTitle = document.createElement("div");
  missQTitle.className = "card-title";
  missQTitle.textContent = "よく間違えている問題";
  missQCard.appendChild(missQTitle);
  const missQDesc = document.createElement("div");
  missQDesc.className = "card-desc";
  missQDesc.textContent = "科目ごとに、正答率が低い問題を順に表示しています(3回以上解答した問題のみ)。本人との面談時の参考にしてください。";
  missQCard.appendChild(missQDesc);

  // 3回以上答えていて、正答率が100%未満の問題だけを対象にする
  // (1〜2回でたまたま間違えた問題まで並べると、本当に苦手な問題が埋もれてしまうため)
  const missAll = myProgress
    .filter(p => p.n_count >= 3 && p.c_count < p.n_count)
    .map(p => {
      const info = questionInfo(karteLevel, p.question_id);
      const meta = karteQidMap[p.question_id];
      return { p, info, meta, rate: p.c_count / p.n_count };
    })
    .filter(x => x.info); // 問題データが見つからないもの(旧データ等)は除く

  if(missAll.length === 0){
    missQCard.appendChild(el('<div class="missq-empty">今のところ、繰り返し間違えている問題はありません。</div>'));
  } else {
    if(!dashState.karteMissQShowCount || typeof dashState.karteMissQShowCount !== "object"){
      dashState.karteMissQShowCount = { moji:5, bunpo:5, dokkai:5, choukai:5 };
    }
    const missGrid = el('<div class="k-miss-grid"></div>');
    missQCard.appendChild(missGrid);
    subjOrder.forEach(subj=>{
      const list = missAll.filter(x => x.meta.subj === subj).sort((a,b)=> a.rate - b.rate || b.p.n_count - a.p.n_count);
      if(list.length === 0) return;
      const subjBlock = el('<div style="margin-bottom:var(--sp-4);"></div>');
      const subjHead = document.createElement("div");
      subjHead.className = "k-miss-hd";
      subjHead.innerHTML = '<i style="background:'+SUBJ_COLOR[subj]+'"></i>' + SUBJECT_LABEL[subj] + '<small>（' + list.length + '問中）</small>';
      subjBlock.appendChild(subjHead);
      const listEl = el('<div class="missq-list"></div>');
      const showCount = dashState.karteMissQShowCount[subj] || 5;
      const shown = list.slice(0, showCount);
      shown.forEach(x => {
        const item = el('<div class="missq-item"></div>');
        const top = el('<div class="missq-top"></div>');
        const catSpan = document.createElement("span");
        catSpan.className = "missq-cat";
        catSpan.textContent = CAT_LABEL[x.meta.cat] || x.meta.cat;
        const rateSpan = document.createElement("span");
        rateSpan.className = "missq-rate";
        rateSpan.textContent = "正答率 " + Math.round(x.rate * 100) + "%（" + x.p.c_count + "/" + x.p.n_count + "回正解）";
        top.appendChild(catSpan); top.appendChild(rateSpan);
        item.appendChild(top);
        // 本人が直近で選んだ誤答(last_wrong_orig = 元データの選択肢の番号)があれば、正解の前に表示する。
        // 対象は「よく間違えている問題」に載る問題(3回以上解答・不正解あり)なので、
        // 記録が無い場合は単に表示をスキップする。
        // 注: 以前のlast_wrong_choiceは、実習生アプリが選択肢をランダムに入れ替えた後の「画面上の位置」で、
        //     元の選択肢の表で引くと別の文字が出る(正解と同じ文字が出ることもある)ため、使わない。
        if(typeof x.p.last_wrong_orig === "number"){
          const opts = (String(x.p.question_id).startsWith("N3-") ? QUESTION_OPTIONS_N3 : QUESTION_OPTIONS_N4)[x.p.question_id];
          if(opts && opts[x.p.last_wrong_orig] !== undefined){
            const yourEl = document.createElement("div");
            yourEl.className = "missq-your";
            yourEl.textContent = "あなたが選んだ答え：" + opts[x.p.last_wrong_orig];
            item.appendChild(yourEl);
          }
        }
        const qEl = document.createElement("div");
        qEl.className = "missq-q";
        qEl.textContent = x.info[0];
        item.appendChild(qEl);
        const aEl = document.createElement("div");
        aEl.className = "missq-a";
        aEl.textContent = "正解：" + x.info[1];
        item.appendChild(aEl);
        if(x.info[2]){
          const eEl = document.createElement("div");
          eEl.className = "missq-e";
          eEl.textContent = x.info[2];
          item.appendChild(eEl);
        }
        listEl.appendChild(item);
      });
      subjBlock.appendChild(listEl);
      if(list.length > shown.length){
        const moreBtn = document.createElement("button");
        moreBtn.className = "missq-more";
        const restCount = list.length - shown.length;
        moreBtn.textContent = SUBJECT_LABEL[subj] + "をもっと見る（あと" + restCount + "問）";
        moreBtn.onclick = () => { dashState.karteMissQShowCount[subj] = showCount + 5; render(); };
        subjBlock.appendChild(moreBtn);
      }
      missGrid.appendChild(subjBlock);
    });
  }
  kadd(missQCard, "k-miss");

  // 模試履歴カード
  const examCard = el('<div class="card"></div>');
  const examTitle = document.createElement("div");
  examTitle.className = "card-title";
  examTitle.textContent = "模試履歴";
  examCard.appendChild(examTitle);

  const myExams = dashState.exams
    .filter(e=>e.company_id===sel.company_id && e.learner_id===sel.learner_id)
    .sort((a,b)=> new Date(b.taken_at) - new Date(a.taken_at));

  if(myExams.length === 0){
    examCard.appendChild(el('<div class="loading">模試の受験履歴はまだありません。</div>'));
  } else {
    const examsAsc = [...myExams].sort((a,b)=> new Date(a.taken_at) - new Date(b.taken_at));
    const trendSvg = svgExamTrend(examsAsc);
    if(trendSvg){
      const trendWrap = document.createElement("div");
      trendWrap.innerHTML = trendSvg;
      examCard.appendChild(trendWrap);
    } else if(myExams.length === 1){
      const hint = document.createElement("div");
      hint.style.cssText = "text-align:center;font-size:12px;color:#889;margin-bottom:12px;";
      hint.textContent = "模試をもう1回以上受けると、得点の推移グラフが表示されます。";
      examCard.appendChild(hint);
    }
    myExams.forEach(e=>{
      const row = el('<div class="examrow"></div>');
      const eg = e.exam_group === "moji" ? "文字語彙" : e.exam_group === "choukai" ? "聴解" : "文法・読解";
      const d = new Date(e.taken_at);
      const dateStr = d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
      row.innerHTML = "<b>"+eg+"</b>　"+e.correct+"/"+e.total+"（"+e.pct+"%）　<span style='color:#889;'>"+dateStr+"</span>";
      examCard.appendChild(row);
    });
  }
  kadd(examCard, "k-exam");

  // ---- 学習履歴カード(study_sessionsベース。1回の練習・模試セッションごとの記録) ----
  const histCard2 = el('<div class="card"></div>');
  const histTitle2 = document.createElement("div");
  histTitle2.className = "card-title";
  histTitle2.textContent = "学習履歴";
  histCard2.appendChild(histTitle2);
  const mySessions = (l.studySessions || []).slice().sort((a,b)=> new Date(b.started_at) - new Date(a.started_at));
  if(mySessions.length === 0){
    const histNote = el('<div class="loading">学習セッションの記録はまだありません（本機能の追加日以降に記録されます）。</div>');
    histCard2.appendChild(histNote);
  } else {
    const histTable = el('<table class="hist-table"></table>');
    // <thead>はel()(div経由でHTMLを解析する)では単独で作れず、nullになって表示が空白になるため、
    // createElementで作ってから中身を入れる(学習セッションのある学習者のカルテが空白になる不具合の修正)
    const thead = document.createElement("thead");
    thead.innerHTML = '<tr><th>日付</th><th>モード</th><th>分野</th><th>問題数</th><th>正答率</th><th>学習時間</th></tr>';
    histTable.appendChild(thead);
    const tbody = document.createElement("tbody");
    mySessions.slice(0, dashState.karteHistShowCount || 10).forEach(s=>{
      const tr = document.createElement("tr");
      const d = new Date(s.started_at);
      const dateStr = d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
      const modeLabel = s.mode === "mock" ? "模試" : "練習";
      const subjLabel = SUBJECT_LABEL[s.subject] || (s.subject === "bunpo_dokkai" ? "文法・読解" : s.subject || "-");
      const pct = s.question_count > 0 ? Math.round(s.correct_count / s.question_count * 100) : 0;
      tr.innerHTML = "<td>"+dateStr+"</td><td><span class='mode-badge mode-"+s.mode+"'>"+modeLabel+"</span></td><td>"+subjLabel+"</td>"+
        "<td>"+s.question_count+"問</td><td>"+pct+"%</td><td>"+formatDuration(s.duration_seconds)+"</td>";
      tbody.appendChild(tr);
    });
    histTable.appendChild(tbody);
    histCard2.appendChild(histTable);
    if(mySessions.length > (dashState.karteHistShowCount || 10)){
      const histMoreBtn = document.createElement("button");
      histMoreBtn.className = "missq-more";
      histMoreBtn.textContent = "もっと見る（あと" + (mySessions.length - (dashState.karteHistShowCount || 10)) + "件）";
      histMoreBtn.onclick = ()=>{ dashState.karteHistShowCount = (dashState.karteHistShowCount || 10) + 10; render(); };
      histCard2.appendChild(histMoreBtn);
    }
  }
  kadd(histCard2, "k-hist");

  // ---- 学習カレンダーカード ----
  const calCard = el('<div class="card cal-card"></div>');
  const calTitleRow = el('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"></div>');
  const calTitle = document.createElement("div");
  calTitle.className = "card-title";
  calTitle.style.marginBottom = "0";
  calTitle.textContent = "学習カレンダー";
  calTitleRow.appendChild(calTitle);
  if(!dashState.karteCalendarDate) dashState.karteCalendarDate = new Date();
  const calYear = dashState.karteCalendarDate.getFullYear();
  const calMonth = dashState.karteCalendarDate.getMonth();
  const calNav = el('<div style="display:flex;align-items:center;gap:10px;"></div>');
  const calPrevBtn = document.createElement("button");
  calPrevBtn.className = "secondary"; calPrevBtn.style.cssText = "padding:2px 10px;"; calPrevBtn.textContent = "◀";
  calPrevBtn.onclick = ()=>{ dashState.karteCalendarDate = new Date(calYear, calMonth-1, 1); render(); };
  const calLabel = document.createElement("div");
  calLabel.style.cssText = "font-size:13.5px;font-weight:700;min-width:80px;text-align:center;";
  calLabel.textContent = calYear + "年" + (calMonth+1) + "月";
  const calNextBtn = document.createElement("button");
  calNextBtn.className = "secondary"; calNextBtn.style.cssText = "padding:2px 10px;"; calNextBtn.textContent = "▶";
  calNextBtn.onclick = ()=>{ dashState.karteCalendarDate = new Date(calYear, calMonth+1, 1); render(); };
  calNav.appendChild(calPrevBtn); calNav.appendChild(calLabel); calNav.appendChild(calNextBtn);
  calTitleRow.appendChild(calNav);
  calCard.appendChild(calTitleRow);

  const calDays = buildCalendarMonthData(l, calYear, calMonth);
  const firstWeekday = new Date(calYear, calMonth, 1).getDay();
  const grid = el('<div class="cal-grid"></div>');
  ["日","月","火","水","木","金","土"].forEach(w=>{
    const wEl = document.createElement("div");
    wEl.className = "cal-weekday";
    wEl.textContent = w;
    grid.appendChild(wEl);
  });
  for(let i=0; i<firstWeekday; i++){ grid.appendChild(el('<div class="cal-cell cal-empty"></div>')); }
  calDays.forEach(dInfo=>{
    const cell = el('<div class="cal-cell"></div>');
    const numEl = document.createElement("div");
    numEl.className = "cal-daynum";
    numEl.textContent = dInfo.day;
    cell.appendChild(numEl);
    if(dInfo.kind !== "none"){
      const dot = document.createElement("div");
      dot.className = "cal-dot cal-dot-" + dInfo.kind;
      cell.appendChild(dot);
    }
    grid.appendChild(cell);
  });
  calCard.appendChild(grid);

  const calLegend = el('<div class="cal-legend"></div>');
  calLegend.innerHTML =
    "<span><span class='cal-dot cal-dot-practice'></span>練習</span>" +
    "<span><span class='cal-dot cal-dot-mock'></span>模試</span>" +
    "<span><span class='cal-dot cal-dot-both'></span>両方</span>" +
    "<span><span class='cal-dot cal-dot-unknown'></span>学習あり(詳細不明)</span>";
  calCard.appendChild(calLegend);
  kadd(calCard, "k-cal");

  return wrap;
}

// フィルタ(企業名・終了済み表示)を適用した学習者一覧を返す。
// renderTableOnlyとrenderBulkBar(全選択の対象範囲)の両方から使う共通ロジック。
function getFilteredLearners(){
  let learners = buildLearnerSummary();
  // 概要の「NTLP未登録」カードから飛んできたときは、未登録の人だけを表示する。
  // アカウントをまだ発行していない人を探す用途。
  if(dashState.onlyUnregistered){
    learners = learners.filter(l=> !l.ntlpRegistered);
  }
  if(dashState.companyFilter.trim()){
    const f = dashState.companyFilter.trim().toLowerCase();
    learners = learners.filter(l=>l.company_id.toLowerCase().includes(f) || (l.companyName||"").toLowerCase().includes(f));
  }
  // 事業所フィルタ(Phase 3.5、UI上の絞り込みのみ。セキュリティ境界はRLS側)
  if(dashState.workplaceFilter){
    learners = learners.filter(l=> (l.workplaces||[]).some(w=>w.id === dashState.workplaceFilter));
  }
  // 実習終了済みの実習生はダッシュボードの対象外(現在学習中の実習生のみを扱う運用のため)
  learners = learners.filter(l=>!l.isFinished);
  return learners;
}

// 期生・号の並び替え用キー(数値昇順、未設定は末尾)
function kiseiSortKey(l){
  if(!l.kisei) return 9999;
  const m = l.kisei.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 9999;
}
function goSortKey(l){
  if(!l.go) return 9;
  const m = l.go.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 9;
}

// 完全一致(店舗名が無く企業名そのものの場合)は省くと空になるため、元の名前のまま表示する。
function stripCompanyPrefix(name, companyName){
  if(!companyName || !name.startsWith(companyName)) return name;

// ドーナツグラフ。segments = [{value, color, label}, ...]
function buildDonutChart(segments, opts){
  opts = opts || {};
  const size = opts.size || 148;
  const stroke = opts.stroke || 22;
  const r = (size - stroke) / 2;
  const cx = size/2, cy = size/2;
  const circumference = 2 * Math.PI * r;
  const total = segments.reduce((s,seg)=>s+seg.value, 0);

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 "+size+" "+size);
  svg.setAttribute("width", size); svg.setAttribute("height", size);

  const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  bg.setAttribute("cx", cx); bg.setAttribute("cy", cy); bg.setAttribute("r", r);
  bg.setAttribute("fill", "none"); bg.setAttribute("stroke", "#eef0f2"); bg.setAttribute("stroke-width", stroke);
  svg.appendChild(bg);

  if(total > 0){
    let offset = 0;
    segments.forEach(seg=>{
      if(seg.value <= 0) return;
      const frac = seg.value / total;
      const dash = frac * circumference;
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", r);
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", seg.color);
      circle.setAttribute("stroke-width", stroke);
      circle.setAttribute("stroke-dasharray", dash + " " + (circumference - dash));
      circle.setAttribute("stroke-dashoffset", -offset);
      circle.setAttribute("transform", "rotate(-90 " + cx + " " + cy + ")");
      circle.setAttribute("stroke-linecap", segments.length===1 ? "round" : "butt");
      svg.appendChild(circle);
      offset += dash;
    });
  }

  const wrap = document.createElement("div");
  wrap.className = "donut-wrap";
  wrap.appendChild(svg);
  if(opts.centerLabel){
    const center = document.createElement("div");
    center.className = "donut-center";
    center.innerHTML = opts.centerLabel;
    wrap.appendChild(center);
  }
  return wrap;
}

// 折れ線グラフ(複数系列対応)。series = [{label, color, points:[{x_label, y}, ...]}]
function buildLineChart(series, opts){
  opts = opts || {};
  const width = opts.width || 600, height = opts.height || 200;
  const padL = 34, padR = 12, padT = 14, padB = 26;
  const plotW = width - padL - padR, plotH = height - padT - padB;

  const allPoints = series.flatMap(s=>s.points);
  const xLabels = series[0] ? series[0].points.map(p=>p.x_label) : [];
  const maxY = Math.max(1, ...allPoints.map(p=>p.y));
  const n = xLabels.length;

  const xPos = (i)=> n<=1 ? padL + plotW/2 : padL + (plotW * i/(n-1));
  const yPos = (v)=> padT + plotH - (plotH * v/maxY);

  let svg = '<svg viewBox="0 0 '+width+' '+height+'" width="100%" height="'+height+'" preserveAspectRatio="xMidYMid meet">';

  // 横グリッド線(4分割)
  for(let g=0; g<=4; g++){
    const y = padT + plotH * g/4;
    const val = Math.round(maxY * (4-g)/4);
    svg += '<line x1="'+padL+'" y1="'+y+'" x2="'+(width-padR)+'" y2="'+y+'" stroke="#eef0f2" stroke-width="1"/>';
    svg += '<text x="'+(padL-8)+'" y="'+(y+3)+'" font-size="10" fill="#8a8f99" text-anchor="end">'+val+'</text>';
  }
  // X軸ラベル
  xLabels.forEach((lbl,i)=>{
    svg += '<text x="'+xPos(i)+'" y="'+(height-8)+'" font-size="10" fill="#8a8f99" text-anchor="middle">'+escapeHtml(lbl)+'</text>';
  });

  series.forEach(s=>{
    if(s.points.length === 0) return;
    if(s.points.length === 1){
      // 点が1つしか無い場合は線が引けないので、点だけ大きめに描く
      const p = s.points[0];
      svg += '<circle cx="'+xPos(0)+'" cy="'+yPos(p.y)+'" r="4" fill="'+s.color+'"/>';
      return;
    }
    let path = "";
    s.points.forEach((p,i)=>{
      const x = xPos(i), y = yPos(p.y);
      path += (i===0 ? "M" : "L") + x + " " + y + " ";
    });
    svg += '<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s.points.forEach((p,i)=>{
      svg += '<circle cx="'+xPos(i)+'" cy="'+yPos(p.y)+'" r="3" fill="'+s.color+'"/>';
    });
  });

  svg += '</svg>';
  const wrap = document.createElement("div");
  wrap.className = "linechart-wrap";
  wrap.innerHTML = svg;
  return wrap;
}

// 縦棒グラフ(分野別傾向など、複数の独立した%を横に並べて比較する用途)。
// items = [{label, value(0-100), color}]
function buildBarChart(items, opts){
  opts = opts || {};
  const width = opts.width || 260, height = opts.height || 200;
  const padT = 24, padB = 34, padX = 14;
  const plotH = height - padT - padB;
  const n = items.length;
  const gap = 14;
  const barW = (width - padX*2 - gap*(n-1)) / n;

  let svg = '<svg viewBox="0 0 '+width+' '+height+'" width="100%" height="'+height+'" preserveAspectRatio="xMidYMid meet">';
  // 横グリッド線(0/50/100)
  [0,50,100].forEach(v=>{
    const y = padT + plotH - (plotH * v/100);
    svg += '<line x1="'+padX+'" y1="'+y+'" x2="'+(width-padX)+'" y2="'+y+'" stroke="#eef0f2" stroke-width="1"/>';
  });
  items.forEach((it,i)=>{
    const x = padX + i*(barW+gap);
    const barH = plotH * Math.max(0, Math.min(100, it.value)) / 100;
    const displayH = it.value > 0 ? Math.max(barH, 4) : 0; // 見やすさのための最低高さ(4px)
    const y = padT + plotH - displayH; // Y座標は「実際に描画する高さ」から計算する(最低高さ適用前の値で計算すると、
                                        // 小さな値の時にバーの下端が背景トラックからはみ出すため)
    svg += '<rect x="'+x+'" y="'+padT+'" width="'+barW+'" height="'+plotH+'" rx="6" fill="#f3f4f6"/>';
    if(it.value > 0){
      svg += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+displayH+'" rx="6" fill="'+it.color+'"/>';
      svg += '<text x="'+(x+barW/2)+'" y="'+(y-8)+'" font-size="13" font-weight="700" fill="#1a1f29" text-anchor="middle">'+it.value+'%</text>';
    } else {
      svg += '<text x="'+(x+barW/2)+'" y="'+(padT+plotH-8)+'" font-size="10.5" fill="#8a8f99" text-anchor="middle">-</text>';
    }
    svg += '<text x="'+(x+barW/2)+'" y="'+(height-12)+'" font-size="12" fill="#8a8f99" text-anchor="middle">'+escapeHtml(it.label)+'</text>';
  });
  svg += '</svg>';
  const wrap = document.createElement("div");
  wrap.className = "barchart-wrap";
  wrap.innerHTML = svg;
  return wrap;
}

    flagBadge(l.nationality) + (l.learnerName ? escapeHtml(l.learnerName) : "-") +

const STUDENTS_PER_PAGE = 10;
const COMPANIES_PER_PAGE = 5;

// クリックで並び替えできる列の定義。値取得関数(getValue)を統一して比較する。
const SORT_GETTERS = {
  name: l => l.learnerName || "",
  learnerId: l => l.learner_id || "",
  period: l => kiseiSortKey(l)*10 + goSortKey(l),
  questions: l => l.questionsStudied || 0,
  rate: l => l.n > 0 ? l.c / l.n : -1,
  lastSeen: l => l.lastSeen ? new Date(l.lastSeen).getTime() : -1,
};
const HEADER_DEFS = [
  { label: "氏名", key: "name" },
  { label: "実習生ID", key: "learnerId" },
  { label: "NTLP状態", key: null },
  { label: "期生・号", key: "period" },
  { label: "学習済み問題数", key: "questions" },
  { label: "通算正答率", key: "rate" },
  { label: "文字語彙", key: null, hideMobile: true },
  { label: "文法", key: null, hideMobile: true },
  { label: "読解", key: null, hideMobile: true },
  { label: "聴解", key: null, hideMobile: true },
  { label: "最新模試", key: null, hideMobile: true },
  { label: "最終学習", key: "lastSeen" },
  { label: "状態", key: null },
];

// 選択中の並び替え列があればそれで、無ければデフォルト(期生・号順)で並び替える。
function sortLearnersForDisplay(learners){
  const col = dashState.sortColumn;
  if(col && SORT_GETTERS[col]){
    const dir = dashState.sortDirection === "desc" ? -1 : 1;
    const getValue = SORT_GETTERS[col];
    return learners.slice().sort((a,b)=>{
      const va = getValue(a), vb = getValue(b);
      if(va < vb) return -1*dir;
      if(va > vb) return 1*dir;
      return 0;
    });
  }
  return learners.slice().sort((a,b)=>{
    const ka = kiseiSortKey(a), kb = kiseiSortKey(b);
    if(ka !== kb) return ka - kb;
    const ga = goSortKey(a), gb = goSortKey(b);
    if(ga !== gb) return ga - gb;
    return (a.learnerName||"").localeCompare(b.learnerName||"", "ja");
  });
}

// 並び替え可能な列見出しを構築する(クリックで昇順⇄降順、別の列をクリックするとその列の昇順から)。
function buildSortableThead(checkboxHeader){
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  if(checkboxHeader) headRow.appendChild(document.createElement("th"));
  HEADER_DEFS.forEach(h=>{
    const th = document.createElement("th");
    if(h.hideMobile) th.classList.add("col-hide-mobile");
    if(h.key){
      th.style.cursor = "pointer";
      th.title = "クリックで並び替え";
      let arrow = "";
      if(dashState.sortColumn === h.key) arrow = dashState.sortDirection === "desc" ? " ▼" : " ▲";
      th.textContent = h.label + arrow;
      th.onclick = ()=>{
        if(dashState.sortColumn === h.key){
          dashState.sortDirection = dashState.sortDirection === "asc" ? "desc" : "asc";
        } else {
          dashState.sortColumn = h.key;
          dashState.sortDirection = "asc";
        }
        renderTableOnly();
      };
    } else {
      th.textContent = h.label;
    }
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  return thead;
}

// ページネーションUI(番号ボタン＋省略記号)を組み立てる。
// currentPageIdxは0始まり。onChangeには新しいページ番号(0始まり)が渡される。
function buildPaginationControl(currentPageIdx, totalPages, onChange){
  const wrap = document.createElement("div");
  wrap.className = "pagination";

  const prevBtn = document.createElement("button");
  prevBtn.className = "pagination-nav";
  prevBtn.innerHTML = "‹ 前へ";
  prevBtn.disabled = currentPageIdx === 0;
  prevBtn.onclick = ()=> onChange(currentPageIdx - 1);
  wrap.appendChild(prevBtn);

  // 表示するページ番号を決める: 先頭・末尾は常に表示、現在ページの前後1つも表示、間は省略記号
  const last = totalPages - 1;
  const pages = [];
  const addPage = p=>{ if(!pages.includes(p)) pages.push(p); };
  addPage(0);
  for(let p = currentPageIdx-1; p <= currentPageIdx+1; p++){ if(p >= 0 && p <= last) addPage(p); }
  addPage(last);
  pages.sort((a,b)=>a-b);

  let prevShown = -1;
  pages.forEach(p=>{
    if(prevShown !== -1 && p - prevShown > 1){
      const ellipsis = document.createElement("span");
      ellipsis.className = "pagination-ellipsis";
      ellipsis.textContent = "…";
      wrap.appendChild(ellipsis);
    }
    const btn = document.createElement("button");
    btn.className = "pagination-page" + (p === currentPageIdx ? " active" : "");
    btn.textContent = String(p+1);
    btn.onclick = ()=> onChange(p);
    wrap.appendChild(btn);
    prevShown = p;
  });

  const nextBtn = document.createElement("button");
  nextBtn.className = "pagination-nav";
  nextBtn.innerHTML = "次へ ›";
  nextBtn.disabled = currentPageIdx >= last;
  nextBtn.onclick = ()=> onChange(currentPageIdx + 1);
  wrap.appendChild(nextBtn);

  return wrap;
}

// 実習生一覧テーブル(並び替え・5件ページング込み)を組み立てる。事業所ごとの表示と、
// 企業まとめて表示の両方から呼べるよう、ページング状態のキー(pageKey)だけ呼び出し側で変える。
function renderStudentTableBlock(learners, pageKey, scopeForTable){
  const sortedLearners = sortLearnersForDisplay(learners);

  const totalPages = Math.max(1, Math.ceil(sortedLearners.length / STUDENTS_PER_PAGE));
  let page = dashState.studentPageByWorkplace[pageKey] || 0;
  if(page >= totalPages) page = totalPages - 1;
  if(page < 0) page = 0;
  const pageLearners = sortedLearners.slice(page*STUDENTS_PER_PAGE, page*STUDENTS_PER_PAGE + STUDENTS_PER_PAGE);

  const body = document.createElement("div");
  body.className = "tree-workplace-body";

  const table = document.createElement("table");
  const checkboxHeader = scopeForTable.isAdmin;
  table.appendChild(buildSortableThead(checkboxHeader));
  const tbody = document.createElement("tbody");
  pageLearners.forEach(l=> tbody.appendChild(buildLearnerRow(l, scopeForTable)));
  table.appendChild(tbody);
  body.appendChild(table);

  if(totalPages > 1){
    const pager = buildPaginationControl(page, totalPages, (newPage)=>{
      dashState.studentPageByWorkplace[pageKey] = newPage;
      renderTableOnly();
    });
    pager.classList.add("tree-pager");
    const countLabel = document.createElement("div");
    countLabel.className = "tree-pager-count";
    countLabel.textContent = sortedLearners.length + "人";
    body.appendChild(pager);
    body.appendChild(countLabel);
  }
  return body;
}

// 学習タブ「実習生別」の一覧を再構築する(フィルタ・検索・ページ変更のたびに呼ばれる)。
function renderLearningLearnersOnly(){
  const wrapEl = document.getElementById("learningLearnersWrap");
  if(!wrapEl) return;
  const scope = sessionScope();
  let learners = buildLearnerSummary().filter(l=>!l.isFinished);

  const filterId = dashState.learningLearnerFilter;
  if(filterId === "notstudied") learners = learners.filter(l=>l.questionsStudied===0);
  else if(filterId === "studying") learners = learners.filter(l=>l.questionsStudied>0);
  else if(filterId === "thisweek") learners = learners.filter(l=>l.lastSeen && (Date.now()-new Date(l.lastSeen).getTime()) <= 7*86400000);
  else if(filterId === "stale") learners = learners.filter(l=>!l.lastSeen || (Date.now()-new Date(l.lastSeen).getTime())/86400000 >= 7);
  else if(filterId === "lowprogress") learners = learners.filter(l=>l.questionsStudied>0 && l.progressPct < 20);
  else if(filterId === "lowrate") learners = learners.filter(l=>l.n>0 && l.rate < 40);
  else if(filterId === "followup") learners = learners.filter(l=>l.needsFollowUp);

  const search = (dashState.learningLearnerSearch||"").trim().toLowerCase();
  if(search) learners = learners.filter(l=>
    (l.learnerName||l.learner_id||"").toLowerCase().includes(search) ||
    (l.learnerNameKana||"").toLowerCase().includes(search)
  );

  // ソート(ヘッダーをクリックして切り替え可能。既定は最終学習が古い順=対応が必要な人を上に)
  const sortCol = dashState.learningLearnerSortCol;
  const sortDir = dashState.learningLearnerSortDir === "asc" ? 1 : -1;
  const sortGetters = {
    name: l => (l.learnerName || l.learner_id || ""),
    kana: l => (l.learnerNameKana || ""),
    progress: l => l.progressPct || 0,
    rate: l => l.n > 0 ? l.rate : -1,
    lastSeen: l => l.lastSeen ? new Date(l.lastSeen).getTime() : 0
  };
  const getter = sortGetters[sortCol] || sortGetters.lastSeen;
  learners.sort((a,b)=>{
    const av = getter(a), bv = getter(b);
    // 文字列ソートで、値が無い(空文字)人は昇順・降順どちらでも常に末尾に回す。
    // (何も指定せず比較すると、空文字は昇順で先頭に来てしまい、「よみがな未登録の人だけが
    // 上に固まって、名前が消えたように見える」という紛らわしい表示になるため)
    if(typeof av === "string" || typeof bv === "string"){
      const aEmpty = !av, bEmpty = !bv;
      if(aEmpty && bEmpty) return 0;
      if(aEmpty) return 1;
      if(bEmpty) return -1;
      return av.localeCompare(bv, "ja") * sortDir;
    }
    return (av - bv) * sortDir;
  });

  wrapEl.innerHTML = "";
  if(learners.length === 0){
    wrapEl.appendChild(el('<div class="loading">該当する実習生がいません。</div>'));
    return;
  }

  // ソート見出し行(クリックで並び替え。同じ列を再クリックすると昇順/降順を反転)
  const sortHeaderDefs = [
    { col:"name", label:"氏名" },
    { col:"kana", label:"よみがな" },
    { col:"progress", label:"進捗" },
    { col:"rate", label:"正答率" },
    { col:"lastSeen", label:"最終学習" }
  ];
  const sortHeaderRow = el('<div class="learner-mgmt-sortheader"></div>');
  sortHeaderDefs.forEach(h=>{
    const btn = el('<button class="learner-mgmt-sortbtn"></button>');
    const isActive = sortCol === h.col;
    if(isActive) btn.classList.add("active");
    btn.innerHTML = h.label + "<span class='learner-mgmt-sortarrow'>"+(isActive ? (dashState.learningLearnerSortDir==="asc"?"↑":"↓") : "")+"</span>";
    btn.onclick = ()=>{
      if(dashState.learningLearnerSortCol === h.col){
        dashState.learningLearnerSortDir = dashState.learningLearnerSortDir === "asc" ? "desc" : "asc";
      } else {
        dashState.learningLearnerSortCol = h.col;
        dashState.learningLearnerSortDir = "asc";
      }
      dashState.learningLearnerPage = 0;
      renderLearningLearnersOnly();
    };
    sortHeaderRow.appendChild(btn);
  });
  wrapEl.appendChild(sortHeaderRow);

  const PAGE_SIZE = 20;
  const pageIdx = dashState.learningLearnerPage || 0;
  const totalPages = Math.ceil(learners.length / PAGE_SIZE);
  const pageLearners = learners.slice(pageIdx*PAGE_SIZE, pageIdx*PAGE_SIZE+PAGE_SIZE);

  const listEl = el('<div class="learner-mgmt-list"></div>');
  pageLearners.forEach(l=>{
    const row = el('<div class="learner-mgmt-row"></div>');
    const statusTone = l.needsFollowUp ? "red" : l.questionsStudied===0 ? "gray" : "green";
    const statusLabel = l.needsFollowUp ? "要フォロー" : l.questionsStudied===0 ? "未学習" : "良好";
    row.innerHTML =
      "<div class='learner-mgmt-main'>"+
        "<div class='learner-mgmt-name'>"+programBadge(l.program)+flagBadge(l.nationality)+escapeHtml(l.learnerName||l.learner_id)+
          (l.learnerNameKana ? " <span style='font-weight:400;color:var(--text-sub);font-size:0.85em;'>"+escapeHtml(l.learnerNameKana)+"</span>" : "")+"</div>"+
        "<div class='learner-mgmt-company'>"+escapeHtml(l.companyName||l.company_id)+
          (l.workplaces&&l.workplaces.length? "　／　"+escapeHtml(l.workplaces.map(w=>w.workplace_name).join("・")) : "")+"</div>"+
      "</div>"+
      "<div class='learner-mgmt-metrics'>"+
        "<div class='learner-mgmt-metric'><span class='learner-mgmt-metric-lbl'>進捗</span><span class='learner-mgmt-metric-val'>"+l.progressPct+"%</span></div>"+
        "<div class='learner-mgmt-metric'><span class='learner-mgmt-metric-lbl'>正答率</span><span class='learner-mgmt-metric-val'>"+(l.n>0?l.rate+"%":"-")+"</span></div>"+
        "<div class='learner-mgmt-metric'><span class='learner-mgmt-metric-lbl'>最終学習</span><span class='learner-mgmt-metric-val'>"+(l.lastSeen?relTime(l.lastSeen):"-")+"</span></div>"+
      "</div>"+
      "<span class='badge-pill' style='background:"+STAT_COLORS[statusTone].bg+";color:"+STAT_COLORS[statusTone].icon+";'>"+statusLabel+"</span>";
    row.onclick = ()=> openKarte(l.company_id, l.learner_id);
    listEl.appendChild(row);
  });
  wrapEl.appendChild(listEl);

  if(totalPages > 1){
    wrapEl.appendChild(buildPaginationControl(pageIdx, totalPages, (newPage)=>{ dashState.learningLearnerPage = newPage; renderLearningLearnersOnly(); }));
  }
}

function renderTableOnly(){
  const tableWrap = document.getElementById("tableWrap");
  if(!tableWrap) return;
  let learners = getFilteredLearners();

  if(learners.length === 0){
    tableWrap.innerHTML = '<div class="loading">該当する学習記録がまだありません。</div>';
    return;
  }

  const scopeForTable = sessionScope();

  // ---- 企業 → 勤務先 → 実習生、の階層にグルーピングする ----
  const companyGroups = {}; // company_id -> { companyName, learners:[], workplaceMap:{ key -> {label, learners:[]} } }
  learners.forEach(l=>{
    if(!companyGroups[l.company_id]){
      companyGroups[l.company_id] = { companyName: l.companyName || l.company_id, workplaceMap: {} };
    }
    const g = companyGroups[l.company_id];
    const w = (l.workplaces && l.workplaces[0]) ? l.workplaces[0] : null;
    const key = w ? w.id : "__unset__";
    if(!g.workplaceMap[key]){
      g.workplaceMap[key] = { label: w ? stripCompanyPrefix(w.workplace_name, g.companyName) : "未設定", learners: [] };
    }
    g.workplaceMap[key].learners.push(l);
  });

  const companyIds = Object.keys(companyGroups).sort((a,b)=>
    companyGroups[a].companyName.localeCompare(companyGroups[b].companyName, "ja"));

  // フィルタで企業が1社だけに絞られている場合は、毎回クリックさせずに自動展開する
  const soleCompany = companyIds.length === 1 ? companyIds[0] : null;

  const container = document.createElement("div");

  // 企業一覧も5社ずつページング(企業が1社に絞られている時はページングの意味が無いので出さない)
  let pagedCompanyIds = companyIds;
  let companyTotalPages = 1;
  let companyPageIdx = 0;
  if(!soleCompany){
    companyTotalPages = Math.max(1, Math.ceil(companyIds.length / COMPANIES_PER_PAGE));
    companyPageIdx = dashState.companyPage || 0;
    if(companyPageIdx >= companyTotalPages) companyPageIdx = companyTotalPages - 1;
    if(companyPageIdx < 0) companyPageIdx = 0;
    pagedCompanyIds = companyIds.slice(companyPageIdx*COMPANIES_PER_PAGE, companyPageIdx*COMPANIES_PER_PAGE + COMPANIES_PER_PAGE);
  }

  pagedCompanyIds.forEach(companyId=>{
    const g = companyGroups[companyId];
    const companyLearnerCount = Object.values(g.workplaceMap).reduce((s,wg)=>s+wg.learners.length, 0);
    const isExpanded = soleCompany ? true : !!dashState.expandedCompanies[companyId];
    // 事業所が2つ以上ある企業だけ、「事業所ごと／まとめて」の切り替えを出す
    // (社長など、全事業所のスタッフを一気に見たい人向け。店長など事業所が1つしかない人には出す意味がない)
    const workplaceCount = Object.keys(g.workplaceMap).length;
    const flatMode = workplaceCount > 1 && !!dashState.companyFlatMode[companyId];

    const companyHeaderRow = document.createElement("div");
    companyHeaderRow.className = "tree-company-header";
    const companyHeaderMain = document.createElement("div");
    companyHeaderMain.style.cssText = "display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;";
    companyHeaderMain.innerHTML =
      "<span class='tree-toggle'>"+(isExpanded ? "▼" : "▶")+"</span>"+
      "<span class='tree-company-name'>"+escapeHtml(g.companyName)+"</span>";
    if(!soleCompany){
      companyHeaderMain.onclick = ()=> toggleCompanyExpand(companyId);
    } else {
      companyHeaderMain.style.cursor = "default";
    }
    companyHeaderRow.appendChild(companyHeaderMain);
    if(workplaceCount > 1){
      const flatToggle = document.createElement("button");
      flatToggle.className = "ghost";
      flatToggle.style.cssText = "font-size:11.5px;padding:2px 8px;margin-right:10px;";
      flatToggle.textContent = flatMode ? "事業所ごとに見る" : "全員まとめて見る";
      flatToggle.onclick = (ev)=>{ ev.stopPropagation(); toggleCompanyFlatMode(companyId); };
      companyHeaderRow.appendChild(flatToggle);
    }
    const companyCountEl = document.createElement("span");
    companyCountEl.className = "tree-count";
    companyCountEl.textContent = companyLearnerCount + "人";
    companyHeaderRow.appendChild(companyCountEl);
    container.appendChild(companyHeaderRow);

    if(!isExpanded) return;

    // ---- まとめて表示: 事業所の区切りを出さず、企業内の全員を1つの表にする ----
    if(flatMode){
      const allLearners = [];
      Object.values(g.workplaceMap).forEach(wg=> allLearners.push(...wg.learners));
      container.appendChild(renderStudentTableBlock(allLearners, "company::"+companyId, scopeForTable));
      return;
    }

    const workplaceKeys = Object.keys(g.workplaceMap).sort((a,b)=>{
      if(a === "__unset__") return 1;
      if(b === "__unset__") return -1;
      return g.workplaceMap[a].label.localeCompare(g.workplaceMap[b].label, "ja");
    });

    const soleWorkplace = workplaceKeys.length === 1 ? workplaceKeys[0] : null;

    workplaceKeys.forEach(wpKey=>{
      const wg = g.workplaceMap[wpKey];
      const fullKey = companyId + "::" + wpKey;
      const wpExpanded = soleWorkplace ? true : !!dashState.expandedWorkplaces[fullKey];

      const wpHeader = document.createElement("div");
      wpHeader.className = "tree-workplace-header";
      wpHeader.innerHTML =
        "<span class='tree-toggle'>"+(wpExpanded ? "▼" : "▶")+"</span>"+
        "<span class='tree-workplace-name'>"+escapeHtml(wg.label)+"</span>"+
        "<span class='tree-count'>"+wg.learners.length+"人</span>";
      if(!soleWorkplace){
        wpHeader.onclick = ()=> toggleWorkplaceExpand(fullKey);
      } else {
        wpHeader.style.cursor = "default";
      }
      container.appendChild(wpHeader);

      if(!wpExpanded) return;

      container.appendChild(renderStudentTableBlock(wg.learners, fullKey, scopeForTable));
    });
  });

  // 企業一覧のページャー(企業が2社以上あり、絞り込まれていない時だけ表示)
  if(!soleCompany && companyTotalPages > 1){
    const companyPager = buildPaginationControl(companyPageIdx, companyTotalPages, (newPage)=>{
      dashState.companyPage = newPage;
      renderTableOnly();
    });
    companyPager.classList.add("tree-pager");
    container.appendChild(companyPager);
    const countLabel = document.createElement("div");
    countLabel.className = "tree-pager-count";
    countLabel.textContent = companyIds.length + "社";
    container.appendChild(countLabel);
  }

  tableWrap.innerHTML = "";
  tableWrap.appendChild(container);
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---- プルリフレッシュ(上から下へ引っ張って更新) ----
// ページの一番上(scrollY===0)にいる時だけ反応させ、それ以外(一覧を下にスクロール中)は
// 通常のスクロール動作を邪魔しないようにする。
(function initPullRefresh(){
  const indicator = document.getElementById("pullRefreshIndicator");
  const spinnerEl = indicator ? indicator.querySelector(".pull-refresh-spinner") : null;
  const THRESHOLD = 64; // これ以上引っ張ったら離した時に更新する
  const MAX_PULL = 90;
  let startY = null, pulling = false, refreshing = false;

  document.addEventListener("touchstart", (ev)=>{
    if(refreshing || window.scrollY > 0 || ev.touches.length !== 1) { startY = null; return; }
    startY = ev.touches[0].clientY;
    pulling = false;
  }, { passive: true });

  document.addEventListener("touchmove", (ev)=>{
    if(startY === null || refreshing) return;
    const dy = ev.touches[0].clientY - startY;
    if(dy <= 0) return; // 上方向や横方向の動きは無視
    if(window.scrollY > 0) { startY = null; return; } // 引っ張っている途中で通常スクロールに移った場合は中断
    pulling = true;
    const pull = Math.min(dy * 0.5, MAX_PULL); // 指の動きよりゆっくり追従させる(ゴムのような感触)
    if(indicator){
      indicator.classList.add("dragging");
      indicator.style.transform = "translateY(" + (pull - 56) + "px)";
    }
    if(spinnerEl) spinnerEl.style.transform = "rotate(" + (pull / MAX_PULL * 360) + "deg)";
  }, { passive: true });

  document.addEventListener("touchend", ()=>{
    if(!pulling || refreshing){ startY = null; pulling = false; return; }
    pulling = false;
    const pulledEnough = indicator && indicator.style.transform &&
      Math.abs(parseFloat(indicator.style.transform.replace(/[^\-0-9.]/g,""))+56) >= THRESHOLD*0.5;
    if(indicator) indicator.classList.remove("dragging");
    if(pulledEnough && session){
      refreshing = true;
      if(indicator){ indicator.style.transform = "translateY(0)"; indicator.classList.add("spinning"); }
      pullRefreshDashboardData().finally(()=>{
        refreshing = false;
        if(indicator){
          indicator.classList.remove("spinning");
          indicator.style.transform = "translateY(-56px)";
        }
      });
    } else if(indicator){
      indicator.style.transform = "translateY(-56px)";
    }
    startY = null;
  });
})();

checkMaintenanceBanner();
render();
})();
</script>
