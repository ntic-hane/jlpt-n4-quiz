<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>N.T.I.C Academy - 管理者ダッシュボード</title>
<style>
:root{ --navy:#0F2E52; --blue:#1E4D8C; --yellow:#F2C230; --green:#12795A; --red:#C0392B; --bg:#EDF1F6; }
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;background:var(--bg);color:#222;}
header{background:var(--navy);color:#fff;padding:14px 20px;}
header h1{font-size:16px;margin:0;font-weight:700;}
main{max-width:1000px;margin:0 auto;padding:20px;}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;width:100%;box-sizing:border-box;margin-bottom:10px;}
button.primary{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost{background:transparent;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:13px;}
.errormsg{color:var(--red);font-size:13px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;}
th{color:#667;font-weight:700;background:#f8fafc;position:sticky;top:0;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.badge.high{background:#e7f6f0;color:var(--green);}
.badge.mid{background:#fff4e0;color:#b8720a;}
.badge.low{background:#fbeceb;color:var(--red);}
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.filters input{flex:1;min-width:160px;margin-bottom:0;}
.loading{text-align:center;color:#889;padding:30px;}
.stale{color:#b8720a;}
</style>
</head>
<body>
<header><h1>N.T.I.C Academy - JLPT N4 学習状況ダッシュボード（管理者用）</h1></header>
<main id="app"></main>

<script>
// Supabase接続設定
// publishable key はブラウザに埋め込んで問題ない設計のキー(RLSで保護されている)
const SUPABASE_URL = "https://ajnuzcbnomlzapnxtehv.supabase.co";
const SUPABASE_KEY = "sb_publishable_vf61-vdAHVX6lXBk8yv0gw_-MOVs444";

</script>
<script>
(function(){
"use strict";

let session = null; // {access_token, email}

function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!session) app.appendChild(renderLogin());
  else app.appendChild(renderDashboard());
}

function renderLogin(){
  const wrap = document.createElement("div");
  const card = el('<div class="card" style="max-width:380px;margin:40px auto;"></div>');
  const h = document.createElement("div");
  h.style.fontWeight="700"; h.style.fontSize="16px"; h.style.marginBottom="14px";
  h.textContent = "管理者ログイン";
  card.appendChild(h);

  const err = document.createElement("div");
  err.className = "errormsg"; err.style.display = "none";
  card.appendChild(err);

  const email = document.createElement("input");
  email.type = "email"; email.placeholder = "メールアドレス";
  card.appendChild(email);

  const pw = document.createElement("input");
  pw.type = "password"; pw.placeholder = "パスワード";
  card.appendChild(pw);

  const btn = document.createElement("button");
  btn.className = "primary"; btn.style.width="100%"; btn.textContent = "ログイン";
  btn.onclick = async ()=>{
    btn.disabled = true; btn.textContent = "ログイン中...";
    err.style.display = "none";
    try{
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.value, password: pw.value })
      });
      const data = await res.json();
      if(!res.ok || !data.access_token){
        err.textContent = "ログインに失敗しました。メールアドレス・パスワードを確認してください。";
        err.style.display = "block";
        btn.disabled = false; btn.textContent = "ログイン";
        return;
      }
      session = { access_token: data.access_token, email: email.value };
      render();
    }catch(e){
      err.textContent = "通信エラーが発生しました。ネットワーク接続を確認してください。";
      err.style.display = "block";
      btn.disabled = false; btn.textContent = "ログイン";
    }
  };
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
}

function decodeJwt(token){
  try{
    const payload = token.split(".")[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,"+").replace(/_/g,"/"))
      .split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  }catch(e){ return {}; }
}

function sessionScope(){
  if(!session) return { isAdmin:false, companyId:null };
  const payload = decodeJwt(session.access_token);
  const meta = (payload.app_metadata) || {};
  return { isAdmin: meta.role === "ntic_admin", companyId: meta.company_id || null };
}

function authHeaders(){
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + session.access_token,
    "Content-Type": "application/json"
  };
}

async function fetchAll(table, params){
  const url = SUPABASE_URL + "/rest/v1/" + table + "?" + (params||"select=*");
  const res = await fetch(url, { headers: authHeaders() });
  if(!res.ok){
    if(res.status === 401){ session = null; render(); }
    throw new Error("fetch failed: " + table);
  }
  return res.json();
}

let dashState = { loading: true, error: null, progress: [], exams: [], activity: [], companyFilter: "" };

function relTime(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff/60000);
  if(min < 1) return "たった今";
  if(min < 60) return min+"分前";
  const hr = Math.floor(min/60);
  if(hr < 24) return hr+"時間前";
  const day = Math.floor(hr/24);
  return day+"日前";
}

function buildLearnerSummary(){
  const map = {};
  dashState.progress.forEach(p=>{
    const key = p.company_id + "::" + p.learner_id;
    if(!map[key]) map[key] = { company_id:p.company_id, learner_id:p.learner_id, n:0, c:0, questionsStudied:0 };
    map[key].n += p.n_count;
    map[key].c += p.c_count;
    map[key].questionsStudied += 1;
  });
  dashState.exams.forEach(e=>{
    const key = e.company_id + "::" + e.learner_id;
    if(!map[key]) map[key] = { company_id:e.company_id, learner_id:e.learner_id, n:0, c:0, questionsStudied:0 };
    if(!map[key].lastExam || new Date(e.taken_at) > new Date(map[key].lastExam.taken_at)){
      map[key].lastExam = e;
    }
  });
  dashState.activity.forEach(a=>{
    const key = a.company_id + "::" + a.learner_id;
    if(!map[key]) map[key] = { company_id:a.company_id, learner_id:a.learner_id, n:0, c:0, questionsStudied:0 };
    map[key].lastSeen = a.last_seen_at;
  });
  return Object.values(map).sort((a,b)=>{
    const at = a.lastSeen ? new Date(a.lastSeen).getTime() : 0;
    const bt = b.lastSeen ? new Date(b.lastSeen).getTime() : 0;
    return bt - at;
  });
}

async function loadDashboardData(){
  dashState.loading = true; dashState.error = null;
  render();
  try{
    const [progress, exams, activity] = await Promise.all([
      fetchAll("progress"),
      fetchAll("exam_log", "select=*&order=taken_at.desc&limit=500"),
      fetchAll("learner_activity")
    ]);
    dashState.progress = progress;
    dashState.exams = exams;
    dashState.activity = activity;
    dashState.loading = false;
  }catch(e){
    dashState.loading = false;
    dashState.error = "データの取得に失敗しました。時間をおいて再読み込みしてください。";
  }
  render();
}

function renderDashboard(){
  const wrap = document.createElement("div");
  const scope = sessionScope();

  const topbar = el('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"></div>');
  const who = document.createElement("div");
  who.style.fontSize = "13px"; who.style.color = "#556";
  let whoText = "ログイン中: " + session.email;
  if(scope.isAdmin) whoText += "（NTIC管理者・全社閲覧）";
  else if(scope.companyId) whoText += "（企業: " + scope.companyId + " の閲覧権限）";
  else whoText += "（閲覧権限が設定されていません。管理者にご連絡ください）";
  who.textContent = whoText;
  topbar.appendChild(who);
  const logoutBtn = document.createElement("button");
  logoutBtn.className = "ghost"; logoutBtn.textContent = "ログアウト";
  logoutBtn.onclick = ()=>{ session = null; dashState = { loading:true, error:null, progress:[], exams:[], activity:[], companyFilter:"" }; render(); };
  topbar.appendChild(logoutBtn);
  wrap.appendChild(topbar);

  if(!scope.isAdmin && !scope.companyId){
    const warnCard = el('<div class="card errormsg"></div>');
    warnCard.textContent = "このアカウントには閲覧できるデータが設定されていません。NTIC管理者に企業IDの割り当てを依頼してください。";
    wrap.appendChild(warnCard);
    return wrap;
  }

  const card = el('<div class="card"></div>');

  if(dashState.loading){
    card.appendChild(el('<div class="loading">読み込み中...</div>'));
    wrap.appendChild(card);
    if(!dashState._fetchTriggered){
      dashState._fetchTriggered = true;
      loadDashboardData();
    }
    return wrap;
  }
  if(dashState.error){
    const errBox = el('<div class="errormsg"></div>');
    errBox.textContent = dashState.error;
    card.appendChild(errBox);
    const retryBtn = document.createElement("button");
    retryBtn.className = "primary"; retryBtn.textContent = "再読み込み";
    retryBtn.onclick = ()=>{ dashState._fetchTriggered = false; loadDashboardData(); };
    card.appendChild(retryBtn);
    wrap.appendChild(card);
    return wrap;
  }

  const filters = el('<div class="filters"></div>');
  if(scope.isAdmin){
    const companyInput = document.createElement("input");
    companyInput.placeholder = "企業IDで絞り込み（空欄で全件）";
    companyInput.value = dashState.companyFilter;
    companyInput.oninput = ()=>{ dashState.companyFilter = companyInput.value; renderTableOnly(); };
    filters.appendChild(companyInput);
  }
  const refreshBtn = document.createElement("button");
  refreshBtn.className = "primary"; refreshBtn.textContent = "更新";
  refreshBtn.onclick = ()=>{ dashState._fetchTriggered = false; loadDashboardData(); };
  filters.appendChild(refreshBtn);
  card.appendChild(filters);

  const tableWrap = document.createElement("div");
  tableWrap.id = "tableWrap";
  card.appendChild(tableWrap);
  wrap.appendChild(card);

  setTimeout(renderTableOnly, 0);
  return wrap;
}

function renderTableOnly(){
  const tableWrap = document.getElementById("tableWrap");
  if(!tableWrap) return;
  let learners = buildLearnerSummary();
  if(dashState.companyFilter.trim()){
    const f = dashState.companyFilter.trim().toLowerCase();
    learners = learners.filter(l=>l.company_id.toLowerCase().includes(f));
  }

  if(learners.length === 0){
    tableWrap.innerHTML = '<div class="loading">該当する学習記録がまだありません。</div>';
    return;
  }

  const table = document.createElement("table");
  table.innerHTML = "<thead><tr>"+
    "<th>企業ID</th><th>実習生ID</th><th>学習済み問題数</th><th>通算正答率</th>"+
    "<th>最新模試</th><th>最終学習</th>"+
    "</tr></thead>";
  const tbody = document.createElement("tbody");
  learners.forEach(l=>{
    const tr = document.createElement("tr");
    const rate = l.n > 0 ? Math.round(l.c / l.n * 100) : 0;
    const badgeClass = rate >= 70 ? "high" : rate >= 40 ? "mid" : "low";
    let examCell = "-";
    if(l.lastExam){
      const eg = l.lastExam.exam_group === "moji" ? "文字語彙" : "文法・読解";
      examCell = eg + " " + l.lastExam.correct + "/" + l.lastExam.total + " (" + l.lastExam.pct + "%)";
    }
    let lastSeenCell = "-";
    let staleClass = "";
    if(l.lastSeen){
      lastSeenCell = relTime(l.lastSeen);
      const days = (Date.now() - new Date(l.lastSeen).getTime()) / 86400000;
      if(days > 7) staleClass = "stale";
    }
    tr.innerHTML =
      "<td>"+escapeHtml(l.company_id)+"</td>"+
      "<td>"+escapeHtml(l.learner_id)+"</td>"+
      "<td>"+l.questionsStudied+"</td>"+
      "<td><span class='badge "+badgeClass+"'>"+rate+"%</span></td>"+
      "<td>"+escapeHtml(examCell)+"</td>"+
      "<td class='"+staleClass+"'>"+escapeHtml(lastSeenCell)+"</td>";
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.innerHTML = "";
  tableWrap.appendChild(table);
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

render();
})();
</script>
</body>
</html>
